<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재직증명서</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@900&display=swap">
<link rel="stylesheet" href="common.css?v=202610282230">
<script src="common.js?v=202610282230"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn{padding:9px 16px;font-size:14px}
  .list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
  .r{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .r:last-child{border-bottom:0}
  .r:hover{background:var(--bg2)}
  .r .who{font-weight:700}
  .r .t{font-size:14px}
  .r .s{font-size:12px;color:var(--fg3);margin-top:2px}
  .r .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .st{font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;white-space:nowrap}
  .st.req{background:#fef3c7;color:#92400e}
  .st.ok{background:#dcfce7;color:#15803d}
  .st.no{background:#fee2e2;color:#b91c1c}
  .new{background:var(--red);color:#fff;font-size:10px;border-radius:3px;padding:0 5px;font-weight:600;margin-left:6px}
  .stampbox{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .stampbox img{width:64px;height:64px;object-fit:contain;border:1px dashed var(--line2);border-radius:6px;background:#fff}
  .stampbox .nos{width:64px;height:64px;border:1px dashed var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg3)}
  @media(max-width:640px){.r{grid-template-columns:1fr}.r .side{justify-content:flex-start}}

  /* 증명서 (A4 794×1123px) — 화면 밖에 그린 뒤 PDF 로 찍음 */
  #certStage{position:fixed;left:-10000px;top:0}
  .cert{width:794px;height:1123px;background:#fff;color:#111;padding:90px 80px 70px;box-sizing:border-box;font-family:'Malgun Gothic','맑은 고딕',sans-serif;position:relative}
  .cert .no{font-size:13px;color:#333}
  .cert h1{text-align:center;font-size:38px;letter-spacing:22px;margin:40px 0 50px;font-weight:800}
  .cert *{box-sizing:border-box}
  .cert table{width:634px !important;min-width:0 !important;table-layout:fixed;border-collapse:collapse;font-size:15px}
  .cert th,.cert td{border:1px solid #333;padding:13px 12px;text-align:left;vertical-align:middle;white-space:normal !important;word-break:keep-all}
  .cert th{background:#f3f4f6;width:110px;font-weight:700;text-align:center}
  .cert th.grp{width:44px;writing-mode:vertical-rl;letter-spacing:6px}
  .cert .msg{text-align:center;font-size:17px;margin:44px 0 28px}
  .cert .date{text-align:center;font-size:17px;margin-bottom:34px;letter-spacing:2px}
  .cert .plate{position:relative;width:430px;margin-left:auto;margin-right:10px}
  .cert .plate .np{width:100%;display:block}
  .cert .plate .seal{position:absolute;width:96px;height:96px;object-fit:contain;right:-18px;top:-6px;opacity:.9}
  .platebox{position:relative;width:300px;margin-top:8px}
  .platebox .np{width:100%;display:block}
  .platebox .seal{position:absolute;width:68px;height:68px;right:-12px;top:-4px;opacity:.9}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="certStage"></div>

<script>
/* ================================================================
   재직증명서 — 팀원이 요청하면 관리자가 표준 양식으로 발급(PDF)
   cert_requests 한 줄 = { name, company, dept, birth, address, purpose, submit_to, copies, memo,
                           status(요청/발급/반려), title, hire_date, issue_no, files[발급 PDF], issued_by/at, reject_reason, downloaded_at }
   회사 정보(상호·대표·사업자번호·주소)는 settings 표 id 'cert_company' (관리자가 고침, 처음엔 사업자등록증 값)
   직인 사진은 인터넷에 올리지 않고 발급하는 PC 브라우저에만 저장 (LS 'cert_stamp_<회사>')
================================================================ */
const COMPANIES = ['식이해법연구소', '(주)피에이치뷰티'];
const CO_DEFAULT = {   // 2026-10-14 회사 서류함의 사업자등록증에서 읽은 값
  '식이해법연구소': { name: '식이해법연구소', ceo: '홍주', ceoTitle: '대표', bizno: '228-18-02412', address: '서울특별시 서초구 형촌3길 20, 1층 A27호(우면동)', bizType: '도·소매', bizItem: '전자상거래', font: '굴림', sealRing: '식이해법연구소', sealCenter: '代表' },
  '(주)피에이치뷰티': { name: '주식회사 피에이치뷰티', ceo: '박봉수', ceoTitle: '대표이사', bizno: '788-86-03834', address: '서울특별시 서초구 사평대로53길 30, 515호(반포동, 반포엠)', bizType: '도·소매, 서비스', bizItem: '전자상거래, 광고대행', font: '굴림', sealRing: '주식회사 피에이치뷰티', sealCenter: '代表理事' },
};
const PURPOSES = ['은행 제출용', '관공서 제출용', '비자·여권', '대출', '어린이집·학교 제출용', '기타'];
const R = () => (DATA.cert_requests || []).slice().sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
const coInfo = c => ({ ...(CO_DEFAULT[c] || {}), ...((((DATA.settings || []).find(x => x.id === 'cert_company') || {}).value || {})[c] || {}) });
const stampKey = c => 'cert_stamp_' + c;
const upStamp = c => { try { return localStorage.getItem(stampKey(c)) || ''; } catch { return ''; } };   // 이 PC에 직접 넣은 직인 사진
const getStamp = c => upStamp(c) || autoSeal(c);                                                          // 없으면 자동 직인

/* 자동 직인: 사업자등록증 내용(회사 정보)으로 그림
   법인(주식회사): 둥근 직인 — 바깥 원을 따라 상호, 가운데 '대표이사인'
   개인사업자: 네모 직인 — '상호+인' 을 오른쪽 줄부터 세로쓰기 */
/* 명판: 파란 글씨 4줄 — 사업자번호 / 상호 + 대표 / 주소 / 업태 · 종목. 직인은 오른쪽 위(대표 이름 옆)에 겹쳐 찍음 */
const PLATE_BLUE = '#2b23c9';
const PLATE_FONTS = { '굴림': "'Gulim','굴림',sans-serif", '명조': "'Batang','바탕','Nanum Myeongjo',serif", '궁서': "'Gungsuh','궁서',serif", '고딕': "'Malgun Gothic','맑은 고딕',sans-serif" };
const _plates = {};
function namePlate(c){
  const i = coInfo(c), fk = PLATE_FONTS[i.font] ? i.font : '굴림', F = PLATE_FONTS[fk], bold = fk === '고딕' ? 'bold ' : '';
  const key = JSON.stringify([i.bizno, i.name, i.ceoTitle, i.ceo, i.address, i.bizType, i.bizItem, fk]);
  if (_plates[key]) return _plates[key];
  const W = 860, H = 380, L = 10, RW = W - 100;   // 대표 이름은 오른쪽 100px 앞에서 끝남 (직인이 이름 끝에 겹침)
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'); x.fillStyle = PLATE_BLUE; x.textBaseline = 'alphabetic';
  const fit = (t, size, maxW, w = '') => { let s = size; do { x.font = `${w}${s}px ${F}`; } while (x.measureText(t).width > maxW && --s > 14); return s; };
  // 1줄: 사업자번호 (크게)
  fit(i.bizno || '', 66, RW - 60, bold); x.textAlign = 'left'; x.fillText(i.bizno || '', L, 80);
  // 2줄: 상호(왼쪽) · 대표(오른쪽, 직인 바로 앞)
  const boss = `${i.ceoTitle || ''} ${i.ceo || ''}`.trim();
  fit(boss, 56, RW * 0.4, bold); const bw = x.measureText(boss).width; x.textAlign = 'right'; x.fillText(boss, RW, 170);
  fit(i.name || '', 66, RW - bw - 30, 'bold '); x.textAlign = 'left'; x.fillText(i.name || '', L, 170);
  // 3줄: 주소 (길면 글자 줄임)
  fit(i.address || '', 40, W - L * 2, bold); x.fillText(i.address || '', L, 250);
  // 4줄: 업태(왼쪽) · 종목(오른쪽)
  fit(i.bizType || '', 46, W * 0.45, bold); x.fillText(i.bizType || '', L, 336);
  fit(i.bizItem || '', 46, W * 0.5, bold); x.textAlign = 'right'; x.fillText(i.bizItem || '', W - L, 336);
  return (_plates[key] = cv.toDataURL('image/png'));
}
const SEAL_RED = '#e3241b', SEAL_FONT = "'Gungsuh','궁서','GungsuhChe','Batang','바탕',serif";
const _seals = {};
const SEAL_RING_FONT = "'Black Han Sans','Gungsuh',sans-serif", SEAL_MID_FONT = "900 {px}px 'Noto Sans KR','Malgun Gothic',sans-serif";
/* 직인 글씨체(인터넷 글꼴)가 다 받아진 뒤에 그려야 모양이 맞음 → 준비되면 그려 둔 것을 지우고 다시 그림 */
const sealFontsReady = Promise.all([
  document.fonts.load("40px 'Black Han Sans'", '주식회사피에이치뷰티식이해법연구소'),
  document.fonts.load("900 40px 'Noto Sans KR'", '代表理事'),
]).catch(() => {}).then(() => { Object.keys(_seals).forEach(k => delete _seals[k]); });
/* 원형 직인: 맨 위 점(●), 둘레에 회사명(한글, 시계 방향), 가운데 한자 (4글자면 2×2: 오른쪽 줄 代表 · 왼쪽 줄 理事) */
function autoSeal(c){
  const i = coInfo(c);
  const ring = [...String(i.sealRing || i.name || c).replace(/\s+/g, '')];
  const mid = [...String(i.sealCenter || '代表').replace(/\s+/g, '')];
  const key = JSON.stringify([ring, mid]);
  if (_seals[key]) return _seals[key];
  const S = 300, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const x = cv.getContext('2d'); x.strokeStyle = x.fillStyle = SEAL_RED; x.textAlign = 'center'; x.textBaseline = 'middle';
  const cx = S / 2, R1 = S * 0.47, R2 = S * 0.30, rr = (R1 + R2) / 2;
  x.lineWidth = S * 0.03; x.beginPath(); x.arc(cx, cx, R1, 0, Math.PI * 2); x.stroke();
  x.lineWidth = S * 0.018; x.beginPath(); x.arc(cx, cx, R2, 0, Math.PI * 2); x.stroke();
  // 둘레: 맨 위에 점 하나, 글자는 점 다음부터 한 바퀴 고르게
  const n = ring.length + 1, step = 2 * Math.PI / n;
  x.beginPath(); x.arc(cx, cx - rr, S * 0.022, 0, Math.PI * 2); x.fill();
  x.font = `${Math.min(S * 0.15, (2 * Math.PI * rr / n) * 0.82)}px ${SEAL_RING_FONT}`;
  ring.forEach((ch, k) => { const a = -Math.PI / 2 + (k + 1) * step;
    x.save(); x.translate(cx + rr * Math.cos(a), cx + rr * Math.sin(a)); x.rotate(a + Math.PI / 2); x.fillText(ch, 0, 0); x.restore(); });
  // 가운데
  const box = R2 * 1.38;
  if (mid.length === 4) {
    const cs = box / 2 * 1.02; x.font = SEAL_MID_FONT.replace('{px}', cs);
    [[1, 0], [1, 1], [0, 0], [0, 1]].forEach(([col, row], k) => x.fillText(mid[k], cx + (col - 0.5) * box / 2, cx + (row - 0.5) * box / 2 + cs * 0.04));
  } else {
    const cs = Math.min(box / mid.length * 1.02, box * 0.62); x.font = SEAL_MID_FONT.replace('{px}', cs);
    mid.forEach((ch, k) => x.fillText(ch, cx, cx + (k - (mid.length - 1) / 2) * cs * 1.02 + cs * 0.04));
  }
  return (_seals[key] = cv.toDataURL('image/png'));
}
const memberOf = n => members.find(m => m.name === n) || {};
const stHtml = r => r.status === '발급' ? '<span class="st ok">발급</span>' : r.status === '반려' ? '<span class="st no">반려</span>' : '<span class="st req">요청</span>';
const ymdKo = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${y}년 ${Number(m)}월 ${Number(d)}일`; };
let tab = 'todo';

function normalize(table, r){ return table === 'cert_requests' ? { ...r, files: Array.isArray(r.files) ? r.files : [] } : r; }
const VIEWS = () => isAdmin()
  ? [{ key: 'todo', label: '발급 대기', badge: R().filter(r => r.status === '요청').length || '' }, { key: 'all', label: '전체' }, { key: 'mine', label: '내 요청' }]
  : [{ key: 'mine', label: '내 요청' }];

function render(){
  if (!VIEWS().some(v => v.key === tab)) tab = VIEWS()[0].key;
  const list = R().filter(r => tab === 'mine' ? r.name === me : tab === 'todo' ? r.status === '요청' : true);
  $('#app').innerHTML = headerHtml({ icon: '📄', title: '재직증명서', tabs: VIEWS(), active: tab })
    + `<main class="wrap" style="max-width:900px">${!DATA.cert_requests ? `<div class="empty">재직증명서 저장 표가 아직 없습니다.${isAdmin() ? ' sql-certs.sql 을 실행하세요.' : ''}</div>` : `
    <div class="actions"><button class="btn primary" id="reqBtn">＋ 재직증명서 요청</button>
      ${isAdmin() ? '<button class="btn" id="coBtn" title="증명서에 들어가는 회사 정보·명판·직인">🏢 회사 정보·명판·직인</button>' : ''}
      <span class="hint">${isAdmin() ? '요청을 눌러 <b>발급</b>하면 입사일·직위가 채워진 증명서가 PDF 로 만들어져 요청한 사람에게 전달됩니다.' : '요청하면 관리자가 발급합니다. 발급되면 여기서 PDF 를 내려받으세요.'}</span></div>
    ${list.length ? `<div class="list">${list.map(rowHtml).join('')}</div>` : `<div class="empty">${tab === 'todo' ? '발급을 기다리는 요청이 없습니다.' : '아직 요청이 없습니다.<br><b>＋ 재직증명서 요청</b>으로 요청하세요.'}</div>`}`}</main>`;
  bindHeader(k => { tab = k; render(); }, null, m => `요청 ${R().filter(r => r.name === m.name).length}건`);
  const rb = $('#reqBtn'); if (rb) rb.onclick = () => openRequest(null);
  const cb = $('#coBtn'); if (cb) cb.onclick = openCompany;
  document.querySelectorAll('.r[data-id]').forEach(el => el.onclick = e => { if (e.target.closest('a,button')) return; openRequest(el.dataset.id); });
  document.querySelectorAll('[data-dl]').forEach(a => a.onclick = () => markDownloaded(a.dataset.dl));
}
function rowHtml(r){
  const pdf = r.files[0];
  const fresh = r.status === '발급' && r.name === me && !r.downloaded_at;
  return `<div class="r" data-id="${r.id}">
    <div><div class="who">${esc(r.name)}</div><div class="s">${fmtDate((r.created_at || '').slice(0, 10))}</div></div>
    <div><div class="t">${esc(r.company || '')} · ${esc(r.purpose || '용도 미기재')}${r.submit_to ? ` → ${esc(r.submit_to)}` : ''}${fresh ? '<span class="new">새로 발급</span>' : ''}</div>
      <div class="s">${r.copies > 1 ? `${r.copies}부 · ` : ''}${r.status === '발급' ? `발급번호 ${esc(r.issue_no || '')} · ${esc(r.issued_by || '')} ${fmtDateTime(r.issued_at)}` : r.status === '반려' ? `반려: ${esc(r.reject_reason || '')}` : '발급 대기'}</div></div>
    <div class="side">${stHtml(r)}${pdf && (r.name === me || isAdmin()) ? `<a class="btn sm primary" href="${esc(pdf.url)}?download=${encodeURIComponent(pdf.name)}" download data-dl="${r.id}">⬇ PDF</a>` : ''}</div>
  </div>`;
}
async function markDownloaded(id){ const r = R().find(x => x.id === id); if (r && r.name === me && !r.downloaded_at) await saveRow('cert_requests', { ...r, downloaded_at: nowIso() }); }

/* ---------- 요청 (팀원) / 발급 (관리자) ---------- */
function openRequest(id){
  const r0 = id ? R().find(x => x.id === id) : null;
  if (r0 && !isAdmin() && r0.name !== me) return;
  const last = (() => { try { return JSON.parse(LS.get('cert_last_' + me) || '{}'); } catch { return {}; } })();   // 지난번에 적은 생년월일·주소·회사
  const d = r0 || { name: me, company: last.company || COMPANIES[0], dept: last.dept || '', birth: last.birth || '', address: last.address || '', purpose: PURPOSES[0], submit_to: '', copies: 1, memo: '', status: '요청' };
  const editable = !r0 || (r0.status === '요청' && (r0.name === me || isAdmin()));
  const dis = editable ? '' : 'disabled';
  openModal(`${modalHead(r0 ? '재직증명서 요청' : '재직증명서 요청하기', r0 ? stHtml(r0) : '')}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>요청자</label>${isAdmin() && !r0 ? `<select id="cName">${memberOptions(d.name)}</select>` : `<div style="padding:8px 0">${who(d.name)}</div><input type="hidden" id="cName" value="${esc(d.name)}">`}</div>
        <div class="f"><label>소속 회사</label><select id="cCo" ${dis}>${COMPANIES.map(c => `<option ${d.company === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="f2">
        <div class="f"><label>생년월일 *</label><input id="cBirth" value="${esc(d.birth || '')}" placeholder="예: 1995-03-21" ${dis}></div>
        <div class="f"><label>부서 <span class="hint">(선택)</span></label><input id="cDept" value="${esc(d.dept || '')}" placeholder="예: 마케팅팀" ${dis}></div>
      </div>
      <div class="f"><label>주소 <span class="hint">(선택 · 제출처가 요구하면)</span></label><input id="cAddr" value="${esc(d.address || '')}" ${dis}></div>
      <div class="f2">
        <div class="f"><label>용도</label><select id="cPurp" ${dis}>${[...PURPOSES, ...(d.purpose && !PURPOSES.includes(d.purpose) ? [d.purpose] : [])].map(p => `<option ${d.purpose === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
        <div class="f"><label>제출처 <span class="hint">(선택)</span></label><input id="cTo" value="${esc(d.submit_to || '')}" placeholder="예: 국민은행" ${dis}></div>
      </div>
      <div class="f2">
        <div class="f"><label>부수</label><input type="number" id="cCopies" min="1" max="10" value="${d.copies || 1}" ${dis}></div>
        <div class="f"><label>메모 <span class="hint">(선택)</span></label><input id="cMemo" value="${esc(d.memo || '')}" ${dis}></div>
      </div>
      ${r0 && r0.status === '반려' ? `<div class="hint" style="color:var(--red)">반려 사유: ${esc(r0.reject_reason || '')}</div>` : ''}
      ${r0 && r0.files.length ? `<div class="f"><label>발급한 증명서</label>${filesHtml(r0.files)}</div>` : ''}
    </div>
    <div class="mf">
      ${r0 && (r0.name === me || isAdmin()) && r0.status !== '발급' ? '<button class="btn danger left" id="cDel">요청 삭제</button>' : ''}
      ${r0 && isAdmin() && r0.status === '요청' ? '<button class="btn" id="cNo">반려</button><button class="btn primary" id="cIssue">📄 발급하기</button>' : ''}
      ${r0 && isAdmin() && r0.status === '발급' ? '<button class="btn" id="cIssue">다시 발급</button>' : ''}

  const read = () => ({ name: $('#cName').value, company: $('#cCo').value, birth: $('#cBirth').value.trim(), dept: $('#cDept').value.trim() || null, address: $('#cAddr').value.trim() || null,

    closeModal(); await saveRow('cert_requests', row); toast(r0 ? '저장했습니다' : '재직증명서를 요청했습니다. 관리자가 발급하면 여기서 내려받을 수 있습니다');
  };
  const del = $('#cDel'); if (del) del.onclick = async () => { if (confirm('이 요청을 삭제할까요?')) { closeModal(); await removeRow('cert_requests', r0.id); toast('삭제했습니다'); } };

/* 증명서 HTML → A4 PDF (html2canvas + jsPDF 를 필요할 때만 불러옴) */
// loadScript(src) 는 common.js 의 것을 씀
async function makePdf(html){
  await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
  const stage = $('#certStage'); stage.innerHTML = html;
  try {
    await Promise.all([...stage.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
    const canvas = await html2canvas(stage.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    return pdf.output('blob');
  } finally { stage.innerHTML = ''; }
}

/* 직인 사진 → 300px PNG, 흰 바탕은 투명하게 */
function stampFromFile(file){
  return new Promise((ok, no) => {
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.src = rd.result; }; rd.onerror = () => no(new Error('파일을 읽지 못했습니다'));
    img.onload = () => {
      const s = Math.min(1, 300 / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
      const d = cx.getImageData(0, 0, w, h);
      for (let i = 0; i < d.data.length; i += 4) { const [r, g, b] = [d.data[i], d.data[i + 1], d.data[i + 2]]; if (r > 225 && g > 225 && b > 225) d.data[i + 3] = 0; }
      cx.putImageData(d, 0, 0); ok(cv.toDataURL('image/png'));
    };
    img.onerror = () => no(new Error('그림 파일이 아닙니다'));
    rd.readAsDataURL(file);
  });
}
