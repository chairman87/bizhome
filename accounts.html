<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영계정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610282304">
<script src="common.js?v=202610282304"></script>
<style>
  .wrap-wide{max-width:1800px}
  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v.red{color:var(--red)}.stat .v.orange{color:var(--orange)}
  .stat .s{font-size:11px;color:var(--fg3)}
  .mono{font-family:Consolas,"Malgun Gothic",monospace;font-size:13px}
  .pw{display:inline-flex;align-items:center;gap:4px}
  .pw .v{min-width:80px;letter-spacing:1px}
  .ib{border:1px solid var(--line2);background:var(--bg);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--fg2)}
  .ib:hover{background:var(--bg3);color:var(--fg)}
  .site{color:var(--blue);text-decoration:none;font-size:12px}
  .site:hover{text-decoration:underline}
  td.memo2{color:var(--fg2);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.small{font-size:12px;color:var(--fg2)}
  .lock{font-size:11px;color:#9a6700;background:#fbeccc;border-radius:4px;padding:0 5px;margin-left:4px}
  .exp{white-space:nowrap;font-variant-numeric:tabular-nums}
  .exp.soon{color:var(--orange);font-weight:600}
  .exp.over{color:var(--red);font-weight:600}
  .grp{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent}
  /* 구분별 색: 운영 파랑, 재무 초록, 총무 노랑, 고객센터 보라, 물류 주황, 법무 빨강, 이메일 청록, 마케팅 쪽은 분홍·남색 */
  .grp.c0{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
  .grp.c1{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .grp.c2{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .grp.c3{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}
  .grp.c4{background:#ffedd5;color:#9a3412;border-color:#fed7aa}
  .grp.c5{background:#fee2e2;color:#991b1b;border-color:#fecaca}
  .grp.c6{background:#ccfbf1;color:#115e59;border-color:#99f6e4}
  .grp.c7{background:#fce7f3;color:#9d174d;border-color:#fbcfe8}
  .grp.c8{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}
  .grp.c9{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
  .sec{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-size:12px;color:var(--fg2);font-weight:600}
  /* 표 글자가 두 줄로 꺾이지 않게: 모든 칸은 한 줄, 길어질 수 있는 칸(주소·공유 사용자·비고)만 말줄임. 그래도 넘치면 표가 가로로 밀림 */
  table.acc th,table.acc td{white-space:nowrap}
  table.acc th,table.acc td{padding-left:6px;padding-right:6px}
  table.acc .ib{white-space:nowrap;padding:1px 4px;font-size:11px}
  table.acc .pw .v{min-width:62px}
  table.acc .grp{padding:2px 8px;font-size:12px}
  table.acc td.svc{max-width:230px;overflow:hidden;text-overflow:ellipsis}
  table.acc td.pur{max-width:150px;overflow:hidden;text-overflow:ellipsis}
  table.acc td.idc .mono{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  table.acc .site{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  table.acc td.share{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  table.acc td.memo2{max-width:150px}
  table.acc td.act{text-align:right}
  table.acc td.act .btn{padding:2px 6px;font-size:12px}
  table.acc td.act .btn + .btn{margin-left:4px}
  /* 사업자주소지 탭 */
  .addr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:14px}
  .addr-card .note{padding:8px 12px;font-size:13px;color:#9a3412;background:#fff7ed;border-bottom:1px solid var(--line)}
  .addr-card table{width:100%;border-collapse:collapse}
  .addr-card th{font-size:12px;color:var(--fg2);font-weight:600;text-align:left;padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
  .addr-card td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  .addr-card tr:last-child td{border-bottom:0}
  .addr-card td.lbl{white-space:nowrap;font-weight:600;color:var(--fg2);width:1%}
  .addr-card td.adr{font-size:14px}
  .addr-card td.adr .ib{margin-left:4px;vertical-align:middle}
  .addr-card td.unt{white-space:nowrap;width:1%}
  .addr-card td.mm{font-size:12px;color:var(--fg2)}
  .addr-note{margin:0 0 12px;padding:10px 12px;border:1px solid #fde68a;background:#fffbeb;border-radius:var(--radius);font-size:13px;color:#92400e}
  .addr-rows{display:grid;gap:8px}
  .addr-row{display:grid;grid-template-columns:150px 1fr 130px 1fr 32px;gap:6px;align-items:center}
  .addr-row input{border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;width:100%;background:var(--bg)}
  .addr-row .x{border:0;background:none;color:var(--fg3);cursor:pointer;font-size:16px}
  .addr-row .x:hover{color:var(--red)}
  .addr-rowh{display:grid;grid-template-columns:150px 1fr 130px 1fr 32px;gap:6px;font-size:12px;color:var(--fg2)}
  @media (max-width:700px){ .addr-rowh{display:none} .addr-row{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px dashed var(--line)} }   /* 휴대폰: 한 줄을 두 칸씩 접어서 보여줌 */
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   계정관리 — 팀이 함께 쓰는 계정(로그인 정보). 구독료·결제일·만료일은 구독관리(subscriptions.html)에서 관리
   한 줄 = { group_name(구분), service, url, purpose, login_id, password, owner(담당자/구매자), shared_with(공유 사용자),
            fee(구독료), cycle(월/년/없음), billing_day(결제일), start_date, end_date(만료일), admin_only, memo }
================================================================ */
const GROUP_ORDER = ['운영', '재무', '총무', '고객센터', '물류', '법무', '이메일·협업', '광고 계정', '레모너리', '서리맥스', '흑생마', '기타'];   // 탭 순서 ('기타'는 안 쓰는 계정을 모아 두는 곳, 항상 맨 뒤)
const ETC = '기타';
const CYCLES = ['없음', '월', '년'];
/* 총무 / 마케팅 두 화면이 같은 표를 나눠 씀: 구분(group_name)이 MARKETING_GROUPS 에 있으면 마케팅 > 계정관리, 나머지는 총무 > 계정관리 */
const DEPT = new URLSearchParams(location.search).get('dept') === '마케팅' ? '마케팅' : '총무';
const PURPOSE_LABEL = DEPT === '마케팅' ? '매체' : '사업자';   // purpose 칸의 화면 이름 (운영계정=사업자, 마케팅계정=매체)
const COMPANIES = ['식이해법연구소', '피에이치뷰티', '공용'];   // 마케팅계정의 사업자 선택지
const COMP_CLS = { '식이해법연구소': 'c1', '피에이치뷰티': 'c3', '공용': 'c9' };
const MARKETING_GROUPS = ['인스타그램 계정', '기타 마케팅', '레모너리', '서리맥스', '흑생마', '광고 계정', '페이스북 페이지', '페이스북 계정'];
if (DEPT === '마케팅') document.title = '마케팅계정';   // 브라우저 탭 이름
/* 사업자주소지 탭(총무 > 운영계정에만): 사업자별로 사업자등록증·홈페이지·식품영업신고지·단상자에 적힌 주소와 기한을 한눈에.
   저장은 팀 공용 settings 표 id 'biz_addresses' 한 줄 (value = { companies:[{ name, note, items:[{ label, address, until, memo }] }] }).
   아직 저장한 적이 없으면 아래 ADDR_DEFAULT(2026-10-18 기준)가 보이고, 처음 '수정 → 저장'할 때 settings 에 들어감 */
const ADDR_ID = 'biz_addresses';
const ADDR_LABELS = ['사업자등록증 주소지', '홈페이지 표기 주소지', '식품영업신고지 주소', '단상자 표기 주소'];
const ADDR_DEFAULT = { companies: [
  { name: '식이해법', note: '', items: [
    { label: '사업자등록증 주소지', address: '서초구 형촌3길 20, A27호', until: '2026-11-30', memo: '' },
    { label: '홈페이지 표기 주소지', address: '서초구 형촌3길 20, A27호', until: '2026-11-30', memo: '' },
    { label: '식품영업신고지 주소', address: '서울시 강남구 봉은사로16길 14, B1층 145호', until: '', memo: '' },
    { label: '단상자 표기 주소', address: '서초구 형촌3길 20, A27호', until: '', memo: '' } ] },
  { name: '피에이치뷰티', note: '신고 들어오면, 그때 카페24 강남주소지로 변경', items: [
    { label: '사업자등록증 주소지', address: '서초구 사평대로53길30, 515', until: '', memo: '' },
    { label: '홈페이지 표기 주소지', address: '서초구 사평대로53길30, 515', until: '', memo: '' },
    { label: '식품영업신고지 주소', address: '서초구 형촌3길 20, A83호', until: '2026-11-30', memo: '' },
    { label: '단상자 표기 주소', address: '서초구 형촌3길 20, A83호', until: '2026-11-30', memo: '' } ] } ] };
const addrSetting = () => (DATA.settings || []).find(x => x.id === ADDR_ID);
const addrData = () => { const v = addrSetting() && addrSetting().value; return v && Array.isArray(v.companies) && v.companies.length ? v : ADDR_DEFAULT; };
const ADDR_MODE = new URLSearchParams(location.search).get('tab') === 'addr';   // 홈 > 계정관리 > '사업자주소지 관리' 단추로 들어오면 이 화면만 따로 보임 (운영계정 탭 줄에는 안 나옴)
if (ADDR_MODE) document.title = '사업자주소지 관리';
/* 구분 이름마다 정해진 색 (목록에 없으면 이름 글자로 색을 정함) */
const GRP_COLOR = { '운영': 'c0', '재무': 'c1', '총무': 'c2', '고객센터': 'c3', '물류': 'c4', '법무': 'c5', '이메일·협업': 'c6', '광고 계정': 'c8', '레모너리': 'c2', '서리맥스': 'c1', '흑생마': 'c9', '기타': 'c9' };
const grpCls = g => { if (!g) return 'c9'; if (GRP_COLOR[g]) return GRP_COLOR[g]; let h = 0; for (const ch of g) h = (h * 31 + ch.charCodeAt(0)) % 10; return 'c' + h; };
/* 마케팅 쪽 구분 = 위 목록 + 사업자 칸이 채워진 계정의 구분(사업자 칸은 마케팅계정 화면에만 있음).
   마케팅 화면에서 구분을 직접 새로 적어도 운영계정으로 넘어가지 않게 (2026-10-23, 'عالم الليمون' 이 운영 쪽으로 간 일) */
const mktGroups = () => new Set([...MARKETING_GROUPS, ...(DATA.accounts || []).filter(a => a.company && a.group_name).map(a => a.group_name)]);
const inDept = a => DEPT === '마케팅' ? mktGroups().has(a.group_name) : !mktGroups().has(a.group_name);
const VIS = () => (DATA.accounts || []).filter(a => (isAdmin() || !a.admin_only) && inDept(a));   // 관리자만 보기 항목은 관리자에게만
const ALL = () => VIS().filter(a => !a.unused);   // 지금 쓰는 계정 (전체·구분 탭)
const OFF = () => VIS().filter(a => a.unused);    // 사용안함으로 빼 둔 계정 ('사용안함' 탭에만 보임, 원래 구분은 그대로 남음)
const groups = () => { const g = [...new Set(ALL().map(a => a.group_name).filter(Boolean))]; return g.sort((a, b) => (GROUP_ORDER.indexOf(a) + 1 || 99) - (GROUP_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b, 'ko')); };
let view = ADDR_MODE ? 'addr' : 'all';   // 열 때마다 항상 '전체' 탭부터
let q = '';
let shown = {};
let sort = { key: 'group_name', dir: 'asc' };   // 처음 열면 구분 순서로 정렬

const won = n => (n == null || n === '' || isNaN(Number(n))) ? '' : Number(n).toLocaleString('ko-KR') + '원';
const monthly = a => { const f = Number(a.fee); if (!f) return 0; return a.cycle === '년' ? Math.round(f / 12) : a.cycle === '월' ? f : 0; };
const isSub = a => Number(a.fee) > 0 || a.end_date || a.billing_day;
const daysTo = d => d ? dayDiff(d) : null;
function expHtml(d){ if (!d) return '<span class="hint">-</span>'; const n = daysTo(d); const cls = n < 0 ? 'over' : n <= 30 ? 'soon' : ''; return `<span class="exp ${cls}">${fmtDate(d)}${n < 0 ? ` (${-n}일 지남)` : n <= 30 ? ` (D-${n})` : ''}</span>`; }
const feeHtml = a => Number(a.fee) > 0 ? `${won(a.fee)}${a.cycle && a.cycle !== '없음' ? '/' + a.cycle : ''}` : (a.cycle === '없음' && a.fee === 0 ? '무료' : '');
const siteHtml = u => u ? `<a class="site" href="${esc(/^https?:\/\//i.test(u) ? u : 'https://' + u)}" target="_blank" rel="noopener" data-link>${esc(u.replace(/^https?:\/\//i, '').replace(/\/$/, ''))}</a>` : '';
const pwHtml = a => `<span class="pw"><span class="v mono">${a.password ? (shown[a.id] ? esc(a.password) : '••••••••') : '<span class="hint">-</span>'}</span>${a.password ? `<button class="ib" data-eye="${a.id}">${shown[a.id] ? '🙈' : '👁'}</button><button class="ib" data-copy="${esc(a.password)}">복사</button>` : ''}</span>`;
function normalize(table, a){ if (table !== 'accounts') return a; return { ...a, admin_only: !!a.admin_only, unused: !!a.unused, cycle: CYCLES.includes(a.cycle) ? a.cycle : (Number(a.fee) > 0 ? '월' : '없음') }; }

/* ---------- 화면 ---------- */
function render(){
  if (view === 'subs') view = 'all';
  if (ADDR_MODE) { view = 'addr'; $('#app').innerHTML = headerHtml({ icon: '🏢', title: '사업자주소지 관리', tabs: [], extra: '<a class="btn sm" href="accounts.html">🔐 운영계정 →</a>' }) + `<main class="wrap wrap-wide">${addrHtml()}</main>`; bindHeader(() => {}); const br = document.querySelector('.brand.page'); if (br) br.href = 'accounts.html?tab=addr'; bindAddr(); return; }   // 제목(새로고침) 링크도 이 화면으로
  const tabs = [{ key: 'all', label: '전체' }, ...(DEPT === '마케팅' ? groups() : [...groups().filter(g => g !== ETC), ETC]).map(g => ({ key: 'g:' + g, label: g })), null, { key: 'off', label: '사용안함' + (OFF().length ? ` ${OFF().length}` : '') }];   // 운영계정의 '기타' 탭은 비어 있어도 항상 구분 맨 뒤에, '사용안함'은 따로 맨 끝
  if (!tabs.some(t => t && t.key === view)) view = 'all';
  $('#app').innerHTML = headerHtml({ icon: '🔐', title: DEPT === '마케팅' ? '마케팅계정' : '운영계정', tabs, active: view })
    + `<main class="wrap wrap-wide">${!DATA.accounts ? `<div class="empty">계정 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL 을 실행하세요.' : ''}</div>` : statsHtml() + `<div class="actions"><button class="btn primary" id="newBtn2">＋ 계정 추가</button>
      <input type="search" id="fq" placeholder="검색 (서비스, 아이디, ${PURPOSE_LABEL}${DEPT === '마케팅' ? ', 사업자' : ''}, 담당자, 비고)" value="${esc(q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;min-width:240px">
      <span class="count" id="cnt"></span></div><div id="view">${tableHtml()}</div>`}</main>`;
  bindHeader(k => { view = k; LS.set('acc_view_' + DEPT, k); render(); }, null, m => `담당 ${ALL().filter(a => a.owner === m.name).length}개`);
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => openEdit(null, view.startsWith('g:') ? { group_name: view.slice(2) } : {});
  const fq = $('#fq'); if (fq) fq.oninput = () => { q = fq.value; renderView(); };
  bindView();
}
/* ---------- 사업자주소지 탭 ---------- */
const addrUntil = u => { if (!u) return '<span class="hint">-</span>'; const n = dayDiff(u); const cls = n < 0 ? 'over' : n <= 45 ? 'soon' : ''; return `<span class="exp ${cls}">${fmtDate(u)} 까지${n != null ? (n < 0 ? ` (${-n}일 지남)` : ` (D-${n})`) : ''}</span>`; };
function addrHtml(){
  const d = addrData(), st = addrSetting();
  const soon = d.companies.flatMap(c => c.items.filter(i => i.until).map(i => ({ c: c.name, ...i }))).sort((a, b) => a.until.localeCompare(b.until));
  const first = soon[0];
  return `<div class="actions"><span class="hint">사업자등록증 · 홈페이지 · 식품영업신고 · 단상자에 적힌 주소가 서로 같은지, 언제까지 쓸 수 있는지 한눈에 봅니다. 주소를 바꾸면 네 곳을 모두 맞춰야 합니다.</span></div>
    ${first ? `<div class="addr-note">⏰ 가장 먼저 끝나는 기한: <b>${fmtDate(first.until)}</b> ${(() => { const n = dayDiff(first.until); return n < 0 ? `(${-n}일 지남)` : `(D-${n})`; })()} — ${soon.filter(i => i.until === first.until).map(i => `${i.c} ${i.label}`).join(', ')}</div>` : ''}
    <div class="addr-grid">${d.companies.map((c, ci) => `<div class="card addr-card">
      <h3>🏢 ${esc(c.name)}<span class="stat"><button class="btn sm" data-addr-edit="${ci}">✏️ 수정</button></span></h3>
      ${c.note ? `<div class="note">📌 ${esc(c.note)}</div>` : ''}
      <table><thead><tr><th>항목</th><th>주소</th><th>기한</th><th>메모</th></tr></thead><tbody>
        ${c.items.map(i => `<tr><td class="lbl">${esc(i.label)}</td><td class="adr">${esc(i.address || '')}${i.address ? `<button class="ib" data-copy="${esc(i.address)}">복사</button>` : ''}</td><td class="unt">${addrUntil(i.until)}</td><td class="mm">${esc(i.memo || '')}</td></tr>`).join('')}
      </tbody></table></div>`).join('')}</div>
    <div class="hint" style="margin-top:10px">${st ? `마지막 수정: ${esc(st.updated_by || '')} ${fmtDateTime(st.updated_at)}` : '아직 저장된 적이 없어 2026-10-18 기준 기본값이 보입니다. 수정 → 저장하면 팀 공용으로 저장됩니다.'}</div>`;
}
function bindAddr(){
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async e => { e.stopPropagation(); try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했습니다'); } catch { toast('복사할 수 없습니다. 직접 선택해서 복사하세요', true); } });
  document.querySelectorAll('[data-addr-edit]').forEach(b => b.onclick = () => openAddrEdit(Number(b.dataset.addrEdit)));
}
/* 사업자 하나의 주소 네 줄 + 메모를 고치는 창. 줄을 더하거나 뺄 수도 있음 */
function openAddrEdit(ci){
  const d = JSON.parse(JSON.stringify(addrData()));
  const c = d.companies[ci]; if (!c) return;
  const rowHtml = (i = {}) => `<div class="addr-row"><input class="rl" value="${esc(i.label || '')}" placeholder="항목 (예: 사업자등록증 주소지)" list="addrLabels"><input class="ra" value="${esc(i.address || '')}" placeholder="주소"><input class="ru" type="date" value="${esc(i.until || '')}" title="이 주소를 언제까지 쓸 수 있는지 (없으면 비움)"><input class="rm" value="${esc(i.memo || '')}" placeholder="메모"><button type="button" class="x" title="이 줄 빼기">×</button></div>`;
  openModal(`${modalHead(`${c.name} 사업자주소지`)}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>사업자 이름</label><input id="adName" value="${esc(c.name)}" maxlength="30"></div>
        <div class="f"><label>메모 (카드 위에 크게 보임)</label><input id="adNote" value="${esc(c.note || '')}" placeholder="예: 신고 들어오면 그때 카페24 강남주소지로 변경"></div>
      </div>
      <div class="sec">주소</div>
      <div class="addr-rowh"><span>항목</span><span>주소</span><span>기한 (까지)</span><span>메모</span><span></span></div>
      <div class="addr-rows" id="adRows">${c.items.map(rowHtml).join('')}</div>
      <datalist id="addrLabels">${ADDR_LABELS.map(l => `<option value="${esc(l)}">`).join('')}</datalist>
      <div><button type="button" class="btn sm" id="adAdd">＋ 줄 추가</button></div>
      <div class="hint">기한은 그 주소를 더 쓸 수 없게 되는 날(예: 임대 만료 11/30)입니다. 45일 안이면 주황, 지나면 빨강으로 보입니다.</div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="adSave">저장</button></div>`, { wide: true });
  const rows = $('#adRows');
  const bindX = () => rows.querySelectorAll('.x').forEach(x => x.onclick = () => { if (rows.children.length <= 1) { toast('줄이 하나는 있어야 합니다', true); return; } x.closest('.addr-row').remove(); });
  bindX();
  $('#adAdd').onclick = () => { rows.insertAdjacentHTML('beforeend', rowHtml()); bindX(); rows.lastElementChild.querySelector('.rl').focus(); };
  $('#adSave').onclick = async () => {
    const name = $('#adName').value.trim(); if (!name) { $('#adName').focus(); toast('사업자 이름을 입력하세요', true); return; }
    const items = [...rows.querySelectorAll('.addr-row')].map(r => ({ label: r.querySelector('.rl').value.trim(), address: r.querySelector('.ra').value.trim(), until: r.querySelector('.ru').value || '', memo: r.querySelector('.rm').value.trim() })).filter(i => i.label || i.address);
    d.companies[ci] = { name, note: $('#adNote').value.trim(), items };
    closeModal(); await saveRow('settings', { id: ADDR_ID, value: d, updated_by: me }); toast('사업자주소지를 저장했습니다');
  };
}
function listOf(){
  const base = view === 'off' ? OFF() : view.startsWith('g:') ? ALL().filter(a => a.group_name === view.slice(2)) : ALL();
  const s = q.trim().toLowerCase();
  return base.filter(a => !s || [a.service, a.login_id, a.purpose, a.company, a.owner, a.memo, a.url, a.group_name, a.shared_with].some(v => (v || '').toLowerCase().includes(s)));
}
function statsHtml(){
  const all = ALL();
  return `<div class="stats">
    <div class="stat"><div class="l">계정</div><div class="v">${all.length}개</div><div class="s">구분 ${groups().length}개${OFF().length ? ` · 사용안함 ${OFF().length}개` : ''}</div></div>
    <div class="stat"><div class="l">비밀번호 비어 있음</div><div class="v ${all.filter(a => !a.password).length ? 'orange' : ''}">${all.filter(a => !a.password).length}개</div><div class="s">계정을 열어 넣어 두세요</div></div>
    <div class="stat"><div class="l">${DEPT === '마케팅' ? '운영계정 (자료실)' : '마케팅계정 (마케팅)'}</div><div class="v" style="font-size:14px"><a href="accounts.html${DEPT === '마케팅' ? '' : '?dept=마케팅'}">🔐 ${DEPT === '마케팅' ? '자료실 > 운영계정' : '마케팅 > 마케팅계정'} →</a></div><div class="s">구분이 ${DEPT === '마케팅' ? '인스타그램·기타 마케팅·제품' : '그 외'}인 계정은 저쪽에</div></div>
  </div>`;
}
function tableHtml(){
  // 구분은 정해진 순서(GROUP_ORDER)로, 같은 구분 안에서는 사업자별로 모으고 그 안에서 서비스 이름순
  const compKey = a => DEPT === '마케팅' ? String((COMPANIES.indexOf(a.company) + 1) || 9) : (a.purpose || '힣');   // 사업자가 비어 있으면 맨 뒤
  const order = groups();
  const list = sort.key === 'group_name'
    ? listOf().slice().sort((a, b) => { const d = ((order.indexOf(a.group_name) + 1 || 99) - (order.indexOf(b.group_name) + 1 || 99)) * (sort.dir === 'asc' ? 1 : -1); return d || compKey(a).localeCompare(compKey(b), 'ko') || String(a.service || '').localeCompare(String(b.service || ''), 'ko'); })
    : sortBy(listOf(), sort, { fee: f => Number(f) || 0 });
  const showGroup = !view.startsWith('g:');
  const cols = [...(showGroup ? [['group_name', '구분']] : []), ['service', '서비스'], ['url', '주소'], ['purpose', PURPOSE_LABEL], ...(DEPT === '마케팅' ? [['company', '사업자']] : []), ['login_id', '아이디'], ['password', '비밀번호'], ['owner', '담당자'], ['shared_with', '공유 사용자'], ['memo', '비고']];
  if (!list.length) return `<div class="empty">${q ? '검색 결과가 없습니다.' : view === 'off' ? '사용안함으로 빼 둔 계정이 없습니다.<br>안 쓰는 계정은 그 줄의 <b>사용안함</b> 버튼을 누르면 여기로 옮겨집니다.' : view === 'g:' + ETC ? '기타로 옮긴 계정이 없습니다.<br>안 쓰는 계정을 열어 <b>구분</b>을 <b>기타</b>로 바꾸면 여기로 모입니다.' : '등록된 계정이 없습니다. <b>＋ 계정 추가</b>로 넣어 주세요.'}</div>`;
  return `<div class="tablewrap"><table class="acc"><thead><tr>${cols.map(([k, l]) => `<th data-sort="${k}">${l}${sortArrow(sort, k)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${list.map(a => `<tr class="row" data-id="${a.id}">
      ${showGroup ? `<td><span class="grp ${grpCls(a.group_name)}">${esc(a.group_name || '-')}</span></td>` : ''}
      <td class="svc" title="${esc(a.service)}"><span class="title">${esc(a.service)}</span>${a.admin_only ? '<span class="lock">관리자만</span>' : ''}</td>
      <td>${siteHtml(a.url)}</td>
      <td class="small pur" title="${esc(a.purpose || '')}">${esc(a.purpose || '')}</td>
      ${DEPT === '마케팅' ? `<td>${a.company ? `<span class="grp ${COMP_CLS[a.company] || 'c9'}" style="font-size:12px;padding:2px 8px">${esc(a.company)}</span>` : '<span class="hint">-</span>'}</td>` : ''}
      <td class="idc"><span class="mono" title="${esc(a.login_id || '')}">${esc(a.login_id || '')}</span>${a.login_id ? ` <button class="ib" data-copy="${esc(a.login_id)}">복사</button>` : ''}</td>
      <td>${pwHtml(a)}</td>
      <td>${who(a.owner)}</td>
      <td class="small share" title="${esc(a.shared_with || '')}">${esc(a.shared_with || '')}</td>
      <td class="memo2" title="${esc(a.memo || '')}">${esc(a.memo || '')}</td>
      <td class="act"><button class="btn sm" data-edit="${a.id}">수정</button>${a.unused ? `<button class="btn sm primary" data-on="${a.id}" title="다시 쓰는 계정으로 되돌립니다">다시 사용</button>` : `<button class="btn sm" data-off="${a.id}" title="안 쓰는 계정을 사용안함 탭으로 빼 둡니다 (지우지는 않음)" style="color:var(--fg2)">사용안함</button>`}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function renderView(){ $('#view').innerHTML = tableHtml(); bindView(); }
function bindView(){
  const c = $('#cnt'); if (c) c.textContent = `${listOf().length}개`;
  bindSort(sort, renderView, { service: 'asc', group_name: 'asc', owner: 'asc', login_id: 'asc' });
  document.querySelectorAll('[data-eye]').forEach(b => b.onclick = e => { e.stopPropagation(); shown[b.dataset.eye] = !shown[b.dataset.eye]; renderView(); });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async e => { e.stopPropagation(); try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했습니다'); } catch { toast('복사할 수 없습니다. 직접 선택해서 복사하세요', true); } });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); openEdit(b.dataset.edit); });
  document.querySelectorAll('[data-off],[data-on]').forEach(b => b.onclick = e => { e.stopPropagation(); setUnused(b.dataset.off || b.dataset.on, !!b.dataset.off); });
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = e => { if (e.target.closest('button, a')) return; openEdit(tr.dataset.id); });
}

/* 사용안함으로 빼기 / 다시 사용 (지우지 않고 '사용안함' 탭으로 옮김) */
async function setUnused(id, unused){
  const a = VIS().find(x => x.id === id); if (!a) return;
  await saveRow('accounts', { ...a, unused, updated_by: me });
  toast(unused ? `"${a.service}" 을(를) 사용안함으로 옮겼습니다` : `"${a.service}" 을(를) 다시 사용으로 되돌렸습니다`);
}
/* ---------- 추가·수정 창 ---------- */
function openEdit(id, preset = {}){
  const a = id ? VIS().find(x => x.id === id) : null;
  const d = a || { group_name: DEPT === '마케팅' ? (view.startsWith('g:') ? view.slice(2) : MARKETING_GROUPS[0]) : (view.startsWith('g:') ? view.slice(2) : ''), service: '', url: '', purpose: '', login_id: '', password: '', owner: '', shared_with: '', fee: '', cycle: '없음', billing_day: '', start_date: '', end_date: '', admin_only: false, memo: '', ...preset };
  openModal(`${modalHead(a ? '계정 정보' : '계정 추가')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>구분 (회사/용도)</label><select id="aGroupSel"><option value="">(없음)</option>${[...new Set([...groups(), ...(DEPT === '마케팅' ? MARKETING_GROUPS : GROUP_ORDER.filter(g => !MARKETING_GROUPS.includes(g)))])].map(g => `<option ${d.group_name === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}<option value="__new" ${d.group_name && ![...groups(), ...GROUP_ORDER, ...MARKETING_GROUPS].includes(d.group_name) ? 'selected' : ''}>＋ 직접 입력…</option></select>
          <input id="aGroup" value="${esc(d.group_name || '')}" placeholder="새 구분 이름" style="margin-top:4px" ${d.group_name && ![...groups(), ...GROUP_ORDER, ...MARKETING_GROUPS].includes(d.group_name) ? '' : 'hidden'}></div>
        <div class="f"><label>서비스 이름 *</label><input id="aService" value="${esc(d.service)}" placeholder="예: 네이버, 어도비" maxlength="60"></div>
        <div class="f"><label>${PURPOSE_LABEL}</label><input id="aPurpose" value="${esc(d.purpose || '')}" placeholder="${DEPT === '마케팅' ? '예: 메타 · 페이지' : '예: 식이해법연구소 · 레모너리'}" maxlength="80"></div>
      </div>
      ${DEPT === '마케팅' ? `<div class="f2">
        <div class="f"><label>사업자</label><select id="aCompany"><option value="">(선택 안 함)</option>${COMPANIES.map(c => `<option ${d.company === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="f"><label>접속 주소</label><input id="aUrl" value="${esc(d.url || '')}" placeholder="예: adobe.co.kr"></div>
      </div>` : `<div class="f"><label>접속 주소</label><input id="aUrl" value="${esc(d.url || '')}" placeholder="예: adobe.co.kr"></div>`}
      <div class="sec">로그인</div>
      <div class="f2">
        <div class="f"><label>아이디</label><input id="aId" value="${esc(d.login_id || '')}" autocomplete="off"></div>
        <div class="f"><label>비밀번호</label><div style="display:flex;gap:4px"><input id="aPw" type="password" value="${esc(d.password || '')}" autocomplete="off" style="flex:1"><button type="button" class="btn sm" id="aPwEye">👁</button></div></div>
      </div>
      <div class="sec">담당·공유</div>
      <div class="f2">
        <div class="f"><label>담당자 / 구매자</label><select id="aOwner"><option value="">미지정</option>${memberOptions(d.owner)}</select></div>
        <div class="f"><label>공유 사용자</label><input id="aShared" value="${esc(d.shared_with || '')}" placeholder="예: 류수연, 김채은"></div>
      </div>
      <div class="f"><label>비고</label><textarea id="aMemo" placeholder="추가 인증 방법, 주의사항, 업체코드 등">${esc(d.memo || '')}</textarea></div>
      <label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="aUnused" ${d.unused ? 'checked' : ''}> 사용안함 (안 쓰는 계정 · '사용안함' 탭으로 빼 둠)</label>
      ${isAdmin() ? `<label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="aAdminOnly" ${d.admin_only ? 'checked' : ''}> 🔒 관리자만 보기 (팀원에게는 숨김)</label>` : ''}
      ${a ? `<div class="hint">등록: ${esc(a.created_by || '')} ${fmtDateTime(a.created_at)}${a.updated_by ? ` · 마지막 수정: ${esc(a.updated_by)} ${fmtDateTime(a.updated_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">
      ${a && isAdmin() ? `<button class="btn danger left" id="aDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="aSave">${a ? '저장' : '추가'}</button>
    </div>`, { wide: true });
  $('#aService').focus();
  $('#aPwEye').onclick = () => { const p = $('#aPw'); p.type = p.type === 'password' ? 'text' : 'password'; };
  // 구분: 목록에서 고르고, "직접 입력"을 고르면 글자 칸이 나옴
  const gs = $('#aGroupSel'), gi = $('#aGroup');
  gs.onchange = () => { if (gs.value === '__new') { gi.hidden = false; gi.value = ''; gi.focus(); } else { gi.hidden = true; gi.value = gs.value; } };
  $('#aSave').onclick = async () => {
    const service = $('#aService').value.trim(); if (!service) { $('#aService').focus(); toast('서비스 이름을 입력하세요', true); return; }
    const row = { id: a ? a.id : uid(), group_name: $('#aGroup').value.trim() || null, service, url: $('#aUrl').value.trim() || null, purpose: $('#aPurpose').value.trim() || null,
      login_id: $('#aId').value.trim() || null, password: $('#aPw').value.trim() || null, owner: $('#aOwner').value || null, shared_with: $('#aShared').value.trim() || null,
      admin_only: $('#aAdminOnly') ? $('#aAdminOnly').checked : !!(a && a.admin_only), unused: $('#aUnused').checked, memo: $('#aMemo').value.trim() || null,
      created_by: a ? a.created_by : me, created_at: a ? a.created_at : nowIso(), updated_by: me };
    if ($('#aCompany')) row.company = $('#aCompany').value || null;   // 사업자 칸은 마케팅계정에서만
    else if (a && a.company) row.company = a.company;
    if (DEPT === '마케팅' && !row.company && !mktGroups().has(row.group_name)) { $('#aCompany').focus(); toast('새 구분은 사업자를 골라야 마케팅계정에 남습니다 (안 고르면 운영계정으로 넘어감)', true); return; }
    closeModal(); await saveRow('accounts', row); toast(a ? '저장했습니다' : '계정을 추가했습니다');
  };
  const del = $('#aDel'); if (del) del.onclick = async () => { if (confirm(`"${a.service}" 계정을 목록에서 삭제할까요?`)) { closeModal(); await removeRow('accounts', a.id); toast('삭제했습니다'); } };
}

boot({ icon: ADDR_MODE ? '🏢' : '🔐', title: ADDR_MODE ? '사업자주소지 관리' : DEPT === '마케팅' ? '마케팅계정' : '운영계정', tables: ['accounts', 'settings'], render, normalize, open: id => openEdit(id) });   // settings: 사업자주소지 탭 저장분   // open: 홈 검색 결과에서 ?open=글번호 로 들어오면 그 글을 바로 엶
</script>
</body>
