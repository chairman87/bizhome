<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결재</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610231338">
<script src="common.js?v=202610231338"></script>
<style>
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:22px;font-weight:700;margin-top:2px}
  .stat .v.red{color:var(--red)}
  .stat .v.orange{color:var(--orange)}
  .stat .v.green{color:var(--green)}
  .stat .s{font-size:11px;color:var(--fg3)}
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn{padding:9px 16px;font-size:14px}
  .amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:600}
  .amt.in{color:var(--green)}
  .amt.out{color:var(--fg)}
  .amt.over{color:var(--red)}
  td.acct{font-size:12px;color:var(--fg2);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
  .flow .step{padding:3px 10px;border-radius:999px;background:var(--bg3)}
  .flow .step.on{background:#dbeafe;color:#1d4ed8;font-weight:600}
  .flow .step.done{background:#dcfce7;color:#15803d}
  .flow .step.no{background:#fee2e2;color:#b91c1c}
  .acctbox{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:14px}
  .acctbox b{font-size:16px;letter-spacing:.3px}
  .acctbox .sp{flex:1}
  .planbox{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius);padding:10px 12px;font-size:13px;line-height:1.7;margin-top:6px}
  .planbox .t{font-weight:700;font-size:14px;cursor:pointer}
  .planbox .t:hover{text-decoration:underline}
  .planbox .memo{color:var(--fg2);white-space:pre-wrap;margin-top:4px;max-height:90px;overflow:auto}
  .linked{margin-top:8px}
  .linked h4{font-size:13px;margin:10px 0 6px;color:var(--fg2)}
  .linked table{width:100%;min-width:0;font-size:13px}
  .linked tr.row{cursor:pointer}
  .linked tr.row:hover td{background:var(--bg2)}
  .linked tr.total td{font-weight:700;background:var(--bg2)}
  .sum table{min-width:0;width:100%}
  .sum td.amt,.sum th.r{text-align:right}
  .sum tr.total td{font-weight:700;background:var(--bg2)}
  .cat{font-size:12px;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 7px;white-space:nowrap}
  .cat.in{background:#dcfce7;color:#166534}
  .nav-m{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .nav-m b{font-size:16px;min-width:110px;text-align:center}
  .radios{display:flex;gap:14px;align-items:center;height:36px;font-size:14px}
  .radios label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .intro{background:var(--bg2);border-radius:var(--radius);padding:10px 14px;font-size:13px;line-height:1.7;color:var(--fg2);margin-bottom:12px}
  .intro b{color:var(--fg)}
  .tab.mode{font-size:15px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   결재 — 두 단계 (2026-10-25 개편)
   ① 기안결재: "무엇을 위해 돈이 이렇게 나갈 계획입니다" → 팀원이 기안 → 대표가 [승인] 또는 [반려]
   ② 자금결제: "승인된 기안대로 진행했으니 돈을 내보내 주세요" → 팀원이 승인된 기안을 골라 청구 → 대표 [결재] → 은행 앱 이체 → [이체 완료]
   한 표(payments)에 함께 저장하고 kind 로 구분: '기안' / '비용'(자금결제) / '수입'
   기안 줄   = { title(기안명), memo(목적·계획), amount(예상 금액), due_date(집행 예정), date(기안일), category, payee, files,
               status(기안대기/기안승인/종결/반려), approved_by/at, reject_reason, comments, created_by, created_at }
   자금결제 줄 = { title, date, category, kind(비용/수입), amount, payee, account, due_date(이체 희망일), memo, files, invoice,
               status(결재대기/결재완료/이체완료/반려), approved_by/at, paid_by/at, reject_reason, comments, created_by, created_at,
               plan_id(어느 기안으로 올렸는지 — sql-payments-plan.sql 로 칸 추가) }
================================================================ */
const ST = { '기안대기': ['#fbeccc', '#9a6700'], '기안승인': ['#dbeafe', '#1d4ed8'], '종결': ['#e5e7eb', '#374151'],
             '결재대기': ['#fbeccc', '#9a6700'], '결재완료': ['#dbeafe', '#1d4ed8'], '이체완료': ['#dcfce7', '#15803d'], '반려': ['#fee2e2', '#b91c1c'] };
const PLAN_ST = ['기안대기', '기안승인', '종결', '반려'];
const FUND_ST = ['결재대기', '결재완료', '이체완료', '반려'];
const KINDS = ['기안', '비용', '수입'];
const DEFAULT_CATS = ['광고비', '인건비', '외주비', '구독료', '소모품', '식대·회식', '교통비', '세금·공과금', '기타'];
const P = () => DATA.payments || [];
const isPlan = p => p.kind === '기안';
const isIn = p => p.kind === '수입';
const PLANS = () => P().filter(isPlan);
const FUNDS = () => P().filter(p => !isPlan(p));
const planOf = p => (p && p.plan_id) ? PLANS().find(x => x.id === p.plan_id) || null : null;
const fundsOf = planId => FUNDS().filter(f => f.plan_id === planId);
const spent = planId => fundsOf(planId).filter(f => f.status !== '반려').reduce((a, f) => a + f.amount, 0);   // 반려 빼고 전부(결재 대기 중인 것도 포함)
const HAS_LINK = () => !P().length || P().some(p => 'plan_id' in p);   // plan_id 칸이 있는지 (없으면 sql-payments-plan.sql 실행 전)
const stHtml = s => tag(s, ...(ST[s] || ST['결재대기']), true);
const won = n => (n == null || n === '' || isNaN(Number(n))) ? '-' : Number(n).toLocaleString('ko-KR') + '원';
const num = s => { const n = Number(String(s || '').replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; };
const cats = () => [...new Set([...DEFAULT_CATS, ...P().map(p => p.category).filter(Boolean)])];

let view = LS.get('pay_view') || 'all';
const isPlanView = () => view.startsWith('p_');
let filter = { q: '', status: '', inv: '', cat: '', person: '' };
let sort = { key: 'date', dir: 'desc' };
let month = todayStr().slice(0, 7);

function normalize(table, p){
  const kind = KINDS.includes(p.kind) ? p.kind : '비용';
  const sts = kind === '기안' ? PLAN_ST : FUND_ST;
  return { ...p, kind, status: sts.includes(p.status) ? p.status : sts[0],
    amount: p.amount != null ? Number(p.amount) : 0, comments: Array.isArray(p.comments) ? p.comments : [], files: Array.isArray(p.files) ? p.files : [] };
}
const log = (text, kind = 'log', files) => ({ by: me, text, at: nowIso(), kind, ...(files && files.length ? { files } : {}) });

const waitPlan = () => PLANS().filter(p => p.status === '기안대기').length;
const waitApprove = () => FUNDS().filter(p => p.status === '결재대기').length;
const waitPay = () => FUNDS().filter(p => p.status === '결재완료').length;
const MODE_TABS = () => [
  { key: 'mode_plan', label: '📝 기안결재', badge: isAdmin() ? waitPlan() : 0, badgeTitle: '승인할 기안' },
  { key: 'mode_fund', label: '💳 자금결제', badge: isAdmin() ? waitApprove() + waitPay() : waitPay(), badgeTitle: isAdmin() ? '결재할 것 + 이체할 것' : '이체할 것' }, null,
];
const VIEWS = () => isPlanView() ? [...MODE_TABS(),
  { key: 'p_all', label: '전체' }, { key: 'p_wait', label: '승인 대기', badge: isAdmin() ? waitPlan() : 0 }, { key: 'p_open', label: '진행 중 (승인됨)' },
  { key: 'p_done', label: '종결·반려' }, { key: 'p_mine', label: '내가 올린 것' },
] : [...MODE_TABS(),
  { key: 'all', label: '전체' }, { key: 'approve', label: '결재 대기', badge: isAdmin() ? waitApprove() : 0 }, { key: 'pay', label: '이체 대기', badge: waitPay() },
  { key: 'done', label: '완료' }, { key: 'mine', label: '내가 올린 것' }, null, { key: 'month', label: '월별 합계' },
];

/* ---------- 저장 동작: 기안 ---------- */
async function approvePlan(id){
  const p = PLANS().find(x => x.id === id); if (!p) return;
  if (!isAdmin()) { toast('관리자만 승인할 수 있습니다', true); return; }
  await saveRow('payments', { ...p, status: '기안승인', approved_by: me, approved_at: nowIso(), reject_reason: null, comments: [...p.comments, log('기안 승인', 'approve')] });
  toast('기안을 승인했습니다. 진행한 뒤 이 기안으로 자금결제를 올리면 됩니다');
}
async function closePlan(id){
  const p = PLANS().find(x => x.id === id); if (!p) return;
  const open = fundsOf(id).filter(f => f.status === '결재대기' || f.status === '결재완료');
  if (open.length && !confirm(`아직 처리 중인 자금결제가 ${open.length}건 있습니다. 그래도 종결할까요?`)) return;
  if (!open.length && !confirm('이 기안을 종결할까요? (더 이상 이 기안으로 자금결제를 올리지 않음)')) return;
  await saveRow('payments', { ...p, status: '종결', comments: [...p.comments, log(`기안 종결 · 집행 ${won(spent(id))} / 예상 ${won(p.amount)}`, 'close')] });
  toast('기안을 종결했습니다');
}
/* ---------- 저장 동작: 자금결제 ---------- */
async function approve(id){
  const p = FUNDS().find(x => x.id === id); if (!p) return;
  if (!isAdmin()) { toast('관리자만 결재할 수 있습니다', true); return; }
  const pl = planOf(p);
  if (pl && spent(pl.id) > pl.amount && !confirm(`이 건까지 더하면 기안 예상 금액(${won(pl.amount)})을 넘습니다.\n이 기안으로 나간 돈 합계: ${won(spent(pl.id))}\n그래도 결재할까요?`)) return;
  await saveRow('payments', { ...p, status: '결재완료', approved_by: me, approved_at: nowIso(), reject_reason: null, comments: [...p.comments, log('결재 완료', 'approve')] });
  toast('결재했습니다. 이체 대기로 넘어갑니다');
}
/* 반려: 기안·자금결제 공용 */
function openReject(id){
  const p = P().find(x => x.id === id); if (!p) return;
  if (!isAdmin()) { toast('관리자만 반려할 수 있습니다', true); return; }
  openModal(`${modalHead('반려')}
    <div class="mb"><div><span class="title">${esc(p.title)}</span><div class="hint">${isPlan(p) ? '기안 · 예상 ' : ''}${won(p.amount)} · ${esc(p.created_by || '')} 등록</div></div>
      <div class="f"><label>반려 사유</label><textarea id="rjText" placeholder="왜 반려하는지 적어 주세요"></textarea></div></div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn danger" id="rjSend">반려</button></div>`);
  $('#rjText').focus();
  $('#rjSend').onclick = async () => {
    const text = $('#rjText').value.trim(); if (!text) { $('#rjText').focus(); toast('사유를 적어 주세요', true); return; }
    closeModal();
    await saveRow('payments', { ...p, status: '반려', reject_reason: text, approved_by: me, approved_at: nowIso(), comments: [...p.comments, log(text, 'reject')] });
    toast('반려했습니다');
  };
}
/* 이체 완료: 은행 앱에서 보낸 뒤 표시 (이체 확인 캡처 첨부 가능) */
function openPaid(id){
  const p = FUNDS().find(x => x.id === id); if (!p) return;
  const at = attachBox('pdFiles', [], 'payments');
  openModal(`${modalHead(isIn(p) ? '입금 확인' : '이체 완료 표시')}
    <div class="mb">
      <div><span class="title">${esc(p.title)}</span><div class="hint">${won(p.amount)} · ${esc(p.payee || '')}</div></div>
      ${p.account ? acctBox(p) : ''}
      <div class="f"><label>메모 (선택)</label><textarea id="pdText" placeholder="${isIn(p) ? '입금 확인한 내용' : '은행 앱에서 이체한 뒤 남길 메모'}"></textarea>${at.html}</div>
      <div class="hint">${isIn(p) ? '입금이 들어온 것을 확인했으면 눌러 주세요.' : '은행 앱에서 이체를 마친 뒤 눌러 주세요. 이체 확인 화면을 캡처해 붙여 두면 나중에 찾기 편합니다.'}</div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="pdSend">${isIn(p) ? '입금 확인' : '이체 완료'}</button></div>`);
  at.bind(); bindCopy();
  $('#pdSend').onclick = async () => {
    const text = $('#pdText').value.trim();   // 창을 닫기 전에 읽어야 함
    closeModal();
    await saveRow('payments', { ...p, status: '이체완료', paid_by: me, paid_at: nowIso(), comments: [...p.comments, log(text || (isIn(p) ? '입금 확인' : '이체 완료'), 'paid', at.files)] });
    toast(isIn(p) ? '입금 확인으로 표시했습니다' : '이체 완료로 표시했습니다');
  };
}
/* 되돌리기·다시 올리기: 기안은 '기안대기', 자금결제는 '결재대기'로 */
async function reopen(id){
  const p = P().find(x => x.id === id); if (!p) return;
  const to = isPlan(p) ? '기안대기' : '결재대기';
  if (!confirm(`다시 "${to}" 상태로 되돌릴까요?`)) return;
  await saveRow('payments', { ...p, status: to, approved_by: null, approved_at: null, paid_by: null, paid_at: null, reject_reason: null, comments: [...p.comments, log(`${to}로 되돌림`)] });
}
const acctBox = p => `<div class="acctbox"><span>🏦</span><b id="acctText">${esc(p.account)}</b><span class="sp"></span><button type="button" class="btn sm" data-copy="${esc(p.account)}">복사</button></div>`;
function bindCopy(){ document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('계좌를 복사했습니다'); } catch { toast('복사가 안 됩니다. 직접 선택해 복사하세요', true); } }); }

/* ---------- 화면 ---------- */
function render(){
  const plan = isPlanView();
  const linkWarn = (isAdmin() && DATA.payments && P().length && !HAS_LINK()) ? `<span class="hint warn">⚠ 기안 연결 칸(plan_id)이 아직 없어 자금결제에 기안을 붙일 수 없습니다 → <b>sql-payments-plan.sql</b> 을 Supabase SQL Editor 에서 실행하세요</span>` : '';
  const actions = plan
    ? `<div class="actions"><button class="btn primary" id="newBtn2">＋ 기안 올리기</button>
        <span class="flow"><span class="step">1 기안 (이런 돈이 나갈 계획)</span>→<span class="step">2 대표 승인</span>→<span class="step">3 진행 후 자금결제 올리기</span>→<span class="step">4 집행 끝나면 종결</span></span></div>`
    : `<div class="actions"><button class="btn primary" id="newBtn2">＋ 자금결제 올리기</button>
        <span class="flow"><span class="step">1 승인된 기안 골라 올리기</span>→<span class="step">2 대표 결재</span>→<span class="step">3 은행 앱 이체</span>→<span class="step">4 이체 완료 표시</span></span>${linkWarn}</div>`;
  const intro = plan
    ? `<div class="intro"><b>기안결재</b>는 돈이 나가기 <b>전에</b> "무엇을 위해, 얼마가, 어떻게 나갈 계획인지" 올려 대표 승인을 받는 곳입니다. 승인된 기안대로 진행한 뒤에는 <b>자금결제</b> 탭에서 그 기안을 골라 돈을 내보내 달라고 올립니다.</div>`
    : `<div class="intro"><b>자금결제</b>는 승인된 기안대로 진행을 마친 뒤 "이렇게 진행했으니 돈을 내보내 주세요" 하고 올리는 곳입니다. 올릴 때 어느 기안인지 고르면 대표가 기안과 비교해 결재합니다. 기안이 필요 없는 소액·정기 지출은 기안 없이 올릴 수 있습니다.</div>`;
  $('#app').innerHTML = headerHtml({ icon: '💳', title: '결재', tabs: VIEWS(), active: view })
    + `<main class="wrap">${!DATA.payments ? `<div class="empty">결재 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL(sql-payments.sql)을 실행하세요.' : ''}</div>`
      : intro + actions + (view === 'month' ? monthHtml() : (view === 'all' ? statsHtml() : view === 'p_all' ? planStatsHtml() : '') + toolbarHtml() + `<div id="view">${tableHtml(filtered())}</div>`)}</main>`;
  const mt = document.querySelector(`.tab[data-view="${plan ? 'mode_plan' : 'mode_fund'}"]`); if (mt) mt.classList.add('on', 'mode');
  document.querySelectorAll('.tab[data-view^="mode_"]').forEach(b => b.classList.add('mode'));
  bindHeader(k => { view = k === 'mode_plan' ? 'p_all' : k === 'mode_fund' ? 'all' : k; LS.set('pay_view', view); filter.status = ''; render(); }, null, m => `올린 건 ${P().filter(p => p.created_by === m.name).length}건`);
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => plan ? openPlan(null) : openPay(null, { kind: '비용' });
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; renderView(); };
  ['status', 'inv', 'cat', 'person'].forEach(k => { const el = $('#f_' + k); if (el) el.onchange = () => { filter[k] = el.value; renderView(); }; });
  const mp = $('#mPrev'); if (mp) {
    const shift = n => { const [y, m] = month.split('-').map(Number); month = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); render(); };
    mp.onclick = () => shift(-1); $('#mNext').onclick = () => shift(1); $('#mToday').onclick = () => { month = todayStr().slice(0, 7); render(); };
  }
  bindView();
}
function statsHtml(){
  const m = FUNDS().filter(p => (p.date || '').startsWith(todayStr().slice(0, 7)));
  const out = m.filter(p => !isIn(p) && p.status !== '반려').reduce((a, p) => a + p.amount, 0);
  const wa = FUNDS().filter(p => p.status === '결재대기'), wp = FUNDS().filter(p => p.status === '결재완료'), needInv = FUNDS().filter(p => p.status === '이체완료' && !p.invoice);
  return `<div class="stats">

  return `<option value="">기안 없이 (소액 · 정기 지출 등 기안이 필요 없는 건)</option>` + list.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.title)} · 예상 ${won(x.amount)} · ${esc(x.created_by || '')}${x.status !== '기안승인' ? ` (${x.status})` : ''}</option>`).join('');
}
function planBoxHtml(pl, exceptId){
  if (!pl) return '';

  return `<div class="planbox"><span class="t" data-plan="${pl.id}" title="기안 내용 보기">📝 ${esc(pl.title)}</span> ${stHtml(pl.status)}
    <div>예상 금액 <b>${won(pl.amount)}</b> · 이미 나간 돈 ${won(used)} · 남은 금액 <b>${won(pl.amount - used)}</b>${pl.approved_by ? ` · 승인 ${esc(pl.approved_by)} ${fmtDate((pl.approved_at || '').slice(0, 10))}` : ''}</div>
    ${pl.memo ? `<div class="memo">${esc(pl.memo)}</div>` : ''}</div>`;
}

  if (p) {
    $('#cAdd').onclick = () => { const text = $('#cText').value.trim(); if (!text && !cAt.files.length) { $('#cText').focus(); return; } if (locked) { closeModal(); saveRow('payments', { ...p, comments: [...p.comments, log(text || '첨부 파일', 'comment', cAt.files)] }); } else save(log(text || '첨부 파일', 'comment', cAt.files)); };
    const md = $('#mDelete'); if (md) md.onclick = async () => { if (confirm(`"${p.title}" 건을 삭제할까요?`)) { closeModal(); await removeRow('payments', p.id); toast('삭제했습니다'); } };
    const ap = $('#mApprove'); if (ap) ap.onclick = () => { closeModal(); approve(p.id); };
    const rj = $('#mReject'); if (rj) rj.onclick = () => { closeModal(); openReject(p.id); };
    const pd = $('#mPaid'); if (pd) pd.onclick = () => { closeModal(); openPaid(p.id); };
    const ro = $('#mReopen'); if (ro) ro.onclick = () => { closeModal(); reopen(p.id); };
  }
}

boot({ icon: '💳', title: '결재', tables: ['payments'], render, normalize, open: openAny });
</script>
</body>
</html>
