<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이스북 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610281808">
<script src="common.js?v=202610281808"></script>
<style>
  /* 페이스북 페이지 모식도: 맨 위 묶음 → 브랜드 → 브랜드별 페이지 */
  .fbm{display:flex;flex-direction:column;align-items:center;max-width:1100px;margin:10px auto 30px}
  .fbm .root{background:#1877f2;color:#fff;font-weight:700;font-size:16px;padding:10px 22px;border-radius:12px;display:flex;align-items:center;gap:8px}
  .fbm .v{width:2px;height:20px;background:var(--line2)}
  .fbm .bar{height:2px;background:var(--line2);width:calc(100% - 100% / 3)}
  .fbm .brands{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
  .fbm .brand{display:flex;flex-direction:column;align-items:center}
  .fbm .bn{color:#fff;font-weight:700;font-size:15px;padding:8px 20px;border-radius:999px;white-space:nowrap}
  .fbm .bn .c{font-weight:400;opacity:.85;font-size:12px;margin-left:4px}
  .fbm .pages{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px;border:1px dashed var(--line2);border-radius:12px;box-sizing:border-box}
  .fbm .pg{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid;border-radius:8px;background:var(--bg)}
  .fbm .pg .f{width:26px;height:26px;border-radius:50%;background:#1877f2;color:#fff;font:700 16px/26px Arial,sans-serif;text-align:center;flex:none}
  .fbm .pg .nm{font-weight:600;font-size:14px}
  .fbm .pg .sub{font-size:12px;color:var(--fg3)}
  .fbm .pg .ar{font-family:Tahoma,'Segoe UI',sans-serif;font-size:16px;text-align:left}
  .fbm .pg{cursor:pointer;align-items:flex-start}
  .fbm .pg:hover{background:var(--bg2);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .fbm .pg .bd{flex:1;min-width:0}
  .fbm .pg .ig{font-size:12px;color:#c13584;margin-top:3px;word-break:break-all}
  .fbm .pg .ig.none{color:var(--fg3)}
  .fbm .pg .memo{font-size:12px;color:var(--fg2);margin-top:4px;white-space:pre-wrap;word-break:break-all;line-height:1.5;background:var(--bg2);border-radius:6px;padding:5px 7px}
  .fbm .pg .ed{font-size:11px;color:var(--fg3);flex:none}
  .fbm button.bn{border:0;cursor:pointer;font-family:inherit}
  .fbm button.bn:hover{filter:brightness(1.12);box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .fbm .bn .plus{margin-left:8px;font-weight:700;opacity:.9}
  .fbm .note{margin-top:16px;font-size:12px;color:var(--fg3);text-align:center}
  @media (max-width:760px){
    .fbm .brands{grid-template-columns:1fr}
    .fbm .bar{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* 브랜드별 페이스북 페이지 목록. 페이지가 늘거나 바뀌면 여기만 고칩니다.
   lang: 'ar' 이면 아랍어(오른쪽에서 왼쪽으로 쓰는 글자), ko 는 우리말 뜻 */
const FB_BRANDS = [
  { name: '레모너리', color: '#e0a800', pages: [{ name: 'Dietbeauty' }, { name: 'Easydiet' }, { name: '식이해법연구소' }] },
  { name: '서리맥스', color: '#2563eb', pages: [{ name: 'Moplus' }, { name: 'Modouble' }, { name: 'Hairtips77' }] },
  { name: '흑생마', color: '#374151', pages: [{ name: 'MaxPower' }, { name: 'قطرة ضوء', lang: 'ar', ko: '빛 한 방울' }, { name: 'حصان بري قوي', lang: 'ar', ko: '힘센 야생마' }] },
];

/* 페이지별 인스타그램 아이디·메모: settings 표에 페이지마다 한 줄(id 'fbpage:<페이지 이름>') → value { ig, memo }
   한 줄에 몰아 두면 두 사람이 동시에 고칠 때 한쪽이 지워지므로 나눔 */
const infoId = name => 'fbpage:' + name;
const infoOf = name => ((DATA.settings || []).find(r => r.id === infoId(name)) || {});
/* 화면에서 추가한 페이지: settings 표에 한 줄씩(id 'fbpage_add:<번호>') → value { brand, name, lang, ko }. 위 FB_BRANDS 는 처음부터 있던 것 */
const ADD_PREFIX = 'fbpage_add:';
const addedRows = () => (DATA.settings || []).filter(r => r.id.startsWith(ADD_PREFIX) && r.value && r.value.name).sort((a, b) => String(a.updated_at || '').localeCompare(String(b.updated_at || '')));
const pagesOf = b => [...b.pages, ...addedRows().filter(r => r.value.brand === b.name).map(r => ({ ...r.value, addId: r.id }))];
const allPages = () => FB_BRANDS.flatMap(b => pagesOf(b).map(x => ({ ...x, brand: b.name })));
const isArabic = t => /[؀-ۿ]/.test(t);
const igList = s => String(s || '').split(/[\s,]+/).map(x => x.trim().replace(/^@/, '')).filter(Boolean);

function render(){
  const total = allPages().length;
  const page = (p, color) => {
    const r = infoOf(p.name), v = r.value || {}, igs = igList(v.ig);
    return `<div class="pg" style="border-left-color:${color}" data-page="${esc(p.name)}" title="눌러서 인스타그램 아이디·메모 적기"><span class="f">f</span><div class="bd">
      <div class="nm ${p.lang === 'ar' ? 'ar' : ''}" ${p.lang === 'ar' ? 'dir="rtl"' : ''}>${esc(p.name)}</div>
      ${p.lang === 'ar' ? `<div class="sub">아랍어 페이지${p.ko ? ' · 뜻: ' + esc(p.ko) : ''}</div>` : ''}
      <div class="ig ${igs.length ? '' : 'none'}">${igs.length ? igs.map(i => '📷 @' + esc(i)).join('<br>') : '📷 인스타그램 아이디 없음'}</div>
      ${v.memo ? `<div class="memo">${esc(v.memo)}</div>` : ''}
    </div><span class="ed">✎</span></div>`;
  };
  $('#app').innerHTML = headerHtml({ icon: '📘', title: '페이스북 페이지' }) + `<main class="wrap">
    <div class="fbm">
      <div class="root"><span class="f" style="background:#fff;color:#1877f2;border-radius:50%;width:24px;height:24px;font:700 16px/24px Arial,sans-serif;text-align:center">f</span>페이스북 페이지 <span style="font-weight:400;opacity:.85;font-size:13px">${FB_BRANDS.length}개 브랜드 · ${total}개 페이지</span></div>
      <div class="v"></div>
      <div class="bar"></div>
      <div class="brands">${FB_BRANDS.map(b => `<div class="brand">
        <div class="v"></div>
        <button class="bn" style="background:${b.color}" data-brand="${esc(b.name)}" title="눌러서 ${esc(b.name)}에 새 페이지 추가">${esc(b.name)}<span class="c">${pagesOf(b).length}개</span><span class="plus">＋</span></button>
        <div class="v"></div>
        <div class="pages">${pagesOf(b).map(p => page(p, b.color)).join('')}</div>
      </div>`).join('')}</div>
      <div class="note">브랜드 이름을 누르면 새 페이지를 추가하고, 페이지 이름을 누르면 연결된 인스타그램 아이디와 메모를 적을 수 있습니다.</div>
    </div>
  </main>`;
  bindHeader(() => {}, null, m => `${m.role === 'admin' ? '관리자' : '팀원'}`);
  document.querySelectorAll('[data-page]').forEach(el => el.onclick = () => openInfo(el.dataset.page));
  document.querySelectorAll('[data-brand]').forEach(el => el.onclick = () => openAdd(el.dataset.brand));
}

function openAdd(brand){
  openModal(`${modalHead(`${esc(brand)} · 새 페이스북 페이지`)}
    <div class="mb">
      <div class="f"><label>페이지 이름 *</label><input id="faName" placeholder="페이스북에 보이는 이름 그대로" maxlength="80"></div>
      <div class="f"><label>우리말 뜻 (외국어 이름일 때만, 선택)</label><input id="faKo" placeholder="예: 힘센 야생마" maxlength="80"></div>
      <div class="hint">인스타그램 아이디와 메모는 추가한 뒤 페이지 이름을 눌러서 적습니다.</div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="faSave">추가</button></div>`);
  $('#faName').focus();
  const save = async () => {
    const name = $('#faName').value.trim(), ko = $('#faKo').value.trim();
    if (!name) { $('#faName').focus(); toast('페이지 이름을 입력하세요', true); return; }
    if (allPages().some(x => x.name.toLowerCase() === name.toLowerCase())) { toast(`"${name}" 은(는) 이미 있습니다`, true); return; }
    closeModal();
    await saveRow('settings', { id: ADD_PREFIX + uid(), value: { brand, name, lang: isArabic(name) ? 'ar' : null, ko: ko || null }, updated_by: me, updated_at: nowIso() });
    toast(`${brand}에 "${name}" 페이지를 추가했습니다`);
  };
  $('#faSave').onclick = save;
  $('#faName').onkeydown = e => { if (e.key === 'Enter') save(); };
}

function openInfo(name){
  const r = infoOf(name), v = r.value || {};
  const p = allPages().find(x => x.name === name) || {};
  openModal(`${modalHead(`📘 ${esc(name)}`)}
    <div class="mb">
      <div class="hint" style="margin-bottom:8px">${esc(p.brand || '')} 페이스북 페이지${p.ko ? ' · 뜻: ' + esc(p.ko) : ''}</div>
      <div class="f"><label>연결된 인스타그램 아이디</label><input id="fiIg" value="${esc(v.ig || '')}" placeholder="예: @lemonery_official (여러 개면 쉼표로)" maxlength="200"></div>
      <div class="f"><label>메모</label><textarea id="fiMemo" style="min-height:140px" maxlength="3000" placeholder="예: 광고 계정 연결, 관리자 권한 가진 사람, 주의할 점 등">${esc(v.memo || '')}</textarea></div>
      ${r.updated_by ? `<div class="hint">마지막 수정: ${esc(r.updated_by)}${r.updated_at ? ' · ' + fmtDateTime(r.updated_at) : ''}</div>` : ''}
    </div>
    <div class="mf">${p.addId ? '<button class="btn danger left" id="fiDel">이 페이지 빼기</button>' : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="fiSave">저장</button></div>`);
  $('#fiIg').focus();
  if (p.addId) $('#fiDel').onclick = async () => {
    if (!confirm(`"${name}" 페이지를 목록에서 뺄까요?
적어 둔 인스타그램 아이디·메모도 함께 지워집니다.`)) return;
    closeModal();
    await removeRow('settings', p.addId);
    if (r.id) await removeRow('settings', r.id);
    toast(`"${name}" 페이지를 뺐습니다`);
  };
  $('#fiSave').onclick = async () => {
    const ig = igList($('#fiIg').value).map(i => '@' + i).join(', ');
    const memo = $('#fiMemo').value.trim();
    closeModal();
    await saveRow('settings', { id: infoId(name), value: { ig, memo }, updated_by: me, updated_at: nowIso() });
    toast(`${name} 저장했습니다`);
  };
}

boot({ icon: '📘', title: '페이스북 페이지', tables: ['settings'], render });
</script>
</body>
</html>
