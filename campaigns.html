<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고 캠페인 현황(관리자용)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610211916">
<script src="common.js?v=202610211916"></script>
<style>
  .wrap-cps{max-width:1360px}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .ctl .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .ctl .seg button{border:0;background:var(--bg);padding:6px 12px;font-size:13px;color:var(--fg2)}
  .ctl .seg button+button{border-left:1px solid var(--line)}
  .ctl .seg button.on{background:var(--fg);color:#fff}
  .ctl .seg button:disabled{cursor:default;color:var(--fg3)}
  .ctl .seg button small{font-size:11px;margin-left:3px}
  .ctl label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--fg2);cursor:pointer}
  .ctl .upd{margin-left:auto;font-size:12px;color:var(--fg3)}
  .bsec{margin:0 0 26px}
  .bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 8px}
  .bh h2{margin:0;font-size:17px}
  .bh .stats{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg2);font-size:13px;font-variant-numeric:tabular-nums}
  .bh .stats b{color:var(--fg)}
  .cps-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  .cps{border-collapse:collapse;width:100%;min-width:1420px;font-size:13px}
  .cps th{background:var(--bg3);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-size:12px;color:var(--fg2)}
  .cps td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .cps th.num,.cps td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cps td.camp{border-right:1px solid var(--line);background:var(--bg2);vertical-align:top;width:230px;min-width:220px}
  .cps td.set{border-left:1px solid var(--line);text-align:center;min-width:110px}
  .cps td.aud{min-width:200px;max-width:280px}
  .cps td.crc{min-width:340px}   /* 소재 이름이 한 줄에 시원하게 보이도록 */
  .cps th.dayh{color:var(--fg)}
  .cps tr.cend td{border-bottom:1px solid var(--line2)}
  .cname{font-weight:700;display:flex;gap:6px;align-items:flex-start}
  .cmeta{margin-top:6px;display:flex;flex-direction:column;gap:2px;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
  .cmeta span{white-space:nowrap}
  .cpa-box{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:12px;font-variant-numeric:tabular-nums}
  .cpa-h{color:var(--fg3);font-size:11px;margin-bottom:2px}
  .cpa-r{display:flex;justify-content:space-between;gap:10px;color:var(--fg2);line-height:1.6}
  .cpa-r b{color:var(--fg);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--fg3)}
  .dot.on{background:var(--green)}
  .cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
  .cr .ct{font-weight:600}
  .cr .ed{color:var(--fg2)}
  .tg{font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap}
  .tg.dt{color:var(--fg3);padding:0}
  .tg.var{background:#e7f1fb;color:#1f6fb8}
  .tg.cat{background:var(--bg3);color:var(--fg2)}
  .tg.stop{background:#fbeee1;color:#b4590a}
  .cps tr.stopped td:not(.camp):not(.set){color:var(--fg3)}
  .cps tr.stopped .ct{font-weight:500}
  .grp{display:block;font-size:11px;color:var(--fg3);margin-bottom:4px}
  /* 직접 입력 칸 */
  .ed-cell{display:block;width:100%;border:1px dashed transparent;border-radius:6px;padding:4px 6px;background:none;text-align:center;font:inherit;color:var(--fg);cursor:text;min-height:28px}
  .ed-cell:hover,.ed-cell:focus-visible{border-color:var(--line2);background:var(--bg)}
  .ed-cell.empty{color:var(--fg3)}
  .ed-cell.empty::before{content:'＋ 입력'}
  .ed-in{width:100%;border:1px solid var(--blue);border-radius:6px;padding:4px 6px;font:inherit;text-align:center;background:var(--bg)}
  .ed-by{display:block;font-size:10px;color:var(--fg3);margin-top:2px}
  .nodata{padding:30px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);border-radius:var(--radius)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================================================================
   광고 캠페인 현황(관리자용) — 마케팅 > 광고 캠페인 현황
   · 채널별로 어떤 캠페인에 어떤 소재가 돌고 있고, 광고그룹 설정(타겟팅·오디언스·지면·최적화 이벤트·입찰)이 어떤지 한눈에.
   · 자료: ad_campaigns 표.
       kind='data' (id 'data-tiktok') — 대표 PC 의 AD-STRUCTURE\build.py 가 매시간 틱톡 보고서 API 에서 읽어 넣음(손대지 않음)
       kind='data' (id 'data-google') — 같은 반영기의 google.py 가 구글애즈 API 에서 설정(나이·성별·오디언스·전환 목표·입찰)까지 읽어 넣음 (그룹에 auto:true)
       kind='set'  (id 'set-<채널>-<광고그룹ID>') — 이 화면에서 직접 적는 타겟팅·오디언스·최적화 이벤트 (틱톡은 API 권한이 없어 못 읽는 칸, 구글은 값이 빌 때만)
   · 볼 수 있는 사람: 관리자 + 메뉴 편집에서 '볼 수 있는 사람'으로 체크한 담당자 (common.js ADMIN_ONLY_PAGES)
   · '운영 중' = 틱톡은 어제나 오늘 노출이 있음, 구글은 캠페인·광고그룹·광고가 모두 켜짐. 광고비·구매·CPA·ROAS 는 고른 하루(어제/오늘) 플랫폼 기준, 광고비는 부가세 별도.
================================================================ */
const CHANNELS = [['tiktok', '틱톡'], ['meta', '메타'], ['google', '구글'], ['coupang', '쿠팡']];
const FIELDS = [['target', '타겟팅', ['25세 이상 남녀', '25세 이상 여성', '25세 이상 남성', '전체 남녀']],
                ['audience', '오디언스', ['지정 없음']],
                ['event', '최적화 이벤트', ['구매', '장바구니 담기', '결제 시작', '페이지 조회']]];
let channel = ['tiktok', 'google'].includes(LS.get('cps_ch')) ? LS.get('cps_ch') : 'tiktok', brand = '전체';
let dayKey = LS.get('cps_day') === 'today' ? 'today' : 'yday';
let showStopped = LS.get('cps_stopped') === '1';
let editing = null;   // 지금 입력 중인 칸 { gid, field }

const fmt = n => Math.round(n || 0).toLocaleString('ko-KR');
const man = n => n >= 1e4 ? fmt(n / 1e4) + '만' : fmt(n);
const roas = (v, s) => s > 0 ? Math.round(v / s * 100) + '%' : '–';
const cpa = (s, n) => n > 0 ? fmt(s / n) : (s > 0 ? '–' : '');   // 전환당 비용 = 광고비 ÷ 구매 수
const md = d => d ? (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) : '';
const rows = () => DATA.ad_campaigns || [];
const chData = () => (rows().find(r => r.id === 'data-' + channel) || {}).data || null;
const setOf = gid => rows().find(r => r.id === `set-${channel}-${gid}`);
const chName = () => (CHANNELS.find(c => c[0] === channel) || [, ''])[1];

function dayVal(x, D){ return (x.d && x.d[D[dayKey]]) || [0, 0, 0]; }   // [광고비, 구매 수, 구매 금액]
function sum(list, D){ return list.reduce((a, x) => { const v = dayVal(x, D); return [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; }, [0, 0, 0]); }

function setCell(g, field){
  const gid = g.id;
  if (g.auto && g[field]) return `<span title="${esc(chName())} API 에서 자동으로 읽은 값">${esc(g[field])}</span>`;
  const r = setOf(gid), v = r && r.data ? (r.data[field] || '') : '';
  if (editing && editing.gid === gid && editing.field === field)
    return `<input class="ed-in" id="edIn" list="dl-${field}" value="${esc(v)}" maxlength="120" placeholder="입력 후 Enter">`;
  return `<button class="ed-cell${v ? '' : ' empty'}" data-ed="${esc(gid)}" data-f="${field}" title="눌러서 직접 입력">${esc(v)}</button>`;
}

/* 캠페인 CPA: 고른 하루 + 최근 5일 + 최근 2주 (기간은 어제까지 꽉 찬 날, data.win) */
function cpaBox(c, ct, D){
  const W = D.win || {}, w = c.win || {};
  const rng = k => W[k] ? `${md(W[k][0])}~${md(W[k][1])}` : '';
  const line = (label, v, title) => `<div class="cpa-r" title="${esc(title)}"><span>${label}</span><b>${v[1] > 0 ? fmt(v[0] / v[1]) + '원' : '–'}</b></div>`;
  return `<div class="cpa-box"><div class="cpa-h">CPA (전환당 비용)</div>
    ${line(md(D[dayKey]) + (dayKey === 'today' ? ' (진행 중)' : ''), ct, '광고비 ' + fmt(ct[0]) + '원 ÷ 구매 ' + fmt(ct[1]))}
    ${w.d5 ? line('최근 5일', w.d5, rng('d5') + ' · 광고비 ' + fmt(w.d5[0]) + '원 ÷ 구매 ' + fmt(w.d5[1])) : ''}
    ${w.d14 ? line('최근 2주', w.d14, rng('d14') + ' · 광고비 ' + fmt(w.d14[0]) + '원 ÷ 구매 ' + fmt(w.d14[1])) : ''}</div>`;
}

function brandHtml(b, D){
  const all = b.campaigns.flatMap(c => c.groups.flatMap(g => g.creatives));
  const t = sum(all, D);
  const camps = b.campaigns.map(c => ({ ...c, groups: c.groups.map(g => ({ ...g, creatives: g.creatives.filter(x => showStopped || x.running) })).filter(g => g.creatives.length) })).filter(c => c.groups.length);
  let body = '';
  camps.forEach(c => {
    const n = c.groups.reduce((a, g) => a + g.creatives.length, 0), multi = c.groups.length > 1;
    const ct = sum(c.groups.flatMap(g => g.creatives), D);
    c.groups.forEach((g, gi) => g.creatives.forEach((x, i) => {
      const last = gi === c.groups.length - 1 && i === g.creatives.length - 1, v = dayVal(x, D);
      body += `<tr class="${x.running ? '' : 'stopped'}${last ? ' cend' : ''}">`;
      if (gi === 0 && i === 0) body += `<td class="camp" rowspan="${n}"><div class="cname"><span class="dot${c.running ? ' on' : ''}" title="${c.running ? '운영 중' : '최근 멈춤'}"></span><span>${esc(c.name)}</span></div>
        <div class="cmeta"><span>${esc(c.objective)}</span><span>예산 ${c.budget ? fmt(c.budget) + '원' : '광고그룹 단위'}</span>
        <span>${md(D[dayKey])} 광고비 ${man(ct[0])}원</span><span>${md(D[dayKey])} 구매 ${fmt(ct[1])}</span><span>${md(D[dayKey])} ROAS ${roas(ct[2], ct[0])}</span></div>
        ${cpaBox(c, ct, D)}</td>`;
      const tags = [x.date ? `<span class="tg dt">${esc(x.date)} 등록</span>` : '',
        x.kind !== '영상' ? `<span class="tg cat">${esc(x.kind)}</span>` : '',
        x.variants ? `<span class="tg var" title="틱톡이 음악·편집을 바꿔 자동으로 만든 변형을 이 줄에 합침">자동 변형 ${x.variants}개 포함</span>` : (x.n > 1 ? `<span class="tg var">같은 소재 ${x.n}개</span>` : ''),
        x.note ? `<span class="tg stop" title="구글 정책 검토 결과. 일부 제한이면 노출이 줄 수 있음">${esc(x.note)}</span>` : '',
        x.running ? '' : `<span class="tg stop">${x.last_day ? md(x.last_day) + ' 이후 ' : ''}멈춤</span>`].join('');
      body += `<td class="crc"><div class="cr"><span class="ct">${esc(x.title)}</span>${x.editor ? `<span class="ed">· ${esc(x.editor)}</span>` : ''}${tags}</div></td>
        <td class="num">${fmt(v[0])}</td><td class="num">${fmt(v[1])}</td><td class="num">${cpa(v[0], v[1])}</td><td class="num">${roas(v[2], v[0])}</td>`;
      if (i === 0) {
        const rs = g.creatives.length, s = setOf(g.id);
        const gname = (multi || g.name !== c.name) ? `<span class="grp">그룹 · ${esc(g.name)}</span>` : '';
        const by = s && s.updated_by ? `<span class="ed-by">${esc(s.updated_by)} · ${md(String(s.updated_at || '').slice(0, 10))}</span>` : '';
        body += `<td class="set" rowspan="${rs}">${gname}${setCell(g, 'target')}</td>
          <td class="set aud" rowspan="${rs}">${setCell(g, 'audience')}</td>
          <td class="set" rowspan="${rs}">${esc(g.placement)}</td>
          <td class="set" rowspan="${rs}">${setCell(g, 'event')}${g.auto ? '' : by}</td>
          <td class="set" rowspan="${rs}">${esc(g.bid)}</td>`;
      }
      body += '</tr>';
    }));
  });
  const runC = b.campaigns.filter(c => c.running).length, runA = all.filter(x => x.running).length;
  return `<section class="bsec"><div class="bh"><h2>${esc(b.brand)}</h2><div class="stats"><span>운영 캠페인 <b>${runC}</b></span><span>운영 소재 <b>${runA}</b></span>
    <span>${md(D[dayKey])} 광고비 <b>${man(t[0])}원</b></span><span>구매 <b>${fmt(t[1])}</b></span><span>CPA <b>${cpa(t[0], t[1]) || '–'}${t[1] > 0 ? '원' : ''}</b></span><span>ROAS <b>${roas(t[2], t[0])}</b></span></div></div>
    ${body ? `<div class="cps-scroll"><table class="cps"><thead><tr><th>캠페인</th><th>광고 소재</th><th class="num dayh" title="${esc(dayKey === 'today' ? '오늘 지금까지' : '어제 하루')} 기준">${md(D[dayKey])} 광고비</th><th class="num dayh">${md(D[dayKey])} 구매</th><th class="num dayh" title="전환당 비용 = 광고비 ÷ 구매 수">${md(D[dayKey])} CPA</th><th class="num dayh">${md(D[dayKey])} ROAS</th>
    <th>타겟팅</th><th>오디언스</th><th>지면</th><th>최적화 이벤트</th><th>입찰</th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="nodata">운영 중인 캠페인이 없습니다.</div>'}</section>`;
}

function render(){
  const D = chData();
  const brands = D ? D.brands.map(b => b.brand) : [];
  if (brand !== '전체' && !brands.includes(brand)) brand = '전체';
  const opts = f => [...new Set([...FIELDS.find(x => x[0] === f)[2], ...rows().filter(r => r.kind === 'set' && r.data && r.data[f]).map(r => r.data[f])])];
  $('#app').innerHTML = headerHtml({ icon: '🧭', title: '광고 캠페인 현황(관리자용)', tabs: ['전체', ...brands].map(b => ({ key: b, label: b })), active: brand }) + `<main class="wrap wrap-cps">
    <div class="ctl"><div class="seg">${CHANNELS.map(([k, l]) => { const has = rows().some(r => r.id === 'data-' + k); return `<button data-ch="${k}" class="${channel === k ? 'on' : ''}" ${has ? '' : 'disabled'}>${l}${has ? '' : '<small>준비 중</small>'}</button>`; }).join('')}</div>
      <div class="seg">${D ? [['yday', '어제 ' + md(D.yday)], ['today', '오늘 ' + md(D.today) + ' (진행 중)']].map(([k, l]) => `<button data-day="${k}" class="${dayKey === k ? 'on' : ''}">${l}</button>`).join('') : ''}</div>
      <label><input type="checkbox" id="stopChk" ${showStopped ? 'checked' : ''}> 최근 멈춘 소재도 보기</label>
      <span class="upd">${D ? '자료 갱신 ' + esc(D.updated) + ' · 매시간 40분에 자동 반영' : ''}</span></div>
    ${DATA.ad_campaigns === undefined ? '' : !D ? `<div class="nodata">아직 ${chName()} 자료가 들어오지 않았습니다. 대표 PC 의 자동 반영(매시간 40분)을 기다려 주세요.</div>`
      : D.brands.filter(b => brand === '전체' || b.brand === brand).map(b => brandHtml(b, D)).join('')}
    ${FIELDS.map(([f]) => `<datalist id="dl-${f}">${opts(f).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`).join('')}
    <div class="foot"><b>보는 법</b> — 캠페인 칸의 CPA 는 고른 하루와 최근 5일·최근 2주(어제까지 꽉 찬 날, 숫자에 마우스를 올리면 기간·계산이 보임)입니다. 그 밖의 광고비·구매·CPA·ROAS는 위에서 고른 하루의 ${chName()} 광고관리자 기준입니다(광고비 부가세 별도, 구매는 ${channel === 'google' ? '입찰에 쓰는 구매 전환' : '픽셀이 추적한 결제'}, CPA = 광고비 ÷ 구매 수).
    ${channel === 'google' ? `<b>운영 중</b>(초록 점)은 캠페인·광고그룹·광고가 모두 켜진 것입니다. 꺼졌어도 최근 7일 노출이 있으면 '최근 멈춘 소재도 보기'로 볼 수 있습니다.
    나이·성별·오디언스·지면·전환 목표·입찰은 모두 구글애즈에서 자동으로 읽어 옵니다. '일부 제한'은 구글 정책 검토에서 노출이 제한된 소재입니다.`
    : `<b>운영 중</b>(초록 점)은 어제나 오늘 노출이 있던 캠페인·소재입니다. 캠페인·광고그룹·소재 이름과 예산·지면·입찰은 틱톡에서 자동으로 읽어 옵니다.
    <b>타겟팅·오디언스·최적화 이벤트</b>는 틱톡이 아직 읽기 권한을 주지 않아 이 화면에서 직접 적습니다. 칸을 누르고 적은 뒤 Enter(취소는 Esc). 광고그룹 단위로 저장되고 다음 갱신 때도 그대로 남습니다.`}</div>
  </main>`;
  bindHeader(b => { brand = b; renderApp(); }, null, null);
  document.querySelectorAll('[data-ch]:not(:disabled)').forEach(b => b.onclick = () => { channel = b.dataset.ch; LS.set('cps_ch', channel); editing = null; renderApp(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { dayKey = b.dataset.day; LS.set('cps_day', dayKey); renderApp(); });
  $('#stopChk').onchange = e => { showStopped = e.target.checked; LS.set('cps_stopped', showStopped ? '1' : '0'); renderApp(); };
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { editing = { gid: b.dataset.ed, field: b.dataset.f }; renderApp(); });
  const inp = $('#edIn');
  if (inp) {
    inp.focus(); inp.select();
    let done = false;
    const finish = save => { if (done) return; done = true; const e = editing; editing = null; if (save) saveSet(e.gid, e.field, inp.value.trim()); else renderApp(); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); };
    inp.onblur = () => finish(true);
  }
}

function saveSet(gid, field, value){
  const old = setOf(gid), prev = old && old.data ? old.data : {};
  if ((prev[field] || '') === value) { renderApp(); return; }
  saveRow('ad_campaigns', { id: `set-${channel}-${gid}`, kind: 'set', data: { ...prev, [field]: value }, updated_by: me });
}

boot({ icon: '🧭', title: '광고 캠페인 현황(관리자용)', tables: ['ad_campaigns'], render });
</script>
