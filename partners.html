<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파트너스</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202609162213">
<script src="common.js?v=202609162213"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn{padding:9px 16px;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v.orange{color:var(--orange)}
  .stat .s{font-size:11px;color:var(--fg3)}
  table.pt{min-width:1500px}
  table.pt td{white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .prod{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;border:1px solid transparent;background:#f1f5f9;color:#334155}
  .prod.p0{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .prod.p1{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .prod.p2{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
  .prod.p3{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
  .handle{font-size:12px;color:var(--fg3)}
  .handle a{color:var(--fg3);text-decoration:none}
  .handle a:hover{color:var(--blue);text-decoration:underline}
  .ox{border:1px solid var(--line2);background:#fff;border-radius:6px;width:34px;height:26px;font-weight:700;cursor:pointer;color:var(--fg3)}
  .ox.on{background:#dcfce7;border-color:#86efac;color:#15803d}
  select.stage{border:1px solid var(--line2);border-radius:6px;font:inherit;font-size:12px;padding:3px 6px;background:#fff;max-width:190px}
  select.stage.s-done{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:600}
  select.stage.s-late{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
  select.stage.s-mid{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
  select.stage.s-early{background:#fef3c7;border-color:#fde68a;color:#92400e}
  .next{font-size:12px;color:var(--orange);font-weight:600}
  .up a{font-size:12px}
  .kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-items:start}
  .kb .col{background:var(--bg2);border-radius:10px;padding:8px}
  .kb .col h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
  .kb .col h3 .n{color:var(--fg3);font-weight:400}
  .kb .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px}
  .kb .card:hover{box-shadow:var(--shadow)}
  .kb .card .sub{font-size:11px;color:var(--fg3);margin-top:2px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.f3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   파트너스 — 인플루언서(크리에이터) 협업 진행 관리
   한 줄 = { product(제품), assignee(담당자), handle(계정명), name(이름), profile_url, followers(팔로워 수, 숫자),
             fee(확정 견적, 원), fee_note(기간 등), delivered(제품전달), stage(진행 단계 1~10), next_schedule(다음 일정),
             upload_url(업로드 링크), upload_date(광고업로드 일자), paid(비용지급 완료), memo, files, created_by/at, updated_by/at }
================================================================ */
const STAGES = ['1. 컨택', '2. 견적 협의', '3. 계약 완료', '4. 제품 전달', '5. 콘티 피드백 완료', '6. 1차본 수령', '7. 1차본 피드백 완료', '8. 최종본 확정', '9. 광고 게재 완료', '10. 정산 완료'];
const PRODUCTS = ['레모너리', '서리맥스', '흑생마', '기타'];
const P = () => DATA.partners || [];
const won = n => (n == null || n === '' || isNaN(Number(n))) ? '' : Number(n).toLocaleString('ko-KR') + '원';
const num = s => { const n = Number(String(s || '').replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; };
const fmtFol = n => { n = Number(n) || 0; if (!n) return '-'; return n >= 10000 ? `${(n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 })}만` : n.toLocaleString('ko-KR'); };
const parseFol = s => { s = String(s || '').trim().replace(/,/g, '.'); if (!s) return 0; const m = s.match(/^([\d.]+)\s*만/); if (m) return Math.round(Number(m[1]) * 10000); return Math.round(num(s)); };
const stageNo = p => Number(p.stage) || 0;
const stageCls = n => n >= 10 ? 's-done' : n >= 8 ? 's-late' : n >= 5 ? 's-mid' : 's-early';
const isDone = p => stageNo(p) >= 10;
const prodCls = p => 'p' + Math.max(0, PRODUCTS.indexOf(p));
const igUrl = u => u ? (/^https?:\/\//i.test(u) ? u : 'https://' + u) : '';
/* 담당자 약칭 → 팀원 이름 (예: "수연" → 류수연) */
const fullMember = s => { s = String(s || '').trim(); if (!s) return ''; if (members.some(m => m.name === s)) return s; const hit = members.find(m => m.name.endsWith(s) || m.name.includes(s)); return hit ? hit.name : s; };

let view = LS.get('pt_view') || 'active';
let filter = { q: '', product: '', assignee: '', stage: '' };
let sort = { key: 'stage', dir: 'asc' };

function normalize(table, p){ return { ...p, stage: Number(p.stage) || 1, followers: Number(p.followers) || 0, fee: Number(p.fee) || 0, delivered: !!p.delivered, paid: !!p.paid, files: Array.isArray(p.files) ? p.files : [] }; }
const VIEWS = () => [{ key: 'active', label: '진행 중', badge: P().filter(p => !isDone(p)).length }, { key: 'done', label: '정산 완료' }, { key: 'all', label: '전체' }, null, { key: 'board', label: '단계별 상황판' }, { key: 'people', label: '담당자별' }];

function render(){
  $('#app').innerHTML = headerHtml({ icon: '🤝', title: '파트너스', tabs: VIEWS(), active: view })
    + `<main class="wrap wrap-wide" style="max-width:1700px">${!DATA.partners ? `<div class="empty">파트너스 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL(sql-partners.sql)을 실행하세요.' : ''}</div>` : `
    <div class="actions"><button class="btn primary" id="newBtn2">＋ 크리에이터 추가</button>
      <input type="search" id="fq" placeholder="검색 (계정, 이름, 제품)" value="${esc(filter.q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:8px 10px;min-width:200px">
      <select id="f_product"><option value="">제품: 전체</option>${PRODUCTS.map(p => `<option ${filter.product === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
      <select id="f_assignee"><option value="">담당자: 전체</option>${[...new Set(P().map(p => p.assignee).filter(Boolean))].sort().map(a => `<option ${filter.assignee === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
      ${view !== 'board' ? `<select id="f_stage"><option value="">단계: 전체</option>${STAGES.map((s, i) => `<option value="${i + 1}" ${filter.stage == i + 1 ? 'selected' : ''}>${s}</option>`).join('')}</select>` : ''}
      <span class="count" id="cnt"></span></div>
    ${statsHtml()}<div id="view">${viewHtml()}</div>`}</main>`;
  bindHeader(k => { view = k; LS.set('pt_view', k); render(); }, null, m => `담당 ${P().filter(p => p.assignee === m.name && !isDone(p)).length}건 진행 중`);
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => openEdit(null);
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; renderView(); };
  ['product', 'assignee', 'stage'].forEach(k => { const el = $('#f_' + k); if (el) el.onchange = () => { filter[k] = el.value; renderView(); }; });
  renderView();
}
function listOf(){
  const q = filter.q.trim().toLowerCase();
  return P().filter(p => (view === 'all' || view === 'board' || view === 'people' || (view === 'done' ? isDone(p) : !isDone(p)))
    && (!q || [p.handle, p.name, p.product, p.assignee, p.memo].some(v => (v || '').toLowerCase().includes(q)))
    && (!filter.product || p.product === filter.product) && (!filter.assignee || p.assignee === filter.assignee) && (!filter.stage || stageNo(p) == filter.stage));
}
function statsHtml(){
  const all = P(), active = all.filter(p => !isDone(p));
  const m = todayStr().slice(0, 7);
  const upThis = all.filter(p => (p.upload_date || '').startsWith(m)).length;
  const unpaid = all.filter(p => stageNo(p) >= 9 && !p.paid);
  const next = active.filter(p => p.next_schedule).length;
  return `<div class="stats">
    <div class="stat"><div class="l">진행 중</div><div class="v">${active.length}명</div><div class="s">전체 ${all.length}명 · 정산 완료 ${all.filter(isDone).length}명</div></div>
    <div class="stat"><div class="l">다음 일정 있음</div><div class="v ${next ? 'orange' : ''}">${next}건</div><div class="s">콘티·영상 수령 예정</div></div>
    <div class="stat"><div class="l">게재됐는데 비용 미지급</div><div class="v ${unpaid.length ? 'orange' : ''}">${unpaid.length}건</div><div class="s">${won(unpaid.reduce((a, p) => a + p.fee, 0))}</div></div>
    <div class="stat"><div class="l">이번 달 광고 업로드</div><div class="v">${upThis}건</div><div class="s">${m.replace('-', '년 ')}월</div></div>
    <div class="stat"><div class="l">확정 견적 합계</div><div class="v" style="font-size:16px">${won(all.reduce((a, p) => a + p.fee, 0))}</div><div class="s">진행 중 ${won(active.reduce((a, p) => a + p.fee, 0))}</div></div>
  </div>`;
}
function viewHtml(){ return view === 'board' ? boardHtml() : view === 'people' ? peopleHtml() : tableHtml(); }
function renderView(){ $('#view').innerHTML = viewHtml(); const c = $('#cnt'); if (c) c.textContent = `${listOf().length}명`; bindView(); }

function tableHtml(){
  const list = sortBy(listOf(), sort, { stage: s => Number(s) || 0, followers: f => Number(f) || 0, fee: f => Number(f) || 0, upload_date: d => d || '9999' });
  if (!list.length) return `<div class="empty">${filter.q || filter.product || filter.assignee || filter.stage ? '조건에 맞는 크리에이터가 없습니다.' : '등록된 크리에이터가 없습니다.<br>위 <b>＋ 크리에이터 추가</b>로 넣으세요.'}</div>`;
  const cols = [['product', '제품'], ['name', '크리에이터'], ['followers', '팔로워'], ['assignee', '담당자'], ['fee', '확정 견적'], ['delivered', '제품전달'], ['stage', '진행 단계'], ['next_schedule', '다음 일정'], ['upload_date', '광고 업로드'], ['paid', '비용지급']];
  return `<div class="tablewrap"><table class="pt"><thead><tr>${cols.map(([k, l]) => `<th data-sort="${k}" class="${['followers', 'fee'].includes(k) ? 'num' : ''}">${l}${sortArrow(sort, k)}</th>`).join('')}</tr></thead><tbody>
    ${list.map(p => `<tr class="row" data-id="${p.id}">
      <td><span class="prod ${prodCls(p.product)}">${esc(p.product || '')}</span></td>
      <td><b>${esc(p.name || p.handle)}</b> <span class="handle">${p.profile_url ? `<a href="${esc(igUrl(p.profile_url))}" target="_blank" rel="noopener" title="프로필 열기">@${esc(p.handle || '')} ↗</a>` : '@' + esc(p.handle || '')}</span></td>
      <td class="num">${fmtFol(p.followers)}</td>
      <td>${p.assignee ? who(p.assignee) : '<span class="hint">-</span>'}</td>
      <td class="num">${won(p.fee) || '-'}${p.fee_note ? `<span class="hint"> (${esc(p.fee_note)})</span>` : ''}</td>
      <td class="c"><button type="button" class="ox ${p.delivered ? 'on' : ''}" data-tog="delivered" data-id="${p.id}" title="제품 전달 여부 (누르면 바뀜)">${p.delivered ? 'O' : 'X'}</button></td>
      <td><select class="stage ${stageCls(stageNo(p))}" data-stage="${p.id}">${STAGES.map((s, i) => `<option value="${i + 1}" ${stageNo(p) === i + 1 ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td>${p.next_schedule ? `<span class="next">${esc(p.next_schedule)}</span>` : '<span class="hint">-</span>'}</td>
      <td class="up">${p.upload_date ? fmtDate(p.upload_date) : ''}${p.upload_url ? ` <a href="${esc(igUrl(p.upload_url))}" target="_blank" rel="noopener" title="업로드된 광고 보기">▶ 보기</a>` : (p.upload_date ? '' : '<span class="hint">-</span>')}</td>
      <td class="c"><button type="button" class="ox ${p.paid ? 'on' : ''}" data-tog="paid" data-id="${p.id}" title="비용 지급 완료 여부 (누르면 바뀜)">${p.paid ? 'O' : 'X'}</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
/* 단계별 상황판 */
function boardHtml(){
  const list = listOf();
  return `<div class="kb">${STAGES.map((s, i) => { const items = list.filter(p => stageNo(p) === i + 1); return `<div class="col"><h3>${esc(s)}<span class="n">${items.length}</span></h3>${items.map(p => `<div class="card" data-open="${p.id}"><span class="prod ${prodCls(p.product)}" style="font-size:11px;padding:1px 6px">${esc(p.product || '')}</span> <b>${esc(p.name || p.handle)}</b><div class="sub">@${esc(p.handle || '')} · ${fmtFol(p.followers)} · ${esc(p.assignee || '')}${p.next_schedule ? `<div class="next">${esc(p.next_schedule)}</div>` : ''}</div></div>`).join('') || '<div class="hint" style="padding:6px">없음</div>'}</div>`; }).join('')}</div>`;
}
/* 담당자별 */
function peopleHtml(){
  const list = listOf();
  const people = [...new Set(list.map(p => p.assignee || '미지정'))].sort();
  return `<div class="kb" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${people.map(a => { const items = list.filter(p => (p.assignee || '미지정') === a); return `<div class="col"><h3>${a === '미지정' ? '미지정' : who(a)}<span class="n">진행 ${items.filter(p => !isDone(p)).length} / 전체 ${items.length}</span></h3>${items.sort((x, y) => stageNo(x) - stageNo(y)).map(p => `<div class="card" data-open="${p.id}"><span class="prod ${prodCls(p.product)}" style="font-size:11px;padding:1px 6px">${esc(p.product || '')}</span> <b>${esc(p.name || p.handle)}</b> <span class="hint">${esc(STAGES[stageNo(p) - 1] || '')}</span>${p.next_schedule ? `<div class="next">${esc(p.next_schedule)}</div>` : ''}</div>`).join('')}</div>`; }).join('')}</div>`;
}
function bindView(){
  bindSort(sort, renderView, { product: 'asc', name: 'asc', assignee: 'asc', stage: 'asc', next_schedule: 'asc' });
  document.querySelectorAll('tr.row[data-id]').forEach(tr => tr.onclick = e => { if (e.target.closest('a, button, select')) return; openEdit(tr.dataset.id); });
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openEdit(el.dataset.open));
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = async e => { e.stopPropagation(); const p = P().find(x => x.id === b.dataset.id); const k = b.dataset.tog; await saveRow('partners', { ...p, [k]: !p[k], updated_by: me }); });
  document.querySelectorAll('select[data-stage]').forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = async () => { const p = P().find(x => x.id === s.dataset.stage); const stage = Number(s.value); await saveRow('partners', { ...p, stage, delivered: stage >= 4 ? true : p.delivered, updated_by: me }); toast(`${p.name || p.handle}: ${STAGES[stage - 1]}`); }; });
}

/* 추가·수정 창 */
function openEdit(id){
  const p0 = id ? P().find(x => x.id === id) : null;
  const d = p0 || { product: filter.product || PRODUCTS[0], assignee: '', handle: '', name: '', profile_url: '', followers: 0, fee: 0, fee_note: '', delivered: false, stage: 1, next_schedule: '', upload_url: '', upload_date: '', paid: false, memo: '', files: [] };
  const at = attachBox('ptFiles', d.files, 'partners');
  openModal(`${modalHead(p0 ? '크리에이터 정보' : '크리에이터 추가', p0 ? `<span class="hint">${esc(STAGES[stageNo(p0) - 1] || '')}</span>` : '')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>제품</label><select id="pProd">${PRODUCTS.map(p => `<option ${d.product === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div class="f"><label>담당자</label><select id="pAsg"><option value="">미지정</option>${memberOptions(d.assignee)}</select></div>
        <div class="f"><label>진행 단계</label><select id="pStage">${STAGES.map((s, i) => `<option value="${i + 1}" ${Number(d.stage) === i + 1 ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="f3">
        <div class="f"><label>계정명 (인스타 아이디) *</label><input id="pHandle" value="${esc(d.handle || '')}" placeholder="예: hheelele"></div>
        <div class="f"><label>이름</label><input id="pName" value="${esc(d.name || '')}" placeholder="예: 이승희"></div>
        <div class="f"><label>팔로워 수</label><input id="pFol" value="${d.followers ? fmtFol(d.followers) : ''}" placeholder="예: 3만, 4.6만, 809"></div>
      </div>
      <div class="f"><label>프로필 / 릴스 링크</label><input id="pProfile" value="${esc(d.profile_url || '')}" placeholder="https://www.instagram.com/..."></div>
      <div class="f3">
        <div class="f"><label>확정 견적 (원)</label><input id="pFee" inputmode="numeric" value="${d.fee ? Number(d.fee).toLocaleString('ko-KR') : ''}" placeholder="예: 300,000"></div>
        <div class="f"><label>견적 메모 (기간 등)</label><input id="pFeeNote" value="${esc(d.fee_note || '')}" placeholder="예: 3개월"></div>
        <div class="f"><label>제품 전달</label><div style="display:flex;gap:14px;align-items:center;height:36px"><label><input type="radio" name="pDel" value="0" ${!d.delivered ? 'checked' : ''}> 아직</label><label><input type="radio" name="pDel" value="1" ${d.delivered ? 'checked' : ''}> 전달함</label></div></div>
      </div>
      <div class="f"><label>다음 일정</label><input id="pNext" value="${esc(d.next_schedule || '')}" placeholder="예: 9/17(목) 영상 콘티 제출"></div>
      <div class="f3">
        <div class="f" style="grid-column:span 2"><label>업로드 링크 (게재된 광고)</label><input id="pUp" value="${esc(d.upload_url || '')}" placeholder="https://www.instagram.com/reel/..."></div>
        <div class="f"><label>광고 업로드 일자</label><input type="date" id="pUpDate" value="${esc(d.upload_date || '')}"></div>
      </div>
      <div class="f"><label>비용 지급</label><div style="display:flex;gap:14px;align-items:center"><label><input type="radio" name="pPaid" value="0" ${!d.paid ? 'checked' : ''}> 미지급</label><label><input type="radio" name="pPaid" value="1" ${d.paid ? 'checked' : ''}> 지급 완료</label></div></div>
      <div class="f"><label>메모 · 파일 (계약서, 콘티 등)</label><textarea id="pMemo">${esc(d.memo || '')}</textarea>${at.html}</div>
      ${p0 ? `<div class="hint">등록: ${esc(p0.created_by || '')} ${fmtDateTime(p0.created_at)}${p0.updated_by ? ` · 수정: ${esc(p0.updated_by)} ${fmtDateTime(p0.updated_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">${p0 ? '<button class="btn danger left" id="pDelete">삭제</button>' : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="pSave">${p0 ? '저장' : '추가'}</button></div>`, { wide: true });
  at.bind();
  $('#pHandle').focus();
  const fee = $('#pFee'); fee.oninput = () => { const n = num(fee.value); fee.value = n ? n.toLocaleString('ko-KR') : ''; };
  $('#pSave').onclick = async () => {
    const handle = $('#pHandle').value.trim().replace(/^@/, ''); if (!handle) { $('#pHandle').focus(); toast('계정명을 입력하세요', true); return; }
    const row = { id: p0 ? p0.id : uid(), product: $('#pProd').value, assignee: $('#pAsg').value || null, handle, name: $('#pName').value.trim() || null, profile_url: $('#pProfile').value.trim() || null,
      followers: parseFol($('#pFol').value), fee: num(fee.value), fee_note: $('#pFeeNote').value.trim() || null, delivered: document.querySelector('input[name=pDel]:checked').value === '1',
      stage: Number($('#pStage').value), next_schedule: $('#pNext').value.trim() || null, upload_url: $('#pUp').value.trim() || null, upload_date: $('#pUpDate').value || null,
      paid: document.querySelector('input[name=pPaid]:checked').value === '1', memo: $('#pMemo').value.trim() || null, files: at.files,
      created_by: p0 ? p0.created_by : me, created_at: p0 ? p0.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('partners', row); toast(p0 ? '저장했습니다' : '추가했습니다');
  };
  const del = $('#pDelete'); if (del) del.onclick = async () => { if (confirm(`${p0.name || p0.handle} 항목을 삭제할까요?`)) { closeModal(); for (const f of p0.files) if (f.path) deleteFile(f.path); await removeRow('partners', p0.id); toast('삭제했습니다'); } };
}

boot({ icon: '🤝', title: '파트너스', tables: ['partners'], render, normalize });
</script>
</body>
</html>
