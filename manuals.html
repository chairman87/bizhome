<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 매뉴얼</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610082253">
<script src="common.js?v=202610082253"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn.primary{padding:9px 16px;font-size:14px}
  .grp{margin:18px 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .grp:first-child{margin-top:0}
  .grp .n{font-weight:400;color:var(--fg3);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  .mc{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;display:grid;gap:8px;cursor:pointer;min-width:0}
  .mc:hover{box-shadow:var(--shadow);border-color:var(--line2)}
  .mc .hd{display:flex;align-items:center;gap:8px;min-width:0}
  .mc .ti{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .mc .pre{font-size:12px;color:var(--fg2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
  .mc .th{display:block;width:100%;height:150px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);background:#fff}
  .mc .ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg3);flex-wrap:wrap}
  .mc .ft .sp{flex:1}
  .mc .who2{display:flex;flex-wrap:wrap;gap:4px}
  .ctag{font-size:11px;background:#e0e7ff;color:#3730a3;border-radius:4px;padding:1px 7px;white-space:nowrap}
  .allow{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:13px;padding:6px 0}
  .allow label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;width:auto;font-size:13px;font-weight:400;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg)}
  .allow label:has(input:checked){background:#dbeafe;border-color:#93c5fd}
  #mContent{min-height:260px;font-family:inherit;line-height:1.6}
  /* 보기 창 */
  .rd{padding:14px 18px;display:grid;gap:12px}
  .rd .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
  .rd .body{white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:14px;padding:12px 14px;background:var(--bg2);border-radius:8px}
  .rd .body a{word-break:break-all}
  .rd .body .h{display:block;font-weight:700;font-size:15px;margin-top:6px}
  .rd .lnk{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--blue);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd .lnk:hover{text-decoration:underline}
  .rd .fsel{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rd .fsel .sp{flex:1}
  .rd .fsel a.btn{text-decoration:none}
  .rd .fsel .btn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd .inv{height:clamp(360px, calc(100vh - 300px), 900px)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   업무 매뉴얼 — 업무별 처리 절차를 적어 두고, 매뉴얼마다 "볼 수 있는 담당자"를 지정
   관리자만 쓰고 고침. 담당자를 고르면 그 사람들과 관리자만 보고, 아무도 고르지 않으면 전체에게 보임
   한 장 = { id, title, category(분류), content(본문), link, files, targets:[담당자…], sort_order, created_by, created_at, updated_by, updated_at }
   본문에서 "# " 으로 시작하는 줄은 소제목으로 굵게 보임
================================================================ */
const DEFAULT_CATS = ['주문·CS', '물류·출고', '광고', '정산·회계', '총무', '기타'];
const TARGETS = m => Array.isArray(m.targets) ? m.targets : [];
const canSee = m => isAdmin() || !TARGETS(m).length || TARGETS(m).includes(me);
const M = () => (DATA.manuals || []).filter(canSee).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.title).localeCompare(String(b.title), 'ko'));
const cats = () => [...new Set([...DEFAULT_CATS, ...(DATA.manuals || []).map(m => m.category).filter(Boolean)])];
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const bodyHtml = s => linkify(s || '').split('\n').map(l => /^#\s*/.test(l) ? `<span class="h">${l.replace(/^#\s*/, '')}</span>` : l).join('\n');
const linkHref = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
const linkText = u => u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
let view = LS.get('manuals_view') || 'all';
let q = '';

function normalize(table, m){ if (table !== 'manuals') return m; return { ...m, targets: Array.isArray(m.targets) ? m.targets : [], files: Array.isArray(m.files) ? m.files : [] }; }

function render(){
  const used = cats().filter(c => M().some(m => m.category === c));
  const tabs = [{ key: 'all', label: '전체' }, ...(used.length ? [null, ...used.map(c => ({ key: 'c:' + c, label: c }))] : [])];
  if (!tabs.some(t => t && t.key === view)) view = 'all';
  $('#app').innerHTML = headerHtml({ icon: '📘', title: '업무 매뉴얼', tabs, active: view }) + `<main class="wrap" style="max-width:1100px">
    <div class="actions">${isAdmin() ? '<button class="btn primary" id="newBtn2">＋ 매뉴얼 쓰기</button>' : ''}
      <input type="search" id="fq" placeholder="검색 (제목, 내용, 담당자)" value="${esc(q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;min-width:220px">
      <span class="count" id="cnt"></span></div>
    <div id="view">${listHtml()}</div></main>`;
  bindHeader(k => { view = k; LS.set('manuals_view', k); render(); }, null, m => `볼 수 있는 매뉴얼 ${(DATA.manuals || []).filter(x => m.role === 'admin' || !TARGETS(x).length || TARGETS(x).includes(m.name)).length}개`);
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => openEdit(null);
  const fq = $('#fq'); fq.oninput = () => { q = fq.value; renderView(); };
  bindView();
}
function listOf(){
  const s = q.trim().toLowerCase();
  return M().filter(m => (view === 'all' || (view.startsWith('c:') && m.category === view.slice(2)))
    && (!s || [m.title, m.content, m.category, ...TARGETS(m)].some(v => (v || '').toLowerCase().includes(s))));
}
const cardPic = m => { const f = (m.files || []).find(x => x.thumb || isImg(x)); return f ? `<img class="th" src="${esc(f.thumb || f.url)}" alt="" loading="lazy">` : ''; };   // 첫 첨부(PDF·PPT 첫 장, 사진)를 카드 그림으로
function cardHtml(m){
  const t = TARGETS(m);
  return `<div class="mc" data-open="${m.id}">
    <div class="hd">${m.category ? `<span class="ctag">${esc(m.category)}</span>` : ''}<span class="ti">${esc(m.title)}</span>${filesCount(m.files)}</div>
    ${cardPic(m)}
    ${m.content ? `<div class="pre">${esc(m.content.replace(/^#\s*/gm, ''))}</div>` : ''}
    <div class="ft"><span class="who2">${t.length ? t.map(n => who(n)).join('') : '<span class="hint">전체 공개</span>'}</span><span class="sp"></span><span>${fmtDate((m.updated_at || m.created_at || '').slice(0, 10))}</span></div>
  </div>`;
}
function listHtml(){
  if (!DATA.manuals) return `<div class="empty">업무 매뉴얼 저장 표가 아직 없습니다.${isAdmin() ? ' sql-manuals.sql 을 Supabase SQL Editor 에서 실행하세요.' : ''}</div>`;
  const list = listOf();
  if (!list.length) return `<div class="empty">${q ? '검색 결과가 없습니다.' : isAdmin() ? '아직 매뉴얼이 없습니다. <b>＋ 매뉴얼 쓰기</b>로 첫 매뉴얼을 적어 보세요.' : '아직 내가 볼 수 있는 매뉴얼이 없습니다.'}</div>`;
  if (view !== 'all') return `<div class="grid">${list.map(cardHtml).join('')}</div>`;
  const groups = cats().filter(c => list.some(m => m.category === c)), none = list.filter(m => !m.category || !cats().includes(m.category));
  return groups.map(c => { const g = list.filter(m => m.category === c); return `<div class="grp">${esc(c)} <span class="n">${g.length}</span></div><div class="grid">${g.map(cardHtml).join('')}</div>`; }).join('')
    + (none.length ? `<div class="grp">분류 없음 <span class="n">${none.length}</span></div><div class="grid">${none.map(cardHtml).join('')}</div>` : '');
}
function renderView(){ $('#view').innerHTML = listHtml(); bindView(); }
function bindView(){
  const c = $('#cnt'); if (c) c.textContent = `${listOf().length}개`;
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openRead(el.dataset.open));
}

/* 보기 창: 첨부(PDF·pptx·사진)가 있으면 창을 넓게 열고 그 안에 바로 띄움. 첨부가 여럿이면 위쪽 단추로 바꿔 봄 */
function openRead(id){
  const m = M().find(x => x.id === id); if (!m) return;
  const t = TARGETS(m), files = m.files || [], viewable = files.filter(canView), others = files.filter(f => !canView(f));
  openModal(`${modalHead(esc(m.title), isAdmin() ? `<button class="btn sm" id="rEdit">고치기</button>` : '')}
    <div class="rd">
      <div class="meta">${m.category ? `<span class="ctag">${esc(m.category)}</span>` : ''}<span>담당자: ${t.length ? t.map(n => esc(fullName(n))).join(', ') : '전체'}</span><span>· ${esc(m.updated_by || m.created_by || '')} · ${fmtDate((m.updated_at || m.created_at || '').slice(0, 10))}</span></div>
      ${m.content ? `<div class="body">${bodyHtml(m.content)}</div>` : ''}
      ${m.link ? `<a class="lnk" href="${esc(linkHref(m.link))}" target="_blank" rel="noopener">🔗 ${esc(linkText(m.link))}</a>` : ''}
      ${viewable.length ? `<div class="fsel">${viewable.map((f, i) => `<button type="button" class="btn sm ${i ? '' : 'primary'}" data-fv="${i}" title="${esc(f.name)}">${fileIcon(f)} ${esc(f.name)}</button>`).join('')}<span class="sp"></span><a class="btn sm" id="rDl" href="${esc(dlUrl(viewable[0]))}">⬇ 내려받기</a><a class="btn sm" id="rNew" href="${esc(fileOpenUrl(viewable[0]))}" target="_blank" rel="noopener">↗ 새 창</a></div><div class="inv" id="inv"></div>` : ''}
      ${others.length ? filesHtml(others) : ''}
      ${!m.content && !files.length ? '<div class="hint">내용이 없습니다</div>' : ''}
    </div>
    <div class="mf"><button class="btn" data-close>닫기</button></div>`, { wide: true, cls: viewable.length ? 'xl' : '' });
  const e = $('#rEdit'); if (e) e.onclick = () => { closeModal(); openEdit(id); };
  if (viewable.length) {
    const show = i => { const f = viewable[i]; mountViewer($('#inv'), f); $('#rDl').href = dlUrl(f); $('#rNew').href = fileOpenUrl(f); document.querySelectorAll('[data-fv]').forEach(b => b.classList.toggle('primary', Number(b.dataset.fv) === i)); };
    document.querySelectorAll('[data-fv]').forEach(b => b.onclick = () => show(Number(b.dataset.fv)));
    show(0);
  }
}

/* 쓰기·고치기 (관리자) */
function openEdit(id){
  if (!isAdmin()) { toast('관리자만 매뉴얼을 쓸 수 있습니다', true); return; }
  const m = id ? M().find(x => x.id === id) : null;
  const cur = m ? TARGETS(m) : [];
  const at = attachBox('mFiles', m ? m.files : [], 'manuals');   // 사진·파일 첨부 (붙여넣기·끌어놓기 됨)
  openModal(`${modalHead(m ? '매뉴얼 고치기' : '매뉴얼 쓰기')}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>제목 *</label><input id="mTitle" value="${esc(m ? m.title : '')}" maxlength="120" placeholder="예: 쿠팡 주문 취소·반품 처리"></div>
        <div class="f"><label>분류</label><input id="mCat" list="catList" value="${esc(m ? m.category || '' : '')}" placeholder="고르거나 새로 입력"><datalist id="catList">${cats().map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      </div>
      <div class="f"><label>내용 (순서대로 적어 주세요. <b>#</b> 으로 시작하는 줄은 소제목이 됩니다)</label><textarea id="mContent" placeholder="# 언제 하는 일&#10;매일 오전 10시, 전날 들어온 취소 요청 확인&#10;&#10;# 순서&#10;1. 쿠팡 윙 > 주문/배송 > 취소 관리 열기&#10;2. 출고 전이면 바로 승인, 출고 후면 물류팀에 회수 요청&#10;3. 처리 결과를 고객에게 문자&#10;&#10;# 주의&#10;- 네이버페이 주문은 카페24 에서 별도 취소">${esc(m ? m.content || '' : '')}</textarea>${at.html}</div>
      <div class="f"><label>참고 링크 (선택)</label><input id="mLink" value="${esc(m ? m.link || '' : '')}" placeholder="예: https://… (관련 화면, 문서 주소)"></div>
      <div class="f"><label>볼 수 있는 담당자 (아무도 고르지 않으면 <b>전체</b>에게 보입니다)</label>
        <div class="allow">${members.filter(x => x.role !== 'admin').map(x => `<label><input type="checkbox" data-tg value="${esc(x.name)}" ${cur.includes(x.name) ? 'checked' : ''}> ${esc(fullName(x.name))}</label>`).join('')}</div>
        <div class="hint">담당자를 고르면 그 사람들과 관리자(${esc(admins().map(x => x.name).join(', '))})에게만 보입니다.</div></div>
    </div>
    <div class="mf">${m ? '<button class="btn danger left" id="mDel">삭제</button>' : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="mSave">${m ? '저장' : '올리기'}</button></div>`, { wide: true });
  at.bind(); $('#mTitle').focus();
  $('#mSave').onclick = async () => {
    const title = $('#mTitle').value.trim(); if (!title) { $('#mTitle').focus(); toast('제목을 입력하세요', true); return; }
    const targets = [...document.querySelectorAll('[data-tg]:checked')].map(x => x.value);
    const row = { id: m ? m.id : uid(), title, category: $('#mCat').value.trim() || null, content: $('#mContent').value.trim() || null, link: $('#mLink').value.trim() || null, files: at.files, targets,
      sort_order: m ? m.sort_order || 0 : 0, created_by: m ? m.created_by : me, created_at: m ? m.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('manuals', row); toast(m ? '저장했습니다' : '매뉴얼을 올렸습니다');
  };
  const del = $('#mDel'); if (del) del.onclick = async () => { if (confirm(`"${m.title}" 매뉴얼을 삭제할까요?`)) { closeModal(); await removeRow('manuals', m.id); toast('삭제했습니다'); } };
}

boot({ icon: '📘', title: '업무 매뉴얼', tables: ['manuals'], render, normalize });
</script>
</body>
</html>
