<link rel="stylesheet" href="common.css?v=202610211153">

<style>
  .wrap-perf{max-width:1180px}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .ctl .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .ctl .seg button{border:0;background:var(--bg);padding:6px 12px;font-size:13px;color:var(--fg2)}
  .ctl .seg button+button{border-left:1px solid var(--line)}
  .ctl .seg button.on{background:var(--fg);color:#fff}
  .ctl .upd{margin-left:auto;font-size:12px;color:var(--fg3)}
  .ctl .seg.view button.on{background:#9c1f4a}
  .camp td.name{text-align:left;max-width:380px;overflow:hidden;text-overflow:ellipsis}
  .camp tr.pf td{background:var(--bg3);font-weight:600;font-size:12px}
  .camp tr.pf td.name{font-size:13px}
  .camp .st{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;border:1px solid var(--line2);color:var(--fg2)}
  .camp .st.on{background:#dcfce7;border-color:#86efac;color:#166534}
  .camp .st.off{background:var(--bg2);color:var(--fg3)}
  .camp .share{display:inline-block;width:60px;height:8px;background:var(--bg3);border-radius:2px;vertical-align:middle;margin-left:6px;overflow:hidden}
  .camp .share i{display:block;height:100%;background:#9c1f4a;opacity:.55}
  .camp input{border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:13px;width:220px}
  .camp .bar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg2);flex-wrap:wrap}
  .ctl .range{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--fg2);opacity:.55}
  .ctl .range.on{opacity:1}
  .ctl .range input{border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:13px;background:var(--bg)}
  .sig{border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;border:1px solid var(--line);background:var(--bg)}
  .sig h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .sig h2 .cmp{font-size:12px;color:var(--fg3);font-weight:400}
  .sig ul{margin:0;padding-left:0;list-style:none}
  .sig li{font-size:14px;line-height:1.7;padding:4px 0 4px 28px;position:relative}
  .sig li::before{position:absolute;left:4px;top:5px;font-size:14px}
  .sig li.crit::before{content:'🔴'} .sig li.warn::before{content:'🟠'} .sig li.good::before{content:'🟢'} .sig li.info::before{content:'⚪'}
  .sig li.crit{background:#fff1f1;border-radius:6px} .sig li.crit b.k{color:#b91c1c}
  .sig li.warn b.k{color:#9a3b00} .sig li.good b.k{color:#166534}
  .sig .none{color:var(--fg2);font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .tile .l{font-size:12px;color:var(--fg2)}
  .tile .v{font-size:22px;font-weight:700;margin:3px 0 2px;letter-spacing:-.01em}
  .tile .v small{font-size:13px;font-weight:500;color:var(--fg2);margin-left:2px}
  .tile .d{font-size:12px;color:var(--fg3)}
  .tile .d .up{color:#166534} .tile .d .dn{color:#b91c1c}
  .tile .d .up.bad{color:#b91c1c} .tile .d .dn.ok{color:#166534}
  .chart{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 8px;margin-bottom:14px;position:relative}
  .chart h3{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .chart h3 .lg{display:flex;gap:12px;font-size:12px;color:var(--fg2);font-weight:400}
  .chart h3 .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .chart svg{width:100%;height:auto;display:block}
  .chart text{font-size:11px;fill:var(--fg3)}
  .chart .grid line{stroke:var(--line);stroke-width:1}
  .chart .hit{fill:transparent}
  .chart .hit:hover{fill:rgba(0,0,0,.04)}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;z-index:5;min-width:170px}
  .tip b{display:block;font-size:12px;margin-bottom:2px}
  .tip .r{display:flex;justify-content:space-between;gap:12px}
  .tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .tip .r.sum{border-top:1px solid var(--line);margin-top:3px;padding-top:3px;font-weight:600}
  .tbl{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;margin-bottom:14px}
  .tbl table{width:100%;border-collapse:collapse;min-width:900px}
  .tbl th{position:sticky;top:0;background:var(--bg2);font-size:12px;font-weight:600;color:var(--fg2);padding:8px 9px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl th.l,.tbl td.l{text-align:left}
  .tbl th.grp{text-align:center;background:var(--bg3);border-left:1px solid var(--line2)}
  .tbl th.gb,.tbl td.gb{border-left:1px solid var(--line2)}
  .tbl td{font-size:13px;padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tbl td.sum{font-weight:600}
  .tbl td.zero{color:var(--fg3)}
  .tbl tr.part td{color:var(--fg2);font-style:italic}
  .tbl tr.part td.l{font-style:normal}
  .tbl tr.wk td.l{color:#b91c1c}
  .tbl .tmp{color:#d9730d;font-style:italic;cursor:help}
  .tbl .pt{display:inline-block;font-size:10px;background:#fffbea;border:1px solid #e0c25a;color:#92400e;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px;font-style:normal}
  .tbl td.ratio.lo{color:#b91c1c} .tbl td.ratio.hi{color:#166534}
  .foot{font-size:12px;color:var(--fg2);line-height:1.8;margin:6px 2px 30px}
  .foot b{color:var(--fg)}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   마케팅 > 퍼포먼스 데이터 — 브랜드별 "광고비(채널별) ↔ 매출(자사몰·스스·쿠팡)"을 마케팅 담당자가 매일 따라가는 화면 (2026-10-18)
   · 배경: 레모너리 쿠팡 광고비는 하루 70만 원 넘게 쓰는데 쿠팡 매출이 크게 빠졌는데도 아무도 모르고 있었음. 담당자가 이상을 느끼려면 이 둘이 한 화면에 있어야 함.
   · 자료: mkt_perf 표. 대표 PC 의 MKT-PERF\perf_sync.py 가 매시간 두 손익 상황판(SIK-DASH·PH-DASH)에서 광고비·매출만 뽑아 넣음.
   · 손익(원가·수수료·영업이익·순이익)은 표에도 화면에도 없음(대표 지시). 광고비와 매출, 그리고 둘의 비율(매출 ÷ 광고비)만.
   · 광고비는 각 플랫폼이 보고한 금액(부가세 전). 매출은 결제 기준(취소 전). 쿠팡 = 판매자배송 + 로켓그로스.
================================================================ */
const BRANDS = ['레모너리', '서리맥스', '흑생마'];
/* 채널 색: 같은 대상은 같은 색(쿠팡 매출 = 쿠팡 광고비 = 주황). 색 순서는 색약·인쇄 검증을 통과한 순서라 바꾸지 않음 */
const SALES_CH = [['cf_s', '자사몰', '#2a78d6'], ['nv_s', '스마트스토어', '#1baf7a'], ['cp', '쿠팡', '#eb6834']];
const AD_CH = [['coupang_ad', '쿠팡광고', '#eb6834'], ['meta', '메타', '#4a3aa7'], ['tiktok', '틱톡', '#e87ba4'], ['naver_cpc', '네이버', '#008300'], ['google', '구글', '#eda100'], ['kakao', '카카오', '#e34948']];
const PERIODS = [['yday', '어제'], ['7', '최근 7일'], ['14', '최근 14일'], ['30', '최근 30일'], ['thisM', '이번 달'], ['lastM', '지난 달'], ['months', '월별'], ['custom', '기간 직접']];

let brand = decodeURIComponent((location.hash || '').slice(1)) || BRANDS[0]; if (!BRANDS.includes(brand)) brand = BRANDS[0];
let period = LS.get('perf_period') || '30'; if (!PERIODS.some(p => p[0] === period)) period = '30';
let range = { from: LS.get('perf_from') || '', to: LS.get('perf_to') || '' };
let view = LS.get('perf_view') === 'camp' ? 'camp' : 'ch';   // ch=채널 보기(브랜드×채널) / camp=캠페인 보기(메타·구글·틱톡 캠페인별, mkt_perf_camp 표)
let campQ = '';                                              // 캠페인 이름 검색
const CAMP = { key: '', rows: [], loading: false, error: '' };
const PF = [['meta', '메타'], ['tiktok', '틱톡'], ['google', '구글']];
/* 캠페인 줄은 많아서(브랜드마다 하루 30~40줄) 화면이 필요한 브랜드·기간만 따로 읽음. 1,000줄씩 끊어 읽음 */
async function loadCamp(key, b, from, to){
  if (!store.client) { CAMP.error = '팀 저장소에 연결돼 있을 때만 볼 수 있습니다'; return; }
  CAMP.key = key; CAMP.loading = true; CAMP.error = ''; CAMP.rows = [];
  try {
    let off = 0, all = [];
    while (true) {
      const { data, error } = await store.client.from('mkt_perf_camp').select('*').eq('brand', b).gte('date', from).lte('date', to).order('date').range(off, off + 999);
      if (error) throw error;
      all = all.concat(data || []); if (!data || data.length < 1000) break; off += 1000;
    }
    if (CAMP.key === key) CAMP.rows = all;
  } catch (e) { CAMP.error = /does not exist|not find|schema cache/i.test(e.message || '') ? '저장소에 mkt_perf_camp 표가 없습니다 (sql-mkt-perf-camp.sql 실행 필요)' : (e.message || String(e)); }
  CAMP.loading = false; renderApp();
}   // '기간 직접'일 때 달력에서 고른 시작일~끝일

/* 금액은 만원 단위로, 1억이 넘으면 "6억 1,751만"처럼 억을 앞에 붙임 (61,751만 처럼 쓰면 읽기 어려워서, 2026-10-18 사장님 지적) */
const man = n => { if (n == null) return '-'; const m = Math.round(n / 10000), s = m < 0 ? '-' : '', a = Math.abs(m); return a >= 10000 ? `${s}${Math.floor(a / 10000)}억${a % 10000 ? ' ' + (a % 10000).toLocaleString('ko-KR') + '만' : ''}` : `${s}${a.toLocaleString('ko-KR')}만`; };
const manShort = n => Math.abs(n) >= 100000000 ? (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억' : man(n);   // 그림 눈금용 짧은 표기 (9.7억)
const won = n => n == null ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
const pct = (a, b) => (b > 0 ? (a - b) / b : null);
const pctTxt = p => p == null ? '' : (p > 0 ? '+' : p < 0 ? '−' : '') + Math.round(Math.abs(p) * 100) + '%';
const ratio = (s, a) => a > 0 ? s / a : null;
const ratioTxt = r => r == null ? '-' : r.toFixed(2);   // '배'는 빼고 숫자만 (2026-10-18 사장님 요청)
const cpOf = r => (r.cp_s || 0) + (r.rg_s || 0);
const adv = (r, k) => (r.ad && r.ad[k]) || 0;
const sumBy = (rows, f) => rows.reduce((s, r) => s + (f(r) || 0), 0);
const mdLabel = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const wd = d => WEEKDAYS[parseYmd(d).getDay()];
const monLabel = m => `${+m.slice(5, 7)}월`;

function rowsOf(kind){ return (DATA.mkt_perf || []).filter(r => r.brand === brand && r.kind === kind).sort((a, b) => a.period.localeCompare(b.period)); }
/* 선택한 기간의 줄 + 비교할 직전 기간의 줄(둘 다 끝난 날만) */
function pick(){
  const days = rowsOf('day');
  if (period === 'months') { const sel = rowsOf('month'); return { sel, full: sel, prev: [], months: true }; }
  const today = todayStr();
  let sel;
  if (period === 'yday') { const d = parseYmd(today); d.setDate(d.getDate() - 1); const y = ymd(d); sel = days.filter(r => r.period === y); }
  else if (period === 'custom') { const f = range.from || days[0]?.period || today, e = range.to || today; sel = days.filter(r => r.period >= f && r.period <= e); }
  else if (period === 'thisM') sel = days.filter(r => r.period.slice(0, 7) === today.slice(0, 7));
  else if (period === 'lastM') { const d = parseYmd(today); d.setDate(0); const m = ymd(d).slice(0, 7); sel = days.filter(r => r.period.slice(0, 7) === m); }
  else sel = days.slice(-Number(period));
  const full = sel.filter(r => !r.partial);
  const first = full[0] ? days.indexOf(full[0]) : -1;
  let prev = first > 0 ? days.slice(Math.max(0, first - full.length), first).filter(r => !r.partial) : [];
  if (prev.length < full.length) prev = [];                       // 직전 기간 자료가 다 없으면(자료가 쌓이기 시작한 지 얼마 안 됨) 비교하지 않음
  return { sel, full, prev, months: false };
}
/* 이상 신호: 끝난 날 기준 최근 7일 ↔ 그 전 7일. 매출 채널이 25% 넘게 빠졌는데 그 채널에 붙는 광고비는 줄지 않았으면 빨강 */
const AD_FOR = { cp: ['coupang_ad'], cf_s: ['meta', 'tiktok', 'google'], nv_s: ['naver_cpc'] };
/* 비교는 두 번: ① 그 전 7일 ② 그 전 4주 평균(하루 평균 × 7). ①에서 안 잡히는 "몇 주에 걸쳐 서서히 빠진" 것은 ②가 잡음 */
function compare(a, b, baseLabel, scale){
  const items = [];
  const salesOf = (rows, k) => sumBy(rows, r => k === 'cp' ? cpOf(r) : r[k]) * (rows === b ? scale : 1);
  const adOf = (rows, keys) => sumBy(rows, r => keys.reduce((s, k) => s + adv(r, k), 0)) * (rows === b ? scale : 1);
  const sA = sumBy(a, r => r.sales), sB = sumBy(b, r => r.sales) * scale, adA = sumBy(a, r => r.ads), adB = sumBy(b, r => r.ads) * scale;
  for (const [k, name] of SALES_CH) {
    const A = salesOf(a, k), B = salesOf(b, k), p = pct(A, B);
    if (B < 300000 && A < 300000) continue;                      // 둘 다 하루 4만 원 수준이면 의미 없음
    const adKeys = AD_FOR[k], aa = adOf(a, adKeys), ab = adOf(b, adKeys), ap = pct(aa, ab);
    const adName = adKeys.map(x => AD_CH.find(c => c[0] === x)[1]).filter(x => adKeys.length === 1 || adOf(a, [AD_CH.find(c => c[1] === x)[0]]) > 0).join('·');
    if (p != null && p <= -0.25) {
      if (ab > 0 && (ap == null || ap > -0.1))
        items.push({ key: 's:' + k, cls: 'crit', html: `<b class="k">${name} 매출</b>이 최근 7일 <b>${man(A)}</b>으로, ${baseLabel}(${man(B)})보다 <b>${pctTxt(p)}</b> 빠졌습니다. 그런데 <b>${adName} 광고비</b>는 ${man(ab)} → ${man(aa)}(${pctTxt(ap)})로 줄지 않았습니다. <b>광고는 그대로 타는데 매출만 빠진 상태</b>입니다. 상품 상태(아이템위너·품절·가격)와 광고 소재를 확인해 주세요.` });
      else
        items.push({ key: 's:' + k, cls: 'warn', html: `<b class="k">${name} 매출</b>이 최근 7일 ${man(A)}으로, ${baseLabel}(${man(B)})보다 <b>${pctTxt(p)}</b> 빠졌습니다.${ab > 0 ? ` ${adName} 광고비도 ${pctTxt(ap)} 줄었습니다(${man(ab)} → ${man(aa)}).` : ''}` });
    } else if (p != null && p >= 0.25) {
      items.push({ key: 's:' + k, cls: 'good', html: `<b class="k">${name} 매출</b>이 최근 7일 ${man(A)}으로, ${baseLabel}(${man(B)})보다 <b>${pctTxt(p)}</b> 늘었습니다.${ab > 0 ? ` (${adName} 광고비 ${pctTxt(ap)})` : ''}` });
    }
  }
  for (const [k, name] of AD_CH) {
    const A = adOf(a, [k]), B = adOf(b, [k]), p = pct(A, B);
    if (B < 500000 && A < 500000) continue;
    if (p != null && p >= 0.3 && pct(sA, sB) != null && pct(sA, sB) < 0.05)
      items.push({ key: 'a:' + k, cls: 'warn', html: `<b class="k">${name} 광고비</b>가 최근 7일 ${man(A)}으로 ${baseLabel}보다 <b>${pctTxt(p)}</b> 늘었는데, 전체 매출은 ${pctTxt(pct(sA, sB))}입니다. 늘린 만큼 팔리는지 확인해 주세요.` });
  }
  const rA = ratio(sA, adA), rB = ratio(sB, adB);
  if (rA != null && rB != null && pct(rA, rB) <= -0.2 && !items.some(i => i.cls === 'crit'))
    items.push({ key: 'ratio', cls: 'warn', html: `광고비 1원당 매출이 <b>${ratioTxt(rB)} → ${ratioTxt(rA)}</b>로 떨어졌습니다(${baseLabel} 대비 매출 ${pctTxt(pct(sA, sB))}, 광고비 ${pctTxt(pct(adA, adB))}).` });
  return items;
}
function signals(){
  const days = rowsOf('day').filter(r => !r.partial);
  if (days.length < 8) return { items: [], a: [], b: [] };
  const a = days.slice(-7), b = days.slice(-14, -7);
  if (b.length < 4) return { items: [], a, b };
  const items = compare(a, b, '그 전 7일', 1);
  const add = list => { for (const it of list) if (it.cls !== 'good' && !items.some(x => x.key === it.key)) items.push(it); };   // 긴 기준에서 새로 잡히는 것(좋아진 것은 빼고)만 보탬
  const b4 = days.slice(-35, -7);
  if (b4.length >= 14) add(compare(a, b4, `그 전 ${Math.round(b4.length / 7)}주 평균`, 7 / b4.length));
  const lm = new Date(); lm.setDate(0); const lmKey = ymd(lm).slice(0, 7), lmRow = rowsOf('month').find(r => r.period === lmKey);   // 지난달 한 달 평균과도 비교 (한 달에 걸쳐 서서히 빠진 것)
  if (lmRow && !lmRow.partial) add(compare(a, [lmRow], `지난달(${monLabel(lmKey)}) 하루 평균 × 7일`, 7 / lm.getDate()));
  items.sort((x, y) => ['crit', 'warn', 'good', 'info'].indexOf(x.cls) - ['crit', 'warn', 'good', 'info'].indexOf(y.cls));
  return { items, a, b };
}

/* ---------- 화면 ---------- */
function tilesHtml(P){
  const { sel, full, prev, months } = P;
  const S = sumBy(sel, r => r.sales), A = sumBy(sel, r => r.ads), O = sumBy(sel, r => r.orders);
  const cmp = (cur, pv, inverse) => {
    if (months || !prev.length || pv == null || cur == null) return '';

        tip.innerHTML = `<b>${title}${r.partial ? ' · 진행 중' : ''}</b>${series.map(c => `<div class="r"><span><i style="background:${c[2]}"></i>${c[1]}</span><span>${won(val(r, c[0]))}</span></div>`).join('')}<div class="r sum"><span>합계</span><span>${won(r[sumKey])}</span></div>`;
        place(e);
      };
      h.onmousemove = place;
      h.onmouseleave = () => { if (tip) tip.remove(); tip = null; };
      function place(e){ if (!tip) return; const b = box.getBoundingClientRect(); let x = e.clientX - b.left + 14, yy = e.clientY - b.top + 14; if (x + tip.offsetWidth > b.width - 8) x = e.clientX - b.left - tip.offsetWidth - 14; tip.style.left = x + 'px'; tip.style.top = yy + 'px'; }
    });
  }
}
window.addEventListener('hashchange', () => { const b = decodeURIComponent((location.hash || '').slice(1)); if (BRANDS.includes(b) && b !== brand) { brand = b; renderApp(); } });
boot({ icon: '📈', title: '퍼포먼스 데이터', tables: ['mkt_perf'], render });
