<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용공고</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202611241108">
<script src="common.js?v=202611241108"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .actions select,.actions input{border:1px solid var(--line2);border-radius:var(--radius);padding:5px 8px;font-size:13px;background:var(--bg);color:var(--fg)}
  .actions input{width:64px}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  table.ap{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
  table.ap th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
  table.ap td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.ap tr:last-child td{border-bottom:0}
  table.ap tr.decided td{opacity:.6}
  .nm{font-weight:700}.nm a{color:inherit;text-decoration:none}.nm a:hover{text-decoration:underline}
  .sub{font-size:12px;color:var(--fg3)}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rs{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
  .rs-통과{background:#dcfce7;color:#15803d}.rs-탈락예정{background:#fee2e2;color:#b91c1c}.rs-애매{background:#fef3c7;color:#92400e}
  .st{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
  .st-면접{background:#e0e7ff;color:#3730a3}.st-불합격{background:#f4f4f5;color:#52525b}.st-보류{background:#fef3c7;color:#92400e}
  .why{margin:0;padding:0;list-style:none}.why li{margin-bottom:2px}
  .why li.note{color:var(--fg3)}
  .bt{display:flex;gap:4px;flex-wrap:wrap}
  .bt button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--fg2);white-space:nowrap}
  .bt button:hover{border-color:var(--fg2);color:var(--fg)}
  .site{font-size:11px;color:var(--fg3);margin-top:3px}
  .crit{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;background:var(--bg)}
  .crit summary{cursor:pointer;font-weight:700;font-size:14px}
  .crit .cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:6px 28px;margin-top:10px}
  .crit h4{margin:0 0 4px;font-size:13px;color:var(--fg2)}
  .crit ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
  .crit .na{font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
  .crit .cn{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg2);line-height:1.7}
  .sum{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;background:var(--bg2)}
  .sum table{border-collapse:collapse;font-size:13px;margin-bottom:6px}
  .sum th,.sum td{padding:4px 14px 4px 0;text-align:left}
  .sum thead th{color:var(--fg3);font-weight:600;font-size:12px}
  .sum td.num{text-align:right;padding-right:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   채용공고 — 사람인(나중에 잡코리아) 지원자를 대표가 정한 기준으로 미리 나눠 둔 목록 (2026-11-18)
   대표 PC(lemon803)의 APPLICANT-SCREEN/screen.py 가 매일 새 지원자를 읽어 통과 / 탈락예정 / 애매 로 나눠 넣음(저장 값 '탈락예정' 은 화면에 '불합격'으로 보임 — 분류 이름일 뿐 사이트 불합격 처리가 아님). 기준은 APPLICANT-SCREEN/rules.py.
   지원자 개인정보라 잠긴 표(applicants, sql-applicants.sql)에 있고, 메모장·카톡 주문과 같은 출입증(think_login)으로만 읽고 고침.
   '통과'는 PC 가 사람인 1차 면접 단계로 옮기고 '면접'으로 올림(decided_by='자동'). 불합격 처리는 없음(2026-11-18 대표 지시). 애매·탈락예정은 사람이 [면접]·[보류]로 표시. 나이는 자동 판정에 쓰지 않고 칸으로만 보여 줌(정렬·필터는 사람이 함).
================================================================ */
const RESULTS = ['볼사람', '통과', '애매', '탈락예정'];   // 탭. '볼사람' = 통과+애매(불합격 분류를 뺀 것, 기본 화면 — 2026-11-18 대표: 너무 많다)
const TAB_NAME = { 볼사람: '볼 사람', 탈락예정: '불합격' };   // 저장 값 '탈락예정' 은 화면에 '불합격'으로 보임. 인트라넷 분류일 뿐 사이트에서 불합격 처리한 것이 아님
const JOBS = ['마케팅', '경영지원', '고객지원', '물류지원'];
const TOKEN_KEY = 'think_token';
let ROWS = null, loadErr = '', tab = '볼사람', job = '', decided = '전체', ageMax = '', days = 30, sortKey = 'applied_at', sortDir = -1, loading = false;

const sbc = () => SupabaseStore.client;
const myMember = () => members.find(m => m.name === me);
const tokenOf = m => { try { return localStorage.getItem(TOKEN_KEY + '_' + m.id) || ''; } catch (e) { return ''; } };
async function token(){   // 로그인할 때 받은 출입증(common.js). 없으면 다시 로그인
  const t = bzToken(); if (!t) { bzExpired(); throw new Error('다시 로그인해 주세요'); }
  return t;
}
async function call(name, args, retry = true){
  const { data, error } = await sbc().rpc(name, { p_token: await token(), ...args });
  if (error) throw error;
  if (data && data.ok === false && data.err === 'session') { bzExpired(); throw new Error('다시 로그인해 주세요'); }
  if (data && data.ok === false) throw new Error(data.err);
  return data;
}
async function load(){
  if (loading || store !== SupabaseStore || !myMember()) return;
  loading = true;
  try { ROWS = (await call('ap_list', { p_days: days })).rows || []; loadErr = ''; }
  catch (e) { loadErr = e.message || String(e); }
  loading = false; render();
}
async function patch(id, p, msg){
  try { await call('ap_update', { p_id: id, p_patch: p }); const r = ROWS.find(x => x.id === id); Object.assign(r, p); if (p.status) { r.decided_by = me; r.decided_at = nowIso(); r.site_done = null; } render(); if (msg) toast(msg); }
  catch (e) { toast('저장 실패: ' + (e.message || e)); }
}
const md = s => { if (!s) return ''; const [, m, d] = String(s).slice(0, 10).split('-'); return `${Number(m)}/${Number(d)}`; };

function rowHtml(r){
  const why = (Array.isArray(r.reasons) ? r.reasons : []).map(x => `<li>${esc(x)}</li>`).join('') + (Array.isArray(r.notes) ? r.notes : []).map(x => `<li class="note">${esc(x)}</li>`).join('');
  const isDecided = r.status && r.status !== '대기';
  return `<tr class="${isDecided ? 'decided' : ''}">
    <td><div class="nm">${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" title="${esc(r.site)} 이력서 열기">${esc(r.name || '')} ↗</a>` : esc(r.name || '')}</div>
        <div class="sub">${esc(r.job || '직무 미정')} · ${esc(r.site || '')}${r.file_resume ? ' · 첨부 이력서' : ''}${r.has_photo === false ? ' · 사진 없음' : ''}</div></td>
    <td class="num">${r.age == null ? '' : r.age}</td>
    <td>${esc(r.career || '')}<div class="sub">${esc(r.last_company || '')}</div></td>
    <td>${esc(r.edu || '')}</td>
    <td>${esc(r.salary_wish || '')}</td>
    <td class="num">${md(r.applied_at)}</td>
    <td><span class="rs rs-${esc(r.result)}">${esc(r.result === '탈락예정' ? '불합격' : r.result)}</span></td>
    <td><ul class="why">${why || '<li class="note">기준에 걸리는 점 없음</li>'}</ul>${r.memo ? `<div class="sub">메모: ${esc(r.memo)}</div>` : ''}</td>
    <td>${isDecided ? `<span class="st st-${esc(r.status)}">${esc(r.status)}</span><div class="site">${esc(r.decided_by || '')} ${r.decided_at ? fmtDateTime(r.decided_at) : ''}${r.site_done ? '<br>' + esc(r.site) + ': ' + esc(r.site_done) : ''}</div>` : (r.site_done ? `<div class="site">${esc(r.site)}: ${esc(r.site_done)}</div>` : '')}
      <div class="bt" style="margin-top:${isDecided ? 4 : 0}px">
        ${isDecided ? `<button data-st="대기" data-sid="${esc(r.id)}">되돌리기</button>`
          : `<button data-st="면접" data-sid="${esc(r.id)}" title="면접 볼 사람으로 표시(사람인 단계는 직접 옮겨 주세요)">면접</button><button data-st="보류" data-sid="${esc(r.id)}">보류</button>`}
        <button data-memo="${esc(r.id)}">메모</button></div></td>
  </tr>`;
}

/* 선정 기준 — 대표가 2026-11-18 에 정한 것. 프로그램 기준은 APPLICANT-SCREEN/rules.py 이고, 여기 글은 사람이 잊지 않게 적어 둔 것이라 기준을 바꾸면 두 곳을 같이 고친다 */
let critOpen = (() => { try { return localStorage.getItem('hire_crit') !== '0'; } catch (e) { return true; } })();
function critHtml(){
  return `<details class="crit" ${critOpen ? 'open' : ''}><summary>📌 선정 기준 <span class="sub">(2026-11-18 대표 지시 · 사람인, 잡코리아 공통)</span></summary>
    <div class="cg">
      <div><h4>공통 탈락 조건</h4><ul>
        <li>사진이 없는 경우</li>
        <li>이직이 잦은 경우 <span class="sub">— 1~2년씩 짧게 다니고 3번 넘게 옮긴 사람 (프로그램: 2년 이하로 다니고 그만둔 직장 4곳 이상)</span></li>
        <li>나이가 40세 이상인 경우 <span class="na">자동 판정 안 함</span></li>
        <li>자기소개서가 성의 없는 경우 <span class="sub">— 한 문단으로 10줄 이하 (프로그램: 한 문단, 450자 미만 또는 없음)</span></li>
        <li>고졸인 경우 <span class="sub">— 대학 재학·휴학·중퇴·수료는 '애매'</span></li>
      </ul></div>
      <div><h4>직무별 1차 면접 조건</h4><ul>
        <li><b>공통</b> — 총 경력 5년 이하 <span class="sub">— 5년을 넘으면 불합격 분류 (2026-11-24 추가 · 사이트에 표시되는 총 경력 기준, 딱 5년은 통과)</span></li>
        <li><b>마케팅(컨텐츠 제작)</b> — 희망연봉 3,500만원 이하 · 영상 편집 또는 영상 관련 자격증·경험</li>
        <li><b>경영지원</b> — 희망연봉 5,000만원 이하 · 35세 이하 <span class="sub">— 나이도 자동 판정(2026-11-24)</span></li>
        <li><b>고객지원</b> — 30세 이하 <span class="sub">— 나이도 자동 판정(2026-11-24)</span></li>
        <li><b>물류지원</b> — 35세 이하 · 희망연봉 4,500만원 이하 <span class="sub">— 2026-11-24 추가 · 나이도 자동 판정(36세부터 불합격 분류, 나이를 모르면 거르지 않음)</span></li>
      </ul>
      <div class="sub" style="margin-top:6px">희망연봉은 금액을 적은 경우만 봅니다("회사내규에 따름"·"면접 후 결정"은 통과).</div></div>
    </div>
    <div class="cn"><b>처리 방식</b> · 기준에 맞거나 <b>애매한</b> 사람은 2단계(사람인 <b>1차 면접</b> / 잡코리아 <b>면접</b>)로 올리고, 기준에 안 맞는 사람은 1단계(서류 전형 / 지원서 검토)에 둔 채 <b>열람 + 불합격</b>으로 표시합니다(2026-11-24). 불합격으로 표시해도 지원자에게 알림은 가지 않으며(메일·결과 안내를 보내지 않음), 최종 합격·불합격은 내부에서 따로 정합니다.<br>
      <b>나이</b> · 프로그램은 나이로 통과·탈락을 가르지 않습니다. 위 나이 기준은 아래 목록의 <b>"나이 ○세 이하"</b> 칸과 나이 정렬로 직접 보세요.<br>
      <b>애매</b> · 첨부 파일(PDF) 이력서, 직무를 알 수 없는 공고("직무별 담당자"), 학력·이직 횟수가 경계선인 경우.</div>
  </details>`;
}

/* 맨 위 요약: 직무별로 몇 명이 어느 칸에 있는지, 마지막으로 읽은 때 (2026-11-18) */
function sumHtml(){
  if (!ROWS || !ROWS.length) return '<div class="hint" style="margin-bottom:12px">아직 올라온 지원자가 없습니다. 대표 PC 가 매일 09:10 에 사람인의 새 지원자를 읽어 올립니다.</div>';
  const jobs = [...JOBS, ''], last = ROWS.reduce((m, r) => (r.screened_at || '') > m ? r.screened_at : m, '');
  const n = (j, f) => ROWS.filter(r => (r.job || '') === j && f(r)).length;
  const line = j => { const total = n(j, () => true); if (!total) return '';
    return `<tr><th>${j || '직무 미정'}</th><td class="num">${total}</td><td class="num"><b>${n(j, r => r.status === '면접')}</b></td><td class="num">${n(j, r => r.result === '통과' && r.status !== '면접')}</td><td class="num">${n(j, r => r.result === '애매' && r.status !== '면접')}</td><td class="num">${n(j, r => r.result === '탈락예정' && r.status !== '면접')}</td></tr>`; };
  return `<div class="sum"><table><thead><tr><th>직무</th><th>지원자</th><th>1차 면접으로 보냄</th><th>통과(아직 서류)</th><th>애매</th><th>불합격(분류)</th></tr></thead><tbody>${jobs.map(line).join('')}</tbody></table>
    <div class="sub">최근 ${days}일 지원자 기준 · 마지막으로 읽은 때 ${last ? fmtDateTime(last) : '-'} · 불합격 분류는 사이트에서도 불합격으로 표시합니다(지원자에게 알림 없음). 애매는 서류 전형에 그대로 있습니다.</div></div>`;
}

function render(){
  let body;
  if (store !== SupabaseStore) body = '<div class="empty">팀 저장소에 연결되지 않았습니다.</div>';
  else if (ROWS === null && loadErr === 'admin') body = '<div class="empty">관리자만 볼 수 있는 화면입니다.</div>';
  else if (ROWS === null) body = `<div class="empty">${loadErr ? '불러오지 못했습니다: ' + esc(loadErr) + (/function|does not exist|schema/i.test(loadErr) && isAdmin() ? '<br>sql-applicants.sql 을 Supabase SQL Editor 에서 실행하세요.' : '') : '불러오는 중…'}</div>`;
  else {
    const base = r => (!job || (job === '미정' ? !r.job : r.job === job)) && (decided === '전체' || (decided === '대기' ? (r.status || '대기') === '대기' : (r.status || '대기') !== '대기')) && (ageMax === '' || (r.age != null && r.age <= Number(ageMax)));
    const inTab = (r, t) => t === '전체' || (t === '볼사람' ? r.result !== '탈락예정' : r.result === t);
    const cnt = t => ROWS.filter(r => base(r) && inTab(r, t)).length;
    const val = r => sortKey === 'age' ? (r.age == null ? 999 : r.age) : sortKey === 'name' ? (r.name || '') : (r.applied_at || '');
    const list = ROWS.filter(r => base(r) && inTab(r, tab)).sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);
    const th = (k, label) => `<th data-sort="${k}">${label}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
    body = `${sumHtml()}<div class="actions">
        <div class="tabs2">${RESULTS.map(t => `<button data-tab="${t}" class="${tab === t ? 'on' : ''}">${TAB_NAME[t] || t} ${cnt(t)}</button>`).join('')}<button data-tab="전체" class="${tab === '전체' ? 'on' : ''}">전체 ${cnt('전체')}</button></div>
        <select id="fjob"><option value="">직무 전체</option>${JOBS.map(j => `<option ${job === j ? 'selected' : ''}>${j}</option>`).join('')}<option value="미정" ${job === '미정' ? 'selected' : ''}>직무 미정</option></select>
        <select id="fdec">${[['대기', '결정 전'], ['결정', '결정한 것'], ['전체', '모두']].map(([v, l]) => `<option value="${v}" ${decided === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label class="sub">나이 <input id="fage" type="number" min="18" max="70" placeholder="전체" value="${esc(ageMax)}"> 세 이하</label>
        <select id="fdays">${[7, 14, 30, 90, 180].map(d => `<option value="${d}" ${days === d ? 'selected' : ''}>최근 ${d}일 지원</option>`).join('')}</select>
        <a class="btn" href="https://hiring.saramin.co.kr/applicant-manage" target="_blank" rel="noopener" title="사람인 기업회원 > 후보자 관리 (새 탭)" style="text-decoration:none;color:inherit">사람인 후보자 관리 ↗</a>
        <a class="btn" href="https://hiring.jobkorea.co.kr/biz/0S07Q0KF1TSEG/applicant/list" target="_blank" rel="noopener" title="잡코리아 하이어링 센터 > 지원자 목록 (새 탭)" style="text-decoration:none;color:inherit">잡코리아 지원자 목록 ↗</a>
        <button class="btn" id="reloadBtn">새로고침</button>
      </div>
      ${loadErr ? `<div class="hint warn">⚠ ${esc(loadErr)}</div>` : ''}
      ${list.length ? `<div class="tw"><table class="ap"><thead><tr>${th('name', '이름')}${th('age', '나이')}<th>경력</th><th>학력</th><th>희망연봉</th>${th('applied_at', '지원일')}<th>판정</th><th>사유</th><th>결정</th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table></div>`
        : `<div class="empty">해당하는 지원자가 없습니다.</div>`}`;
  }
  $('#app').innerHTML = headerHtml({ icon: '📋', title: '채용공고' }) + `<main class="wrap" style="max-width:1200px">
    ${critHtml()}
    ${body}
    <div class="hint" style="margin-top:12px">대표 PC 가 매일 사람인의 새 지원자를 읽어 기준에 따라 <b>통과 · 애매 · 불합격</b>으로 나눠 올립니다. <b>'불합격'은 기준에 맞지 않는다는 분류이고, 사람인·잡코리아에도 불합격으로 표시합니다</b>(지원자에게 알림은 가지 않음. 최종 결정은 내부에서 따로). 기본 화면 '볼 사람'에는 불합격 분류를 뺀 사람만 나옵니다. 이름을 누르면 사람인 이력서가 열립니다.
    <b>'통과'와 '애매'는 대표 PC 가 2단계(사람인 1차 면접 · 잡코리아 면접)로 바로 올립니다(안내 메일은 보내지 않음). 불합격 분류는 1단계에서 열람 + 불합격으로 표시합니다(알림 없음).</b> 첨부 파일(PDF) 이력서와 직무를 알 수 없는 지원자는 프로그램이 못 읽어 '애매'로 올립니다.
    나이는 판정에 쓰지 않습니다. 이름·나이·지원일 제목을 누르면 정렬됩니다.</div></main>`;
  const cd = document.querySelector('details.crit'); if (cd) cd.ontoggle = () => { critOpen = cd.open; try { localStorage.setItem('hire_crit', cd.open ? '1' : '0'); } catch (e) {} };
  bindHeader(() => {}, null, () => ROWS ? `결정 전 지원자 ${ROWS.filter(r => (r.status || '대기') === '대기').length}명` : '');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'applied_at' ? -1 : 1; } render(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onchange = () => fn(el.value); };
  on('#fjob', v => { job = v; render(); }); on('#fdec', v => { decided = v; render(); }); on('#fage', v => { ageMax = v; render(); }); on('#fdays', v => { days = Number(v); load(); });
  const rb = $('#reloadBtn'); if (rb) rb.onclick = () => load();
  const get = id => ROWS.find(x => x.id === id);
  document.querySelectorAll('[data-st]').forEach(el => el.onclick = () => { const r = get(el.dataset.sid), s = el.dataset.st; patch(r.id, { status: s }, s === '대기' ? `${r.name} — 결정을 되돌렸습니다` : `${r.name} — ${s}(으)로 표시했습니다`); });
  document.querySelectorAll('[data-memo]').forEach(el => el.onclick = () => { const r = get(el.dataset.memo); const v = prompt(`${r.name} 메모`, r.memo || ''); if (v !== null) patch(r.id, { memo: v.trim() }, '메모를 저장했습니다'); });
  if (ROWS === null && !loading && !loadErr) load();
}

boot({ icon: '📋', title: '채용공고', tables: [], render });
</script>
</body>
</html>
