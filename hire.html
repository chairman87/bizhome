<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용공고</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202611101107">
<script src="common.js?v=202611101107"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .actions select,.actions input{border:1px solid var(--line2);border-radius:var(--radius);padding:5px 8px;font-size:13px;background:var(--bg);color:var(--fg)}
  .actions input{width:64px}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  table.ap{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
  table.ap th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
  table.ap td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.ap tr:last-child td{border-bottom:0}
  table.ap tr.decided td{opacity:.6}
  .nm{font-weight:700}.nm a{color:inherit;text-decoration:none}.nm a:hover{text-decoration:underline}
  .sub{font-size:12px;color:var(--fg3)}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rs{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
  .rs-통과{background:#dcfce7;color:#15803d}.rs-탈락예정{background:#fee2e2;color:#b91c1c}.rs-애매{background:#fef3c7;color:#92400e}
  .st{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
  .st-면접{background:#e0e7ff;color:#3730a3}.st-불합격{background:#f4f4f5;color:#52525b}.st-보류{background:#fef3c7;color:#92400e}
  .why{margin:0;padding:0;list-style:none}.why li{margin-bottom:2px}
  .why li.note{color:var(--fg3)}
  .bt{display:flex;gap:4px;flex-wrap:wrap}
  .bt button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--fg2);white-space:nowrap}
  .bt button:hover{border-color:var(--fg2);color:var(--fg)}
  .site{font-size:11px;color:var(--fg3);margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   채용공고 — 사람인(나중에 잡코리아) 지원자를 대표가 정한 기준으로 미리 나눠 둔 목록 (2026-11-18)
   대표 PC(lemon803)의 APPLICANT-SCREEN/screen.py 가 매일 새 지원자를 읽어 통과 / 탈락예정 / 애매 로 나눠 넣음. 기준은 APPLICANT-SCREEN/rules.py.
   지원자 개인정보라 잠긴 표(applicants, sql-applicants.sql)에 있고, 메모장·카톡 주문과 같은 출입증(think_login)으로만 읽고 고침.
   사람이 [면접]·[불합격]·[보류]를 눌러 최종 결정함. 나이는 자동 판정에 쓰지 않고 칸으로만 보여 줌(정렬·필터는 사람이 함).
================================================================ */
const RESULTS = ['통과', '애매', '탈락예정'];
const JOBS = ['마케팅', '경영지원', '고객지원'];
const TOKEN_KEY = 'think_token';
let ROWS = null, loadErr = '', tab = '통과', job = '', decided = '대기', ageMax = '', days = 30, sortKey = 'applied_at', sortDir = -1, loading = false;

const sbc = () => SupabaseStore.client;
const myMember = () => members.find(m => m.name === me);
const tokenOf = m => { try { return localStorage.getItem(TOKEN_KEY + '_' + m.id) || ''; } catch (e) { return ''; } };
async function token(){
  const m = myMember(); if (!m) return '';
  let t = tokenOf(m); if (t) return t;
  const { data, error } = await sbc().rpc('think_login', { p_member: m.id, p_pin: m.password || '1234' });
  if (error || !data || !data.ok) throw new Error('출입증을 받지 못했습니다' + (data && data.err ? ` (${data.err})` : ''));
  try { localStorage.setItem(TOKEN_KEY + '_' + m.id, data.token); } catch (e) {}
  return data.token;
}
async function call(name, args, retry = true){
  const { data, error } = await sbc().rpc(name, { p_token: await token(), ...args });
  if (error) throw error;
  if (data && data.ok === false && data.err === 'session' && retry) { const m = myMember(); try { localStorage.removeItem(TOKEN_KEY + '_' + m.id); } catch (e) {} return call(name, args, false); }
  if (data && data.ok === false) throw new Error(data.err);
  return data;
}
async function load(){
  if (loading || store !== SupabaseStore || !myMember()) return;
  loading = true;
  try { ROWS = (await call('ap_list', { p_days: days })).rows || []; loadErr = ''; }
  catch (e) { loadErr = e.message || String(e); }
  loading = false; render();
}
async function patch(id, p, msg){
  try { await call('ap_update', { p_id: id, p_patch: p }); const r = ROWS.find(x => x.id === id); Object.assign(r, p); if (p.status) { r.decided_by = me; r.decided_at = nowIso(); r.site_done = null; } render(); if (msg) toast(msg); }
  catch (e) { toast('저장 실패: ' + (e.message || e)); }
}
const md = s => { if (!s) return ''; const [, m, d] = String(s).slice(0, 10).split('-'); return `${Number(m)}/${Number(d)}`; };

function rowHtml(r){
  const why = (Array.isArray(r.reasons) ? r.reasons : []).map(x => `<li>${esc(x)}</li>`).join('') + (Array.isArray(r.notes) ? r.notes : []).map(x => `<li class="note">${esc(x)}</li>`).join('');
  const isDecided = r.status && r.status !== '대기';
  return `<tr class="${isDecided ? 'decided' : ''}">
    <td><div class="nm">${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener" title="${esc(r.site)} 이력서 열기">${esc(r.name || '')} ↗</a>` : esc(r.name || '')}</div>
        <div class="sub">${esc(r.job || '직무 미정')} · ${esc(r.site || '')}${r.file_resume ? ' · 첨부 이력서' : ''}${r.has_photo === false ? ' · 사진 없음' : ''}</div></td>
    <td class="num">${r.age == null ? '' : r.age}</td>
    <td>${esc(r.career || '')}<div class="sub">${esc(r.last_company || '')}</div></td>
    <td>${esc(r.edu || '')}</td>
    <td>${esc(r.salary_wish || '')}</td>
    <td class="num">${md(r.applied_at)}</td>
    <td><span class="rs rs-${esc(r.result)}">${esc(r.result === '탈락예정' ? '탈락 예정' : r.result)}</span></td>
    <td><ul class="why">${why || '<li class="note">기준에 걸리는 점 없음</li>'}</ul>${r.memo ? `<div class="sub">메모: ${esc(r.memo)}</div>` : ''}</td>
    <td>${isDecided ? `<span class="st st-${esc(r.status)}">${esc(r.status)}</span><div class="site">${esc(r.decided_by || '')} ${r.decided_at ? fmtDateTime(r.decided_at) : ''}${r.site_done ? '<br>' + esc(r.site) + ': ' + esc(r.site_done) : ''}</div>` : ''}
      <div class="bt" style="margin-top:${isDecided ? 4 : 0}px">
        ${isDecided ? `<button data-st="대기" data-sid="${esc(r.id)}">되돌리기</button>`
          : `<button data-st="면접" data-sid="${esc(r.id)}">면접</button><button data-st="불합격" data-sid="${esc(r.id)}">불합격</button><button data-st="보류" data-sid="${esc(r.id)}">보류</button>`}
        <button data-memo="${esc(r.id)}">메모</button></div></td>
  </tr>`;
}

function render(){
  let body;
  if (store !== SupabaseStore) body = '<div class="empty">팀 저장소에 연결되지 않았습니다.</div>';
  else if (ROWS === null) body = `<div class="empty">${loadErr ? '불러오지 못했습니다: ' + esc(loadErr) + (/function|does not exist|schema/i.test(loadErr) && isAdmin() ? '<br>sql-applicants.sql 을 Supabase SQL Editor 에서 실행하세요.' : '') : '불러오는 중…'}</div>`;
  else {
    const base = r => (!job || (job === '미정' ? !r.job : r.job === job)) && (decided === '전체' || (decided === '대기' ? (r.status || '대기') === '대기' : (r.status || '대기') !== '대기')) && (ageMax === '' || (r.age != null && r.age <= Number(ageMax)));
    const inTab = (r, t) => t === '전체' || r.result === t;
    const cnt = t => ROWS.filter(r => base(r) && inTab(r, t)).length;
    const val = r => sortKey === 'age' ? (r.age == null ? 999 : r.age) : sortKey === 'name' ? (r.name || '') : (r.applied_at || '');
    const list = ROWS.filter(r => base(r) && inTab(r, tab)).sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);
    const th = (k, label) => `<th data-sort="${k}">${label}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
    body = `<div class="actions">
        <div class="tabs2">${RESULTS.map(t => `<button data-tab="${t}" class="${tab === t ? 'on' : ''}">${t === '탈락예정' ? '탈락 예정' : t} ${cnt(t)}</button>`).join('')}<button data-tab="전체" class="${tab === '전체' ? 'on' : ''}">전체 ${cnt('전체')}</button></div>
        <select id="fjob"><option value="">직무 전체</option>${JOBS.map(j => `<option ${job === j ? 'selected' : ''}>${j}</option>`).join('')}<option value="미정" ${job === '미정' ? 'selected' : ''}>직무 미정</option></select>
        <select id="fdec">${[['대기', '결정 전'], ['결정', '결정한 것'], ['전체', '모두']].map(([v, l]) => `<option value="${v}" ${decided === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label class="sub">나이 <input id="fage" type="number" min="18" max="70" placeholder="전체" value="${esc(ageMax)}"> 세 이하</label>
        <select id="fdays">${[7, 14, 30, 90, 180].map(d => `<option value="${d}" ${days === d ? 'selected' : ''}>최근 ${d}일 지원</option>`).join('')}</select>
        <button class="btn" id="reloadBtn">새로고침</button>
      </div>
      ${loadErr ? `<div class="hint warn">⚠ ${esc(loadErr)}</div>` : ''}
      ${list.length ? `<div class="tw"><table class="ap"><thead><tr>${th('name', '이름')}${th('age', '나이')}<th>경력</th><th>학력</th><th>희망연봉</th>${th('applied_at', '지원일')}<th>판정</th><th>사유</th><th>결정</th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table></div>`
        : `<div class="empty">해당하는 지원자가 없습니다.</div>`}`;
  }
  $('#app').innerHTML = headerHtml({ icon: '📋', title: '채용공고' }) + `<main class="wrap" style="max-width:1200px">
    ${body}
    <div class="hint" style="margin-top:12px">대표 PC 가 매일 사람인의 새 지원자를 읽어 기준에 따라 <b>통과 · 애매 · 탈락 예정</b>으로 나눠 올립니다. 이름을 누르면 사람인 이력서가 열립니다.
    <b>판정은 프로그램이 한 것이고, 결정은 사람이 [면접]·[불합격]·[보류]로 누릅니다.</b> 첨부 파일(PDF) 이력서와 직무를 알 수 없는 지원자는 프로그램이 못 읽어 '애매'로 올립니다.
    나이는 판정에 쓰지 않습니다. 이름·나이·지원일 제목을 누르면 정렬됩니다.</div></main>`;
  bindHeader(() => {}, null, () => ROWS ? `결정 전 지원자 ${ROWS.filter(r => (r.status || '대기') === '대기').length}명` : '');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'applied_at' ? -1 : 1; } render(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onchange = () => fn(el.value); };
  on('#fjob', v => { job = v; render(); }); on('#fdec', v => { decided = v; render(); }); on('#fage', v => { ageMax = v; render(); }); on('#fdays', v => { days = Number(v); load(); });
  const rb = $('#reloadBtn'); if (rb) rb.onclick = () => load();
  const get = id => ROWS.find(x => x.id === id);
  document.querySelectorAll('[data-st]').forEach(el => el.onclick = () => { const r = get(el.dataset.sid), s = el.dataset.st; patch(r.id, { status: s }, s === '대기' ? `${r.name} — 결정을 되돌렸습니다` : `${r.name} — ${s}(으)로 표시했습니다`); });
  document.querySelectorAll('[data-memo]').forEach(el => el.onclick = () => { const r = get(el.dataset.memo); const v = prompt(`${r.name} 메모`, r.memo || ''); if (v !== null) patch(r.id, { memo: v.trim() }, '메모를 저장했습니다'); });
  if (ROWS === null && !loading && !loadErr) load();
}

boot({ icon: '📋', title: '채용공고', tables: [], render });
</script>
</body>
</html>
