<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연차/휴가 등록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610252148">
<script src="common.js?v=202610252148"></script>
<style>
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:22px;font-weight:700;margin-top:2px}
  .stat .v.orange{color:var(--orange)}
  .stat .s{font-size:11px;color:var(--fg3)}
  .bar{display:inline-block;width:100px;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
  .bar.warn i{background:var(--orange)}
  .days{font-variant-numeric:tabular-nums;white-space:nowrap}
  .reason{color:var(--fg2);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.type-연차{background:#dbeafe;color:#1d4ed8}
  .ev.sched{background:#dcfce7;color:#166534}
  .ev.sched.shared{background:#fef9c3;color:#854d0e}
  .viewers{display:flex;flex-wrap:wrap;gap:6px 12px;padding:4px 0}
  .viewers label{display:inline-flex !important;align-items:center;gap:4px;font-size:13px;cursor:pointer;font-weight:400;white-space:nowrap;margin:0 !important;color:var(--fg) !important}
  .viewers input[type=checkbox]{width:auto !important;margin:0;padding:0}
  .twrap{position:relative;display:inline-block}
  .tbtn{min-width:120px;text-align:left;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:14px;color:var(--fg)}
  .tbtn.empty{color:var(--fg3)}
  .tpop{position:absolute;top:calc(100% + 4px);left:0;z-index:50;display:flex;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
  .tcol{max-height:220px;overflow-y:auto;min-width:86px;padding:4px 0}
  .tcol + .tcol{border-left:1px solid var(--line)}
  .tcol div{padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
  .tcol div:hover{background:var(--bg2)}
  .tcol div.on{background:#2563eb;color:#fff;font-weight:600}
  .viewers label.all{font-weight:700}
  .ev.type-반차{background:#e0f2fe;color:#0369a1}
  .ev.type-병가{background:#fee2e2;color:#b91c1c}
  .ev.type-경조사{background:#ede9fe;color:#6d28d9}
  .ev.type-기타{background:var(--bg3);color:var(--fg2)}
  .ev.pending{opacity:.55;border:1px dashed currentColor}
  .card .row2{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .card .row2:last-child{border-bottom:0}
  .card .row2 .bar{flex:1;width:auto}
  .card .row2 input{width:52px;border:1px solid var(--line2);border-radius:4px;padding:2px 4px;text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   연차/휴가 등록
   흐름: 팀원이 신청 → 관리자가 승인 / 반려. 신청자는 승인 전까지 취소 가능
================================================================ */
const ST = { '신청': ['#fbeccc','#9a6700'], '승인': ['#dcfce7','#15803d'], '반려': ['#fee2e2','#b91c1c'], '취소': ['#e9e9e7','#5a5a55'] };
const STATUSES = Object.keys(ST);
const stHtml = s => tag(s, ...(ST[s] || ST['신청']), true);
/* 종류: [하루당 일수, 연차에서 차감 여부] */
const TYPES = { '연차': [1, true], '오전 반차': [0.5, true], '오후 반차': [0.5, true], '병가': [1, false], '경조사': [1, false], '기타': [1, false] };
const DEFAULT_TOTAL = 15;   // 팀원별 연차 총 일수 기본값 (팀원별 현황에서 바꿀 수 있음)
const L = () => DATA.leaves || [];

let view = LS.get('leave_view') || 'mine';
let filter = { q: '', person: '', status: '', year: String(new Date().getFullYear()) };
let sort = { key: 'start_date', dir: 'desc' };
const cal = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();

const pendingCount = () => L().filter(l => l.status === '신청').length;
/* 팀원은 내 신청·내 달력만, 관리자는 전체·팀원별 현황까지 */
const VIEWS = () => isAdmin() ? [
  { key: 'mine', label: '내 신청' }, { key: 'all', label: '전체', badge: pendingCount() },
  null, { key: 'calendar', label: '달력' }, { key: 'members', label: '팀원별 현황' },
] : [{ key: 'mine', label: '내 신청' }, { key: 'calendar', label: '달력' }];

/* 평일 수 세기 (토·일 제외) */
function weekdays(a, b){
  const s = parseYmd(a), e = parseYmd(b); if (!s || !e || e < s) return 0;
  let n = 0; for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0 && d.getDay() !== 6) n++;
  return n;
}
const calcDays = (type, a, b) => { const t = TYPES[type] || TYPES['기타']; return t[0] < 1 ? t[0] : weekdays(a, b); };
/* ---- 연차 계산 (근로기준법 제60조) ----
   입사 1년 미만: 한 달 개근마다 1일 (최대 11일). 1년 이상: 15일, 3년차부터 2년마다 +1일 (최대 25일)
   연차 기간은 입사일 기준(입사일 ~ 다음 입사 기념일 전날). 입사일이 없으면 예전 방식(총 일수 직접 입력, 달력 연도 기준) */
function addMonths(d, n){ const r = new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); if (r.getDate() !== d.getDate()) r.setDate(0); return r; }
function leaveInfo(name){
  const m = members.find(x => x.name === name) || {};
  const adjust = Number(m.leave_adjust) || 0;
  if (!m.hire_date) {
    const y = filter.year, manual = m.leave_total != null ? Number(m.leave_total) : DEFAULT_TOTAL;
    return { auto: false, base: manual, adjust, total: manual + adjust, start: y + '-01-01', end: y + '-12-31', label: '입사일 없음 · 직접 입력한 총 일수', months: null };
  }
  const hire = parseYmd(m.hire_date), today = parseYmd(todayStr());
  let months = (today.getFullYear() - hire.getFullYear()) * 12 + (today.getMonth() - hire.getMonth());
  if (today.getDate() < hire.getDate()) months--;
  months = Math.max(0, months);
  const years = Math.floor(months / 12);
  let base, start, label;
  if (years < 1) { base = Math.min(11, months); start = hire; label = `입사 ${fmtDate(m.hire_date)} · ${months}개월 근속 → 월 1일씩 ${base}일 (1년 미만, 최대 11일)`; }
  else { base = Math.min(25, 15 + Math.floor((years - 1) / 2)); start = addMonths(hire, years * 12); label = `입사 ${fmtDate(m.hire_date)} · ${years + 1}년차 → ${base}일`; }
  const end = addMonths(start, 12); end.setDate(end.getDate() - 1);
  return { auto: true, base, adjust, total: base + adjust, start: ymd(start), end: ymd(end), label, months };
}
/* 해당 연차 기간에 승인된 연차·반차 합계 */
function usedDays(name, info){
  info = info || leaveInfo(name);
  return L().filter(l => l.name === name && l.status === '승인' && (TYPES[l.type] || [1, false])[1] && l.start_date >= info.start && l.start_date <= info.end).reduce((a, l) => a + (Number(l.days) || 0), 0);
}
const totalDays = name => leaveInfo(name).total;
const period = l => l.start_date === l.end_date || !l.end_date ? fmtDate(l.start_date) : `${fmtDate(l.start_date)} ~ ${fmtDate(l.end_date)}`;
const typeKey = t => t.includes('반차') ? '반차' : (TYPES[t] ? t : '기타');
const years = () => [...new Set([String(new Date().getFullYear()), ...L().map(l => (l.start_date || '').slice(0, 4)).filter(Boolean)])].sort().reverse();

function normalize(table, l){ if (table === 'schedules') return { ...l, viewers: Array.isArray(l.viewers) ? l.viewers : [], attendees: Array.isArray(l.attendees) ? l.attendees : [] }; return { ...l, status: STATUSES.includes(l.status) ? l.status : '신청', comments: Array.isArray(l.comments) ? l.comments : [] }; }
const log = (text, kind = 'log') => ({ by: me, text, at: nowIso(), kind });

/* ---------- 승인 / 반려 / 취소 ---------- */
async function approve(id){
  if (!isAdmin()) { toast('관리자만 승인할 수 있습니다', true); return; }
  const l = L().find(x => x.id === id); if (!l) return;
  await saveRow('leaves', { ...l, status: '승인', decided_by: me, decided_at: nowIso(), comments: [...(l.comments || []), log('승인')] });
  toast(`${l.name}님의 ${l.type}을(를) 승인했습니다`);
}
function openReject(id){
  if (!isAdmin()) { toast('관리자만 반려할 수 있습니다', true); return; }
  const l = L().find(x => x.id === id); if (!l) return;
  openModal(`${modalHead('반려')}
    <div class="mb"><div><span class="title">${esc(l.name)} · ${esc(l.type)} · ${period(l)}</span></div>
      <div class="f"><label>반려 사유</label><textarea id="jText" placeholder="예: 그 주에 행사가 있어 조정이 필요합니다"></textarea></div></div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn danger" id="jSend">반려하기</button></div>`);
  $('#jText').focus();
  $('#jSend').onclick = async () => {
    const text = $('#jText').value.trim();
    closeModal();
    await saveRow('leaves', { ...l, status: '반려', decided_by: me, decided_at: nowIso(), comments: [...(l.comments || []), log(text ? `반려: ${text}` : '반려')] });
    toast('반려했습니다');
  };
}
async function cancelLeave(id){
  const l = L().find(x => x.id === id); if (!l) return;
  if (!confirm(`${l.type} 신청(${period(l)})을 취소할까요?`)) return;
  await saveRow('leaves', { ...l, status: '취소', comments: [...(l.comments || []), log('신청 취소')] });
  toast('취소했습니다');
}

/* ---------- 화면 ---------- */
function render(){
  if (!VIEWS().some(v => v && v.key === view)) view = 'mine';   // 권한에 없는 탭이 기억돼 있으면 내 신청으로
  $('#app').innerHTML = headerHtml({ icon: '📅', title: '연차/휴가 등록', tabs: VIEWS(), active: view, newLabel: '휴가 신청' })
    + `<main class="wrap">${view === 'mine' ? myStatsHtml() : ''}${['mine', 'all'].includes(view) ? toolbarHtml() : ''}<div id="view">${viewHtml()}</div></main>`;
  bindHeader(k => { view = k; LS.set('leave_view', k); render(); }, () => openLeave(null), m => `남은 연차 ${totalDays(m.name) - usedDays(m.name)}일`);
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; renderView(); };
  const fa = $('#fa'); if (fa) fa.onchange = () => { filter.person = fa.value; renderView(); };
  const fs = $('#fs'); if (fs) fs.onchange = () => { filter.status = fs.value; renderView(); };
  const fy = $('#fy'); if (fy) fy.onchange = () => { filter.year = fy.value; render(); };
  bindView();
}
function myStatsHtml(){
  const info = leaveInfo(me), used = usedDays(me, info), total = info.total, left = total - used;
  const pending = L().filter(l => l.name === me && l.status === '신청').length;
  return `<div class="stats">
    <div class="stat"><div class="l">내 연차 (${fmtDate(info.start)} ~ ${fmtDate(info.end)})</div><div class="v">${total}일</div><div class="s">${esc(info.label)}${info.adjust ? ` · 조정 ${info.adjust > 0 ? '+' : ''}${info.adjust}일` : ''}</div></div>
    <div class="stat"><div class="l">사용</div><div class="v">${used}일</div><div class="s">이 기간에 승인된 연차·반차 합계</div></div>
    <div class="stat"><div class="l">남은 연차</div><div class="v ${left <= 2 ? 'orange' : ''}">${left}일</div><div class="s"><span class="bar ${left <= 2 ? 'warn' : ''}"><i style="width:${total ? Math.min(100, used / total * 100) : 0}%"></i></span></div></div>
    <div class="stat"><div class="l">승인 대기</div><div class="v ${pending ? 'orange' : ''}">${pending}건</div><div class="s">관리자 확인 전</div></div>
  </div>`;
}
function baseList(){ return (view === 'mine' ? L().filter(l => l.name === me) : L()).filter(l => (l.start_date || '').startsWith(filter.year)); }
function filtered(){
  const q = filter.q.trim().toLowerCase();
  return baseList().filter(l =>
    (!q || [l.name, l.type, l.reason].some(v => (v || '').toLowerCase().includes(q))) &&
    (!filter.person || l.name === filter.person) &&
    (!filter.status || l.status === filter.status));
}
function viewHtml(){ return ({ mine: tableHtml, all: tableHtml, calendar: calHtml, members: membersHtml })[view](filtered()); }
function toolbarHtml(){
  return `<div class="toolbar">
    <select id="fy">${years().map(y => `<option ${filter.year === y ? 'selected' : ''}>${y}</option>`).join('')}</select>
    ${view === 'all' ? `<select id="fa"><option value="">신청자: 전체</option>${memberOptions(filter.person)}</select>` : ''}
    <select id="fs"><option value="">상태: 전체</option>${STATUSES.map(s => `<option ${filter.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <input type="search" id="fq" placeholder="검색 (이름, 종류, 사유)" value="${esc(filter.q)}">
    <span class="count">${filtered().length}건${view === 'all' && pendingCount() ? ` · 승인 대기 ${pendingCount()}건` : ''}</span>
  </div>`;
}
function renderView(){
  $('#view').innerHTML = viewHtml();
  const c = document.querySelector('.toolbar .count'); if (c) c.textContent = `${filtered().length}건${view === 'all' && pendingCount() ? ` · 승인 대기 ${pendingCount()}건` : ''}`;
  bindView();
}
const sortLeaves = list => sortBy(list, sort, { status: s => STATUSES.indexOf(s), days: d => Number(d) || 0 });

/* 표 */
function tableHtml(list){
  if (!list.length) return `<div class="empty">${view === 'mine' ? `${filter.year}년에 신청한 휴가가 없습니다.<br>오른쪽 위 <b>+ 휴가 신청</b>으로 신청하세요.` : `${filter.year}년 휴가 신청이 없습니다.`}</div>`;
  const cols = [];
  if (view === 'all') cols.push(['name', '신청자']);
  cols.push(['type', '종류'], ['start_date', '기간'], ['days', '일수'], ['status', '상태']);
  const th = cols.map(([k, l]) => `<th data-sort="${k}">${l}${sortArrow(sort, k)}</th>`).join('') + '<th>사유</th><th>처리</th>';
  const rows = sortLeaves(list).map(l => `<tr class="row" data-id="${l.id}">
      ${view === 'all' ? `<td>${who(l.name)}</td>` : ''}
      <td>${esc(l.type)}</td>
      <td><span class="date">${period(l)}</span></td>
      <td class="days">${l.days}일</td>
      <td>${stHtml(l.status)}${l.decided_by && l.status !== '신청' && l.status !== '취소' ? `<span class="hint" style="margin-left:6px">${esc(l.decided_by)}</span>` : ''}</td>
      <td class="reason" title="${esc(l.reason || '')}">${esc(l.reason || '')}</td>
      <td class="act">${actionButtons(l)}</td>
    </tr>`).join('');
  return `<div class="tablewrap"><table style="min-width:760px"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function actionButtons(l){
  let h = '';
  if (l.status === '신청' && isAdmin()) h += `<button class="btn sm primary" data-ok="${l.id}">승인</button><button class="btn sm" data-no="${l.id}">반려</button>`;
  if (l.status === '신청' && l.name === me) h += `<button class="btn sm" data-cancel="${l.id}">취소</button>`;
  return h;
}

/* 달력 (승인된 것은 진하게, 신청 중은 점선) */
function calHtml(list){
  const items = [];
  L().filter(l => isAdmin() || l.name === me ? (l.status === '승인' || l.status === '신청') : l.status === '승인').forEach(l => {   // 팀원: 내 것(승인·대기) + 남의 승인된 휴가 (2026-10-14 달력 공개)
    const s = parseYmd(l.start_date), e = parseYmd(l.end_date || l.start_date); if (!s) return;
    for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0 && d.getDay() !== 6) items.push({ ...l, id: l.id, _day: ymd(d) });
  });
  SCH().filter(canSeeSched).forEach(x => {
    const s = parseYmd(x.start_date), e = parseYmd(x.end_date || x.start_date); if (!s) return;
    for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) items.push({ ...x, _sched: true, _day: ymd(d) });
  });
  items.sort((a, b) => (a._sched ? 1 : 0) - (b._sched ? 1 : 0) || String(a.time_text || '').localeCompare(String(b.time_text || '')));   // 휴가 먼저, 일정은 시간 순
  return calendarHtml(cal, items, {
    date: l => l._day,
    label: l => l._sched ? `🗓 ${l.owner !== me ? esc(l.owner) + ' · ' : ''}${l.time_text ? esc(l.time_text) + ' ' : ''}${esc(l.title)}${(l.attendees || []).length ? ` 👥${l.attendees.length}` : ''}` : `${esc(l.name)} · ${esc(l.type)}`,
    cls: l => l._sched ? `sched ${l.owner !== me ? 'shared' : ''}` : `type-${typeKey(l.type)} ${l.status === '신청' ? 'pending' : ''}`,
    hint: (isAdmin() ? '' : '다른 팀원은 승인된 휴가만 표시 · ') + '점선은 승인 대기 · 날짜를 누르면 휴가 신청(창 왼쪽 아래 「일정 등록으로 바꾸기」로 내 일정) · 초록=내 일정, 노랑=남이 보여 준 일정',
  });
}

/* 팀원별 현황 */
function membersHtml(){
  const y = filter.year;
  const admin = isAdmin();
  return `<div class="toolbar"><select id="fy">${years().map(x => `<option ${y === x ? 'selected' : ''}>${x}</option>`).join('')}</select><span class="hint">${admin ? '입사일을 넣으면 연차가 자동 계산됩니다 (1년 미만: 월 1일씩 최대 11일, 1년 이상: 15일). 개근하지 못한 달은 조정 칸에 -1 씩 넣으세요.' : ''}</span></div>
  <div class="grid">${members.map(m => {
    const info = leaveInfo(m.name), used = usedDays(m.name, info), total = info.total, left = total - used;
    const mine = L().filter(l => l.name === m.name && l.start_date >= info.start && l.start_date <= info.end && l.status !== '취소').sort((a, b) => (b.start_date || '').localeCompare(a.start_date || ''));
    return `<div class="card">
      <h3>${avatar(m.name)}${esc(m.name)}<span class="stat">남은 연차 <b style="color:${left <= 2 ? 'var(--orange)' : 'inherit'}">${left}일</b> / ${total}일</span></h3>
      <div class="row2" style="flex-wrap:wrap">${admin ? `입사일 <input type="date" value="${esc(m.hire_date || '')}" data-hire="${m.id}" style="width:140px;text-align:left">` : `<span class="hint">${info.auto ? '입사 ' + fmtDate(m.hire_date) : ''}</span>`}
        ${admin && !info.auto ? `총 <input type="number" min="0" max="60" step="0.5" value="${info.base}" data-total="${m.id}" title="입사일이 없을 때 쓰는 총 일수">일` : ''}
        ${admin ? `조정 <input type="number" min="-30" max="30" step="0.5" value="${info.adjust}" data-adj="${m.id}" title="개근 못 한 달은 -1, 특별 부여는 +">일` : ''}</div>
      <div class="row2"><span class="hint" style="flex:1">${esc(info.label)} · 기간 ${fmtDate(info.start)} ~ ${fmtDate(info.end)}</span></div>
      <div class="row2">사용 ${used}일 <span class="bar ${left <= 2 ? 'warn' : ''}"><i style="width:${total ? Math.min(100, used / total * 100) : 0}%"></i></span></div>
      ${mine.slice(0, 8).map(l => `<div class="item" data-id="${l.id}"><span class="t">${esc(l.type)} · ${period(l)}</span><span class="days">${l.days}일</span>${stHtml(l.status)}</div>`).join('') || '<div class="item" style="color:var(--fg3);cursor:default">신청 없음</div>'}
      ${mine.length > 8 ? `<div class="more">외 ${mine.length - 8}건 (전체 탭에서 확인)</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function bindView(){
  const v = $('#view');
  bindSort(sort, renderView, { name: 'asc', type: 'asc', status: 'asc' });
  v.querySelectorAll('tr.row, .item[data-id]').forEach(el => el.onclick = e => { if (e.target.closest('button')) return; openLeave(el.dataset.id); });
  v.querySelectorAll('[data-ok]').forEach(b => b.onclick = e => { e.stopPropagation(); approve(b.dataset.ok); });
  v.querySelectorAll('[data-no]').forEach(b => b.onclick = e => { e.stopPropagation(); openReject(b.dataset.no); });
  v.querySelectorAll('[data-cancel]').forEach(b => b.onclick = e => { e.stopPropagation(); cancelLeave(b.dataset.cancel); });
  const fy2 = v.querySelector('#fy'); if (fy2) fy2.onchange = () => { filter.year = fy2.value; renderView(); };
  v.querySelectorAll('[data-total]').forEach(inp => inp.onchange = async () => {
    const m = members.find(x => x.id === inp.dataset.total); if (!m) return;
    await saveRow('members', { ...m, leave_total: Number(inp.value) }); toast(`${m.name}님 연차 총 ${inp.value}일로 저장`);
  });
  v.querySelectorAll('[data-hire]').forEach(inp => inp.onchange = async () => {
    const m = members.find(x => x.id === inp.dataset.hire); if (!m) return;
    await saveRow('members', { ...m, hire_date: inp.value || null }); toast(inp.value ? `${m.name}님 입사일 ${fmtDate(inp.value)} 저장 → 연차 ${totalDays(m.name)}일` : `${m.name}님 입사일을 지웠습니다`);
  });
  v.querySelectorAll('[data-adj]').forEach(inp => inp.onchange = async () => {
    const m = members.find(x => x.id === inp.dataset.adj); if (!m) return;
    await saveRow('members', { ...m, leave_adjust: Number(inp.value) || 0 }); toast(`${m.name}님 조정 ${inp.value}일 저장 → 연차 ${totalDays(m.name)}일`);
  });
  bindCalendar(cal, renderView, day => openLeave(null, { start_date: day, end_date: day }), id => SCH().some(x => x.id === id) ? openSched(id) : openLeave(id));
}

/* ---------- 신청 · 상세 창 ---------- */
function openLeave(id, preset = {}){
  const l = id ? L().find(x => x.id === id) : null;
  if (l && !isAdmin() && l.name !== me) {   // 남의 휴가: 이름·종류·기간만 (사유·처리 기록은 숨김)
    openModal(`${modalHead('휴가')}<div class="mb"><div style="font-size:15px">${who(l.name)} · <b>${esc(l.type)}</b></div><div class="hint" style="margin-top:6px">${period(l)}</div></div><div class="mf"><button class="btn primary" data-close>닫기</button></div>`);
    return;
  }
  const d = l || { name: me, type: '연차', start_date: todayStr(), end_date: todayStr(), reason: '', ...preset };
  const editable = !l || (l.status === '신청' && (l.name === me || isAdmin()));
  const logs = l ? (l.comments || []) : [];
  openModal(`${modalHead(l ? '휴가 신청 내용' : '휴가 신청', l ? stHtml(l.status) : '')}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>신청자</label>${isAdmin() ? `<select id="lName" ${editable ? '' : 'disabled'}>${memberOptions(d.name)}</select>` : `<div style="padding:8px 0">${who(d.name)}</div><input type="hidden" id="lName" value="${esc(d.name)}">`}</div>
        <div class="f"><label>종류</label><select id="lType" ${editable ? '' : 'disabled'}>${Object.keys(TYPES).map(t => `<option ${d.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="f2">
        <div class="f"><label>시작일</label><input type="date" id="lStart" value="${esc(d.start_date || '')}" ${editable ? '' : 'disabled'}></div>
        <div class="f"><label>종료일</label><input type="date" id="lEnd" value="${esc(d.end_date || d.start_date || '')}" ${editable ? '' : 'disabled'}></div>
      </div>
      <div class="hint" id="lDays"></div>
      <div class="f"><label>사유</label><textarea id="lReason" ${editable ? '' : 'disabled'} placeholder="예: 개인 사정, 가족 행사">${esc(d.reason || '')}</textarea></div>
      ${l ? `<div class="comments"><h4>처리 기록</h4>${logs.slice().reverse().map(c => `<div class="cm">${avatar(c.by)}<div class="body"><span class="by">${esc(c.by)}</span>${esc(c.text)}<span class="at">${fmtDateTime(c.at)}</span></div></div>`).join('') || '<div class="hint">아직 기록이 없습니다</div>'}</div>
      <div class="hint">신청: ${fmtDateTime(l.created_at)}${l.decided_at ? ` · 처리: ${esc(l.decided_by || '')} ${fmtDateTime(l.decided_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">
      ${l && isAdmin() ? `<button class="btn danger left" id="lDelete">삭제</button>` : ''}
      ${!l && DATA.schedules ? `<button class="btn left" id="lToSched" title="이 날짜로 내 일정 등록 창을 엽니다" style="background:#16a34a;border-color:#16a34a;color:#fff">🗓 일정 등록으로 바꾸기</button>` : ''}
      ${l && l.status === '신청' && isAdmin() ? `<button class="btn" id="lNo">반려</button><button class="btn primary" id="lOk">승인</button>` : ''}
      ${l && l.status === '신청' && l.name === me && !isAdmin() ? `<button class="btn danger" id="lCancel">신청 취소</button>` : ''}
      <button class="btn" data-close>닫기</button>
      ${editable ? `<button class="btn primary" id="lSave">${l ? '저장' : '신청하기'}</button>` : ''}
    </div>`);
  const upd = () => {
    const t = $('#lType').value; if ((TYPES[t] || [1])[0] < 1) $('#lEnd').value = $('#lStart').value;
    const n = calcDays(t, $('#lStart').value, $('#lEnd').value);
    const left = totalDays($('#lName').value) - usedDays($('#lName').value);
    $('#lDays').innerHTML = `${n}일 (토·일 제외)${(TYPES[t] || [1, false])[1] ? ` · 남은 연차 ${left}일${n > left ? ' <span class="warn">→ 부족합니다</span>' : ''}` : ' · 연차에서 차감되지 않음'}`;
  };
  ['lType', 'lStart', 'lEnd', 'lName'].forEach(i => { const el = $('#' + i); if (el) el.onchange = upd; });
  upd();
  const sb = $('#lSave'); if (sb) sb.onclick = async () => {
    const type = $('#lType').value, s = $('#lStart').value, e = $('#lEnd').value || s;
    if (!s) { toast('시작일을 넣어 주세요', true); return; }
    if (e < s) { toast('종료일이 시작일보다 빠릅니다', true); return; }
    const days = calcDays(type, s, e); if (!days) { toast('평일이 하루도 없습니다 (토·일만 선택)', true); return; }
    const n = { id: l ? l.id : uid(), name: $('#lName').value, type, start_date: s, end_date: e, days, reason: $('#lReason').value.trim() || null,
      status: l ? l.status : '신청', comments: l ? [...(l.comments || []), log('내용 수정')] : [log('신청')], decided_by: l ? l.decided_by : null, decided_at: l ? l.decided_at : null,
      created_by: l ? l.created_by : me, created_at: l ? l.created_at : nowIso() };
    closeModal();
    await saveRow('leaves', n);
    toast(l ? '저장했습니다' : '휴가를 신청했습니다. 관리자 승인을 기다립니다');
  };
  const ts = $('#lToSched'); if (ts) ts.onclick = () => { const st = $('#lStart').value, en = $('#lEnd').value || st; closeModal(); openSched(null, { start_date: st, end_date: en }); };
  const ok = $('#lOk'); if (ok) ok.onclick = () => { closeModal(); approve(l.id); };
  const no = $('#lNo'); if (no) no.onclick = () => { closeModal(); openReject(l.id); };
  const cn = $('#lCancel'); if (cn) cn.onclick = () => { closeModal(); cancelLeave(l.id); };
  const del = $('#lDelete'); if (del) del.onclick = async () => { if (confirm('이 신청을 삭제할까요?')) { closeModal(); await removeRow('leaves', l.id); toast('삭제했습니다'); } };
}

/* ---------- 개인 일정 (달력에서 날짜를 누르면) ----------
   schedules 표: owner(작성자) · title · start_date~end_date · time_text · memo · viewers(볼 사람 이름, ['전체'] = 모두, 비면 나만)
   보이는 사람: 작성자 + viewers 에 든 사람 */
const SCH = () => DATA.schedules || [];
const canSeeSched = x => x.owner === me || (x.viewers || []).includes(me) || (x.viewers || []).includes('전체') || (x.attendees || []).includes(me);   // 참석자는 볼 사람에 없어도 보임
/* 시간은 time_text 한 칸에 "14:00" 또는 "14:00~15:30" 으로 저장 (비면 종일) */
const tParts = t => { const m = String(t || '').match(/^(\d{1,2}:\d{2})(?:\s*~\s*(\d{1,2}:\d{2}))?$/); return m ? [m[1].padStart(5, '0'), (m[2] || '').padStart(m[2] ? 5 : 0, '0')] : ['', '']; };
/* 시간 고르기: 칸을 누르면 왼쪽 시(오전 7시~오후 9시) · 오른쪽 분(00~55, 5분 단위) 두 줄 창. 값은 'HH:MM' 또는 '' */
const tLabel = v => { const [h, m] = v.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2, '0')}`; };
const T_HOURS = Array.from({ length: 15 }, (_, i) => i + 7);          // 7 ~ 21시
const T_MINS = Array.from({ length: 12 }, (_, i) => i * 5);           // 0 ~ 55분
const tNorm = val => val ? (([h, m]) => `${h.padStart(2, '0')}:${String(Math.round(Number(m) / 5) * 5 % 60).padStart(2, '0')}`)(val.split(':')) : '';
const timePick = (id, val, ph) => { const v = tNorm(val);
  return `<span class="twrap"><button type="button" id="${id}" class="tbtn ${v ? '' : 'empty'}" data-v="${v}" data-ph="${esc(ph)}">${v ? tLabel(v) : esc(ph)}</button></span>`; };
const tGet = id => $('#' + id).dataset.v || '';
const tSet = (id, v, fire) => { const b = $('#' + id); b.dataset.v = v || ''; b.textContent = v ? tLabel(v) : b.dataset.ph; b.classList.toggle('empty', !v); if (fire) b.dispatchEvent(new Event('change')); };
function bindTimePick(id){
  const btn = $('#' + id);
  const close = () => { const p = btn.parentNode.querySelector('.tpop'); if (p) p.remove(); document.removeEventListener('mousedown', outside, true); };
  const outside = e => { if (!btn.parentNode.contains(e.target)) close(); };
  const draw = () => {
    const [h, m] = (tGet(id) || ':').split(':');
    const pop = btn.parentNode.querySelector('.tpop');
    pop.innerHTML = `<div class="tcol" data-col="h">${T_HOURS.map(x => `<div data-h="${String(x).padStart(2, '0')}" class="${String(x).padStart(2, '0') === h ? 'on' : ''}">${x < 12 ? '오전' : '오후'} ${x % 12 || 12}시</div>`).join('')}</div>
      <div class="tcol" data-col="m">${T_MINS.map(x => `<div data-m="${String(x).padStart(2, '0')}" class="${String(x).padStart(2, '0') === m ? 'on' : ''}">${String(x).padStart(2, '0')}분</div>`).join('')}</div>`;
    pop.querySelectorAll('[data-h]').forEach(el => el.onclick = () => { const cur = tGet(id); tSet(id, `${el.dataset.h}:${cur ? cur.split(':')[1] : '00'}`, true); draw(); });
    pop.querySelectorAll('[data-m]').forEach(el => el.onclick = () => { const cur = tGet(id); tSet(id, `${cur ? cur.split(':')[0] : '09'}:${el.dataset.m}`, true); close(); });
  };
  btn.onclick = () => {
    if (btn.parentNode.querySelector('.tpop')) { close(); return; }
    document.querySelectorAll('.tpop').forEach(p => p.remove());
    const pop = document.createElement('div'); pop.className = 'tpop'; btn.parentNode.appendChild(pop); draw();
    pop.querySelectorAll('.on').forEach(el => el.scrollIntoView({ block: 'center' }));   // 고른 시·분이 가운데 보이게
    if (!tGet(id)) { const nine = pop.querySelector('[data-h="09"]'); if (nine) nine.scrollIntoView({ block: 'start' }); }
    document.addEventListener('mousedown', outside, true);
  };
  btn.onkeydown = e => { if (e.key === 'Escape' && btn.parentNode.querySelector('.tpop')) { e.stopPropagation(); close(); } };
}
const viewersText = v => !v.length ? '나만' : v.includes('전체') ? '전체' : v.join(', ');
function openSched(id, preset = {}){
  if (!DATA.schedules) { toast('일정 표가 아직 없습니다. 관리자에게 sql-schedules.sql 실행을 부탁하세요', true); return; }
  const x = id ? SCH().find(y => y.id === id) : null;
  if (x && !canSeeSched(x)) return;
  const d = x || { owner: me, title: '', start_date: todayStr(), end_date: todayStr(), time_text: '', memo: '', viewers: [], ...preset };
  const mine = !x || x.owner === me;
  const v = d.viewers || [];
  const people = members.map(m => m.name).filter(n => n !== d.owner);
  if (!mine) {
    openModal(`${modalHead('일정')}
      <div class="mb">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">${esc(d.title)}</div>
        <div class="hint" style="margin-bottom:8px">${who(d.owner)} · ${period({ start_date: d.start_date, end_date: d.end_date })} · ${d.time_text ? esc(d.time_text) : '종일'}</div>
        ${d.memo ? `<div style="white-space:pre-wrap;font-size:13px">${esc(d.memo)}</div>` : ''}
        ${(d.attendees || []).length ? `<div style="margin-top:10px;font-size:13px">👥 참석자: ${d.attendees.map(n => esc(n)).join(', ')}</div>` : ''}
        <div class="hint" style="margin-top:6px">볼 사람: ${esc(viewersText(v))}</div>
      </div>
      <div class="mf"><button class="btn primary" data-close>닫기</button></div>`);
    return;
  }
  openModal(`${modalHead(x ? '내 일정' : '일정 등록')}
    <div class="mb">
      <div class="f"><label>일정 *</label><input id="sTitle" value="${esc(d.title)}" placeholder="예: 거래처 미팅, 병원, 외근" maxlength="100"></div>
      <div class="f2">
        <div class="f"><label>시작일</label><input type="date" id="sStart" value="${esc(d.start_date || '')}"></div>
        <div class="f"><label>종료일</label><input type="date" id="sEnd" value="${esc(d.end_date || d.start_date || '')}"></div>
      </div>
      <div class="f"><label>시간 <span class="hint">(비워 두면 종일)</span></label>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${timePick('sT1', tParts(d.time_text)[0], '시작 시간')}<span>~</span>${timePick('sT2', tParts(d.time_text)[1], '종료 시간')}<button type="button" class="btn sm" id="sTClear">종일</button></div></div>
      <div class="f"><label>메모 <span class="hint">(선택)</span></label><textarea id="sMemo" style="min-height:60px">${esc(d.memo || '')}</textarea></div>
      <div class="f"><label>참석자 <span class="hint">(고른 사람에게는 이 일정이 보입니다)</span></label>
        <div class="viewers">${people.map(n => `<label><input type="checkbox" class="sa" value="${esc(n)}" ${(d.attendees || []).includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>
      <div class="f"><label>볼 사람 <span class="hint">(참석자 말고 더 보여 줄 사람 · 아무도 안 고르면 나와 참석자만)</span></label>
        <div class="viewers"><label class="all"><input type="checkbox" id="sAll" ${v.includes('전체') ? 'checked' : ''}>전체</label>
          ${people.map(n => `<label><input type="checkbox" class="sv" value="${esc(n)}" ${v.includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>
    </div>
    <div class="mf">
      ${x ? '<button class="btn danger left" id="sDel">삭제</button>' : '<button class="btn left" id="sToLeave" title="이 날짜로 휴가 신청 창을 엽니다">휴가 신청으로 바꾸기</button>'}
      <button class="btn" data-close>닫기</button><button class="btn primary" id="sSave">${x ? '저장' : '등록'}</button>
    </div>`);
  $('#sTitle').focus();
  const syncAll = () => { const all = $('#sAll').checked; document.querySelectorAll('.sv').forEach(c => { c.disabled = all; }); };
  $('#sAll').onchange = syncAll; syncAll();
  $('#sStart').onchange = () => { if (!$('#sEnd').value || $('#sEnd').value < $('#sStart').value) $('#sEnd').value = $('#sStart').value; };
  // 시작을 고르면 종료는 한 시간 뒤로
  $('#sT1').onchange = () => { const a = tGet('sT1'), b = tGet('sT2'); if (a && (!b || b <= a)) { const [h, m] = a.split(':').map(Number), t = Math.min(23 * 60 + 55, h * 60 + m + 60); tSet('sT2', String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0')); } };
  $('#sTClear').onclick = () => { tSet('sT1', ''); tSet('sT2', ''); };
  bindTimePick('sT1'); bindTimePick('sT2');
  $('#sTitle').onkeydown = e => { if (e.key === 'Enter') $('#sSave').click(); };
  const tl = $('#sToLeave'); if (tl) tl.onclick = () => { const st = $('#sStart').value, en = $('#sEnd').value || st; closeModal(); openLeave(null, { start_date: st, end_date: en }); };
  $('#sSave').onclick = async () => {
    const title = $('#sTitle').value.trim(), st = $('#sStart').value, en = $('#sEnd').value || st;
    if (!title) { $('#sTitle').focus(); toast('일정 내용을 적어 주세요', true); return; }
    if (!st) { toast('시작일을 넣어 주세요', true); return; }
    if (en < st) { toast('종료일이 시작일보다 빠릅니다', true); return; }
    const t1 = tGet('sT1'), t2 = tGet('sT2');
    if (!t1 && t2) { toast('시작 시각도 골라 주세요', true); return; }
    if (t1 && t2 && st === en && t2 <= t1) { toast('끝 시각이 시작 시각보다 빠릅니다', true); return; }
    const viewers = $('#sAll').checked ? ['전체'] : [...document.querySelectorAll('.sv:checked')].map(c => c.value);
    const attendees = [...document.querySelectorAll('.sa:checked')].map(c => c.value);
    const row = { id: x ? x.id : uid(), owner: d.owner, title, start_date: st, end_date: en, time_text: t1 ? (t2 ? `${t1}~${t2}` : t1) : null, memo: $('#sMemo').value.trim() || null, viewers, attendees,
      created_by: x ? x.created_by : me, created_at: x ? x.created_at : nowIso() };
    closeModal(); await saveRow('schedules', row);
    toast(`${x ? '일정을 저장했습니다' : '일정을 등록했습니다'}${attendees.length ? ` · 참석자 ${attendees.length}명` : ''} · 볼 사람: ${viewersText(viewers)}`);
  };
  const del = $('#sDel'); if (del) del.onclick = async () => { if (confirm(`"${d.title}" 일정을 삭제할까요?`)) { closeModal(); await removeRow('schedules', x.id); toast('삭제했습니다'); } };
}

boot({ icon: '📅', title: '연차/휴가 등록', tables: ['leaves', 'schedules'], render, normalize });
