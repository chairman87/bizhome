<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고 영상 리스트</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202609201351">
<script src="common.js?v=202609201351"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .wrap-wide{max-width:1800px}
  table.ads{min-width:1000px}
  /* 제목 줄(정렬·필터): 연한 노란색 배경, 큰 글자, 높은 칸 */
  table.ads th{text-align:center;background:#fffbea;color:#292524;font-size:14px;font-weight:600;padding:11px 8px;border-bottom:2px solid #e0c25a}
  table.ads th[data-sort]:hover{color:#292524;background:#fef3c7}
  table.ads th .arrow{color:#b45309}
  table.ads td{padding:5px 8px;font-size:13px}
  /* 묶음 제목 줄: 메타(페이지명·운영여부·예산) / 틱톡 / 구글 */
  table.ads th.grp{padding:7px 8px 6px;background:#fff;border-bottom:1px solid #e0c25a}
  table.ads th.grp .brand{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#292524;letter-spacing:.01em}
  table.ads th.grp svg{width:17px;height:17px;display:block}
  table.ads th.gl{border-left:2px solid #e0c25a}
  table.ads tbody td:nth-child(4),table.ads tbody td:nth-child(7),table.ads tbody td:nth-child(8),table.ads.g tbody td:nth-child(10){border-left:2px solid var(--line)}
  td.c{text-align:center;white-space:nowrap}
  td.ttl{font-weight:500;min-width:220px}
  td.note{color:var(--fg2);font-size:12px;max-width:260px;white-space:pre-wrap;word-break:break-word}
  .off{background:#e5e5e5;color:#444;padding:0 8px;border-radius:3px;font-weight:600;font-size:12px}
  .del{background:#fee2e2;color:#b91c1c;padding:0 8px;border-radius:3px;font-weight:600;font-size:12px}
  .run{background:#dcfce7;color:#15803d;padding:0 8px;border-radius:3px;font-size:12px}
  tr.newrow td{background:transparent;padding:4px 6px}
  tr.newrow input,tr.newrow select{width:100%;border:1px solid var(--line2);border-radius:4px;padding:5px 6px;font:inherit;font-size:13px;background:#fff}
  tr.newrow input:focus,tr.newrow select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
  [data-edit]{cursor:text}
  [data-edit]:hover{background:#fffbea;outline:1px dashed #e0c25a}
  .inline{width:100%;font:inherit;font-size:13px;border:2px solid var(--blue);border-radius:4px;padding:2px 6px;background:var(--bg)}
  /* 월별 */
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
  .sum table{min-width:0;width:100%;border:1px solid var(--line)}
  .sum th{text-align:center;color:#fff;font-weight:600}
  .sum td{text-align:center;font-weight:600;font-size:15px}
  .sum .p th{background:#1d4ed8}.sum .p td{background:#dbeafe}
  .sum .e th{background:#991b1b}.sum .e td{background:#fecaca}
  .sum td.l{background:var(--bg2);color:var(--fg2);font-size:12px;font-weight:500}
  .wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .wk .h{background:#222;color:#fff;text-align:center;font-weight:700;padding:6px 0;font-size:12px}
  .wk .d{background:var(--bg);min-height:150px;padding:0 0 6px;cursor:pointer}
  .wk .d:hover{background:var(--bg2)}
  .wk .d.out{background:#fafaf9}
  .wk .d .dn{background:#e5e5e5;font-weight:700;padding:3px 8px;font-size:13px}
  .wk .d.today .dn{color:var(--red)}
  .wk .d.out .dn{color:var(--fg3)}
  .wk .it{padding:2px 8px;font-size:12px;line-height:1.45;cursor:pointer;word-break:break-word}
  .wk .it:hover{background:#fffbea}
  .wk .it b{font-weight:700}
  .p-레{color:#1d4ed8}.p-서{color:#15803d}.p-흑{color:#6d28d9}
  .wk .it.del{background:#fee2e2;color:#b91c1c;text-decoration:line-through}
  .ox{border:1px solid var(--line2);background:#fff;border-radius:6px;width:34px;height:26px;font-weight:700;cursor:pointer;color:var(--fg3)}
  .ox.on{background:#dcfce7;border-color:#86efac;color:#15803d}
  .stf{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px}
  .stf .lb{font-size:12px;color:var(--fg2);margin-right:2px}
  th select[data-hf]{border:1px solid #e0c25a;border-radius:6px;font:inherit;font-size:14px;font-weight:600;padding:5px 8px;background:#fff;color:#292524;cursor:pointer;min-width:120px}
  th select[data-hf]:hover{background:#fffdf3;border-color:#ca8a04}
  th select[data-hf].on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  .stf button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--fg2)}
  .stf button b{font-weight:600;color:var(--fg)}
  .stf button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .stf button.on b{color:#fff}
  /* 메타 자동 반영 안내 줄 */
  .sync{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:13px;color:#1e3a8a}
  .sync .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sync .chip{background:#fff;border:1px solid #bfdbfe;border-radius:999px;padding:1px 9px;font-size:12px}
  .sync .chip b{font-weight:700}
  .sync .chip.warn{border-color:#fca5a5;color:#b91c1c}
  .sync a{color:var(--blue);cursor:pointer;margin-left:auto}
  .sync .det{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .sync .det h4{margin:0 0 3px;font-size:12px;color:#1e3a8a}
  .sync .det div div{font-size:12px;color:var(--fg);line-height:1.5}
  /* 예산 현황 */
  .bsum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .bsum .k{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;min-width:170px}
  .bsum .k .t{font-size:12px;color:var(--fg2)}
  .bsum .k .v{font-size:20px;font-weight:700;margin-top:2px}
  .bsum .k .v small{font-size:12px;font-weight:500;color:var(--fg2);margin-left:4px}
  .bsum .k.big{border-color:#e0c25a;background:#fffbea}
  .bsum .k.big .t,.bsum .k.big .v{color:#292524}
  .bsum .k .t .brand,table.bud th .brand{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
  .bsum .k .t .brand svg,table.bud th .brand svg{width:14px;height:14px;display:block}
  .bsum .k .s{font-size:11px;color:var(--fg2);margin-top:2px}
  table.bud .bar.g{background:#34A853;margin-left:-8px;border-radius:0 5px 5px 0}
  table.bud .bar.m.cut{border-radius:5px 0 0 5px}
  table.bud td.mg{color:var(--fg2)}
  .vlist div .amt{white-space:nowrap;color:var(--fg2)}
  .vlist div .amt b{color:var(--fg)}
  table.bud{min-width:760px}
  table.bud th{background:#fffbea;color:#292524;font-size:13px;font-weight:600;padding:9px 10px;border-bottom:2px solid #e0c25a;text-align:right;white-space:nowrap}
  table.bud th.l,table.bud td.l{text-align:left}
  table.bud td{padding:8px 10px;font-size:14px;text-align:right;white-space:nowrap}
  table.bud tr.ed{cursor:pointer}
  table.bud tr.ed:hover td{background:var(--bg2)}
  table.bud td.rk{text-align:center;font-weight:700;width:44px;color:var(--fg2)}
  table.bud tr.ed:nth-child(-n+3) td.rk{color:#b45309}
  table.bud td.nm{font-weight:700}
  table.bud td.tot{font-weight:700;font-size:15px}
  table.bud .bar{display:inline-block;height:10px;border-radius:5px;background:#0866FF;vertical-align:middle;margin-right:8px;min-width:2px}
  table.bud td.sh{width:34%;text-align:left;color:var(--fg2);font-size:12px}
  table.bud tr.sumrow td{font-weight:700;border-top:2px solid var(--line2);background:var(--bg2)}
  table.bud tr.det td{background:var(--bg2);text-align:left;white-space:normal;padding:6px 10px 12px 54px}
  .vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 18px;font-size:12px}
  .vlist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
  .vlist div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lk{font-size:10px;opacity:.55;margin-left:3px;cursor:help}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   광고 영상 리스트 — 마케팅 팀장이 구글시트로 관리하던 표
   한 줄 = { product(제품), date(게재일), title(영상 타이틀), editor(편집자), meta_account(메타 계정),
            meta_budget(메타 예산: 숫자 또는 OFF), tiktok(틱톡), status(운영중/OFF/삭제·수정필요), note(사유/수정 콘티) }
================================================================ */
const PRODUCTS = ['레모너리', '서리맥스', '흑생마'];
const PCODE = { '레모너리': '레', '서리맥스': '서', '흑생마': '흑' };
const STATUSES = ['운영중', 'OFF', '삭제·수정필요'];
const G = () => DATA.ads || [];
let view = 'month';   // 들어오면 항상 월별 현황부터 (예전에는 마지막에 보던 탭을 기억했음)
const freshFilter = () => ({ q: '', editor: '', meta: '', mstate: '운영중', budget: '', gstate: '', google: '', status: '' });   // 기본: 메타 운영중만
let filter = freshFilter();
let month = todayStr().slice(0, 7);   // 월별 탭에서 보는 달 (YYYY-MM)
let sort = { key: 'date', dir: 'desc' };

const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
const editors = () => uniq(G().map(a => a.editor));
/* 편집자 선택지는 이 5명만 (예전 영상에 다른 이름이 있으면 그 줄에서만 함께 보여 줌) */
const EDITORS = ['상형', '수연', '예솔', '채은', '홍재'];
const editorOpts = cur => `<option value="">편집자</option>` + [...EDITORS, ...(cur && !EDITORS.includes(cur) ? [cur] : [])].map(e => `<option ${cur === e ? 'selected' : ''}>${esc(e)}</option>`).join('');
const metas = () => uniq(G().map(a => a.meta_account));
const budgetKey = v => String(v || '').replace(/,/g, '').trim().toUpperCase();   // 예산 값 비교용 (10,000 = 10000, off = OFF)
const budgets = () => [...new Set(G().map(a => budgetKey(a.meta_budget)).filter(Boolean))].sort((x, y) => (x === 'OFF') - (y === 'OFF') || Number(x) - Number(y));
const fmtBudget = b => { if (b == null || b === '') return ''; const n = Number(String(b).replace(/,/g, '')); return isNaN(n) ? esc(b) : n.toLocaleString('ko-KR'); };
const stHtml = s => s === 'OFF' ? '<span class="off">OFF</span>' : s === '삭제·수정필요' ? '<span class="del">삭제·수정필요</span>' : '<span class="run">운영중</span>';
const MSTATES = ['운영중', 'OFF', '미연결'];
const mstateOf = a => a.meta_state === '운영중' || a.meta_state === 'OFF' ? a.meta_state : '미연결';   // 메타에서 실제로 켜져 있는지 (매일 10시 자동 반영)
const mstateHtml = a => { const m = mstateOf(a); return m === '운영중' ? '<span class="run">운영중</span>' : m === 'OFF' ? '<span class="off">OFF</span>' : '<span style="color:var(--fg3)" title="메타 캠페인과 아직 연결되지 않은 줄입니다. 새로 넣은 줄은 다음 날 오전 10시에 자동으로 연결됩니다.">–</span>'; };
const LOGO = {
  '메타': `<span class="brand" title="메타 (페이스북·인스타그램)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0866FF" d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg>Meta</span>`,
  '틱톡': `<span class="brand" title="틱톡"><svg viewBox="-1.5 -1.5 27 27" aria-hidden="true"><path fill="#25F4EE" transform="translate(-1 -1)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#FE2C55" transform="translate(1 1)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#000" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>TikTok</span>`,
  '구글': `<span class="brand" title="구글애즈"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google</span>`,
};
const NO_GOOGLE = ['레모너리'];   // 구글 광고를 하지 않는 제품: 표에서 구글 열 두 개를 숨김
const hasGoogle = p => !NO_GOOGLE.includes(p);
const GSTATES = ['운영중', 'OFF', '거부됨', '없음'];
const gstateOf = a => ['운영중', 'OFF', '거부됨'].includes(a.google_state) ? a.google_state : '없음';   // 구글애즈에서 실제로 켜져 있는지 (매일 10시 자동 반영, 서리맥스·흑생마)
const gstateHtml = a => { const g = gstateOf(a); return g === '운영중' ? '<span class="run">운영중</span>' : g === 'OFF' ? '<span class="off">OFF</span>' : g === '거부됨' ? '<span class="del" title="구글애즈에서 캠페인은 켜져 있지만 광고가 전부 심사에서 거부되어 노출되지 않고 있습니다">거부됨</span>' : '<span style="color:var(--fg3)" title="구글애즈에 이 영상의 캠페인이 없습니다. 구글에 새로 올리면 다음 날 오전 10시에 자동으로 표시됩니다.">–</span>'; };
const mmdd = d => d ? d.slice(5, 7) + d.slice(8, 10) : '';   // 0915 형식
function normalize(table, a){ if (table !== 'ads') return a; return { ...a, product: PRODUCTS.includes(a.product) ? a.product : PRODUCTS[0], status: STATUSES.includes(a.status) ? a.status : '운영중', google: !!a.google }; }

/* ---------- 화면 ---------- */
function render(){
  const tabs = [...PRODUCTS.map(p => ({ key: p, label: p, badge: 0 })), null, { key: 'month', label: '월별 현황' }, { key: 'budget', label: '예산 현황' }];
  $('#app').innerHTML = headerHtml({ icon: '🎬', title: '광고 영상 리스트', tabs, active: view })
    + `<main class="wrap wrap-wide">${!DATA.ads ? `<div class="empty">광고 리스트 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL 을 실행하세요.' : ''}</div>` : view === 'month' ? monthHtml() : view === 'budget' ? budgetHtml() : productHtml(view)}</main>`;
  bindHeader(k => { view = k; LS.set('ads_view', k); filter = { ...freshFilter(), q: filter.q }; render(); }, null, m => `편집 ${G().filter(a => a.editor === m.name).length}건`);
  bindView();
}

/* 메타 자동 반영 안내: 매일 오전 10시에 ADS-SYNC 프로그램이 메타 캠페인의 예산·켜짐/꺼짐을 읽어 이 표에 맞추고, 바뀐 점을 ads_sync 표에 남김 */
let syncOpen = false;
function syncHtml(p){
  const last = (DATA.ads_sync || []).slice().sort((a, b) => (b.synced_at || '').localeCompare(a.synced_at || ''))[0];
  if (!last) return '';
  const S = last.summary || {}, of = k => (S[k] || []).filter(x => x.product === p), won = v => /^\d+$/.test(v || '') ? Number(v).toLocaleString('ko-KR') : esc(v || '');
  const nw = of('new'), off = of('off'), on = of('on'), bd = of('budget'), gon = of('g_on'), goff = of('g_off'), chk = [...of('lost').map(x => ({ ...x, why: '표에는 운영중인데 메타에서 못 찾음' })), ...of('kept')];
  const who = x => `${esc(x.title)}${x.editor ? ' / ' + esc(x.editor) : ''}`;
  const box = (t, list, f) => list.length ? `<div><h4>${t} ${list.length}</h4>${list.map(x => `<div>${f(x)}</div>`).join('')}</div>` : '';
  const any = nw.length + off.length + on.length + bd.length + gon.length + goff.length + chk.length;
  return `<div class="sync"><div class="top"><b>🔗 메타·구글 자동 반영</b><span>마지막 ${fmtDateTime(last.synced_at)}</span>
      ${any ? '' : '<span>· 바뀐 점 없음</span>'}
      ${nw.length ? `<span class="chip">새 영상 <b>${nw.length}</b></span>` : ''}${off.length ? `<span class="chip">OFF 됨 <b>${off.length}</b></span>` : ''}${on.length ? `<span class="chip">다시 켜짐 <b>${on.length}</b></span>` : ''}${bd.length ? `<span class="chip">예산 변경 <b>${bd.length}</b></span>` : ''}${gon.length ? `<span class="chip">구글 켜짐 <b>${gon.length}</b></span>` : ''}${goff.length ? `<span class="chip">구글 꺼짐 <b>${goff.length}</b></span>` : ''}${chk.length ? `<span class="chip warn">확인 필요 <b>${chk.length}</b></span>` : ''}
      ${any ? `<a id="syncTg">${syncOpen ? '접기 ▴' : '자세히 ▾'}</a>` : ''}</div>
    ${any && syncOpen ? `<div class="det">${box('새 영상', nw, x => `${who(x)} · 예산 ${won(x.budget)}`)}${box('OFF 됨', off, x => who(x) + (x.why ? ` <span style="color:#b91c1c">(${esc(x.why)})</span>` : ''))}${box('다시 켜짐', on, who)}${box('예산 변경', bd, x => `${who(x)}: ${won(x.from)} → <b>${won(x.to)}</b>`)}${box('구글 켜짐', gon, who)}${box('구글 꺼짐', goff, x => who(x) + (x.why ? ` <span style="color:#b91c1c">(${esc(x.why)})</span>` : ''))}${box('확인 필요', chk, x => `${who(x)} <span style="color:#b91c1c">(${esc(x.why || '')})</span>`)}</div>` : ''}</div>`;
}

/* 제품별 표 */
function listOf(p){
  const q = filter.q.trim().toLowerCase();
  return G().filter(a => a.product === p && (!q || [a.title, a.editor, a.meta_account, a.note, a.tiktok].some(v => (v || '').toLowerCase().includes(q)))
    && (!filter.editor || a.editor === filter.editor) && (!filter.meta || a.meta_account === filter.meta) && (!filter.mstate || mstateOf(a) === filter.mstate || (filter.mstate === '운영중' && mstateOf(a) === '미연결' && a.status === '운영중')) && (!filter.budget || budgetKey(a.meta_budget) === filter.budget) && (!filter.gstate || gstateOf(a) === filter.gstate) && (!filter.google || (a.google ? 'O' : 'X') === filter.google) && (!filter.status || a.status === filter.status));
}
function productHtml(p){
  const list = sortBy(listOf(p), sort, { meta_budget: b => { const n = Number(String(b || '').replace(/,/g, '')); return isNaN(n) ? -1 : n; } });
  const cols = [['date', '게재일'], ['title', '영상 타이틀'], ['editor', '편집자'], ['meta_account', '페이지명'], ['meta_state', '운영여부'], ['meta_budget', '예산'], ['tiktok', '틱톡'], ['google_state', '운영여부'], ['google', '구글'], ['note', '사유 / 수정 콘티']].filter(([k]) => hasGoogle(p) || (k !== 'google_state' && k !== 'google'));
  return syncHtml(p) + `<div class="actions"><button class="btn primary" id="addBtn">＋ 영상 추가</button>
      <input type="search" id="fq" placeholder="검색" value="${esc(filter.q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;min-width:180px">
      <span class="count">${(filter.editor || filter.meta || filter.mstate || filter.budget || filter.gstate || filter.google || filter.status) ? `<b>${[filter.editor, filter.meta, filter.mstate && '메타 ' + filter.mstate, filter.gstate && '구글 ' + filter.gstate, filter.google && '구글 ' + filter.google, filter.budget === 'OFF' ? '예산 OFF' : filter.budget && fmtBudget(filter.budget), filter.status].filter(Boolean).map(esc).join(' · ')}</b> ${list.length}건 보는 중 · <a href="#" data-clear style="color:var(--blue)">전체 보기</a>` : `${list.length}건`}</span></div>
    <div class="hint" style="margin-bottom:8px;line-height:1.7">
      <div>1) 제목 줄 바로 아래 <b>입력 줄</b>에 바로 입력하고 <b>Enter</b> 를 누르면 저장됩니다(Tab 으로 칸 이동). 기존 칸은 <b>더블클릭</b>으로 고치고, 줄을 클릭하면 상세 창이 열립니다.</div>
      <div>2) <b>🔗</b> 표시가 있는 줄은 메타 광고 관리자와 연결되어 <b>예산·상태가 매일 오전 10시에 자동으로</b> 맞춰지고, 메타에 새로 만든 캠페인도 자동으로 들어옵니다.</div>
    </div>
    <div class="tablewrap"><table class="ads ${hasGoogle(p) ? 'g' : ''}"><thead>${(() => {
      const GROUP = { meta_account: '메타', meta_state: '메타', meta_budget: '메타', tiktok: '틱톡', google_state: '구글', google: '구글' }, GCLS = { '메타': 'g-meta', '틱톡': 'g-tt', '구글': 'g-gg' };
      const th = ([k, l], attr = '', cls = '') => {
        const HF = { editor: ['editor', EDITORS], meta_account: ['meta', metas()], meta_state: ['mstate', MSTATES], google_state: ['gstate', GSTATES], meta_budget: ['budget', budgets()], google: ['google', ['O', 'X']] }[k];   // 열 머리 필터: [filter 키, 선택지]
        if (!HF) return `<th data-sort="${k}" class="${cls}" ${attr}>${l}${sortArrow(sort, k)}</th>`;
        const [fk, opts] = HF, cur = filter[fk], name = GROUP[k] === '구글' && k === 'google_state' ? '구글 운영여부' : l;
        return `<th class="c ${cls}" ${attr}><select data-hf="${fk}" title="${name}(으)로 걸러 보기" class="${cur ? 'on' : ''}"><option value="">${l}</option>${opts.map(o => `<option value="${esc(o)}" ${cur === o ? 'selected' : ''}>${fk === 'budget' && o !== 'OFF' ? fmtBudget(o) : esc(o)}</option>`).join('')}</select></th>`;
      };
      const first = (c, i) => i === 0 || GROUP[cols[i - 1][0]] !== GROUP[c[0]];   // 묶음의 첫 열인지
      const top = cols.map((c, i) => !GROUP[c[0]] ? th(c, 'rowspan="2"', i && GROUP[cols[i - 1][0]] ? 'gl' : '') : first(c, i) ? `<th class="grp gl ${GCLS[GROUP[c[0]]]}" colspan="${cols.filter(x => GROUP[x[0]] === GROUP[c[0]]).length}">${LOGO[GROUP[c[0]]]}</th>` : '').join('');
      const sub = cols.map((c, i) => GROUP[c[0]] ? th(c, '', first(c, i) ? 'gl' : '') : '').join('');
      return `<tr>${top}</tr><tr>${sub}</tr>`;
    })()}</thead><tbody>
    <tr class="newrow">
      <td class="c"><input type="date" id="nDate" value="${esc(lastNew.date)}"></td>
      <td><input id="nTitle" placeholder="영상 타이틀 입력 후 Enter" maxlength="200"></td>
      <td class="c"><select id="nEditor" style="width:80px">${editorOpts(lastNew.editor)}</select></td>
      <td class="c"><input id="nMeta" list="metaList2" value="${esc(lastNew.meta)}" placeholder="페이지명" style="width:100px"><datalist id="metaList2">${metas().map(e => `<option value="${esc(e)}">`).join('')}</datalist></td>
      <td class="c hint" title="메타 광고 관리자에서 자동으로 읽어 옵니다">자동</td>
      <td class="c"><input id="nBudget" placeholder="예산/OFF" style="width:80px"></td>
      <td class="c"><input id="nTiktok" placeholder="틱톡" style="width:70px"></td>
      ${hasGoogle(p) ? `<td class="c hint" title="구글애즈에서 자동으로 읽어 옵니다">자동</td>
      <td class="c"><select id="nGoogle" title="구글 광고 여부"><option value="0">X</option><option value="1">O</option></select></td>` : ''}
      <td><div style="display:flex;gap:4px"><input id="nNote" placeholder="사유 / 수정 콘티" style="flex:1"><button class="btn sm primary" id="nAdd" title="저장 (Enter)">추가</button></div></td>
    </tr>
    ${list.length ? '' : `<tr><td colspan="${cols.length}" class="hint" style="text-align:center;padding:16px">${filter.q || filter.editor || filter.meta || filter.mstate || filter.budget || filter.gstate || filter.google || filter.status ? '조건에 맞는 영상이 없습니다.' : `${p} 영상이 아직 없습니다. 위 입력 줄에 입력해 보세요.`}</td></tr>`}
    ${list.map(a => `<tr class="row" data-id="${a.id}">
      <td class="c" data-edit="date" data-id="${a.id}" title="${esc(a.date || '')}">${mmdd(a.date)}</td>
      <td class="ttl" data-edit="title" data-id="${a.id}">${esc(a.title)}</td>
      <td class="c" data-edit="editor" data-id="${a.id}">${esc(a.editor || '')}</td>
      <td class="c" data-edit="meta_account" data-id="${a.id}">${esc(a.meta_account || '')}</td>
      <td class="c" title="메타 광고 관리자에서 실제로 켜져 있는지 (매일 오전 10시 자동 반영)">${mstateHtml(a)}</td>
      <td class="c" data-edit="meta_budget" data-id="${a.id}">${String(a.meta_budget || '').toUpperCase() === 'OFF' ? '<span class="off">OFF</span>' : fmtBudget(a.meta_budget)}${a.meta_campaign_id ? `<span class="lk" title="메타 광고 관리자와 연결됨 · 예산과 상태는 매일 오전 10시에 자동으로 맞춰집니다${a.meta_synced_at ? ' (마지막 반영 ' + fmtDateTime(a.meta_synced_at) + ')' : ''}">🔗</span>` : ''}</td>
      <td class="c" data-edit="tiktok" data-id="${a.id}">${esc(a.tiktok || '')}</td>
      ${hasGoogle(p) ? `<td class="c" title="구글애즈에서 실제로 켜져 있는지 (매일 오전 10시 자동 반영)">${gstateHtml(a)}</td>
      <td class="c"><button type="button" class="ox ${a.google ? 'on' : ''}" data-google="${a.id}" title="누르면 O/X 가 바뀝니다">${a.google ? 'O' : 'X'}</button></td>` : ''}
      <td class="note" data-edit="note" data-id="${a.id}">${esc(a.note || '')}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
/* 맨 위 입력 줄에서 바로 추가 (Enter). 게재일·편집자·메타는 다음 줄에도 남겨 연달아 넣기 편하게 */
let lastNew = { date: todayStr(), editor: '', meta: '' };
async function addFromRow(){
  const title = $('#nTitle').value.trim(); if (!title) { $('#nTitle').focus(); toast('영상 타이틀을 입력하세요', true); return; }
  lastNew = { date: $('#nDate').value || todayStr(), editor: $('#nEditor').value.trim(), meta: $('#nMeta').value.trim() };
  const row = { id: uid(), product: view, date: lastNew.date, title, editor: lastNew.editor || null, meta_account: lastNew.meta || null,
    meta_budget: $('#nBudget').value.trim().replace(/,/g, '') || null, tiktok: $('#nTiktok').value.trim() || null, google: !!$('#nGoogle') && $('#nGoogle').value === '1', status: '운영중', note: $('#nNote').value.trim() || null,
    created_by: me, created_at: nowIso(), updated_by: me };
  await saveRow('ads', row);
  toast(`추가: ${title}`);
  const t = $('#nTitle'); if (t) t.focus();
}

/* 예산 현황: 메타에서 실제 운영중인 영상의 일예산을 편집자별로 합계 → 큰 순서 (예산·운영 여부는 매일 오전 10시에 메타에서 자동 반영된 값) */
let budOpen = '';   // 펼쳐 본 편집자
function budgetHtml(){
  const won = v => Math.round(v).toLocaleString('ko-KR'), num = v => /^\d+$/.test(budgetKey(v)) ? Number(budgetKey(v)) : 0, dash = '<span style="color:var(--fg3)">–</span>';
  // m = 메타 일예산(메타 운영중일 때만), g = 구글 일예산(구글 운영중일 때만, 부가세 별도)
  const live = G().map(a => ({ ...a, m: a.meta_state === '운영중' ? num(a.meta_budget) : 0, g: a.google_state === '운영중' ? num(a.google_budget) : 0 })).filter(a => a.m + a.g > 0);
  if (!live.length) return `<div class="empty">메타·구글에서 운영중인 영상이 없습니다.</div>`;
  const sum = (list, k) => list.reduce((t, a) => t + (k ? a[k] : a.m + a.g), 0);
  const M = sum(live, 'm'), Gg = sum(live, 'g'), T = M + Gg;
  const byEd = {};
  live.forEach(a => { const e = a.editor || '편집자 미지정'; (byEd[e] = byEd[e] || []).push(a); });
  const rank = Object.entries(byEd).map(([e, list]) => ({ e, list: list.sort((x, y) => (y.m + y.g) - (x.m + x.g)), m: sum(list, 'm'), g: sum(list, 'g') })).sort((x, y) => (y.m + y.g) - (x.m + x.g));
  const max = rank[0].m + rank[0].g;
  const last = (DATA.ads_sync || []).slice().sort((a, b) => (b.synced_at || '').localeCompare(a.synced_at || ''))[0];
  const bars = r => `<span class="bar m ${r.g ? 'cut' : ''}" style="width:${Math.max(1, Math.round(r.m / max * 70))}%" title="메타 ${won(r.m)}"></span>${r.g ? `<span class="bar g" style="width:${Math.max(1, Math.round(r.g / max * 70))}%" title="구글 ${won(r.g)}"></span>` : ''}`;
  return `<div class="bsum">
      <div class="k"><div class="t">${LOGO['메타']} 운영중 일예산</div><div class="v">${won(M)}<small>원/일</small></div><div class="s">영상 ${live.filter(a => a.m).length}개</div></div>
      <div class="k"><div class="t">${LOGO['구글']} 운영중 일예산</div><div class="v">${won(Gg)}<small>원/일</small></div><div class="s">영상 ${live.filter(a => a.g).length}개 · 부가세 별도</div></div>
      <div class="k big"><div class="t">메타 + 구글 합계</div><div class="v">${won(T)}<small>원/일</small></div><div class="s">영상 ${live.length}개</div></div>
      ${PRODUCTS.map(p => { const l = live.filter(a => a.product === p); return `<div class="k"><div class="t">${p}</div><div class="v" style="font-size:16px">${won(sum(l))}</div><div class="s">메타 ${won(sum(l, 'm'))}${sum(l, 'g') ? ` · 구글 ${won(sum(l, 'g'))}` : ''}</div></div>`; }).join('')}
    </div>
    <div class="hint" style="margin-bottom:8px">메타·구글 광고 관리자에서 <b>지금 켜져 있는 영상</b>의 <b>하루 예산</b>을 편집자별로 더해 합계가 큰 순서로 보여 줍니다${last ? ` (자동 반영 ${fmtDateTime(last.synced_at)} 기준)` : ''}. 구글 예산은 부가세 별도 금액입니다. 편집자 줄을 누르면 그 사람의 운영중 영상이 펼쳐집니다.</div>
    <div class="tablewrap"><table class="bud"><thead><tr><th>순위</th><th class="l">편집자</th><th>영상 수</th><th>${LOGO['메타']} 예산</th><th>${LOGO['구글']} 예산</th><th>합계</th><th class="l">비중 <span style="font-weight:400;font-size:11px;color:#57534e">(파랑 메타 · 초록 구글)</span></th></tr></thead><tbody>
    ${rank.map((r, i) => `<tr class="ed" data-ed="${esc(r.e)}"><td class="rk">${i + 1}</td><td class="l nm">${esc(r.e)} <span style="font-weight:400;color:var(--fg3);font-size:11px">${budOpen === r.e ? '▴' : '▾'}</span></td><td>${r.list.length}</td>
        <td class="mg">${r.m ? won(r.m) : dash}</td><td class="mg">${r.g ? won(r.g) : dash}</td><td class="tot">${won(r.m + r.g)}</td>
        <td class="sh">${bars(r)}${((r.m + r.g) / T * 100).toFixed(1)}%</td></tr>
      ${budOpen === r.e ? `<tr class="det"><td colspan="7"><div class="vlist">${r.list.map(a => `<div data-open="${a.id}" style="cursor:pointer" title="${esc(a.title)}"><span><b class="p-${PCODE[a.product]}">(${PCODE[a.product]})</b> ${mmdd(a.date)} ${esc(a.title)}</span><span class="amt">${a.g ? `메타 ${a.m ? won(a.m) : '–'} · 구글 ${won(a.g)} = ` : ''}<b>${won(a.m + a.g)}</b></span></div>`).join('')}</div></td></tr>` : ''}`).join('')}
    <tr class="sumrow"><td></td><td class="l">합계</td><td>${live.length}</td><td>${won(M)}</td><td>${won(Gg)}</td><td class="tot">${won(T)}</td><td class="sh">메타 ${(M / T * 100).toFixed(1)}% · 구글 ${(Gg / T * 100).toFixed(1)}%</td></tr>
    </tbody></table></div>`;
}

/* 월별 현황: 제품별·제작자별 개수 + 월~금 달력 */
function monthHtml(){
  const [y, m] = month.split('-').map(Number);
  const inMonth = G().filter(a => (a.date || '').startsWith(month));
  const byP = PRODUCTS.map(p => [p, inMonth.filter(a => a.product === p).length]);
  const eds = uniq(inMonth.map(a => a.editor));
  const byE = eds.map(e => [e, inMonth.filter(a => a.editor === e).length]);
  // 월~금만 있는 달력 (첫 주 월요일부터)
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  let cells = '';
  for (let d = new Date(start); d <= last; d.setDate(d.getDate() + 7)) {
    for (let i = 0; i < 5; i++) {
      const day = new Date(d); day.setDate(d.getDate() + i);
      const key = ymd(day), out = day.getMonth() !== m - 1;
      const items = inMonth.filter(a => a.date === key).sort((a, b) => PRODUCTS.indexOf(a.product) - PRODUCTS.indexOf(b.product));
      cells += `<div class="d ${out ? 'out' : ''} ${key === todayStr() ? 'today' : ''}" data-day="${key}"><div class="dn">${out ? '' : `${m}/${day.getDate()}`}</div>
        ${items.map(a => `<div class="it ${a.status === '삭제·수정필요' ? 'del' : ''}" data-open="${a.id}" title="${esc(a.title)} · ${esc(a.editor || '')} · ${a.status}"><b class="p-${PCODE[a.product]}">(${PCODE[a.product]})</b>${esc(a.title)}${a.editor ? '_' + esc(a.editor) : ''}</div>`).join('')}</div>`;
    }
  }
  return `<div class="actions"><button class="btn sm" id="mPrev">‹</button><h2 style="margin:0;font-size:18px">${y}년 ${m}월</h2><button class="btn sm" id="mNext">›</button><button class="btn sm" id="mToday">이번 달</button>
      <span class="hint">날짜를 누르면 그 날짜로 영상을 추가합니다 · 월을 넘기면 다음 달 표가 자동으로 생깁니다</span></div>
    <div class="sum">
      <table class="p"><tr><th>제품</th>${byP.map(([p]) => `<th>${esc(p)}</th>`).join('')}<th>총 컨텐츠 수</th></tr><tr><td class="l">당월<br>컨텐츠 개수</td>${byP.map(([, n]) => `<td>${n}</td>`).join('')}<td>${inMonth.length}</td></tr></table>
      <table class="e"><tr><th>제작자</th>${byE.map(([e]) => `<th>${esc(e)}</th>`).join('')}<th>총 컨텐츠 수</th></tr><tr><td class="l">당월<br>컨텐츠 개수</td>${byE.map(([, n]) => `<td>${n}</td>`).join('')}<td>${inMonth.length}</td></tr></table>
    </div>
    <div class="wk">${['MON', 'TUE', 'WED', 'THU', 'FRI'].map(h => `<div class="h">${h}</div>`).join('')}${cells}</div>`;
}

function bindView(){
  const tg = $('#syncTg'); if (tg) tg.onclick = () => { syncOpen = !syncOpen; render(); };
  const ab = $('#addBtn'); if (ab) ab.onclick = () => openAd(null, { product: view });
  const na = $('#nAdd'); if (na) {
    na.onclick = addFromRow;
    document.querySelectorAll('.newrow input, .newrow select').forEach(i => { i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addFromRow(); } }; i.onclick = e => e.stopPropagation(); });
  }
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; render(); $('#fq').focus(); $('#fq').setSelectionRange(filter.q.length, filter.q.length); };
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = e => { e.preventDefault(); filter.status = (b.tagName === 'BUTTON' && b.dataset.fs === filter.status) ? '' : b.dataset.fs; render(); });   // 상태 버튼: 누르면 걸리고 다시 누르면 풀림
  document.querySelectorAll('select[data-hf]').forEach(h => { h.onclick = e => e.stopPropagation(); h.onchange = () => { filter[h.dataset.hf] = h.value; render(); }; });   // 열 머리 필터
  const cl = $('[data-clear]'); if (cl) cl.onclick = e => { e.preventDefault(); filter.editor = filter.meta = filter.mstate = filter.budget = filter.gstate = filter.google = filter.status = ''; render(); };
  bindSort(sort, render, { title: 'asc', editor: 'asc', meta_account: 'asc' });
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = e => { if (e.target.closest('select, input, textarea')) return; openAd(tr.dataset.id); });
  document.querySelectorAll('[data-google]').forEach(b => b.onclick = async e => { e.stopPropagation(); const a = G().find(x => x.id === b.dataset.google); await saveRow('ads', { ...a, google: !a.google, updated_by: me }); });   // 구글 O/X 토글
  document.querySelectorAll('select[data-status]').forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = async () => { const a = G().find(x => x.id === s.dataset.status); await saveRow('ads', { ...a, status: s.value, updated_by: me }); }; });
  document.querySelectorAll('[data-edit]').forEach(el => el.ondblclick = e => { e.stopPropagation(); inlineEdit(el); });
  document.querySelectorAll('table.bud tr.ed').forEach(tr => tr.onclick = () => { budOpen = budOpen === tr.dataset.ed ? '' : tr.dataset.ed; render(); });
  document.querySelectorAll('table.bud [data-open]').forEach(d => d.onclick = e => { e.stopPropagation(); openAd(d.dataset.open); });
  const mp = $('#mPrev'); if (mp) {
    const shift = n => { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); month = ymd(d).slice(0, 7); render(); };
    mp.onclick = () => shift(-1); $('#mNext').onclick = () => shift(1); $('#mToday').onclick = () => { month = todayStr().slice(0, 7); render(); };
    document.querySelectorAll('.wk .d').forEach(d => d.onclick = e => { const it = e.target.closest('[data-open]'); if (it) openAd(it.dataset.open); else if (d.dataset.day) openAd(null, { date: d.dataset.day }); });
  }
}
/* 칸 더블클릭 수정 */
function inlineEdit(el){
  const a = G().find(x => x.id === el.dataset.id); if (!a || el.querySelector('input,textarea')) return;
  const k = el.dataset.edit, old = a[k] || '';
  const box = document.createElement(k === 'note' || k === 'title' ? 'textarea' : 'input');
  if (k === 'date') { box.type = 'date'; } box.className = 'inline'; box.value = old;
  if (box.tagName === 'TEXTAREA') box.rows = 2;
  el.innerHTML = ''; el.appendChild(box); box.focus(); if (box.type !== 'date') box.select();
  let done = false;
  const finish = async save => { if (done) return; done = true; const v = box.value.trim(); if (!save || v === String(old).trim()) { render(); return; } await saveRow('ads', { ...a, [k]: k === 'meta_budget' ? v.replace(/,/g, '') : v || null, updated_by: me }); };
  box.onblur = () => finish(true);
  box.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); finish(false); } else if (e.key === 'Enter' && (box.tagName !== 'TEXTAREA' || e.ctrlKey)) { e.preventDefault(); finish(true); } };
}

/* ---------- 추가·수정 창 ---------- */
function openAd(id, preset = {}){
  const a = id ? G().find(x => x.id === id) : null;
  const d = a || { product: PRODUCTS.includes(view) ? view : PRODUCTS[0], date: todayStr(), title: '', editor: '', meta_account: '', meta_budget: '', tiktok: '', google: false, status: '운영중', note: '', ...preset };
  openModal(`${modalHead(a ? '영상 정보' : '영상 추가')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>제품</label><select id="aProduct">${PRODUCTS.map(p => `<option ${d.product === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div class="f"><label>게재일</label><input type="date" id="aDate" value="${esc(d.date || '')}"></div>
        <div class="f"><label>상태</label><select id="aStatus">${STATUSES.map(s => `<option ${d.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="f"><label>영상 타이틀 *</label><input id="aTitle" value="${esc(d.title)}" placeholder="예: 유산균 들어간 고체레몬즙(심포니)" maxlength="200"></div>
      <div class="f3">
        <div class="f"><label>편집자</label><select id="aEditor">${editorOpts(d.editor || '')}</select></div>
        <div class="f"><label>페이지명 (메타 계정)</label><input id="aMeta" value="${esc(d.meta_account || '')}" list="metaList" placeholder="예: Diet Beauty"><datalist id="metaList">${metas().map(e => `<option value="${esc(e)}">`).join('')}</datalist></div>
        <div class="f"><label>예산 (숫자 또는 OFF)</label><input id="aBudget" value="${esc(d.meta_budget || '')}" placeholder="예: 10000 또는 OFF"></div>
      </div>
      <div class="f"><label>틱톡</label><input id="aTiktok" value="${esc(d.tiktok || '')}" placeholder="예: 리타겟2, 1, 3"></div>
      <div class="f" ${hasGoogle(d.product) ? '' : 'style="display:none"'}><label>구글</label><select id="aGoogle"><option value="0" ${!d.google ? 'selected' : ''}>X</option><option value="1" ${d.google ? 'selected' : ''}>O</option></select></div>
      <div class="f"><label>질병 예방/치료 오인 사유 · 수정 콘티</label><textarea id="aNote">${esc(d.note || '')}</textarea></div>
      ${a ? `<div class="hint">등록: ${esc(a.created_by || '')} ${fmtDateTime(a.created_at)}${a.updated_by ? ` · 마지막 수정: ${esc(a.updated_by)} ${fmtDateTime(a.updated_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">
      ${a ? `<button class="btn danger left" id="aDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="aSave">${a ? '저장' : '추가'}</button>
    </div>`, { wide: true });
  $('#aTitle').focus();
  $('#aSave').onclick = async () => {
    const title = $('#aTitle').value.trim(); if (!title) { $('#aTitle').focus(); toast('영상 타이틀을 입력하세요', true); return; }
    const row = { id: a ? a.id : uid(), product: $('#aProduct').value, date: $('#aDate').value || null, title, editor: $('#aEditor').value.trim() || null, meta_account: $('#aMeta').value.trim() || null,
      meta_budget: $('#aBudget').value.trim().replace(/,/g, '') || null, tiktok: $('#aTiktok').value.trim() || null, google: $('#aGoogle').value === '1', status: $('#aStatus').value, note: $('#aNote').value.trim() || null,
      created_by: a ? a.created_by : me, created_at: a ? a.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('ads', row); toast(a ? '저장했습니다' : '영상을 추가했습니다');
  };
  const del = $('#aDel'); if (del) del.onclick = async () => { if (confirm(`"${a.title}" 을(를) 목록에서 삭제할까요?`)) { closeModal(); await removeRow('ads', a.id); toast('삭제했습니다'); } };
}

boot({ icon: '🎬', title: '광고 영상 리스트', tables: ['ads', 'ads_sync'], render, normalize });
</script>
