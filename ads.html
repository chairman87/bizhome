<script>
/* ================================================================
   광고 영상 리스트 — 마케팅 팀장이 구글시트로 관리하던 표
   한 줄 = { product(제품), date(게재일), title(영상 타이틀), editor(편집자), meta_account(메타 계정),
            meta_budget(메타 예산: 숫자 또는 OFF), tiktok(틱톡), status(운영중/OFF/삭제·수정필요), note(콘티 메모), files(콘티 파일),
            meta_spend·google_spend·tiktok_spend(매체별 월 집행금액), perf(매체별 하루·달 성과: 광고비·구매·구매금액), nas(나스 최종본 파일 이름 — 영상 정보 창에 글자로만 표시) }
   성과·나스 칸은 2026-11-09 추가. lemon803 의 MKT-PERF 가 매시간 40분쯤 기록. 월요일 마케팅 회의용 "영상 리뷰" 탭이 이걸로 영상별 CPA·ROAS 를 보여 줌
================================================================ */
const PRODUCTS = ['레모너리', '서리맥스', '흑생마'];
const PCODE = { '레모너리': '레', '서리맥스': '서', '흑생마': '흑' };
const STATUSES = ['운영중', 'OFF', '삭제·수정필요'];
const G = () => DATA.ads || [];
/* 수정본 (2026-10-30): 이미 있는 영상을 조금 고쳐 다시 올린 것. 타이틀에 "수정"이 붙음 — "40살 넘어가면 수정", "(1호 수정)", "후킹수정", "_디자인 수정"
   제작 영상 수에는 세지 않고, 새 줄로도 넣지 않음 (메타의 수정 캠페인은 매일 10시 자동 반영이 원본 줄에 붙여 운영여부·예산을 원본 줄에 적음) */
const isRevTitle = t => /\([^)]*수정[^)]*\)/.test(t || '') || /수정\s*\d{0,4}\s*$/.test(String(t || '').trim());
/* 개수에서 빼는 것은 "원본 줄이 목록에 따로 있는 수정본"만 (= 같은 영상이 두 번 세지는 경우).
   예전 시트에서 옮겨 온 "(1호 수정)" 줄은 대부분 원본 줄이 없어 그 줄이 그 영상의 유일한 기록이므로 그대로 셈 */
let revCache = { src: null, map: new Map() };
const isRev = a => { if (!isRevTitle(a.title)) return false; if (revCache.src !== DATA.ads) revCache = { src: DATA.ads, map: new Map() };
  if (!revCache.map.has(a.id)) revCache.map.set(a.id, !!findOriginal(a.product, a.title, a.editor, a.date)); return revCache.map.get(a.id); };
const revBase = t => String(t || '').replace(/\([^)]*수정[^)]*\)/g, '').replace(/[\s_]*\S*수정\s*\d{0,4}\s*$/, '').trim();
const normT = t => String(t || '').replace(/\(.*?\)/g, '').replace(/[\s_\-.,!?~·:/'"“”‘’]+/g, '').toLowerCase();
/* 수정본 타이틀의 원본 줄: 같은 제품, 수정본이 아닌 줄 중 타이틀이 같거나 한쪽이 다른 쪽을 포함. 편집자가 다르면 제외, 게재일이 가까운 것 우선 */
function findOriginal(product, title, editor, date){
  const b = normT(revBase(title)); if (b.length < 2) return null;
  const c = G().filter(a => a.product === product && !isRevTitle(a.title) && !(editor && a.editor && a.editor !== editor)).filter(a => { const t = normT(a.title); return t && (t === b || (b.length >= 4 && (t.includes(b) || b.includes(t)))); });
  const gap = a => Math.abs(new Date(a.date || '2000-01-01') - new Date(date || todayStr()));
  return c.sort((x, y) => (normT(y.title) === b) - (normT(x.title) === b) || gap(x) - gap(y))[0] || null;
}
/* 새 줄을 넣기 전 확인: 수정본이면 넣지 않고 원본 줄을 알려 줌. 원본을 못 찾으면 물어보고 넣음. true = 넣어도 됨 */
function revGuard(product, title, editor, date){
  if (!isRevTitle(title)) return true;
  const o = findOriginal(product, title, editor, date);
  if (o) { toast(`수정본은 새 줄로 넣지 않습니다. 원본 "${o.title}" 줄로 셉니다 (메타 운영여부·예산은 내일 10시 자동 반영 때 원본 줄에 붙음)`); return false; }
  return confirm(`"${title}" 은(는) 수정본처럼 보이는데 원본 영상을 목록에서 찾지 못했습니다.
새 영상으로 추가할까요? (수정본 줄은 제작 영상 수에 세지 않습니다)`);
}
const isPt = a => String(a.title || '').replace(/\s/g, '').includes('파트너스');   // 파트너스 광고 = 영상 타이틀에 "파트너스"가 들어감 (월별 현황·예산 현황 공통)
let view = 'month';   // 들어오면 항상 월별 현황부터 (예전에는 마지막에 보던 탭을 기억했음)
const freshFilter = () => ({ q: '', editor: '', meta: '', mstate: '운영중', budget: '', tstate: '', gstate: '', google: '', status: '' });   // 기본: 메타 운영중만
let filter = freshFilter();
let month = todayStr().slice(0, 7);   // 월별 탭에서 보는 달 (YYYY-MM)
let monthQ = '';   // 월별 현황 검색어 (걸린 영상만 달력에서 노랗게 표시)
/* 공휴일 (달력 날짜를 빨갛게). 토·일에 걸린 공휴일은 달력에 안 나오므로 대체공휴일만 적음. 해마다 연말에 다음 해 것을 추가할 것. */
const HOLIDAYS = {

   줄을 누르면 영상 정보 창 */
let rvBrand = '', rvRange = '4', rvQ = '';   // 브랜드 필터 · 게재 범위(주 수, 'spend' = 기간 내 광고비 있는 전부) · 검색어
function reviewHtml(){
  if (!hasPerf()) return `<div class="empty">성과 칸이 아직 없습니다.${isAdmin() ? ' TEAM-TASKS\\sql-ads-perf.sql 을 Supabase SQL Editor 에서 한 번 실행하세요.' : ' 관리자가 저장소 설정을 마치면 보입니다.'}</div>`;
  const q = rvQ.trim().toLowerCase(), since = rvRange === 'spend' ? null : addDays(todayStr(), -Number(rvRange) * 7 + 1);
  const all = G().map(a => ({ ...a, _pf: perfOf(a) })).filter(a => (!rvBrand || a.product === rvBrand) && (!q || [a.title, a.editor].some(v => (v || '').toLowerCase().includes(q)))
    && (since ? (a.date || '') >= since : a._pf.spend > 0));
  const chs = PERF_CH.filter(([k]) => all.some(a => perfOf(a, k).spend > 0));   // 이 기간에 집행이 있는 매체만 열을 보임
  const groups = PRODUCTS.filter(p => !rvBrand || p === rvBrand).map(p => [p, all.filter(a => a.product === p).sort((x, y) => (y.date || '').localeCompare(x.date || '') || y._pf.spend - x._pf.spend)]).filter(([, l]) => l.length);
  const ncol = 2 + chs.length * 4 + 3, at = perfAt();
  const totCells = s => `<td class="perf tl">${spendHtml(s)}</td><td class="perf">${cpaHtml(s)}</td><td class="perf">${roasHtml(s)}</td>`;
  const sel = (id, opts, cur, title) => `<select id="${id}" title="${title}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;font:inherit;font-weight:600">${opts.map(([k, l]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  /* 켜짐/꺼짐 표시 (2026-11-09 사장님 질문 뒤 고침): 표의 "상태" 칸은 메타 기준이라 쓰지 않고, 매체별 운영여부로 판단.
     세 매체가 다 꺼져 있으면 "전체 OFF", 일부만 꺼졌으면 이 기간에 광고비를 썼던 매체 중 지금 꺼진 것만 "메타 OFF" 처럼 이름을 붙임. 삭제·수정필요는 그대로 */
  /* 켜짐/꺼짐 (2026-11-09): 표의 "상태" 칸은 메타 기준이라 쓰지 않고 매체별 운영여부로 봄. 꺼진 매체는 그 매체 칸을 회색 음영으로(offOf), 세 매체 다 꺼졌으면 줄을 흐리게 + "전체 OFF" */
  const ST = { meta: a => mstateOf(a), tiktok: a => tstateOf(a), google: a => gstateOf(a) };
  const offOf = (a, k) => { const st = ST[k](a); return st !== '운영중' && (st === 'OFF' || st === '거부됨' || perfOf(a, k).spend > 0); };   // 한 번도 안 올린 매체(없음·광고비 0)는 음영 없이 '–'
  const allOff = a => PERF_CH.every(([k]) => ST[k](a) !== '운영중');
  const badge = a => a.status === '삭제·수정필요' ? ' ' + stHtml(a.status) : allOff(a) ? ' <span class="off" title="메타·틱톡·구글 모두 꺼져 있음 (매일 10시 자동 반영 기준)">전체 OFF</span>' : '';
  return `<div class="actions">${perfSel()}
      ${sel('rvBrand', [['', '전체 브랜드'], ...PRODUCTS.map(p => [p, p])], rvBrand, '브랜드')}
      ${sel('rvRange', [['2', '최근 2주 게재'], ['4', '최근 4주 게재'], ['8', '최근 8주 게재'], ['spend', '기간 내 광고비 있는 전부']], rvRange, '어느 영상을 보일지: 게재일 기준')}
      <input type="search" id="rvQ" placeholder="검색 (타이틀·편집자)" value="${esc(rvQ)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;min-width:180px">
      <span class="hint">${esc(perfLabel())} (${perfRangeTxt()}) · 영상 ${all.length}개 · 매체가 보고한 광고비(부가세 전)·구매 기준, 매시간 자동 반영${perfToday() ? ' · <b>오늘은 진행 중</b>' : ''}${at ? ` (${fmtDateTime(at)} 기준)` : ''}</span></div>
    ${!all.length ? `<div class="empty">조건에 맞는 영상이 없습니다. 게재 범위나 기간을 넓혀 보세요.</div>` : `
    <div class="hint" style="margin-bottom:8px;line-height:1.7"><b>CPA</b> = 광고비 ÷ 매체가 추적한 구매 수(구매 1건에 든 광고비, 낮을수록 좋음) · <b>ROAS</b> = 매체가 추적한 구매 금액 ÷ 광고비(높을수록 좋음). 매체 픽셀 기준이라 쿠팡·스마트스토어 구매는 거의 안 잡힙니다. 줄을 누르면 영상 정보 창이 열립니다. <span class="nopurchase">구매 0</span> 은 광고비는 썼는데 구매가 한 건도 안 잡힌 영상입니다. <b>회색 칸</b>은 그 매체에서 지금 꺼져 있는 영상이고(숫자는 꺼지기 전 기간의 실적), <span class="off">전체 OFF</span> 는 세 매체가 다 꺼진 영상입니다(매일 10시 자동 반영 기준).</div>
    ${(() => {   // 제목 줄은 브랜드마다 이름 줄 바로 아래에 반복 (표가 길어 아래 브랜드에서도 열 이름이 보이게, 2026-11-09 사장님 요청)
      const head = `<tr class="hd"><th rowspan="2">게재일</th><th rowspan="2" style="text-align:left">영상</th>${chs.map(([, n]) => `<th class="grp gl" colspan="4">${LOGO[n]}</th>`).join('')}<th class="grp gl" colspan="3"><span class="brand">합계</span></th></tr>
      <tr class="hd">${chs.map(() => '<th class="gl">광고비</th><th>구매</th><th>CPA</th><th>ROAS</th>').join('')}<th class="gl">광고비</th><th>CPA</th><th>ROAS</th></tr>`;
      return `<div class="tablewrap"><table class="rv"><tbody>
      ${groups.map(([p, l]) => `<tr class="gh"><td colspan="${ncol}"><b class="p-${PCODE[p]}">${p}</b> <span style="font-weight:500;color:var(--fg2);font-size:12px">영상 ${l.length}개 · 게재일 최근 순</span></td></tr>${head}
        ${l.map(a => `<tr class="row ${allOff(a) ? 'alloff' : ''}" data-id="${a.id}"><td class="c" title="${esc(a.date || '')}">${mmdd(a.date)}</td>
          <td class="ttl"><div>${esc(a.title)}</div><div class="sub2">${esc(a.editor || '')}${badge(a)}${isRev(a) ? ' <span title="원본 줄이 따로 있는 수정본">수정본</span>' : ''}</div></td>
          ${chs.map(([k]) => pfCells(perfOf(a, k), offOf(a, k))).join('')}${totCells(a._pf)}</tr>`).join('')}
        <tr class="sub"><td colspan="2">${p} 합계</td>${chs.map(([k]) => pfCells(perfSum(l, k))).join('')}${totCells(perfSum(l))}</tr>`).join('')}
    </tbody></table></div>`; })()}`}`;
}
/* 영상 정보 창의 성과·나스 블록 */
function perfBlock(a){
  const n = nasOf(a), rows = PERF_CH.map(([k, nm]) => [nm, perfOf(a, k)]).filter(([, s]) => s.spend || s.conv);
  return `<div class="pfbox"><div class="hint" style="margin-bottom:4px"><b>성과 · ${esc(perfLabel())}</b> (${perfRangeTxt()} · 부가세 전 · 매시간 자동 반영${perfToday() ? ' · 오늘은 진행 중' : ''})</div>
    ${rows.length ? `<table class="pft"><tr><th>매체</th><th>광고비</th><th>구매</th><th>CPA</th><th>ROAS</th></tr>${rows.map(([nm, s]) => `<tr><td>${nm}</td>${pfCells(s)}</tr>`).join('')}${rows.length > 1 ? `<tr class="sub"><td>합계</td>${pfCells(perfOf(a))}</tr>` : ''}</table>` : '<div class="hint">이 기간에는 광고 집행이 없습니다.</div>'}
    <div class="hint" style="margin-top:6px">나스 최종본: ${n ? `${esc(baseName(n.path))}${n.mb ? ` (${Math.round(n.mb)} MB)` : ''}` : '아직 못 찾음 (게재일·타이틀·편집자가 나스 파일 이름과 같으면 다음 자동 반영 때 연결됩니다)'}</div></div>`;
}

/* 집행 현황 (2026-11-02): 메타·구글·틱톡 광고 집행 금액(부가세 전)을 달별로 편집자별 합계 → 큰 순서. 예전 "예산 현황"(하루 예산 합계)을 대신함 —
   매체가 캠페인 하나에 영상 여러 개를 넣는 구조로 바뀌어 예산을 영상별로 나눌 수 없음. 값은 매일 10시 자동 반영 (2026-10 부터, meta_spend·google_spend·tiktok_spend) */
let budOpen = '';      // 펼쳐 본 편집자
let spendMonth = '';   // 보는 달 (비어 있으면 가장 최근 달)
function budgetHtml(){
  const months = spendMonths();
  if (!months.length) return `<div class="empty">집행 금액이 아직 기록되지 않았습니다. 매일 오전 10시 자동 반영 뒤에 보입니다.${isAdmin() ? ' (저장소에 meta_spend 칸이 없으면 sql-ads-spend.sql 을 먼저 실행하세요)' : ''}</div>`;
  const m = months.includes(spendMonth) ? spendMonth : months[0], dash = '<span style="color:var(--fg3)">–</span>';
  // v = 그 달 세 매체 합계. me = 메타, g = 구글, t = 틱톡. 메타는 다시 mo = 제작영상(직접 만든 영상) / mp = 파트너스(타이틀에 "파트너스"가 들어감, 공통 isPt)
  const live = G().map(a => ({ ...a, me: spendOf(a, m, 'meta_spend'), g: spendOf(a, m, 'google_spend'), t: spendOf(a, m, 'tiktok_spend') })).map(a => ({ ...a, v: a.me + a.g + a.t })).filter(a => a.v > 0)
    .map(a => ({ ...a, pt: isPt(a), mo: isPt(a) ? 0 : a.me, mp: isPt(a) ? a.me : 0 }));
  const sum = (list, k = 'v') => list.reduce((t, a) => t + a[k], 0);
  const T = sum(live), ME = sum(live, 'me'), MO = sum(live, 'mo'), MP = sum(live, 'mp'), GG = sum(live, 'g'), TT = sum(live, 't');
  const byEd = {};
  live.forEach(a => { const e = a.editor || '편집자 미지정'; (byEd[e] = byEd[e] || []).push(a); });
  const rank = Object.entries(byEd).map(([e, list]) => ({ e, list: list.sort((x, y) => y.v - x.v), v: sum(list), mo: sum(list, 'mo'), mp: sum(list, 'mp'), g: sum(list, 'g'), t: sum(list, 't') })).sort((x, y) => y.v - x.v);
  const max = rank.length ? rank[0].v : 1;
  const last = (DATA.ads_sync || []).slice().sort((a, b) => (b.synced_at || '').localeCompare(a.synced_at || ''))[0];
  const sel = `<select id="spendMonth" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;font:inherit;font-weight:600">${months.map(k => `<option value="${k}" ${k === m ? 'selected' : ''}>${monthLabel(k)}</option>`).join('')}</select>`;
  const w = v => Math.max(v ? 1 : 0, Math.round(v / max * 70));
  const bars = r => `<span class="bar m ${r.g || r.t ? 'cut' : ''}" style="width:${w(r.mo + r.mp)}%" title="메타 ${fmtWon(r.mo + r.mp)}"></span>${r.g ? `<span class="bar g ${r.t ? 'cut' : ''}" style="width:${w(r.g)}%" title="구글 ${fmtWon(r.g)}"></span>` : ''}${r.t ? `<span class="bar t" style="width:${w(r.t)}%" title="틱톡 ${fmtWon(r.t)}"></span>` : ''}`;
  const chips = a => [a.me ? `메타 ${fmtWon(a.me)}` : '', a.g ? `구글 ${fmtWon(a.g)}` : '', a.t ? `틱톡 ${fmtWon(a.t)}` : ''].filter(Boolean).join(' · ');
  return `<div class="actions">${sel}<span class="hint">${LOGO['메타']} ${LOGO['구글']} ${LOGO['틱톡']} 광고 집행 금액 (부가세 전) · 매일 오전 10시 자동 반영${last ? ` (${fmtDateTime(last.synced_at)} 기준)` : ''}${m === todayStr().slice(0, 7) ? ' · 이번 달은 진행 중' : ''}</span></div>
    ${!live.length ? `<div class="empty">${monthLabel(m)}에 집행된 영상이 없습니다.</div>` : `<div class="bsum">
      <div class="k big"><div class="t">${monthLabel(m)} 집행 금액 합계</div><div class="v">${fmtWon(T)}<small>원</small></div><div class="s">영상 ${live.length}개 · 부가세 전</div></div>
      <div class="k"><div class="t">${LOGO['메타']}</div><div class="v">${fmtWon(ME)}<small>원</small></div><div class="s">제작영상 ${fmtWon(MO)} · 파트너스 ${fmtWon(MP)}</div></div>
      <div class="k"><div class="t">${LOGO['구글']}</div><div class="v">${fmtWon(GG)}<small>원</small></div><div class="s">영상 ${live.filter(a => a.g).length}개</div></div>
      <div class="k"><div class="t">${LOGO['틱톡']}</div><div class="v">${fmtWon(TT)}<small>원</small></div><div class="s">영상 ${live.filter(a => a.t).length}개</div></div>
      ${PRODUCTS.map(p => { const l = live.filter(a => a.product === p); return `<div class="k"><div class="t">${p}</div><div class="v" style="font-size:16px">${fmtWon(sum(l))}</div><div class="s">영상 ${l.length}개</div></div>`; }).join('')}
    </div>
    <div class="hint" style="margin-bottom:8px">메타·구글·틱톡 광고 관리자가 보고한 <b>${monthLabel(m)} 집행 금액</b>을 편집자별로 더해 큰 순서로 보여 줍니다 (한 캠페인에 영상 여러 개가 들어 있어도 광고별로 나눠 셉니다). 메타는 <b>제작영상</b>(직접 만든 영상)과 <b>파트너스</b>(타이틀에 "파트너스"가 들어가는 영상)로 나눴습니다. 편집자 줄을 누르면 그 사람의 영상이 펼쳐집니다.</div>
    <div class="tablewrap"><table class="bud"><thead><tr><th>순위</th><th class="l">편집자</th><th>영상 수</th><th>${LOGO['메타']} 제작영상</th><th>${LOGO['메타']} 파트너스</th><th>${LOGO['구글']}</th><th>${LOGO['틱톡']}</th><th>합계</th><th class="l">비중 <span style="font-weight:400;font-size:11px;color:#57534e">(파랑 메타 · 초록 구글 · 검정 틱톡)</span></th></tr></thead><tbody>
    ${rank.map((r, i) => `<tr class="ed" data-ed="${esc(r.e)}"><td class="rk">${i + 1}</td><td class="l nm">${esc(r.e)} <span style="font-weight:400;color:var(--fg3);font-size:11px">${budOpen === r.e ? '▴' : '▾'}</span></td><td>${r.list.length}</td>
        <td class="mg">${r.mo ? fmtWon(r.mo) : dash}</td><td class="mg">${r.mp ? fmtWon(r.mp) : dash}</td><td class="mg">${r.g ? fmtWon(r.g) : dash}</td><td class="mg">${r.t ? fmtWon(r.t) : dash}</td><td class="tot">${fmtWon(r.v)}</td>
        <td class="sh">${bars(r)}${(r.v / T * 100).toFixed(1)}%</td></tr>
      ${budOpen === r.e ? `<tr class="det"><td colspan="9"><div class="vlist">${r.list.map(a => `<div data-open="${a.id}" style="cursor:pointer" title="${esc(a.title)}"><span><b class="p-${PCODE[a.product]}">(${PCODE[a.product]})</b> ${mmdd(a.date)} ${esc(a.title)}${mstateOf(a) === 'OFF' ? ' <span class="off">OFF</span>' : ''}</span><span class="amt">${chips(a)} = <b>${fmtWon(a.v)}</b></span></div>`).join('')}</div></td></tr>` : ''}`).join('')}
    <tr class="sumrow"><td></td><td class="l">합계</td><td>${live.length}</td><td>${fmtWon(MO)}</td><td>${fmtWon(MP)}</td><td>${fmtWon(GG)}</td><td>${fmtWon(TT)}</td><td class="tot">${fmtWon(T)}</td><td class="sh">메타 ${(ME / T * 100).toFixed(1)}% · 구글 ${(GG / T * 100).toFixed(1)}% · 틱톡 ${(TT / T * 100).toFixed(1)}%</td></tr>
    </tbody></table></div>`}`;
}

/* 월별 현황: 제품별·제작자별 개수 + 월~금 달력 */
function monthHtml(){
  const [y, m] = month.split('-').map(Number);
  const inMonth = G().filter(a => (a.date || '').startsWith(month));
  // 파트너스 광고(타이틀에 "파트너스"가 들어감)는 따로 센다. 예산 현황 탭과 같은 기준(isPt).
  const own = inMonth.filter(a => !isPt(a) && !isRev(a)), pt = inMonth.filter(a => isPt(a) && !isRev(a)), revN = inMonth.filter(isRev).length;   // 수정본은 세지 않음 (2026-10-30)
  const byP = PRODUCTS.map(p => [p, own.filter(a => a.product === p).length, pt.filter(a => a.product === p).length]);
  const eds = uniq(inMonth.map(a => a.editor));
  const byE = eds.map(e => [e, own.filter(a => a.editor === e).length, pt.filter(a => a.editor === e).length]);
  // 월~금만 있는 달력 (첫 주 월요일부터)
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  // 검색: 타이틀·편집자·제품·페이지명·상태 중 하나에 검색어가 들어가면 걸림 (띄어쓰기·대소문자 무시)
  const q = monthQ.replace(/\s/g, '').toLowerCase();
  const hit = a => !!q && [a.title, a.editor, a.product, a.meta_account, a.status].some(v => String(v || '').replace(/\s/g, '').toLowerCase().includes(q));
  const hits = q ? inMonth.filter(hit).length : 0;
  let cells = '';
  for (let d = new Date(start); d <= last; d.setDate(d.getDate() + 7)) {
    for (let i = 0; i < 5; i++) {
      const day = new Date(d); day.setDate(d.getDate() + i);
      const key = ymd(day), out = day.getMonth() !== m - 1;
      const items = inMonth.filter(a => a.date === key).sort((a, b) => PRODUCTS.indexOf(a.product) - PRODUCTS.indexOf(b.product));
      const holi = HOLIDAYS[key];   // 공휴일이면 이름, 아니면 undefined
      cells += `<div class="d ${out ? 'out' : ''} ${key === todayStr() ? 'today' : ''} ${holi ? 'holi' : ''}" data-day="${key}"><div class="dn">${out ? '' : `${m}/${day.getDate()}${holi ? `<small>${esc(holi)}</small>` : ''}`}</div>
        ${items.map(a => `<div class="it ${a.status === '삭제·수정필요' ? 'del' : ''} ${isRev(a) ? 'rev' : ''} ${q ? (hit(a) ? 'hit' : 'dim') : ''}" data-open="${a.id}" title="${esc(a.title)} · ${esc(a.editor || '')} · ${a.status}${isRev(a) ? ' · 수정본 (원본 줄이 있어 개수에 안 셈)' : ''}"><b class="p-${PCODE[a.product]}">(${PCODE[a.product]})</b>${esc(a.title)}${a.editor ? '_' + esc(a.editor) : ''}</div>`).join('')}</div>`;
    }
  }
  return `<div class="actions"><button class="btn sm" id="mPrev">‹</button><h2 style="margin:0;font-size:18px">${y}년 ${m}월</h2><button class="btn sm" id="mNext">›</button><button class="btn sm" id="mToday">이번 달</button>
      <input type="search" id="mq" placeholder="검색 (예: 파트너스, 편집자 이름)" value="${esc(monthQ)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;min-width:220px">
      ${q ? `<span class="hint" style="color:#b45309;font-weight:600">${hits}개 일치 · 달력에서 노랗게 표시</span>` : `<span class="hint">날짜를 누르면 그 날짜로 영상을 추가합니다 · 월을 넘기면 다음 달 표가 자동으로 생깁니다</span>`}</div>
    <div class="sum">
      <table class="p"><tr><th>제품</th>${byP.map(([p]) => `<th>${esc(p)}</th>`).join('')}<th>총 컨텐츠 수</th></tr>
        <tr><td class="l">당월 컨텐츠 개수<br>(파트너스 제외)</td>${byP.map(([, n]) => `<td>${n}</td>`).join('')}<td>${own.length}</td></tr>
        <tr><td class="l">파트너스 광고</td>${byP.map(([, , n]) => `<td>${n}</td>`).join('')}<td>${pt.length}</td></tr></table>
      <table class="e"><tr><th>제작자</th>${byE.map(([e]) => `<th>${esc(e)}</th>`).join('')}<th>총 컨텐츠 수</th></tr>
        <tr><td class="l">당월 컨텐츠 개수<br>(파트너스 제외)</td>${byE.map(([, n]) => `<td>${n}</td>`).join('')}<td>${own.length}</td></tr>
        <tr><td class="l">파트너스 광고</td>${byE.map(([, , n]) => `<td>${n}</td>`).join('')}<td>${pt.length}</td></tr></table>
    </div>
    ${revN ? `<div class="hint" style="margin:-4px 0 8px">원본 영상이 목록에 따로 있는 수정본 ${revN}개는 위 개수에 세지 않았습니다 (달력에서 흐리게 표시)</div>` : ''}
    <div class="wk">${['MON', 'TUE', 'WED', 'THU', 'FRI'].map(h => `<div class="h">${h}</div>`).join('')}${cells}</div>`;
}

function bindView(){
  const tg = $('#syncTg'); if (tg) tg.onclick = () => { syncOpen = !syncOpen; render(); };
  const ab = $('#addBtn'); if (ab) ab.onclick = () => openAd(null, { product: view });
  const na = $('#nAdd'); if (na) {
    na.onclick = addFromRow;
    document.querySelectorAll('.newrow input, .newrow select').forEach(i => { i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addFromRow(); } }; i.onclick = e => e.stopPropagation(); });
  }
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; render(); $('#fq').focus(); $('#fq').setSelectionRange(filter.q.length, filter.q.length); };
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = e => { e.preventDefault(); filter.status = (b.tagName === 'BUTTON' && b.dataset.fs === filter.status) ? '' : b.dataset.fs; render(); });   // 상태 버튼: 누르면 걸리고 다시 누르면 풀림
  document.querySelectorAll('select[data-hf]').forEach(h => { h.onclick = e => e.stopPropagation(); h.onchange = () => { filter[h.dataset.hf] = h.value; render(); }; });   // 열 머리 필터
  const cl = $('[data-clear]'); if (cl) cl.onclick = e => { e.preventDefault(); filter.editor = filter.meta = filter.mstate = filter.budget = filter.tstate = filter.gstate = filter.google = filter.status = ''; render(); };
  bindSort(sort, render, { title: 'asc', editor: 'asc', meta_account: 'asc' });
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = e => { if (e.target.closest('select, input, textarea')) return; openAd(tr.dataset.id); });
  document.querySelectorAll('[data-google]').forEach(b => b.onclick = async e => { e.stopPropagation(); const a = G().find(x => x.id === b.dataset.google); await saveRow('ads', { ...a, google: !a.google, updated_by: me }); });   // 구글 O/X 토글
  document.querySelectorAll('select[data-status]').forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = async () => { const a = G().find(x => x.id === s.dataset.status); await saveRow('ads', { ...a, status: s.value, updated_by: me }); }; });
  document.querySelectorAll('[data-edit]').forEach(el => el.ondblclick = e => { e.stopPropagation(); inlineEdit(el); });
  document.querySelectorAll('[data-note]').forEach(el => el.onclick = e => { e.stopPropagation(); if (e.detail > 1) return; openNote(el.dataset.note); });   // 콘티 한 번 클릭 → 전체 보기 창 (두 번 클릭은 바로 고치기)
  document.querySelectorAll('table.bud tr.ed').forEach(tr => tr.onclick = () => { budOpen = budOpen === tr.dataset.ed ? '' : tr.dataset.ed; render(); });
  const smn = $('#spendMonth'); if (smn) smn.onchange = () => { spendMonth = smn.value; render(); };   // 집행 현황: 보는 달 바꾸기
  const pp = $('#perfPeriod'); if (pp) pp.onchange = () => { perfPeriod = pp.value; LS.set('ads_perf_period', perfPeriod); render(); };   // 성과 기간 (제품 탭·영상 리뷰 공통)
  const rb = $('#rvBrand'); if (rb) rb.onchange = () => { rvBrand = rb.value; render(); };
  const rr = $('#rvRange'); if (rr) rr.onchange = () => { rvRange = rr.value; render(); };
  const rq = $('#rvQ'); if (rq) rq.oninput = () => { rvQ = rq.value; render(); const b = $('#rvQ'); b.focus(); b.setSelectionRange(rvQ.length, rvQ.length); };
  document.querySelectorAll('table.bud [data-open]').forEach(d => d.onclick = e => { e.stopPropagation(); openAd(d.dataset.open); });
  const mp = $('#mPrev'); if (mp) {
    const shift = n => { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); month = ymd(d).slice(0, 7); render(); };
    mp.onclick = () => shift(-1); $('#mNext').onclick = () => shift(1); $('#mToday').onclick = () => { month = todayStr().slice(0, 7); render(); };
    const mq = $('#mq'); if (mq) mq.oninput = () => { monthQ = mq.value; render(); const b = $('#mq'); b.focus(); b.setSelectionRange(monthQ.length, monthQ.length); };   // 월별 검색: 글자 칠 때마다 다시 그리고 커서 유지
    document.querySelectorAll('.wk .d').forEach(d => d.onclick = e => { const it = e.target.closest('[data-open]'); if (it) openAd(it.dataset.open); else if (d.dataset.day) openAd(null, { date: d.dataset.day }); });
  }
}
/* 칸 더블클릭 수정 */
function inlineEdit(el){
  const a = G().find(x => x.id === el.dataset.id); if (!a || el.querySelector('input,textarea')) return;
  const k = el.dataset.edit, old = a[k] || '';
  const box = document.createElement(k === 'note' || k === 'title' ? 'textarea' : 'input');
  if (k === 'date') { box.type = 'date'; } box.className = 'inline'; box.value = old;
  if (box.tagName === 'TEXTAREA') box.rows = 2;
  el.innerHTML = ''; el.appendChild(box); box.focus(); if (box.type !== 'date') box.select();
  let done = false;
  const finish = async save => { if (done) return; done = true; const v = box.value.trim(); if (!save || v === String(old).trim()) { render(); return; } await saveRow('ads', { ...a, [k]: k === 'meta_budget' ? v.replace(/,/g, '') : v || null, updated_by: me }); };
  box.onblur = () => finish(true);
  box.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); finish(false); } else if (e.key === 'Enter' && (box.tagName !== 'TEXTAREA' || e.ctrlKey)) { e.preventDefault(); finish(true); } };
}

/* 콘티 전체 보기 창 (표에서는 첫 줄만 보여 주므로) */
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');   // 글 속 인터넷 주소를 링크로
function openNote(id){
  const a = G().find(x => x.id === id); if (!a) return;
  openModal(`${modalHead(`콘티 · ${esc(a.title)}`)}
    <div class="mb">
      <div class="hint">${esc(a.product)} · ${fmtDate(a.date) || ''}${a.editor ? ' · ' + esc(a.editor) : ''}</div>
      ${(a.note || '').trim() ? `<div class="ntfull">${linkify(a.note)}</div>` : '<div class="hint">적힌 콘티가 없습니다.</div>'}
      ${filesHtml(a.files || [])}
    </div>
    <div class="mf"><button class="btn" id="ntEdit">✎ 고치기 (영상 정보 창)</button><button class="btn primary" data-close>닫기</button></div>`, { wide: true });
  $('#ntEdit').onclick = () => { closeModal(); openAd(id); };
}
/* ---------- 추가·수정 창 ---------- */
function openAd(id, preset = {}){
  const a = id ? G().find(x => x.id === id) : null;
  const d = a || { product: PRODUCTS.includes(view) ? view : PRODUCTS[0], date: todayStr(), title: '', editor: '', meta_account: '', meta_budget: '', tiktok: '', google: false, status: '운영중', note: '', ...preset };
  const fAt = attachBox('aFiles', d.files, 'ads');   // 콘티 파일 (보관함 ads 폴더)
  openModal(`${modalHead(a ? '영상 정보' : '영상 추가')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>제품</label><select id="aProduct">${PRODUCTS.map(p => `<option ${d.product === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div class="f"><label>게재일</label><input type="date" id="aDate" value="${esc(d.date || '')}"></div>
        <div class="f"><label>상태</label><select id="aStatus">${STATUSES.map(s => `<option ${d.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="f"><label>영상 타이틀 *</label><input id="aTitle" value="${esc(d.title)}" placeholder="예: 유산균 들어간 고체레몬즙(심포니)" maxlength="200"></div>
      <div class="f3">
        <div class="f"><label>편집자</label><select id="aEditor">${editorOpts(d.editor || '')}</select></div>
        <div class="f"><label>페이지명 (메타 계정)</label><input id="aMeta" value="${esc(d.meta_account || '')}" list="metaList" placeholder="예: Diet Beauty"><datalist id="metaList">${metas().map(e => `<option value="${esc(e)}">`).join('')}</datalist></div>
        <div class="f"><label>메타 일예산 (자동, 숫자 또는 OFF)</label><input id="aBudget" value="${esc(d.meta_budget || '')}" placeholder="캠페인에 영상이 여러 개면 비어 있음"></div>
      </div>
      ${a && spendOf(a) ? `<div class="hint" style="margin:-4px 0 10px;white-space:pre-line">${esc(spendTitle(a))}</div>` : ''}
      ${a && hasPerf() ? perfBlock(a) : ''}
      <div class="f"><label>틱톡</label><input id="aTiktok" value="${esc(d.tiktok || '')}" placeholder="예: 리타겟2, 1, 3"></div>
      <div class="f" ${hasGoogle(d.product) ? '' : 'style="display:none"'}><label>구글</label><select id="aGoogle"><option value="0" ${!d.google ? 'selected' : ''}>X</option><option value="1" ${d.google ? 'selected' : ''}>O</option></select></div>
      <div class="f"><label>콘티</label><textarea id="aNote" placeholder="콘티 내용이나 메모. 파일(사진·PDF·문서)은 아래에 첨부">${esc(d.note || '')}</textarea>${fAt.html}</div>
      ${a ? `<div class="hint">등록: ${esc(a.created_by || '')} ${fmtDateTime(a.created_at)}${a.updated_by ? ` · 마지막 수정: ${esc(a.updated_by)} ${fmtDateTime(a.updated_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">
      ${a ? `<button class="btn danger left" id="aDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="aSave">${a ? '저장' : '추가'}</button>
    </div>`, { wide: true });
  fAt.bind(); $('#aTitle').focus();
  $('#aSave').onclick = async () => {
    const title = $('#aTitle').value.trim(); if (!title) { $('#aTitle').focus(); toast('영상 타이틀을 입력하세요', true); return; }
    if (!a && !revGuard($('#aProduct').value, title, $('#aEditor').value.trim(), $('#aDate').value)) { closeModal(); return; }
    const row = { id: a ? a.id : uid(), product: $('#aProduct').value, date: $('#aDate').value || null, title, editor: $('#aEditor').value.trim() || null, meta_account: $('#aMeta').value.trim() || null,
      meta_budget: $('#aBudget').value.trim().replace(/,/g, '') || null, tiktok: $('#aTiktok').value.trim() || null, google: $('#aGoogle').value === '1', status: $('#aStatus').value, note: $('#aNote').value.trim() || null, files: fAt.files,
      created_by: a ? a.created_by : me, created_at: a ? a.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('ads', row); toast(a ? '저장했습니다' : '영상을 추가했습니다');
  };
  const del = $('#aDel'); if (del) del.onclick = async () => { if (confirm(`"${a.title}" 을(를) 목록에서 삭제할까요?`)) { closeModal(); await removeRow('ads', a.id); toast('삭제했습니다'); } };
}

boot({ icon: '🎬', title: '광고 영상 리스트', tables: ['ads', 'ads_sync'], render, normalize, open: id => openAd(id) });   // open: 홈 검색 결과에서 ?open=글번호 로 들어오면 그 글을 바로 엶
</script>
</body>
