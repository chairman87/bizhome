<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동작업</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610301630">
<script src="common.js?v=202610301630"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .sec{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--fg2);display:flex;align-items:center;gap:8px}
  .sec .hint{font-weight:400}
  .tbl{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--bg)}
  table{min-width:860px}
  tr.r{cursor:pointer}
  tr.r:hover td{background:var(--bg2)}
  tr.off td{color:var(--fg3)}
  td.t{font-weight:500}
  td.t .d{font-size:12px;color:var(--fg3);font-weight:400;margin-top:1px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.sum{color:var(--fg2);font-size:12.5px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .late{color:var(--orange);font-weight:600;font-size:12px}
  .lock{font-size:11px;color:var(--fg3);margin-left:4px}
  .list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
  .a{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .a:last-child{border-bottom:0}
  .a:hover{background:var(--bg2)}
  .a .mid{flex:1;min-width:0}
  .a .t{font-weight:500;word-break:break-word}
  .a .d{font-size:12.5px;color:var(--fg2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .a .m{font-size:12px;color:var(--fg3);white-space:nowrap;flex:none;text-align:right}
  .a .src{font-size:11px;color:var(--fg3);border:1px solid var(--line2);border-radius:3px;padding:0 5px;margin-right:6px;font-weight:400}
  .content{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:14px}
  .box{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg2)}
  .box h4{margin:0 0 6px;font-size:12px;color:var(--fg2);font-weight:600}
  .box.ok{background:#f0fdf4;border-color:#bbf7d0}
  .box.bad{background:#fef2f2;border-color:#fecaca}
  pre.small{font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;margin:0;color:var(--fg2);max-height:260px;overflow:auto}
  .runs{display:grid;gap:4px}
  .run{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:var(--radius);cursor:pointer}
  .run:hover{background:var(--bg2)}
  .run .when{color:var(--fg3);white-space:nowrap;font-size:12px;min-width:92px}
  .run .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
  .steps{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--fg3);align-items:center}
  .steps b{color:var(--fg)}
  .morebtn{display:block;width:100%;margin-top:10px;padding:10px}
  /* 대화 탭 */
  .chatwrap{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
  @media(max-width:820px){.chatwrap{grid-template-columns:1fr}}
  .chatlist{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);overflow:hidden}
  .chatlist .ci{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .chatlist .ci:last-child{border-bottom:0}
  .chatlist .ci:hover,.chatlist .ci.on{background:var(--bg2)}
  .chatlist .ci .t{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chatlist .ci .d{font-size:12px;color:var(--fg3);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chatpane{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);display:flex;flex-direction:column;min-height:60vh}
  .chathead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chathead .t{font-weight:600;flex:1;min-width:120px}
  .thread{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:62vh}
  .bub{max-width:80%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .bub.user{align-self:flex-end;background:#dbeafe;color:#1e3a8a;border-bottom-right-radius:3px}
  .bub.claude{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:3px}
  .bub.system{align-self:center;background:transparent;color:var(--fg3);font-size:12.5px;text-align:center;max-width:92%}
  .bub.wait{align-self:flex-start;background:transparent;color:var(--fg3);font-size:13px}
  .bub .meta{font-size:11px;color:var(--fg3);margin-top:4px}
  .bub .files{font-size:11.5px;color:var(--fg2);margin-top:5px}
  .composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;min-height:46px;max-height:180px;resize:vertical}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   자동작업 — lemon803 PC 에서 도는 자동작업(윈도우 작업 스케줄러 + Claude 앱 예약작업)의 현황·결과·수정요청
   · routines         작업 목록 (한 줄 = 작업 하나. 최근 결과 last_* 는 lemon803 의 report.py 가 복사해 둠)
   · routine_runs     실행 기록 (report.py 가 한 번 돌 때마다 한 줄. 화면에서는 필요한 만큼만 읽음)
   · routine_requests 수정요청 (요청 → 처리중 → 검토대기 → 승인 → 반영완료 / 반려 / 실패. lemon803 의 process_requests.py 가 10분마다 처리)
   · routine_chats / routine_chat_messages  대화 (2026-10-28). 대상 하나를 두고 클로드와 글로 주고받으며 고침. lemon803 의 chat_worker.py 가 5초마다 보고 답함.
       고친 것은 대화마다 복사본(브랜치 chat-xxxxxxxx)에 쌓이고, "반영" 버튼이 routine_requests 에 요청(관리자=바로 승인, 직원=검토대기)을 만들어 같은 길로 반영됨
   관리자만 보기(admin_only)인 작업은 관리자가 아니면 목록·기록·요청·대화 어디에도 안 보임. 프로그램 쪽 설명은 클로드코드\ROUTINE-BOARD\README.md
================================================================ */
const INTRANET = '인트라넷';
const KINDS = ['스케줄러', '클로드', '상시', '예정'];
const KIND_LABEL = { 스케줄러: '윈도우 작업 스케줄러 (Claude 앱이 꺼져 있어도 돎)', 클로드: 'Claude 앱 예약작업 (lemon803 의 Claude 앱이 켜져 있어야 돎)', 상시: '항상 켜져 있는 프로그램', 예정: '아직 자동작업 없음 (자리만)' };
const OPEN_STATES = ['요청', '처리중', '검토대기', '승인'];
const ST = { 요청: ['#e0e7ff', '#3730a3'], 처리중: ['#fef3c7', '#92400e'], 검토대기: ['#ffedd5', '#9a3412'], 승인: ['#dbeafe', '#1d4ed8'], 반영완료: ['#dcfce7', '#15803d'], 반려: ['#f3f4f6', '#4b5563'], 실패: ['#fee2e2', '#b91c1c'] };
const RS = { 성공: ['#dcfce7', '#15803d'], 실패: ['#fee2e2', '#b91c1c'], 경고: ['#fef3c7', '#92400e'] };
const stTag = s => ST[s] ? tag(s, ST[s][0], ST[s][1]) : tag(s || '?', '#f3f4f6', '#4b5563');
const runTag = s => RS[s] ? tag(s, RS[s][0], RS[s][1]) : tag('기록 없음', '#f3f4f6', '#9ca3af');
let view = 'board', reqTab = 'open', runKey = '', runLimit = 60;
let RUNS = [], runsFor = null;   // 실행 기록은 필요한 만큼만 읽어 여기에 둠 (runsFor: 어떤 조건으로 읽었는지)
let chatTarget = '', chatId = '', MSGS = [], chatDraft = '', msgCh = null, chatPoll = null;   // 대화 탭: 고른 대상, 열린 대화,   // 대화 탭: 열린 대화, 그 메시지(필요할 때만 읽음), 적다 만 글, 실시간 구독, 답 기다릴 때의 보조 새로고침
const CS = { 반영대기: ['#ffedd5', '#9a3412'], 반영완료: ['#dcfce7', '#15803d'], 닫힘: ['#f3f4f6', '#4b5563'] };
const csTag = s => s && s !== '열림' ? tag(s, ...(CS[s] || ['#f3f4f6', '#4b5563'])) : '';

const rel = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return '방금'; if (m < 60) return `${m}분 전`; if (m < 48 * 60) return `${Math.round(m / 60)}시간 전`; return `${Math.round(m / 1440)}일 전`; };
const R = () => (DATA.routines || []).filter(r => isAdmin() || !r.admin_only).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
const routineOf = key => (DATA.routines || []).find(r => r.key === key);
const visibleKey = key => key === INTRANET || R().some(r => r.key === key);
const REQS = () => (DATA.routine_requests || []).filter(q => visibleKey(q.target)).sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
const late = r => { if (!r.enabled || !(r.expect_hours > 0) || r.report === 'none') return false; if (!r.last_run_at) return true; return Date.now() - new Date(r.last_run_at) > r.expect_hours * 3600000; };
const canEdit = r => !!(r && r.repo_path);
const CHATS = () => (DATA.routine_chats || []).filter(c => visibleKey(c.target)).sort((a, b) => String(b.last_message_at || b.created_at || '').localeCompare(String(a.last_message_at || a.created_at || '')));
const chatOf = id => (DATA.routine_chats || []).find(c => c.id === id);

function normalize(table, a){
  if (table === 'routine_requests') return { ...a, comments: Array.isArray(a.comments) ? a.comments : [], changed_files: Array.isArray(a.changed_files) ? a.changed_files : [] };
  if (table === 'routine_chats') return { ...a, changed_files: Array.isArray(a.changed_files) ? a.changed_files : [], status: a.status || '열림' };
  if (table === 'routines') return { ...a, enabled: a.enabled !== false };
  return a;
}

/* ---------- 실행 기록 읽기 (전체를 다 읽지 않고 필요한 만큼만) ---------- */
async function loadRuns(key, limit){
  if (!store.client) { RUNS = (DATA.routine_runs || []); return; }   // 임시 저장 모드
  let q = store.client.from('routine_runs').select('id,routine_key,status,summary,started_at,finished_at,created_at').order('created_at', { ascending: false }).limit(limit);
  if (key) q = q.eq('routine_key', key);
  const { data, error } = await q;
  if (error) { if (!/does not exist|schema cache/i.test(error.message)) toast('실행 기록 읽기 실패: ' + error.message, true); RUNS = []; return; }
  RUNS = data || []; runsFor = `${key}|${limit}`;
}
async function runDetail(id){
  if (!store.client) return (DATA.routine_runs || []).find(r => r.id === id)?.detail || '';
  const { data } = await store.client.from('routine_runs').select('detail').eq('id', id).single();
  return (data && data.detail) || '';
}

/* ---------- 그리기 ---------- */
function render(){
  const admin = isAdmin();
  const reqs = REQS();
  const nWait = reqs.filter(q => q.status === '검토대기').length, nMine = reqs.filter(q => q.requester === me && OPEN_STATES.includes(q.status)).length;
  const nChatWait = CHATS().filter(c => c.status === '반영대기').length;
  const tabs = [{ key: 'board', label: '작업 현황' }, { key: 'chat', label: '대화', badge: admin ? (nChatWait || '') : '', badgeTitle: '반영 승인을 기다리는 대화' }, { key: 'requests', label: '수정요청', badge: admin ? (nWait || '') : (nMine || ''), badgeTitle: admin ? '승인 기다리는 요청' : '진행 중인 내 요청' }, { key: 'runs', label: '실행 기록' }];
  const missing = !DATA.routines || !DATA.routine_requests;
  $('#app').innerHTML = headerHtml({ icon: '🤖', title: '자동작업', tabs, active: view, newLabel: '대화 생성' }) + `<main class="wrap" style="max-width:1200px">
    ${missing ? `<div class="empty">자동작업 저장 표가 아직 없습니다.${admin ? '<br>Supabase SQL Editor 에서 <b>sql-routines.sql</b> 을 한 번 실행하세요.' : ''}</div>` : view === 'board' ? boardHtml() : view === 'requests' ? requestsHtml(reqs) : view === 'chat' ? chatHtml() : runsHtml()}
  </main>`;
  bindHeader(v => { view = v; if (v === 'runs') refreshRuns(); render(); }, openNewProject, m => { const n = REQS().filter(q => q.requester === m.name && OPEN_STATES.includes(q.status)).length; return n ? `진행 중인 수정요청 ${n}건` : ''; });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { reqTab = b.dataset.tab; render(); });
  bindChat();
  document.querySelectorAll('tr.r[data-key]').forEach(el => el.onclick = () => openChatModal(el.dataset.key));
  document.querySelectorAll('[data-hist]').forEach(b => b.onclick = e => { e.stopPropagation(); openRoutine(b.dataset.hist); });
  document.querySelectorAll('.a[data-id]').forEach(el => el.onclick = () => openRequest(el.dataset.id));
  document.querySelectorAll('.run[data-run]').forEach(el => el.onclick = () => openRun(el.dataset.run));
  document.querySelectorAll('[data-req-for]').forEach(b => b.onclick = e => { e.stopPropagation(); openNew(b.dataset.reqFor); });
  const fk = $('#frun'); if (fk) fk.onchange = () => { runKey = fk.value; runLimit = 60; refreshRuns(); };
  const mb = $('#moreBtn'); if (mb) mb.onclick = () => { runLimit += 60; refreshRuns(); };
  if (chatModalOpen()) renderChatModal();   // 작업 현황 위에 뜬 대화 창도 같이 갱신
}

function boardHtml(){
  const rows = R();
  if (!rows.length) return '<div class="empty">아직 등록된 자동작업이 없습니다.</div>';
  const nLate = rows.filter(late).length, nFail = rows.filter(r => r.last_status === '실패').length;
  return `<div class="actions"><span class="hint">작업 ${rows.length}개${nFail ? ` · <b style="color:var(--red)">실패 ${nFail}</b>` : ''}${nLate ? ` · <b style="color:var(--orange)">늦음 ${nLate}</b>` : ''} · 줄을 누르면 그 작업에 대해 클로드와 바로 대화합니다. "기록"은 최근 실행 결과. 결과는 lemon803 PC 가 작업을 끝낼 때마다 올립니다.</span></div>` +
    KINDS.map(k => { const list = rows.filter(r => (r.kind || '스케줄러') === k); if (!list.length) return ''; return `<div class="sec">${esc(k)} <span class="hint">${esc(KIND_LABEL[k] || '')}</span></div>
      <div class="tbl"><table><thead><tr><th style="width:34%">작업</th><th>주기</th><th>마지막 실행</th><th>결과</th><th style="width:30%">보고 내용</th><th>담당</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr class="r ${r.enabled ? '' : 'off'}" data-key="${esc(r.key)}" data-id="${r.id}" title="누르면 이 작업에 대해 클로드와 대화">
        <td class="t">${esc(r.title)}${r.admin_only ? '<span class="lock" title="관리자만 보는 작업">🔒</span>' : ''}${r.enabled ? '' : ' <span class="hint">(꺼짐)</span>'}<div class="d">${esc(r.description || '')}</div></td>
        <td class="memo">${esc(r.schedule || '')}</td>
        <td style="white-space:nowrap">${r.last_run_at ? `<span title="${fmtDateTime(r.last_run_at)}">${rel(r.last_run_at)}</span>` : (r.report === 'none' ? '<span class="hint">보고 안 함</span>' : '<span class="hint">기록 없음</span>')}${late(r) ? ' <span class="late">늦음</span>' : ''}</td>
        <td>${r.report === 'none' && !r.last_status ? '' : runTag(r.last_status)}</td>
        <td class="sum" title="${esc(r.last_summary || '')}">${esc(r.last_summary || '')}</td>
        <td class="memo">${esc(r.owner || '')}</td>
        <td class="act" style="white-space:nowrap"><button class="btn sm" data-hist="${r.id}">기록</button>${canEdit(r) ? '' : ' <span class="hint" title="고칠 폴더가 정해지지 않아 대화·자동 수정 불가">대화 불가</span>'}</td></tr>`).join('')}
      </tbody></table></div>`; }).join('') +
    `<div class="hint" style="margin-top:14px">🔒 는 관리자만 보는 작업입니다. "늦음"은 평소 주기보다 오래 결과가 안 올라온 것 — lemon803 PC 가 꺼졌거나 Claude 앱이 꺼졌을 수 있습니다. 결과 보고가 연결되지 않은 작업("보고 안 함")은 텔레그램으로만 알립니다.</div>`;
}

function requestsHtml(all){
  const list = all.filter(q => reqTab === 'all' || (reqTab === 'mine' ? q.requester === me : OPEN_STATES.includes(q.status)));
  const nOpen = all.filter(q => OPEN_STATES.includes(q.status)).length;
  return `<div class="actions"><div class="tabs2"><button data-tab="open" class="${reqTab === 'open' ? 'on' : ''}">진행 중 ${nOpen}</button><button data-tab="mine" class="${reqTab === 'mine' ? 'on' : ''}">내 요청 ${all.filter(q => q.requester === me).length}</button><button data-tab="all" class="${reqTab === 'all' ? 'on' : ''}">전체 ${all.length}</button></div></div>
    ${list.length ? `<div class="list">${list.map(q => `<div class="a" data-id="${q.id}">${stTag(q.status)}<div class="mid"><div class="t"><span class="src">${esc(q.target_label || q.target || '')}</span>${esc(q.title || '(제목 없음)')}</div><div class="d">${esc(q.requester || '')} · ${esc((q.status === '실패' ? (q.error || q.result) : q.result) || q.body || '')}</div></div><span class="m">${fmtDateTime(q.created_at)}</span></div>`).join('')}</div>`
      : `<div class="empty">${reqTab === 'open' ? '진행 중인 수정요청이 없습니다.' : reqTab === 'mine' ? '내가 올린 수정요청이 없습니다.' : '아직 수정요청이 없습니다.'}<br><span class="hint">고칠 것은 <b>대화</b> 탭에서 클로드에게 바로 말하면 됩니다. 이 탭에는 직원 대화의 반영 요청(승인 대기)만 쌓입니다.</span></div>`}
    <div class="hint" style="margin-top:12px">흐름: <b>요청</b> → lemon803 의 클로드가 고침(10분 안에 시작) → <b>검토대기</b>(관리자가 바꾼 내용을 보고 승인/반려) → <b>반영완료</b>. 인트라넷은 승인 1~2분 뒤 phb.kr 에 반영됩니다. 승인 전에는 아무것도 바뀌지 않습니다.</div>`;
}

function runsHtml(){
  const opts = R().map(r => `<option value="${esc(r.key)}" ${runKey === r.key ? 'selected' : ''}>${esc(r.title)}</option>`).join('');
  const list = RUNS.filter(x => visibleKey(x.routine_key));

const targetLabel = t => t === INTRANET ? '인트라넷' : ((routineOf(t) || {}).title || t);
async function loadMsgs(id){
  if (!store.client || !id) { MSGS = []; return; }
  const { data, error } = await store.client.from('routine_chat_messages').select('*').eq('chat_id', id).order('created_at');
  if (error) { if (!/does not exist|schema cache/i.test(error.message)) toast('대화 읽기 실패: ' + error.message, true); MSGS = []; return; }
  MSGS = (data || []).map(m => ({ ...m, changed_files: Array.isArray(m.changed_files) ? m.changed_files : [] }));
}
const chatPending = () => MSGS.some(m => m.role === 'user' && ['대기', '처리중'].includes(m.status));
function watchChat(id){   // 열린 대화의 메시지 표만 실시간으로 받음 + 답을 기다리는 동안은 8초마다 한 번 더 읽음(실시간이 끊겼을 때 대비)
  if (msgCh) { try { store.client.removeChannel(msgCh); } catch (e) {} msgCh = null; }
  clearInterval(chatPoll); chatPoll = null;
  if (!store.client || !id) return;
  msgCh = store.client.channel('chat-' + id).on('postgres_changes', { event: '*', schema: 'public', table: 'routine_chat_messages', filter: 'chat_id=eq.' + id }, () => refreshThread()).subscribe();
  chatPoll = setInterval(() => { if (document.visibilityState === 'visible' && (view === 'chat' || chatModalOpen()) && chatId === id && chatPending()) refreshThread(); }, 8000);
}
async function refreshThread(){ if (!chatId) return; await loadMsgs(chatId); if (chatModalOpen()) renderChatModal(); else if (view === 'chat') render(); }
async function openChat(id){   // 특정 대화(다른 사람 것, 알림 링크)를 엶
  const c = chatOf(id); if (!c) return;
  if (chatId !== id) chatDraft = '';
  chatId = id; chatTarget = c.target; view = 'chat'; await loadMsgs(id); watchChat(id); render();
}
async function openChatFor(target){   // 대상을 눌렀을 때: 내 대화가 있으면 그것, 없으면 빈 대화 창(첫 메시지를 보내면 만들어짐)
  if (target !== INTRANET && !canEdit(routineOf(target))) { const r = routineOf(target); if (r) openRoutine(r.id); return; }   // 자동 수정이 안 되는 작업은 기록 창
  const c = myChatFor(target);
  if (chatTarget !== target) chatDraft = '';
  chatTarget = target; chatId = c ? c.id : ''; view = 'chat';
  await loadMsgs(chatId); watchChat(chatId); render();
}

function chatHtml(){
  const admin = isAdmin(), targets = CHAT_TARGETS();
  const all = CHATS(), mineList = all.filter(x => x.author === me && x.status !== '닫힘'), otherList = all.filter(x => x.author !== me && x.status !== '닫힘'), closedList = all.filter(x => x.status === '닫힘');
  const item = x => `<div class="ci ${x.id === chatId ? 'on' : ''}" data-chat="${x.id}"><div class="t">${esc(x.title || '(제목 없음)')}</div><div class="d"><span class="src">${esc(x.target_label || x.target || '')}</span>${x.author !== me ? esc(x.author) + ' · ' : ''}${rel(x.last_message_at || x.created_at)} ${csTag(x.status)}</div></div>`;
  const side = `<aside class="chatlist">
    <div style="padding:10px 12px;border-bottom:1px solid var(--line)"><button class="btn primary" id="chNewProj" style="width:100%">+ 대화 생성 (새 프로젝트)</button></div>
    ${mineList.length ? `<div class="sec" style="margin:8px 12px 2px">내 프로젝트</div>` + mineList.map(item).join('') : '<div class="hint" style="padding:12px">아직 프로젝트가 없습니다. 위 단추로 시작하거나, 작업 현황에서 작업 줄을 누르세요.</div>'}
    ${admin && otherList.length ? `<div class="sec" style="margin:8px 12px 2px">다른 사람</div>` + otherList.map(item).join('') : ''}
    ${closedList.length ? `<div class="sec" style="margin:8px 12px 2px">닫힌 대화 ${closedList.length}</div>` + closedList.slice(0, 20).map(item).join('') : ''}
  </aside>`;
  return `<div class="chatwrap">${side}${chatPaneHtml()}</div>`;
}
function chatPaneHtml(){   // 오른쪽 대화 창. 대화 탭과 작업 현황의 팝업 창이 같이 씀
  const admin = isAdmin();
  if (chatId && !chatOf(chatId)) chatId = '';
  const c = chatId ? chatOf(chatId) : null;
  let pane;
  if (!chatTarget) {
    pane = `<section class="chatpane"><div class="empty" style="margin:auto;max-width:560px"><b>+ 대화 생성</b>으로 새 프로젝트를 시작하거나, 왼쪽에서 프로젝트를 고르세요. 작업 현황에서 작업 줄을 눌러도 그 작업과의 대화가 열립니다.<br><br><span class="hint">lemon803 의 클로드와 글로 주고받습니다. "지금 어떻게 되어 있어?"라고 물어도 되고 "이렇게 바꿔 줘"라고 해도 됩니다.<br>${admin ? '관리자가 고치라고 한 것은 <b>바로 반영</b>됩니다(인트라넷은 1~2분 뒤 phb.kr).' : '고친 것은 <b>반영 요청</b>을 눌러야 관리자 승인 뒤 적용됩니다.'}<br>답은 보통 30초~2분 걸리고, lemon803 PC 가 켜져 있어야 합니다.</span></div></section>`;
  } else {
    const others = chatsOf(chatTarget).filter(x => x.author !== me);
    const label = targetLabel(chatTarget), r = routineOf(chatTarget);
    const nFiles = c ? c.changed_files.length : 0, mine = !c || c.author === me;
    const canApply = c && nFiles > 0 && c.status !== '반영대기' && c.status !== '닫힘' && (admin || mine);
    const bubbles = MSGS.map(m => {
      if (m.role === 'user') return `<div class="bub user">${esc(m.text || '')}<div class="meta" style="text-align:right">${esc(m.author || '')} · ${fmtDateTime(m.created_at).slice(5)}${m.status === '실패' ? ' · <span style="color:var(--red)">답 못 받음</span>' : m.status === '처리중' ? ' · 클로드가 보는 중' : m.status === '대기' ? ' · 기다리는 중' : ''}</div></div>`;
      if (m.role === 'claude') return `<div class="bub claude">${esc(m.text || '')}${m.changed_files.length ? `<div class="files">✏ 고친 파일: ${m.changed_files.map(esc).join(', ')}</div>` : ''}<div class="meta">클로드 · ${fmtDateTime(m.created_at).slice(5)}</div></div>`;
      return `<div class="bub system">${esc(m.text || '')}</div>`;
    }).join('');
    pane = `<section class="chatpane">
      <div class="chathead"><span class="t">${esc(label)}${c && !mine ? ` <span class="hint">· ${esc(c.author)}님의 대화</span>` : ''}</span>${c ? csTag(c.status) : ''}
        ${r ? `<span class="hint">${esc(r.schedule || '')}</span>` : ''}
        ${nFiles ? `<span class="hint" title="${esc(c.changed_files.join(', '))}">반영 전인 파일 ${nFiles}개</span>` : ''}
        ${c && c.status === '반영대기' && c.request_id ? '<button class="btn sm" id="chReq">반영 요청 보기</button>' : ''}
        ${canApply ? `<button class="btn sm primary" id="chApply">${admin ? '반영하기' : '반영 요청'}</button>` : ''}
        ${admin && others.length ? `<select id="chOthers" style="border:1px solid var(--line2);border-radius:var(--radius);padding:3px 6px;font-size:12px"><option value="">다른 사람의 대화…</option>${others.map(x => `<option value="${x.id}" ${x.id === chatId ? 'selected' : ''}>${esc(x.author)} · ${esc(x.title || '')}</option>`).join('')}</select>` : ''}
        ${r ? '<button class="btn sm" id="chHist" title="최근 실행 기록과 설정">기록</button>' : ''}
        ${c && (admin || mine) && c.status !== '닫힘' ? '<button class="btn sm" id="chClose" title="이 대화를 닫고 다음부터 새로 시작">대화 새로 시작</button>' : ''}${c && admin ? '<button class="btn sm danger" id="chDel">삭제</button>' : ''}</div>
      <div class="thread" id="chThread">${bubbles || `<div class="hint">${esc(label)}에 대해 물어보거나 고쳐 달라고 적어 보세요.</div>`}${chatPending() ? '<div class="bub wait">⏳ 클로드가 보고 있습니다… (보통 30초~2분. lemon803 이 꺼져 있으면 켜질 때까지 기다립니다)</div>' : ''}</div>
      ${c && c.status === '닫힘' ? '<div class="composer"><span class="hint">닫힌 대화입니다.</span></div>'
        : `<div class="composer"><textarea id="chText" placeholder="${c && c.status === '반영대기' ? '반영 요청이 처리된 뒤에 답합니다. 메시지는 미리 보내 둘 수 있습니다.' : '예) 지금 어떻게 되어 있어? / 마감일 지난 건 빨간색으로 보여 줘'}">${esc(chatDraft)}</textarea><button class="btn primary" id="chSend">보내기</button></div>
           <div class="hint" style="padding:0 12px 8px">Ctrl+Enter 로 보내기 · ${admin ? '고치라고 한 것은 바로 반영됩니다' : '고친 것은 <b>반영 요청</b>을 눌러야 적용됩니다'}${c && c.commits ? ` · 이 대화에서 ${c.commits}번 고침` : ''}</div>`}
    </section>`;
  }
  return pane;
}
const chatModalOpen = () => !!$('#chModal');
async function openChatModal(target){   // 작업 현황에서 줄을 눌렀을 때: 탭을 바꾸지 않고 그 자리에 대화 창
  if (target !== INTRANET && !canEdit(routineOf(target))) { const r = routineOf(target); if (r) openRoutine(r.id); return; }
  const c = myChatFor(target);
  if (chatTarget !== target) chatDraft = '';
  chatTarget = target; chatId = c ? c.id : '';
  await loadMsgs(chatId); watchChat(chatId);
  openModal(`${modalHead('💬 ' + esc(targetLabel(target)))}<div id="chModal" style="margin:-4px -2px 0">${chatPaneHtml()}</div>`, { cls: 'xl' });
  bindChat(true);
  const ta = $('#chText'); if (ta) ta.focus();
}
function renderChatModal(){ const box = $('#chModal'); if (!box) return; const ta = $('#chText'), focused = ta && document.activeElement === ta; box.innerHTML = chatPaneHtml(); bindChat(true); if (focused) { const t2 = $('#chText'); if (t2) { t2.focus(); t2.selectionStart = t2.selectionEnd = t2.value.length; } } }
function bindChat(force){
  if (view !== 'chat' && !force) { if (chatPoll && !chatModalOpen()) { clearInterval(chatPoll); chatPoll = null; } return; }
  document.querySelectorAll('.ci[data-chat]').forEach(el => el.onclick = () => openChat(el.dataset.chat));
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on('#chNewProj', openNewProject); on('#chSend', sendMsg); on('#chApply', applyChat); on('#chClose', closeChat); on('#chDel', delChat);
  on('#chReq', () => { const c = chatOf(chatId); if (c && c.request_id) openRequest(c.request_id); });
  on('#chHist', () => { const r = routineOf(chatTarget); if (r) { if (chatModalOpen()) closeModal(); openRoutine(r.id); } });
  const so = $('#chOthers'); if (so) so.onchange = () => { if (so.value) openChat(so.value); else openChatFor(chatTarget); };
  const ta = $('#chText'); if (ta) { ta.oninput = () => { chatDraft = ta.value; }; ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMsg(); } }; }
  const th = $('#chThread'); if (th) th.scrollTop = th.scrollHeight;
  if (chatId && !chatPoll) watchChat(chatId);
}
async function sendMsg(){
  const ta = $('#chText'); if (!ta || !chatTarget) return;
  const text = ta.value.trim(); if (!text) return;
  if (!store.client) { toast('저장소에 연결돼 있지 않아 보낼 수 없습니다', true); return; }
  let c = chatId ? chatOf(chatId) : null;
  const now = nowIso();
  if (!c || c.status === '닫힘' || (c.author !== me && !isAdmin())) {   // 내 대화가 아직 없으면 첫 메시지로 만듦
    c = { id: uid(), target: chatTarget, target_label: targetLabel(chatTarget), title: text.split('\n')[0].slice(0, 60), author: me, status: '열림', changed_files: [], commits: 0, last_message_at: now, created_at: now };
    chatId = c.id;
    await saveRow('routine_chats', c);
    watchChat(c.id);
  }
  const row = { id: uid(), chat_id: c.id, role: 'user', author: me, text, status: '대기', created_at: now };
  chatDraft = ''; MSGS.push(row); render();
  const { error } = await store.client.from('routine_chat_messages').insert(row);
  if (error) { toast('보내기 실패: ' + error.message, true); MSGS = MSGS.filter(m => m.id !== row.id); chatDraft = text; render(); return; }
  await saveRow('routine_chats', { ...c, last_message_at: now, status: c.status === '반영완료' ? '열림' : c.status });
}
async function applyChat(){
  const c = chatOf(chatId); if (!c) return;
  const admin = isAdmin(), n = c.changed_files.length;
  if (!confirm(admin ? `이 대화에서 고친 것(파일 ${n}개)을 반영할까요?\nlemon803 이 10분 안에 합칩니다.${c.target === INTRANET ? ' 그 뒤 1~2분이면 phb.kr 에 보입니다.' : ''}` : `이 대화에서 고친 것(파일 ${n}개)을 반영해 달라고 관리자에게 요청할까요?`)) return;
  const lastAns = [...MSGS].reverse().find(m => m.role === 'claude'), now = nowIso();
  const q = { id: uid(), target: c.target, target_label: c.target_label, title: c.title, body: `💬 대화에서 고친 내용 (${c.commits || 0}번 고침). 과정은 대화 보기.`, requester: me, status: admin ? '승인' : '검토대기', reviewer: admin ? me : null, reviewed_at: admin ? now : null, result: lastAns ? lastAns.text : '', changed_files: c.changed_files, diff_stat: c.diff_stat || null, branch: c.branch, chat_id: c.id, comments: [], created_at: now };
  await saveRow('routine_requests', q);
  await saveRow('routine_chats', { ...c, status: '반영대기', request_id: q.id, last_message_at: now });
  if (store.client) await store.client.from('routine_chat_messages').insert({ id: uid(), chat_id: c.id, role: 'system', author: '안내', text: admin ? `${me}님이 반영을 눌렀습니다. lemon803 이 10분 안에 합칩니다.` : `${me}님이 반영을 요청했습니다. 관리자 승인을 기다립니다.`, status: '완료', created_at: now });
  await refreshThread();
  toast(admin ? '반영을 걸었습니다. 10분 안에 적용됩니다' : '반영 요청을 올렸습니다. 관리자가 승인하면 반영됩니다');
}
async function closeChat(){ const c = chatOf(chatId); if (!c) return; if (!confirm('이 대화를 닫고 다음부터 새로 시작할까요? (기록은 남습니다' + (c.changed_files.length ? '. 반영 안 한 수정은 더는 쓰이지 않습니다' : '') + ')')) return; await saveRow('routine_chats', { ...c, status: '닫힘' }); chatId = ''; MSGS = []; watchChat(''); toast('닫았습니다. 다음 메시지부터 새 대화입니다'); render(); }
async function delChat(){
  const c = chatOf(chatId); if (!c) return;
  if (!confirm(`"${c.title}" 대화와 메시지를 모두 지울까요?`)) return;
  if (store.client) await store.client.from('routine_chat_messages').delete().eq('chat_id', c.id);
  chatId = ''; MSGS = []; watchChat('');
  await removeRow('routine_chats', c.id); toast('지웠습니다');
}

boot({ icon: '🤖', title: '자동작업', tables: ['routines', 'routine_requests', 'routine_chats'], render, normalize,
  open: id => { if ((DATA.routine_requests || []).some(q => q.id === id)) { view = 'requests'; render(); openRequest(id); } else if ((DATA.routine_chats || []).some(c => c.id === id)) openChat(id); else if ((DATA.routines || []).some(r => r.id === id)) openRoutine(id); } });   // 텔레그램 알림의 ?open=요청번호 로 들어오면 그 요청(또는 대화)을 바로 엶
</script>
</body>
</html>
