<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202611191728">
<script src="common.js?v=202611192212"></script>
<style>
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .actions .sp{flex:1}
  .sub{font-size:12px;color:var(--fg3)}
  .alerts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .al{font-size:12.5px;border-radius:999px;padding:4px 11px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .al.red{background:#fee2e2;color:#b91c1c}.al.org{background:#fef3c7;color:#92400e}.al.blu{background:#dbeafe;color:#1d4ed8}
  .board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
  .col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);min-height:220px;display:flex;flex-direction:column}
  .col.post{background:#f8fafc}
  .ch{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
  .ch .no{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:6px}
  .ch .nm{font-weight:700;font-size:14px}
  .ch .cnt{float:right;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
  .ch .ds{font-size:11.5px;color:var(--fg3);margin-top:4px;line-height:1.45}
  .cb{padding:8px;display:grid;gap:8px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;min-width:0}
  .card:hover{border-color:var(--fg3)}
  .card .ct{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
  .card .cs{font-size:12px;color:var(--fg3);margin-top:2px;overflow-wrap:anywhere}
  .card .cd{font-size:12.5px;margin-top:6px}
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .chip2{font-size:11px;border-radius:4px;padding:1px 6px;background:#f1f5f9;color:#64748b;white-space:nowrap}
  .chip2.ok{background:#dcfce7;color:#15803d}
  .dd{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
  .dd.red{background:#fee2e2;color:#b91c1c}.dd.org{background:#fef3c7;color:#92400e}.dd.gry{background:#f1f5f9;color:#475569}
  .bt{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
  .bt button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--fg2);white-space:nowrap}
  .bt button.go{border-color:var(--blue);color:var(--blue);font-weight:600}
  .bt button:hover{border-color:var(--fg2);color:var(--fg)}
  .none{font-size:12px;color:var(--fg3);text-align:center;padding:14px 4px}
  .addc{border:1px dashed var(--line2);background:transparent;border-radius:8px;padding:7px;font-size:12.5px;color:var(--fg3);cursor:pointer}
  .addc:hover{color:var(--fg);border-color:var(--fg3)}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  table.rt{border-collapse:collapse;width:100%;font-size:13px;min-width:820px}
  table.rt th{background:var(--bg2);text-align:left;font-weight:600;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.rt tr:last-child td{border-bottom:0}
  table.rt tbody tr{cursor:pointer}
  table.rt tbody tr:hover td{background:var(--bg2)}
  .stg{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap;background:#f1f5f9;color:#475569}
  .stg-수습{background:#fef3c7;color:#92400e}.stg-정규직{background:#dcfce7;color:#15803d}.stg-출근{background:#dbeafe;color:#1d4ed8}.stg-면접{background:#e0e7ff;color:#3730a3}
  .sec{font-weight:700;font-size:13px;margin:6px 0 -2px;padding-top:10px;border-top:1px solid var(--line)}
  .sec:first-child{border-top:0;padding-top:0}
  .mb.rc{display:grid;gap:12px}
  .cks{display:grid;gap:6px}
  .cks label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
  .logl{font-size:12px;color:var(--fg3);line-height:1.7;margin:0;padding-left:16px}
  @media (max-width:700px){ .f2,.f3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   채용 관리 — 채용 프로세스 6단계를 한눈에 보고, 채용 뒤(수습 3개월 평가 → 정규직 전환)까지 관리 (2026-11-19)
   ①② 는 공고(recruit_posts) 카드, ③~⑥ 은 사람(recruit_people) 카드가 단계를 옮겨 다님.
   이름·급여·평가가 들어가므로 잠긴 표(sql-recruit.sql)에 있고, 로그인할 때 받은 출입증으로 서버 함수(rc_*)만 부름. 관리자와 운영진만 봄.
   '채용공고'(hire.html)에서 면접 대상으로 표시된 사람은 [면접 대상 가져오기]로 ③ 서류 심사 칸에 들어옴.
   계약서 파일은 여기에 올리지 않음(파일 보관함은 주소를 알면 열리는 공개 보관함). 작성했는지 체크만.
================================================================ */
const STEPS = [
  { key: '작성',   kind: 'post',   name: '채용기술서 작성', desc: 'JD · 하루 루틴 · 앞으로 배우게 될 것' },
  { key: '업로드', kind: 'post',   name: '업로드',         desc: '잡코리아 · 사람인. 광고가 필요하면 영업담당과 소통' },
  { key: '서류',   kind: 'person', name: '서류 심사',      desc: '합격자 면접일자 조율' },
  { key: '면접',   kind: 'person', name: '면접',           desc: '합격자 출근일자 조율' },
  { key: '출근',   kind: 'person', name: '출근',           desc: '계약서 작성 및 온보딩' },
  { key: '수습',   kind: 'person', name: '정규직 전환',    desc: '3개월 평가 후 정규직 전환' },
];
const STAGES = ['서류', '면접', '출근', '수습', '정규직', '종료'];
const STAGE_NAME = { 서류: '서류 심사', 면접: '면접', 출근: '출근(온보딩)', 수습: '수습(평가 대기)', 정규직: '정규직', 종료: '종료' };
const ONBOARD = ['근로계약서 작성', '인트라넷 계정 만들기', '입사일 등록(연차 계산)', '하루 루틴 · 업무 안내', '자리 · 장비 준비'];
const SOURCES = ['사람인', '잡코리아', '지인 추천', '기타'];
const JOBS = ['마케팅', '경영지원', '고객지원'];
const ERR = { denied: '관리자와 운영진만 볼 수 있는 화면입니다', title: '공고 이름을 넣어 주세요', name: '이름을 넣어 주세요', haspeople: '이 공고에 딸린 사람이 있어 지울 수 없습니다. 상태를 "마감"으로 바꿔 주세요' };
let POSTS = null, PEOPLE = null, WAITING = 0, loadErr = '', loading = false, tab = 'board';

async function call(name, args = {}){
  const t = bzToken(); if (!t) { bzExpired(); throw new Error('다시 로그인해 주세요'); }
  const d = await bzRpc(name, { p_token: t, ...args });
  if (d && d.ok === false) { if (d.err === 'session') { bzExpired(); throw new Error('다시 로그인해 주세요'); } throw new Error(ERR[d.err] || d.err); }
  return d;
}
async function load(){
  if (loading || store !== SupabaseStore || !bzMe()) return;
  loading = true;
  try { const d = await call('rc_list'); POSTS = d.posts || []; PEOPLE = d.people || []; WAITING = d.waiting || 0; loadErr = ''; }
  catch (e) { loadErr = e.message || String(e); }
  loading = false;
  if (!document.querySelector('#modal > *')) render();
}
const put = (list, row) => { const i = list.findIndex(x => x.id === row.id); if (i >= 0) list[i] = row; else list.push(row); };
async function savePost(row, msg){
  try { const d = await call('rc_post_save', { p_row: row }); put(POSTS, d.row); render(); if (msg) toast(msg); return d.row; }
  catch (e) { toast('저장 실패: ' + (e.message || e), true); return null; }
}
async function savePerson(row, msg, note){
  try { const d = await call('rc_person_save', { p_row: row, p_note: note || null }); put(PEOPLE, d.row); render(); if (msg) toast(msg); return d.row; }
  catch (e) { toast('저장 실패: ' + (e.message || e), true); return null; }
}
const postOf = x => POSTS.find(p => p.id === x.post_id);
const val = id => { const el = $(id); return el ? el.value.trim() : ''; };
const orNull = v => v === '' ? null : v;
const dday = (s, done) => {   // 날짜까지 남은 날 표시
  if (!s || done) return '';
  const n = dayDiff(String(s).slice(0, 10));
  return `<span class="dd ${n < 0 ? 'red' : n <= 14 ? 'org' : 'gry'}">${n < 0 ? `${-n}일 지남` : n === 0 ? '오늘' : `D-${n}`}</span>`;
};
const dt = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localInput = iso => { if (!iso) return ''; const d = new Date(iso); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const months = s => { if (!s) return ''; const a = parseYmd(s), b = new Date(); const m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() - (b.getDate() < a.getDate() ? 1 : 0); return m < 0 ? '입사 전' : m < 12 ? `${m}개월` : `${Math.floor(m / 12)}년 ${m % 12}개월`; };
const checked = x => ONBOARD.filter(k => x.checklist && x.checklist[k]).length;

/* ---------- 카드 ---------- */
function postCard(p){
  const n = PEOPLE.filter(x => x.post_id === p.id && x.stage !== '종료').length;
  const c = (ok, label) => `<span class="chip2 ${ok ? 'ok' : ''}">${ok ? '✓ ' : ''}${label}</span>`;
  const draft = p.status === '작성', ready = p.jd && p.routine && p.learn;
  return `<div class="card" data-post="${p.id}">
    <div class="ct">${esc(p.title)}</div>
    <div class="cs">${esc([p.job, p.owner ? '담당 ' + p.owner : '', p.headcount ? p.headcount + '명' : ''].filter(Boolean).join(' · '))}</div>
    <div class="chips">${draft ? c(p.jd, 'JD') + c(p.routine, '하루 루틴') + c(p.learn, '배우게 될 것') : c(p.saramin, '사람인') + c(p.jobkorea, '잡코리아') + (p.ad_note ? '<span class="chip2">광고 메모</span>' : '')}</div>
    ${draft ? '' : `<div class="cd">${p.opened_at ? fmtDate(p.opened_at) + ' 시작' : '아직 안 올림'}${p.closed_at ? ` · 마감 ${fmtDate(p.closed_at)}${dday(p.closed_at)}` : ''}${n ? ` · 진행 ${n}명` : ''}</div>`}
    <div class="bt">${draft ? `<button class="${ready ? 'go' : ''}" data-pgo="${p.id}" data-to="업로드" title="${ready ? '' : '세 가지를 다 적으면 넘기세요'}">업로드 단계로 →</button>` : `<button data-pgo="${p.id}" data-to="마감">공고 마감</button>`}</div>
  </div>`;
}
function personCard(x){
  const p = postOf(x); let mid = '', btn = '';
  if (x.stage === '서류') { mid = '면접일을 정할 차례'; btn = `<button class="go" data-act="interview" data-id="${x.id}">면접일 정하기</button><button data-act="end" data-id="${x.id}">불합격·포기</button>`; }
  else if (x.stage === '면접') { mid = x.interview_at ? `면접 ${dt(x.interview_at)}${dday(x.interview_at)}` : '면접일 미정'; btn = `<button class="go" data-act="start" data-id="${x.id}">합격 · 출근일 정하기</button><button data-act="end" data-id="${x.id}">불합격·포기</button>`; }
  else if (x.stage === '출근') { mid = `${x.start_date ? '출근 ' + fmtDate(x.start_date) + dday(x.start_date) : '출근일 미정'}<br>온보딩 ${checked(x)}/${ONBOARD.length}`; btn = `<button class="go" data-act="onboard" data-id="${x.id}">계약서 · 온보딩 체크</button>`; }
  else if (x.stage === '수습') { mid = `${x.start_date ? '입사 ' + fmtDate(x.start_date) + ' · ' + months(x.start_date) : ''}<br>평가 예정 ${x.eval_due ? fmtDate(x.eval_due) + dday(x.eval_due) : '미정'}${x.eval_result === '수습 연장' ? ' <span class="chip2">연장</span>' : ''}`; btn = `<button class="go" data-act="eval" data-id="${x.id}">3개월 평가 기록</button>`; }
  return `<div class="card" data-person="${x.id}">
    <div class="ct">${esc(x.name)}</div>
    <div class="cs">${esc([p ? p.title : x.job, x.source].filter(Boolean).join(' · '))}</div>
    <div class="cd">${mid}</div>
    <div class="bt">${btn}</div>
  </div>`;
}

/* ---------- 알림 줄 ---------- */
function alertsHtml(){
  const a = [];
  PEOPLE.filter(x => x.stage === '수습' && x.eval_due && dayDiff(x.eval_due) <= 30).sort((p, q) => p.eval_due < q.eval_due ? -1 : 1)
    .forEach(x => { const n = dayDiff(x.eval_due); a.push(`<span class="al ${n < 0 ? 'red' : 'org'}" data-person="${x.id}">⏰ ${esc(x.name)} 3개월 평가 ${n < 0 ? `${-n}일 지남` : n === 0 ? '오늘' : `D-${n}`}</span>`); });
  PEOPLE.filter(x => x.stage === '면접' && x.interview_at && dayDiff(ymd(new Date(x.interview_at))) >= 0 && dayDiff(ymd(new Date(x.interview_at))) <= 3)
    .forEach(x => a.push(`<span class="al blu" data-person="${x.id}">🗓 ${esc(x.name)} 면접 ${dt(x.interview_at)}</span>`));
  PEOPLE.filter(x => x.stage === '출근' && x.start_date && dayDiff(x.start_date) >= 0 && dayDiff(x.start_date) <= 7)
    .forEach(x => a.push(`<span class="al blu" data-person="${x.id}">👋 ${esc(x.name)} 출근 ${fmtDate(x.start_date)}</span>`));
  return a.length ? `<div class="alerts">${a.join('')}</div>` : '';
}

/* ---------- 탭별 화면 ---------- */
function boardHtml(){
  return `<div class="board">${STEPS.map((s, i) => {
    const items = s.kind === 'post' ? POSTS.filter(p => p.status === s.key) : PEOPLE.filter(x => x.stage === s.key);
    const sorted = s.key === '수습' ? [...items].sort((a, b) => (a.eval_due || '9') < (b.eval_due || '9') ? -1 : 1) : s.key === '면접' ? [...items].sort((a, b) => (a.interview_at || '9') < (b.interview_at || '9') ? -1 : 1) : items;
    return `<section class="col ${s.kind}">
      <div class="ch"><span class="cnt">${items.length}</span><span class="no">${i + 1}</span><span class="nm">${s.name}</span><div class="ds">${s.desc}</div></div>
      <div class="cb">${sorted.map(s.kind === 'post' ? postCard : personCard).join('') || `<div class="none">없음</div>`}
        ${s.key === '작성' ? '<button class="addc" id="addPost">+ 새 공고</button>' : s.key === '서류' ? '<button class="addc" id="addPerson">+ 사람 직접 추가</button>' : ''}</div>
    </section>`; }).join('')}</div>
    <div class="hint" style="margin-top:10px">카드를 누르면 자세히 보고 고칠 수 있습니다. 파란 버튼이 그 단계에서 할 일이고, 누르면 다음 단계로 넘어갑니다. ⑥에서 평가를 기록해 정규직으로 전환하면 <b>채용 후 관리</b> 탭으로 옮겨집니다.</div>`;
}
function afterHtml(){
  const list = PEOPLE.filter(x => ['출근', '수습', '정규직'].includes(x.stage)).sort((a, b) => (a.start_date || '9') < (b.start_date || '9') ? 1 : -1);
  if (!list.length) return '<div class="empty">아직 입사한 사람이 없습니다.<br>진행판에서 ⑤ 출근 단계로 넘어온 사람부터 여기에 보입니다.</div>';
  return `<div class="tw"><table class="rt"><thead><tr><th>이름</th><th>공고 · 직무</th><th>상태</th><th>입사일</th><th>근속</th><th>3개월 평가</th><th>평가 결과</th><th>정규직 전환일</th><th>메모</th></tr></thead><tbody>${list.map(x => { const p = postOf(x);
    return `<tr data-person="${x.id}"><td><b>${esc(x.name)}</b></td><td>${esc(p ? p.title : x.job || '')}</td><td><span class="stg stg-${x.stage}">${STAGE_NAME[x.stage]}</span></td>
      <td>${fmtDate(x.start_date)}</td><td>${months(x.start_date)}</td><td>${x.eval_due ? fmtDate(x.eval_due) + dday(x.eval_due, x.stage === '정규직') : ''}</td>
      <td>${esc(x.eval_result || '')}${x.eval_note ? `<div class="sub">${esc(x.eval_note.slice(0, 60))}${x.eval_note.length > 60 ? '…' : ''}</div>` : ''}</td><td>${fmtDate(x.converted_at)}</td><td class="sub">${esc((x.memo || '').slice(0, 60))}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function postsHtml(){
  if (!POSTS.length) return '<div class="empty">아직 공고가 없습니다. [+ 새 공고]로 채용기술서부터 적어 보세요.</div>';
  const n = (p, st) => PEOPLE.filter(x => x.post_id === p.id && st.includes(x.stage)).length;
  return `<div class="tw"><table class="rt"><thead><tr><th>공고</th><th>직무</th><th>상태</th><th>담당</th><th>올린 곳</th><th>기간</th><th>서류·면접</th><th>입사</th><th>종료</th></tr></thead><tbody>${POSTS.map(p =>
    `<tr data-post="${p.id}"><td><b>${esc(p.title)}</b></td><td>${esc(p.job || '')}</td><td><span class="stg">${p.status === '작성' ? '채용기술서 작성' : p.status === '업로드' ? '업로드 · 공고 중' : '마감'}</span></td><td>${esc(p.owner || '')}</td>
      <td>${[p.saramin ? '사람인' : '', p.jobkorea ? '잡코리아' : ''].filter(Boolean).join(', ')}</td><td>${fmtDate(p.opened_at)}${p.closed_at ? ' ~ ' + fmtDate(p.closed_at) : ''}</td>
      <td>${n(p, ['서류', '면접'])}</td><td>${n(p, ['출근', '수습', '정규직'])}</td><td>${n(p, ['종료'])}</td></tr>`).join('')}</tbody></table></div>`;
}
function endedHtml(){
  const list = PEOPLE.filter(x => x.stage === '종료').sort((a, b) => (a.ended_at || a.updated_at) < (b.ended_at || b.updated_at) ? 1 : -1);
  if (!list.length) return '<div class="empty">종료된 사람이 없습니다.</div>';
  return `<div class="tw"><table class="rt"><thead><tr><th>이름</th><th>공고 · 직무</th><th>종료일</th><th>사유</th><th>메모</th></tr></thead><tbody>${list.map(x => { const p = postOf(x);
    return `<tr data-person="${x.id}"><td><b>${esc(x.name)}</b></td><td>${esc(p ? p.title : x.job || '')}</td><td>${fmtDate(x.ended_at)}</td><td>${esc(x.end_reason || '')}</td><td class="sub">${esc((x.memo || '').slice(0, 80))}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function render(){
  let body;
  if (store !== SupabaseStore) body = '<div class="empty">팀 저장소에 연결되지 않았습니다.</div>';
  else if (POSTS === null) body = `<div class="empty">${loadErr ? esc(loadErr === ERR.denied ? loadErr : '불러오지 못했습니다: ' + loadErr) + (/function|does not exist|schema/i.test(loadErr) && isAdmin() ? '<br>sql-recruit.sql 이 아직 실행되지 않았습니다.' : '') : '불러오는 중…'}</div>`;
  else {
    const cnt = { board: PEOPLE.filter(x => ['서류', '면접', '출근', '수습'].includes(x.stage)).length, after: PEOPLE.filter(x => ['출근', '수습', '정규직'].includes(x.stage)).length, posts: POSTS.length, ended: PEOPLE.filter(x => x.stage === '종료').length };
    body = `${alertsHtml()}<div class="actions">
        <div class="tabs2">${[['board', '진행판'], ['after', '채용 후 관리'], ['posts', '공고'], ['ended', '종료']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l} ${cnt[k]}</button>`).join('')}</div>
        <span class="sp"></span>
        ${WAITING ? `<button class="btn" id="importBtn" title="채용공고 화면에서 '면접'으로 표시된 최근 30일 지원자를 ③ 서류 심사 칸으로 가져옵니다">면접 대상 가져오기 ${WAITING}명</button>` : ''}
        <button class="btn" id="reloadBtn">새로고침</button>
      </div>
      ${loadErr ? `<div class="hint warn">⚠ ${esc(loadErr)}</div>` : ''}
      ${tab === 'board' ? boardHtml() : tab === 'after' ? afterHtml() : tab === 'posts' ? postsHtml() : endedHtml()}`;
  }
  $('#app').innerHTML = headerHtml({ icon: '🧭', title: '채용 관리' }) + `<main class="wrap" style="max-width:1500px">${body}</main>`;
  bindHeader(() => {}, null, () => '');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#reloadBtn', load); on('#addPost', () => openPost()); on('#addPerson', () => openPerson());
  on('#importBtn', async () => { try { const d = await call('rc_import'); toast(`${d.added}명을 서류 심사 칸으로 가져왔습니다`); load(); } catch (e) { toast('가져오지 못했습니다: ' + (e.message || e), true); } });
  document.querySelectorAll('[data-pgo]').forEach(b => b.onclick = e => { e.stopPropagation(); const p = POSTS.find(x => x.id === b.dataset.pgo), to = b.dataset.to;
    if (to === '업로드' && !(p.jd && p.routine && p.learn) && !confirm('JD · 하루 루틴 · 배우게 될 것 중 비어 있는 것이 있습니다. 그래도 업로드 단계로 넘길까요?')) return;
    if (to === '마감' && !confirm(`"${p.title}" 공고를 마감할까요?\n진행판에서 빠지고 '공고' 탭에 남습니다.`)) return;
    savePost({ id: p.id, status: to, ...(to === '마감' && !p.closed_at ? { closed_at: todayStr() } : {}) }, to === '마감' ? '공고를 마감했습니다' : '업로드 단계로 넘겼습니다'); });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); ACTS[b.dataset.act](PEOPLE.find(x => x.id === b.dataset.id)); });
  document.querySelectorAll('[data-post]').forEach(el => el.onclick = () => openPost(el.dataset.post));
  document.querySelectorAll('[data-person]').forEach(el => el.onclick = () => openPerson(el.dataset.person));
  if (POSTS === null && !loading && !loadErr) load();
}

      interview_at: at ? new Date(at).toISOString() : null, interview_note: orNull(val('#xINote')), start_date: orNull(val('#xStart')), salary: orNull(val('#xSal')), checklist: c,
      ...(ev ? { eval_due: ev } : val('#xStart') ? {} : { eval_due: null }),   // 비우면 서버가 출근일 + 3개월로 잡음
      eval_result: orNull(val('#xRes')), converted_at: orNull(val('#xConv')), eval_note: orNull(val('#xENote')), end_reason: orNull(val('#xWhy')), ended_at: orNull(val('#xEnd')), memo: orNull(val('#xMemo')) };
    if (await savePerson(row, '저장했습니다')) closeModal();
  };
  const del = $('#xDel'); if (del) del.onclick = async () => {
    if (!confirm(`"${x.name}" 을(를) 지울까요? 되돌릴 수 없습니다.${x.applicant_id ? '\n채용공고에서 넘어온 사람은 지우면 [면접 대상 가져오기] 때 다시 들어옵니다. 다시 안 보려면 단계를 "종료"로 두세요.' : ''}`)) return;
    try { await call('rc_person_delete', { p_id: x.id }); PEOPLE = PEOPLE.filter(v => v.id !== x.id); closeModal(); render(); toast('지웠습니다'); } catch (e) { toast(e.message || String(e), true); } };
}

boot({ icon: '🧭', title: '채용 관리', tables: [], render });
</script>
</body>
</html>
