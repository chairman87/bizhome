<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>인사 서류</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202611261659">
<script src="common.js?v=202611261659"></script>
<script src="hr-docx.js?v=202611262100"></script>
<style>
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .actions .sp{flex:1}
  .actions input[type=search]{max-width:200px}
  .sub{font-size:12px;color:var(--fg3)}
  .alerts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .al{font-size:12.5px;border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .al.red{background:#fee2e2;color:#b91c1c}.al.org{background:#fef3c7;color:#92400e}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
  table.rt{border-collapse:collapse;width:100%;font-size:13px;min-width:820px}
  table.rt th{background:var(--bg2);text-align:left;font-weight:600;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.rt tr:last-child td{border-bottom:0}
  table.rt tbody tr{cursor:pointer}
  table.rt tbody tr:hover td{background:var(--bg2)}
  .stg{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap;background:#f1f5f9;color:#475569}
  .stg-수습{background:#fef3c7;color:#92400e}.stg-정규{background:#dcfce7;color:#15803d}
  .chip2{display:inline-block;font-size:11px;border-radius:4px;padding:2px 7px;background:#f1f5f9;color:#94a3b8;white-space:nowrap;margin-right:4px}
  .chip2.made{background:#dbeafe;color:#1d4ed8}.chip2.ok{background:#dcfce7;color:#15803d}
  .sec{font-weight:700;font-size:13px;margin:6px 0 -2px;padding-top:10px;border-top:1px solid var(--line)}
  .sec:first-child{border-top:0;padding-top:0}
  .mb.hr{display:grid;gap:12px}
  .wage{font-size:12.5px;color:var(--fg2);background:var(--bg2);border-radius:8px;padding:8px 10px;line-height:1.6}
  .dk{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:6px}
  .dk .dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dk .dh b{font-size:13.5px}
  .dk .dh .sp{flex:1}
  .dl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);padding-top:6px;border-top:1px dashed var(--line)}
  .dl .sp{flex:1}
  .dl label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .dl input[type=checkbox]{width:auto}
  textarea.doc{min-height:46vh;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Malgun Gothic',monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
  .cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .co{border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:8px;background:var(--bg)}
  .tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .tp{border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;background:var(--bg)}
  .tp:hover{border-color:var(--fg3)}
  .tp b{font-size:14px}
  .keys{font-size:12px;color:var(--fg2);line-height:1.9}
  .keys code{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:2px;font-size:11.5px}
  h3.h{font-size:14px;margin:18px 0 8px}
  h3.h:first-child{margin-top:0}
  @media (max-width:700px){ .f2,.f3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   인사 서류 — 이름 · 주소 · 연락처를 넣으면 근로계약서(계약직·수습) · 근로계약서(정규직) · 비밀유지서약서가 워드로 나옴 (2026-11-26)
   직원(hr_people) 한 줄에 서류(hr_docs)가 여러 장 달림. 서류는 "그때 채워진 글 전체"를 보관하므로 언제든 같은 워드 파일을 다시 받음.
   양식(hr_templates)과 회사 정보(hr_companies)는 '양식 · 회사' 탭에서 고침. {이름} 같은 빈칸은 hr-docx.js 의 fill() 이 채움.
   주소 · 연락처 · 연봉이 들어가므로 잠긴 표(sql-hr.sql)에 있고, 로그인 출입증으로 서버 함수(hr_*)만 부름. 관리자만 봄(common.js 의 ADMIN_ONLY_PAGES).
   워드 파일 자체는 저장소에 올리지 않음(파일 보관함은 주소를 알면 열리는 공개 보관함). 서명본 스캔도 여기 올리지 않고 '서명 받음' 체크만.
================================================================ */
const KINDS = [
  { key: '수습',     name: '근로계약서(계약직·수습)', file: '근로계약서', dates: true,  end: true },
  { key: '정규',     name: '근로계약서(정규직)', file: '근로계약서', dates: true,  end: false },
  { key: '비밀유지', name: '비밀유지서약서',   file: '서약서',     dates: false, end: false },
];
const kindOf = k => KINDS.find(x => x.key === k) || { key: k, name: k, file: k };
const STATUS = ['수습', '정규', '퇴사'];
const KEYS = ['이름', '이름띄움', '주소', '연락처', '회사', '회사주소', '근무장소', '대표자', '시작일', '종료일', '업무내용', '연봉', '기본급', '고정수당', '연장수당', '휴일수당', '연장시간', '휴일시간', '식대', '월급', '작성일'];
const ERR = { denied: '관리자만 볼 수 있는 화면입니다', name: '이름을 넣어 주세요', doc: '서류 내용이 비어 있습니다', haspeople: '이 회사에 딸린 직원이 있어 지울 수 없습니다', body: '양식 내용이 비어 있습니다', table: '저장할 수 없는 자료입니다' };
let CO = null, TPL = [], PEOPLE = [], DOCS = [], loadErr = '', loading = false, tab = 'people', q = '', onlyUnsigned = false;

async function call(name, args = {}){
  const t = bzToken(); if (!t) { bzExpired(); throw new Error('다시 로그인해 주세요'); }
  const d = await bzRpc(name, { p_token: t, ...args });
  if (d && d.ok === false) { if (d.err === 'session') { bzExpired(); throw new Error('다시 로그인해 주세요'); } throw new Error(ERR[d.err] || d.err); }
  return d;
}
async function load(){
  if (loading || store !== SupabaseStore || !bzMe()) return;
  loading = true;
  try { const d = await call('hr_list'); CO = d.companies || []; TPL = d.templates || []; PEOPLE = d.people || []; DOCS = d.docs || []; loadErr = ''; }
  catch (e) { loadErr = e.message || String(e); }
  loading = false;
  if (!document.querySelector('#modal > *')) render();
}
const LISTS = { hr_people: () => PEOPLE, hr_docs: () => DOCS, hr_companies: () => CO };
async function save(table, row, msg){
  try { const d = await call('hr_save', { p_table: table, p_row: row }); const list = LISTS[table](), i = list.findIndex(x => x.id === d.row.id);
    if (i >= 0) list[i] = d.row; else if (table === 'hr_people') list.unshift(d.row); else list.push(d.row);
    if (msg) toast(msg); return d.row; }
  catch (e) { toast('저장 실패: ' + (e.message || e), true); return null; }
}
async function remove(table, id){
  try { await call('hr_delete', { p_table: table, p_id: id });
    if (table === 'hr_people') { PEOPLE = PEOPLE.filter(x => x.id !== id); DOCS = DOCS.filter(x => x.person_id !== id); }
    else if (table === 'hr_docs') DOCS = DOCS.filter(x => x.id !== id); else CO = CO.filter(x => x.id !== id);
    return true; }
  catch (e) { toast(e.message || String(e), true); return false; }
}
const val = id => { const el = $(id); return el ? el.value.trim() : ''; };
const orNull = v => v === '' ? null : v;
const num = s => { const t = String(s || '').replace(/[^\d]/g, ''); return t ? Number(t) : null; };
const coOf = p => CO.find(c => c.id === p.company_id) || {};
const docsOf = (p, kind) => DOCS.filter(d => d.person_id === p.id && (!kind || d.kind === kind)).sort((a, b) => a.created_at < b.created_at ? 1 : -1);
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const probEnd = s => { if (!s) return ''; const d = parseYmd(s); return ymd(new Date(d.getFullYear(), d.getMonth() + 3, d.getDate() - 1)); };   // 수습 종료일 = 입사일 + 3개월 − 1일
const endOf = p => p.end_date || probEnd(p.start_date);
const phoneFmt = s => { const t = String(s || '').replace(/[^\d]/g, ''); return /^01\d{8,9}$/.test(t) ? t.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3') : String(s || '').trim(); };
const dday = s => { if (!s) return ''; const n = dayDiff(s); return n < 0 ? `${-n}일 지남` : n === 0 ? '오늘' : `D-${n}`; };
function wageLine(annual, meal, o = {}){
  if (!annual) return '연 급여를 넣으면 기본급 · 고정수당이 계산됩니다. 고정 연장 · 휴일 시간은 최저임금에 걸리지 않는 선에서 가장 많이 잡습니다.';
  const mw = HRDOC.minWageFor(o.start, o.end), w = HRDOC.wageOf(annual, meal, { minWage: mw.wage, otH: o.otH, holH: o.holH }), f = HRDOC.won;
  const need = Math.ceil(mw.wage * 209 * 12 / 10000) * 10000;
  return `월 임금 총액 <b>${f(w.monthly)}원</b> = 기본급 ${f(w.base)} + 고정연장 ${f(w.ot)}(월 ${w.otH}시간) + 고정휴일 ${f(w.hol)}(월 ${w.holH}시간) + 식대 ${f(w.meal)}
    <br><span class="sub">시간급 ${f(Math.floor(w.hour))}원 · 최저임금 ${f(mw.wage)}원(${mw.year}년${mw.guess ? ' — 그 뒤 해는 아직 몰라 이 금액으로 봄' : ''}) 기준${w.auto ? ' · 고정 시간은 자동으로 잡음(위쪽 끝 연장 40 · 휴일 12)' : ' · 고정 시간은 직접 넣은 값'}</span>
    ${w.low ? `<br><b style="color:#b91c1c">⚠ 최저임금 미달입니다.</b> <span class="sub">${w.otH + w.holH > 0 ? '고정 시간을 줄이거나 ' : ''}연 급여를 올려야 합니다(고정 시간 없이도 연 ${f(need)}원 이상 필요).</span>` : ''}`;
}
/* 서류의 빈칸에 들어갈 값 */
function varsOf(p, o = {}){
  const co = coOf(p), w = HRDOC.wageOf(p.salary_year, p.meal, { minWage: HRDOC.minWageFor(o.start, o.end).wage, otH: o.otH, holH: o.holH }), f = HRDOC.won, blank = '____________', money = v => p.salary_year ? f(v) : '          ';
  return { 이름: p.name || blank, 이름띄움: HRDOC.spaced(p.name) || blank, 주소: p.address || '', 연락처: p.phone || '',
    회사: co.name || blank, 회사주소: co.addr || '', 근무장소: co.work_addr || co.addr || '', 대표자: co.ceo || '',
    시작일: HRDOC.kDate(o.start), 종료일: HRDOC.kDate(o.end), 업무내용: p.job_desc || blank, 작성일: HRDOC.kDate(o.date),
    연봉: money(w.annual), 기본급: money(w.base), 고정수당: money(w.fixed), 연장수당: money(w.ot), 휴일수당: money(w.hol), 연장시간: p.salary_year ? w.otH : '    ', 휴일시간: p.salary_year ? w.holH : '    ', 식대: f(w.meal), 월급: money(w.monthly) };
}
function download(text, fileName){
  const blob = new Blob([HRDOC.buildDocx(text)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const fileNameOf = (p, kind, date) => `${(date || todayStr()).slice(2).replace(/-/g, '')}_${kind}_${(p.name || '').replace(/[\\/:*?"<>|\s]/g, '')}_${kindOf(kind).file}.docx`;

/* ---------- 화면 ---------- */
function chips(p){
  return KINDS.map(k => { const d = docsOf(p, k.key)[0]; return `<span class="chip2 ${d ? (d.signed ? 'ok' : 'made') : ''}" title="${d ? (d.signed ? '서명 받음' : '만듦 · 서명 전') : '아직 안 만듦'}">${d && d.signed ? '✓ ' : ''}${k.key}</span>`; }).join('');
}
function alertsHtml(){
  const a = [];
  PEOPLE.filter(p => p.status === '수습' && endOf(p) && dayDiff(endOf(p)) <= 30 && !docsOf(p, '정규').length).sort((x, y) => endOf(x) < endOf(y) ? -1 : 1)
    .forEach(p => { const n = dayDiff(endOf(p)); a.push(`<span class="al ${n < 0 ? 'red' : 'org'}" data-person="${p.id}">⏰ ${esc(p.name)} 수습 종료 ${dday(endOf(p))} — 정규 계약서 필요</span>`); });
  return a.length ? `<div class="alerts">${a.join('')}</div>` : '';
}
function peopleHtml(){
  const list = PEOPLE.filter(p => !q || [p.name, p.phone, p.address, coOf(p).name, p.job_desc].join(' ').toLowerCase().includes(q.toLowerCase()));
  if (!PEOPLE.length) return '<div class="empty">아직 등록한 직원이 없습니다.<br><b>+ 새 직원</b>을 눌러 이름 · 주소 · 연락처를 넣으면 서류 3종을 워드로 받을 수 있습니다.</div>';
  if (!list.length) return '<div class="empty">찾는 사람이 없습니다.</div>';
  return `<div class="tw"><table class="rt"><thead><tr><th>이름</th><th>회사</th><th>상태</th><th>입사일</th><th>수습 종료</th><th>연락처</th><th>서류</th><th></th></tr></thead><tbody>${list.map(p =>
    `<tr data-person="${p.id}"><td><b>${esc(p.name)}</b></td><td>${esc(coOf(p).name || '')}</td><td><span class="stg stg-${p.status}">${esc(p.status)}</span></td><td>${fmtDate(p.start_date)}</td>
      <td>${p.status === '수습' && endOf(p) ? fmtDate(endOf(p)) + ` <span class="sub">${dday(endOf(p))}</span>` : ''}</td><td>${esc(p.phone || '')}</td><td>${chips(p)}</td><td><button class="btn sm">서류 만들기</button></td></tr>`).join('')}</tbody></table></div>
    <div class="hint" style="margin-top:10px">줄을 누르면 정보를 고치고 서류를 만들 수 있습니다. 서류 표시: <span class="chip2">안 만듦</span><span class="chip2 made">만듦 · 서명 전</span><span class="chip2 ok">✓ 서명 받음</span></div>`;
}
function docsHtml(){
  const list = DOCS.filter(d => !onlyUnsigned || !d.signed).slice().sort((a, b) => a.created_at < b.created_at ? 1 : -1);
  if (!DOCS.length) return '<div class="empty">아직 만든 서류가 없습니다.</div>';
  return `<div class="tw"><table class="rt"><thead><tr><th>만든 날</th><th>이름</th><th>회사</th><th>서류</th><th>작성일</th><th>서명</th><th>만든 사람</th><th></th></tr></thead><tbody>${list.map(d => { const p = PEOPLE.find(x => x.id === d.person_id) || {};
    return `<tr data-person="${p.id || ''}"><td>${fmtDate(String(d.created_at).slice(0, 10))}</td><td><b>${esc(p.name || '')}</b></td><td>${esc(coOf(p).name || '')}</td><td>${esc(d.title || kindOf(d.kind).name)}</td><td>${fmtDate(d.doc_date)}</td>
      <td>${d.signed ? `<span class="chip2 ok">✓ ${fmtDate(d.signed_at)}</span>` : '<span class="chip2 made">서명 전</span>'}</td><td>${esc(d.created_by || '')}</td><td><button class="btn sm" data-dl="${d.id}">워드 받기</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="sub">서명을 안 받은 서류가 없습니다.</td></tr>'}</tbody></table></div>`;
}
function setupHtml(){
  return `<h3 class="h">회사 <span class="sub">— 서류의 사업주 칸에 들어갑니다</span></h3>
    <div class="cos">${CO.map(c => `<div class="co" data-co="${c.id}">
        <div class="f"><label>사업체명</label><input data-k="name" value="${esc(c.name)}"></div>
        <div class="f"><label>주소 <span class="hint">(서명 칸)</span></label><input data-k="addr" value="${esc(c.addr || '')}"></div>
        <div class="f"><label>근무장소 <span class="hint">(제3조. 비우면 주소와 같음)</span></label><input data-k="work_addr" value="${esc(c.work_addr || '')}"></div>
        <div class="f"><label>대표자 <span class="hint">(찍히는 그대로. 예: 홍 길 동)</span></label><input data-k="ceo" value="${esc(c.ceo || '')}"></div>
        <div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn sm danger" data-codel="${c.id}">삭제</button><button class="btn sm primary" data-cosave="${c.id}">저장</button></div>
      </div>`).join('')}
      <div class="co" style="place-content:center;border-style:dashed"><button class="btn" id="addCo">+ 회사 추가</button></div></div>
    <h3 class="h">양식 <span class="sub">— 누르면 글을 고칩니다. 고친 뒤에 만드는 서류부터 적용되고, 이미 만든 서류는 그대로입니다</span></h3>
    <div class="tpls">${KINDS.map(k => { const t = TPL.find(x => x.kind === k.key); return `<div class="tp" data-tpl="${k.key}"><b>${esc(k.name)}</b>
        <div class="sub" style="margin-top:4px">${t ? `${t.body.split('\n').length}줄 · ${t.updated_by ? esc(t.updated_by) + ' · ' : ''}${fmtDate(String(t.updated_at).slice(0, 10))} 고침` : '<span style="color:#b91c1c">양식이 아직 없습니다</span>'}</div></div>`; }).join('')}</div>`;
}
function render(){
  let body;
  if (store !== SupabaseStore) body = '<div class="empty">팀 저장소에 연결되지 않았습니다.</div>';
  else if (CO === null) body = `<div class="empty">${loadErr ? esc(loadErr === ERR.denied ? loadErr : '불러오지 못했습니다: ' + loadErr) + (/function|does not exist|schema/i.test(loadErr) && isAdmin() ? '<br>sql-hr.sql 이 아직 실행되지 않았습니다.' : '') : '불러오는 중…'}</div>`;
  else {
    body = `${alertsHtml()}<div class="actions">
        <div class="tabs2">${[['people', `직원 ${PEOPLE.length}`], ['docs', `서류 대장 ${DOCS.length}`], ['setup', '양식 · 회사']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <span class="sp"></span>
        ${tab === 'people' ? `<input type="search" id="q" placeholder="이름 · 연락처 찾기" value="${esc(q)}">` : ''}
        ${tab === 'docs' ? `<label class="sub" style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="unsigned" style="width:auto" ${onlyUnsigned ? 'checked' : ''}> 서명 안 받은 것만</label>` : ''}
        <button class="btn" id="reloadBtn">새로고침</button>
        <button class="btn primary" id="addPerson">+ 새 직원</button>
      </div>
      ${loadErr ? `<div class="hint warn">⚠ ${esc(loadErr)}</div>` : ''}
      ${!TPL.length || !CO.length ? '<div class="hint warn" style="margin-bottom:10px">⚠ 양식이나 회사 정보가 아직 없습니다. <b>양식 · 회사</b> 탭에서 먼저 넣어 주세요.</div>' : ''}
      ${tab === 'people' ? peopleHtml() : tab === 'docs' ? docsHtml() : setupHtml()}`;
  }
  $('#app').innerHTML = headerHtml({ icon: '📝', title: '인사 서류' }) + `<main class="wrap" style="max-width:1200px">${body}</main>`;
  bindHeader(() => {}, null, () => '');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#reloadBtn', load); on('#addPerson', () => openPerson());
  const qi = $('#q'); if (qi) qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  const us = $('#unsigned'); if (us) us.onchange = () => { onlyUnsigned = us.checked; render(); };
  document.querySelectorAll('[data-dl]').forEach(b => b.onclick = e => { e.stopPropagation(); const d = DOCS.find(x => x.id === b.dataset.dl); download(d.body, d.file_name || 'doc.docx'); });
  document.querySelectorAll('[data-person]').forEach(el => el.onclick = () => { if (el.dataset.person) openPerson(el.dataset.person); });
  document.querySelectorAll('[data-tpl]').forEach(el => el.onclick = () => openTemplate(el.dataset.tpl));
  document.querySelectorAll('[data-cosave]').forEach(b => b.onclick = async () => { const box = b.closest('.co'), row = { id: b.dataset.cosave };
    box.querySelectorAll('[data-k]').forEach(i => row[i.dataset.k] = orNull(i.value.trim()));
    if (!row.name) { toast('사업체명을 넣어 주세요', true); return; }
    if (await save('hr_companies', row, '저장했습니다')) render(); });
  document.querySelectorAll('[data-codel]').forEach(b => b.onclick = async () => { const c = CO.find(x => x.id === b.dataset.codel);
    if (!confirm(`"${c.name}" 회사 정보를 지울까요?`)) return; if (await remove('hr_companies', c.id)) { render(); toast('지웠습니다'); } });
  on('#addCo', async () => { const name = (prompt('사업체명') || '').trim(); if (!name) return; if (await save('hr_companies', { name, sort: CO.length }, '추가했습니다. 주소 · 대표자를 넣고 저장해 주세요')) render(); });
  if (CO === null && !loading && !loadErr) load();
}

/* ---------- 직원 창: 정보 + 서류 ---------- */
function openPerson(id){
  let p = id ? PEOPLE.find(v => v.id === id) : null;
  const d = p || { name: '', status: '수습', company_id: CO.length === 1 ? CO[0].id : '', meal: 200000, start_date: '' };
  const docBox = k => { const list = p ? docsOf(p, k.key) : [];
    return `<div class="dk"><div class="dh"><b>${k.name}</b><span class="sub">${list.length ? '' : '아직 안 만듦'}</span><span class="sp"></span><button class="btn sm ${list.length ? '' : 'primary'}" data-make="${k.key}">${list.length ? '다시 만들기' : '만들기'}</button></div>
      ${list.map(x => `<div class="dl"><span>작성일 ${fmtDate(x.doc_date) || '빈칸'} · ${fmtDate(String(x.created_at).slice(0, 10))} ${esc(x.created_by || '')} 만듦</span><span class="sp"></span>
        <label><input type="checkbox" data-sign="${x.id}" ${x.signed ? 'checked' : ''}> 서명 받음${x.signed && x.signed_at ? ' ' + fmtDate(x.signed_at) : ''}</label>
        <button class="btn sm" data-dl2="${x.id}">워드 받기</button><button class="btn sm danger" data-ddel="${x.id}">삭제</button></div>`).join('')}</div>`; };
  openModal(`${modalHead(p ? esc(p.name) : '새 직원')}<div class="mb hr">
      <div class="sec">기본 <span class="sub">— 이름 · 주소 · 연락처는 서류의 근로자 칸에 그대로 들어갑니다</span></div>
      <div class="f3"><div class="f"><label>이름 *</label><input id="xName" value="${esc(d.name)}" maxlength="30"></div>
        <div class="f"><label>연락처 *</label><input id="xPhone" value="${esc(d.phone || '')}" placeholder="010-0000-0000" inputmode="tel"></div>
        <div class="f"><label>회사 *</label><select id="xCo"><option value="">고르세요</option>${CO.map(c => `<option value="${c.id}" ${d.company_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div></div>
      <div class="f"><label>주소 *</label><input id="xAddr" value="${esc(d.address || '')}" placeholder="주민등록상 주소"></div>
      <div class="sec">계약 조건 <span class="sub">— 계약서에만 쓰입니다. 비밀유지서약서만 받을 거면 비워도 됩니다</span></div>
      <div class="f3"><div class="f"><label>입사일(수습 시작)</label><input type="date" id="xStart" value="${d.start_date || ''}"></div>
        <div class="f"><label>수습 종료일 <span class="hint">(비우면 3개월)</span></label><input type="date" id="xEnd" value="${d.end_date || ''}"></div>
        <div class="f"><label>상태</label><select id="xStatus">${STATUS.map(s => `<option ${d.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
      <div class="f"><label>업무내용 <span class="hint">(제5조)</span></label><input id="xJob" value="${esc(d.job_desc || '')}" placeholder="예: SNS 영상 컨텐츠 편집 및 제작업무, 기타 회사 운영에 필요하다고 인정되는 업무"></div>
      <div class="f2"><div class="f"><label>연 급여(원)</label><input id="xSal" value="${d.salary_year ? HRDOC.won(d.salary_year) : ''}" placeholder="예: 28,000,000" inputmode="numeric"></div>
        <div class="f"><label>식대(원)</label><input id="xMeal" value="${HRDOC.won(d.meal == null ? 200000 : d.meal)}" inputmode="numeric"></div></div>
      <div class="wage" id="xWage"></div>
      <div class="f"><label>메모</label><textarea id="xMemo">${esc(d.memo || '')}</textarea></div>
      <div class="sec">서류 <span class="sub">— [만들기]를 누르면 위 내용을 저장하고, 채워진 글을 확인한 뒤 워드로 받습니다</span></div>
      ${KINDS.map(docBox).join('')}
    </div>
    <div class="mf">${p ? '<button class="btn danger left" id="xDel">삭제</button>' : ''}<button class="btn" data-close>닫기</button><button class="btn primary" id="xSave">저장</button></div>`, { wide: true });
  const wage = () => { $('#xWage').innerHTML = wageLine(num(val('#xSal')), num(val('#xMeal')), { start: val('#xStart') || todayStr(), end: val('#xEnd') || probEnd(val('#xStart') || todayStr()) }); };
  $('#xSal').oninput = $('#xMeal').oninput = $('#xEnd').onchange = wage; wage();
  $('#xSal').onblur = () => { const n = num(val('#xSal')); $('#xSal').value = n ? HRDOC.won(n) : ''; };
  $('#xPhone').onblur = () => { $('#xPhone').value = phoneFmt(val('#xPhone')); };
  $('#xStart').onchange = () => { wage(); if (!val('#xEnd')) $('#xEnd').title = '비우면 ' + fmtDate(probEnd(val('#xStart'))); };
  const saveForm = async (needAll, msg) => {
    const name = val('#xName'); if (!name) { toast('이름을 넣어 주세요', true); $('#xName').focus(); return null; }
    if (needAll) { for (const [sel, label] of [['#xCo', '회사를 골라'], ['#xAddr', '주소를 넣어'], ['#xPhone', '연락처를 넣어']]) if (!val(sel)) { toast(label + ' 주세요', true); $(sel).focus(); return null; } }
    const meal = num(val('#xMeal'));
    return save('hr_people', { ...(p ? { id: p.id } : {}), name, phone: orNull(phoneFmt(val('#xPhone'))), company_id: orNull(val('#xCo')), address: orNull(val('#xAddr')), start_date: orNull(val('#xStart')), end_date: orNull(val('#xEnd')),
      status: val('#xStatus'), job_desc: orNull(val('#xJob')), salary_year: num(val('#xSal')), meal: meal == null ? 200000 : meal, memo: orNull(val('#xMemo')) }, msg);
  };
  $('#xSave').onclick = async () => { const r = await saveForm(false, '저장했습니다'); if (r) { render(); openPerson(r.id); } };
  document.querySelectorAll('[data-make]').forEach(b => b.onclick = async () => { const r = await saveForm(true); if (r) { render(); openDoc(r, b.dataset.make); } });
  document.querySelectorAll('[data-dl2]').forEach(b => b.onclick = () => { const x = DOCS.find(v => v.id === b.dataset.dl2); download(x.body, x.file_name || 'doc.docx'); });
  document.querySelectorAll('[data-sign]').forEach(c => c.onchange = async () => { await save('hr_docs', { id: c.dataset.sign, signed: c.checked, signed_at: c.checked ? todayStr() : null }, c.checked ? '서명 받음으로 표시했습니다' : '서명 표시를 풀었습니다'); render(); openPerson(p.id); });
  document.querySelectorAll('[data-ddel]').forEach(b => b.onclick = async () => { const x = DOCS.find(v => v.id === b.dataset.ddel);
    if (!confirm(`${x.title || kindOf(x.kind).name} (${fmtDate(String(x.created_at).slice(0, 10))} 만듦) 기록을 지울까요? 되돌릴 수 없습니다.`)) return;
    if (await remove('hr_docs', x.id)) { render(); openPerson(p.id); toast('지웠습니다'); } });
  const del = $('#xDel'); if (del) del.onclick = async () => { const n = docsOf(p).length;
    if (!confirm(`"${p.name}" 을(를) 지울까요?${n ? `\n만든 서류 기록 ${n}건도 같이 지워집니다.` : ''} 되돌릴 수 없습니다.`)) return;
    if (await remove('hr_people', p.id)) { closeModal(); render(); toast('지웠습니다'); } };
}

/* ---------- 서류 창: 채워진 글 확인 → 워드로 받기 ---------- */
function openDoc(p, kind){
  const k = kindOf(kind), tpl = TPL.find(t => t.kind === kind);
  if (!tpl) { toast(`${k.name} 양식이 없습니다. '양식 · 회사' 탭에서 먼저 넣어 주세요`, true); return; }
  const start0 = kind === '정규' && endOf(p) ? addDays(endOf(p), 1) : (p.start_date || '');   // 정규는 수습이 끝난 다음 날부터
  const hrs = () => k.dates ? { otH: val('#dOt'), holH: val('#dHol') } : {};
  const filled = () => HRDOC.fill(tpl.body, varsOf(p, { start: val('#dStart'), end: val('#dEnd'), date: $('#dBlank').checked ? '' : val('#dDate'), ...hrs() }));
  const miss = [k.dates && !p.start_date ? '입사일' : '', k.dates && !p.salary_year ? '연 급여' : '', k.dates && !p.job_desc ? '업무내용' : ''].filter(Boolean);
  openModal(`${modalHead(`${esc(p.name)} — ${k.name}`)}<div class="mb hr">
      ${miss.length ? `<div class="hint warn">⚠ ${miss.join(' · ')}이(가) 비어 있어 그 자리는 빈칸으로 나옵니다. 닫고 직원 정보에 넣거나, 아래 글에서 바로 고쳐도 됩니다.</div>` : ''}
      <div class="f3">${k.dates ? `<div class="f"><label>근로개시일</label><input type="date" id="dStart" value="${start0}"></div>` : '<input type="hidden" id="dStart" value="">'}
        ${k.end ? `<div class="f"><label>계약 종료일</label><input type="date" id="dEnd" value="${endOf(p)}"></div>` : '<input type="hidden" id="dEnd" value="">'}
        <div class="f"><label for="dDate">작성일</label><input type="date" id="dDate" value="${todayStr()}"></div></div>
      <label class="hint" style="display:flex;gap:5px;align-items:center;cursor:pointer;margin-top:-6px"><input type="checkbox" id="dBlank" style="width:auto"> 작성일을 빈칸으로 두기(서명할 때 손으로 적음)</label>
      ${k.dates ? `<div class="f3"><div class="f"><label>고정 연장근로 <span class="hint">(월 시간 · 비우면 자동)</span></label><input id="dOt" inputmode="numeric" placeholder="자동"></div>
        <div class="f"><label>고정 휴일근로 <span class="hint">(월 시간 · 비우면 자동)</span></label><input id="dHol" inputmode="numeric" placeholder="자동"></div><div class="f"></div></div><div class="wage" id="dWage"></div>` : ''}
      <div class="f"><label>내용 <span class="hint">— 이대로 워드 파일이 됩니다. 이 사람만 다른 조건이 있으면 여기서 바로 고치세요</span></label><textarea class="doc" id="dBody"></textarea></div>
    </div>
    <div class="mf"><button class="btn left" id="dBack">← ${esc(p.name)} 정보로</button><button class="btn" data-close>닫기</button><button class="btn primary" id="dSave">저장하고 워드로 받기</button></div>`, { wide: true });
  let dirty = false; const ta = $('#dBody'); ta.value = filled(); ta.oninput = () => { dirty = true; };
  const wageShow = () => { if (k.dates) $('#dWage').innerHTML = wageLine(p.salary_year, p.meal, { start: val('#dStart'), end: val('#dEnd'), ...hrs() }); };
  const refill = () => { wageShow(); if (dirty && !confirm('날짜나 시간을 바꾸면 글을 양식대로 다시 채웁니다. 직접 고친 부분이 사라지는데 괜찮을까요?')) return; ta.value = filled(); dirty = false; };
  ['#dStart', '#dEnd', '#dDate', '#dBlank', ...(k.dates ? ['#dOt', '#dHol'] : [])].forEach(s => { $(s).onchange = refill; });
  wageShow();
  $('#dBack').onclick = () => openPerson(p.id);
  $('#dSave').onclick = async () => {
    const body = ta.value; if (!body.trim()) { toast('내용이 비어 있습니다', true); return; }
    if (k.dates && p.salary_year && HRDOC.wageOf(p.salary_year, p.meal, { minWage: HRDOC.minWageFor(val('#dStart'), val('#dEnd')).wage, ...hrs() }).low && !confirm('이 조건은 최저임금 미달입니다. 그래도 받을까요?')) return;
    const left = body.match(/\{[^{}\n]{1,20}\}/g); if (left && !confirm(`아직 안 채워진 빈칸이 있습니다: ${[...new Set(left)].join(' ')}\n그대로 받을까요?`)) return;
    const date = $('#dBlank').checked ? null : orNull(val('#dDate')), fileName = fileNameOf(p, kind, val('#dStart') || date);
    const row = await save('hr_docs', { person_id: p.id, kind, title: tpl.title || k.name, file_name: fileName, body, doc_date: date });
    if (!row) return;
    download(body, fileName); toast(`${fileName} 을(를) 받았습니다`);
    if (kind === '정규' && p.status === '수습' && confirm(`${p.name} 님의 상태를 '정규'로 바꿀까요?`)) await save('hr_people', { id: p.id, status: '정규' });
    render(); openPerson(p.id);
  };
}

/* ---------- 양식 창 ---------- */
function openTemplate(kind){
  const k = kindOf(kind), t = TPL.find(x => x.kind === kind) || { title: k.name, body: '' };
  openModal(`${modalHead(`양식 — ${k.name}`)}<div class="mb hr">
      <div class="keys">빈칸 이름(누르면 글에 들어감): ${KEYS.map(x => `<code data-key="${x}" style="cursor:pointer">{${x}}</code>`).join('')}<br>
        줄 표시: <code># 제목</code><code>## 제목 아래 작은 글</code><code>### 제1조(…)</code><code>&gt;&gt; 가운데 정렬</code><code>---쪽나눔---</code> · 줄 앞의 빈칸 수만큼 들여씁니다.</div>
      <div class="f"><textarea class="doc" id="tBody" style="min-height:56vh">${esc(t.body)}</textarea></div>
    </div>
    <div class="mf"><button class="btn left" id="tTry">예시 값으로 워드 받아 보기</button><button class="btn" data-close>취소</button><button class="btn primary" id="tSave">저장</button></div>`, { wide: true });
  const ta = $('#tBody');
  document.querySelectorAll('[data-key]').forEach(c => c.onclick = () => { const s = ta.selectionStart, e = ta.selectionEnd, ins = `{${c.dataset.key}}`; ta.setRangeText(ins, s, e, 'end'); ta.focus(); });
  $('#tTry').onclick = () => { const co = CO[0] || {}, sample = { name: '홍길동', address: '서울특별시 ○○구 ○○로 123, 101동 1001호', phone: '010-0000-0000', company_id: co.id, job_desc: '○○ 업무, 기타 회사 운영에 필요하다고 인정되는 업무', salary_year: 30000000, meal: 200000 };
    download(HRDOC.fill(ta.value, varsOf(sample, { start: todayStr(), end: probEnd(todayStr()), date: todayStr() })), `예시_${kind}.docx`); };
  $('#tSave').onclick = async () => {
    if (!ta.value.trim()) { toast('내용이 비어 있습니다', true); return; }
    try { const d = await call('hr_template_save', { p_kind: kind, p_title: k.name, p_body: ta.value }); const i = TPL.findIndex(x => x.kind === kind); if (i >= 0) TPL[i] = d.row; else TPL.push(d.row);
      closeModal(); render(); toast('양식을 저장했습니다. 이제부터 만드는 서류에 적용됩니다'); }
    catch (e) { toast('저장 실패: ' + (e.message || e), true); }
  };
}

boot({ icon: '📝', title: '인사 서류', tables: [], render });
</script>
</body>
</html>
