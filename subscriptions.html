<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202609192028">
<script src="common.js?v=202609192028"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn{padding:9px 16px;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v.orange{color:var(--orange)}
  .stat .v.red{color:var(--red)}
  .stat .s{font-size:11px;color:var(--fg3)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .exp{white-space:nowrap}
  .exp.soon{color:var(--orange);font-weight:600}
  .exp.over{color:var(--red);font-weight:600}
  .cat{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;background:#f1f5f9;color:#334155}
  .cat.c0{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
  .cat.c1{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .cat.c2{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .cat.c3{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}
  .cat.c4{background:#ffedd5;color:#9a3412;border-color:#fed7aa}
  .cat.c5{background:#fee2e2;color:#991b1b;border-color:#fecaca}
  .cat.c6{background:#ccfbf1;color:#115e59;border-color:#99f6e4}
  .cat.c7{background:#fce7f3;color:#9d174d;border-color:#fbcfe8}
  .cat.c8{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}
  .cat.c9{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
  .co{font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap}
  .co.a{background:#dcfce7;color:#166534}.co.b{background:#fce7f3;color:#9d174d}.co.c{background:var(--bg3);color:var(--fg2)}
  tr.off td{color:var(--fg3)}
  tr.total td{font-weight:700;background:var(--bg2)}
  .sec{font-size:12px;font-weight:600;color:var(--fg2);margin-top:4px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.f3{grid-template-columns:1fr}}
  .sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .sched .d{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
  .sched .d h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
  .sched .d h3 .n{font-weight:400;color:var(--fg3);font-size:12px}
  .sched .d.today{border-color:var(--blue);box-shadow:0 0 0 2px #dbeafe}
  .sched .d.past{opacity:.6}
  .sched .it{font-size:13px;display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-top:1px dashed var(--line)}
  .sched .it b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .usd{color:#0369a1}
  td.nm{white-space:nowrap}   /* 항목은 한 줄로 */
  td.nw{white-space:nowrap}
  td .mono{white-space:nowrap}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .pw{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .ib{border:1px solid var(--line2);background:var(--bg);border-radius:4px;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--fg2)}
  .ib:hover{background:var(--bg3);color:var(--fg)}
  a.site{font-size:12px;color:var(--fg3);text-decoration:none}
  a.site:hover{color:var(--blue)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   구독관리 — 매월(또는 매년) 나가는 돈을 한 곳에: 소프트웨어·AI 구독, 광고 계정, 통신비, 임대료, 보험 등
   한 줄 = { name(항목), category(구분), company(회사), vendor(결제처), fee(금액), currency(KRW/USD), cycle(월/년),
             billing_day(결제일), start_date, end_date(만료·갱신일), pay_method(결제 수단), owner(담당),
             account_id(연결된 계정), status(이용중/해지), memo, admin_only, created_by/at, updated_by/at }
   월 환산: 월=그대로, 년=÷12. 달러는 따로 합산해 표시(환율 적용 안 함)
================================================================ */
const CATS = ['AI', '소프트웨어', '영상편집', '마케팅', '통신', '임대·관리비', '보험', '세금·공과금', '인건비·용역', '기타'];   // 구분 순서 (표 정렬·입력 목록)
const COMPANIES = ['식이해법연구소', '(주)피에이치뷰티', '공통'];
const CO_CLS = { '식이해법연구소': 'a', '(주)피에이치뷰티': 'b', '공통': 'c' };
const CYCLES = ['월', '년'];
const S = () => (DATA.subscriptions || []).filter(s => isAdmin() || !s.admin_only);
const won = n => (n == null || n === '' || isNaN(Number(n))) ? '' : Number(n).toLocaleString('ko-KR') + '원';
const money = (n, cur) => cur === 'USD' ? `<span class="usd">$${Number(n).toLocaleString('en-US')}</span>` : won(n);
const monthly = s => { const f = Number(s.fee) || 0; return s.cycle === '년' ? Math.round(f / 12) : f; };
const feeHtml = s => Number(s.fee) > 0 ? `${money(s.fee, s.currency)}<span class="hint">/${s.cycle}</span>` : '<span class="hint">-</span>';
const daysTo = d => d ? dayDiff(d) : null;
function expHtml(d){ if (!d) return '<span class="hint">-</span>'; const n = daysTo(d); const cls = n < 0 ? 'over' : n <= 30 ? 'soon' : ''; return `<span class="exp ${cls}">${fmtDate(d)}${n < 0 ? ` (${-n}일 지남)` : n <= 30 ? ` (D-${n})` : ''}</span>`; }
const isOn = s => s.status !== '해지';
/* 구분별 색 (목록에 없으면 이름 글자로 정함) */
const CAT_COLOR = { 'AI': 'c0', '소프트웨어': 'c1', '영상편집': 'c3', '마케팅': 'c7', '통신': 'c4', '임대·관리비': 'c2', '보험': 'c6', '세금·공과금': 'c5', '인건비·용역': 'c8', '기타': 'c9' };
const catCls = c => { if (!c) return 'c9'; if (CAT_COLOR[c]) return CAT_COLOR[c]; let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) % 10; return 'c' + h; };
let shown = {};   // 비밀번호 보이기 상태
const siteHtml = u => u ? `<a class="site" href="${esc(/^https?:\/\//i.test(u) ? u : 'https://' + u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//i, '').replace(/\/$/, '').slice(0, 28))}</a>` : '';
const pwHtml = s => `<span class="pw"><span class="mono">${s.password ? (shown[s.id] ? esc(s.password) : '••••••••') : '<span class="hint">-</span>'}</span>${s.password ? `<button class="ib" data-eye="${s.id}">${shown[s.id] ? '🙈' : '👁'}</button><button class="ib" data-copy="${esc(s.password)}">복사</button>` : ''}</span>`;
/* 사용자: 이름을 쉼표로 나눠 팀원이면 아바타, 아니면 글자로 */
const usersHtml = s => { const names = String(s.users || '').split(/[,·/]/).map(x => x.trim()).filter(Boolean); if (!names.length) return '<span class="hint">-</span>'; return names.map(n => members.some(m => m.name === n) ? who(n) : `<span class="chip none">${esc(n)}</span>`).join(' '); };

let view = 'all';   // 열 때마다 항상 '전체' 탭부터
let q = '';
let sort = { key: 'category', dir: 'asc' };   // 처음 열면 구분 순서로 정렬

function normalize(table, s){
  if (table !== 'subscriptions') return s;
  return { ...s, admin_only: !!s.admin_only, currency: s.currency === 'USD' ? 'USD' : 'KRW', cycle: CYCLES.includes(s.cycle) ? s.cycle : '월', status: s.status === '해지' ? '해지' : '이용중', company: COMPANIES.includes(s.company) ? s.company : '공통' };
}
const VIEWS = () => [{ key: 'all', label: '전체' }, ...COMPANIES.map(c => ({ key: 'c:' + c, label: c })), null, { key: 'sched', label: '이번 달 결제 일정' }, { key: 'expire', label: '만료·갱신 확인', badge: S().filter(s => isOn(s) && s.end_date && daysTo(s.end_date) <= 30).length }];

function render(){
  $('#app').innerHTML = headerHtml({ icon: '💸', title: '구독관리', tabs: VIEWS(), active: view })
    + `<main class="wrap wrap-wide" style="max-width:1700px">${!DATA.subscriptions ? `<div class="empty">구독관리 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL(sql-subscriptions.sql)을 실행하세요.' : ''}</div>` : `
    <div class="actions"><button class="btn primary" id="newBtn2">＋ 구독·정기 지출 추가</button>
      <input type="search" id="fq" placeholder="검색 (항목, 결제처, 메모)" value="${esc(q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:8px 10px;min-width:220px">
      <label class="hint" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="fOff" ${LS.get('sub_off') ? 'checked' : ''}> 해지한 것도 보기</label>
      <span class="count" id="cnt"></span></div>
    ${statsHtml()}<div id="view">${viewHtml()}</div>`}</main>`;
  bindHeader(k => { view = k; LS.set('sub_view', k); render(); }, null, m => `담당 ${S().filter(s => s.owner === m.name).length}건`);
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => openEdit(null, view.startsWith('c:') ? { company: view.slice(2) } : {});
  const fq = $('#fq'); if (fq) fq.oninput = () => { q = fq.value; renderView(); };
  const fo = $('#fOff'); if (fo) fo.onchange = () => { LS.set('sub_off', fo.checked ? 1 : ''); renderView(); };
  renderView();
}
function listOf(){
  const showOff = !!LS.get('sub_off');
  return S().filter(s => (showOff || isOn(s)) && (view === 'all' || view === 'sched' || view === 'expire' || (view.startsWith('c:') && s.company === view.slice(2)))
    && (!q || [s.name, s.vendor, s.category, s.memo, s.pay_method, s.owner, s.users, s.login_id, s.url].some(v => (v || '').toLowerCase().includes(q.toLowerCase()))));
}
function statsHtml(){
  const on = S().filter(isOn);
  const krw = on.filter(s => s.currency !== 'USD').reduce((a, s) => a + monthly(s), 0), usd = on.filter(s => s.currency === 'USD').reduce((a, s) => a + monthly(s), 0);
  const soon = on.filter(s => s.end_date && daysTo(s.end_date) <= 30 && daysTo(s.end_date) >= 0).length, over = on.filter(s => s.end_date && daysTo(s.end_date) < 0).length;
  const today = new Date().getDate(); const due = on.filter(s => s.billing_day && s.billing_day >= today && s.billing_day <= today + 7);
  return `<div class="stats">
    <div class="stat"><div class="l">매월 나가는 돈 (월 환산)</div><div class="v">${won(krw) || '0원'}${usd ? ` <span class="usd" style="font-size:14px">+ $${usd.toLocaleString('en-US')}</span>` : ''}</div><div class="s">연 ${won(krw * 12)}${usd ? ` + $${(usd * 12).toLocaleString('en-US')}` : ''} · ${on.length}건</div></div>
    <div class="stat"><div class="l">7일 내 결제일</div><div class="v ${due.length ? 'orange' : ''}">${due.length}건</div><div class="s">오늘 ${today}일 기준 ${due.length ? won(due.filter(s => s.currency !== 'USD').reduce((a, s) => a + (s.cycle === '월' ? Number(s.fee) || 0 : 0), 0)) : ''}</div></div>
    <div class="stat"><div class="l">30일 내 만료·갱신</div><div class="v ${soon ? 'orange' : ''}">${soon}건</div><div class="s">${over ? `<span style="color:var(--red)">만료 지남 ${over}건</span>` : '만료 지난 것 없음'}</div></div>
    <div class="stat"><div class="l">회사별</div><div class="v" style="font-size:14px">${COMPANIES.map(c => `${c.replace('(주)', '')} ${won(on.filter(s => s.company === c && s.currency !== 'USD').reduce((a, s) => a + monthly(s), 0)) || '0원'}`).join('<br>')}</div></div>
  </div>`;
}
function viewHtml(){ return view === 'sched' ? schedHtml() : view === 'expire' ? expireHtml() : tableHtml(); }
function renderView(){ $('#view').innerHTML = viewHtml(); const c = $('#cnt'); if (c) c.textContent = `${listOf().length}건`; bindView(); }

function tableHtml(){
  // 구분은 정해진 순서(CATS)로, 같은 구분 안에서는 항목 이름순
  const list = sort.key === 'category'
    ? listOf().slice().sort((a, b) => { const dir = sort.dir === 'asc' ? 1 : -1; const d = ((CATS.indexOf(a.category) + 1 || 99) - (CATS.indexOf(b.category) + 1 || 99)) * dir; return d || String(a.category || '').localeCompare(String(b.category || ''), 'ko') * dir || String(a.name || '').localeCompare(String(b.name || ''), 'ko'); })
    : sortBy(listOf(), sort, { fee: f => Number(f) || 0, billing_day: d => Number(d) || 99, end_date: d => d || '9999' });
  if (!list.length) return `<div class="empty">${q ? '검색 결과가 없습니다.' : '등록된 구독·정기 지출이 없습니다.<br>위 <b>＋ 구독·정기 지출 추가</b>로 넣어 두면 매월 나가는 돈이 한눈에 보입니다.'}</div>`;
  const cols = [['category', '구분'], ['name', '항목'], ['company', '회사'], ['fee', '금액'], ['monthly', '월 환산'], ['billing_day', '결제일'], ['login_id', '아이디'], ['password', '비밀번호'], ['pay_method', '결제 수단'], ['end_date', '만료·갱신일'], ['users', '사용자']];
  const krw = list.filter(s => s.currency !== 'USD' && isOn(s)).reduce((a, s) => a + monthly(s), 0), usd = list.filter(s => s.currency === 'USD' && isOn(s)).reduce((a, s) => a + monthly(s), 0);
  return `<div class="tablewrap"><table style="min-width:1400px"><thead><tr>${cols.map(([k, l]) => `<th data-sort="${k}" class="${['fee', 'monthly'].includes(k) ? 'num' : ''}">${l}${sortArrow(sort, k)}</th>`).join('')}</tr></thead><tbody>
    ${list.map(s => { return `<tr class="row ${isOn(s) ? '' : 'off'}" data-id="${s.id}">
      <td><span class="cat ${catCls(s.category)}">${esc(s.category || '기타')}</span></td>
      <td class="nm"><b>${esc(s.name)}</b>${s.admin_only ? ' 🔒' : ''}${!isOn(s) ? ' <span class="hint">(해지)</span>' : ''}${s.vendor ? ` <span class="hint">${esc(s.vendor)}</span>` : ''}</td><td><span class="co ${CO_CLS[s.company] || 'c'}">${esc(s.company)}</span></td>
      <td class="num">${feeHtml(s)}</td><td class="num">${isOn(s) && monthly(s) ? money(monthly(s), s.currency) : '<span class="hint">-</span>'}</td>
      <td class="nw">${s.billing_day ? `매${s.cycle === '년' ? '년' : '월'} ${s.billing_day}일` : '<span class="hint">-</span>'}</td>
      <td class="nw"><span class="mono">${esc(s.login_id || '')}</span>${s.login_id ? ` <button class="ib" data-copy="${esc(s.login_id)}">복사</button>` : ''}${s.url ? ` <a class="site" href="${esc(/^https?:\/\//i.test(s.url) ? s.url : 'https://' + s.url)}" target="_blank" rel="noopener" title="${esc(s.url)}">🔗</a>` : ''}</td>
      <td>${pwHtml(s)}</td>
      <td class="hint">${esc(s.pay_method || '')}</td><td>${expHtml(s.end_date)}</td><td class="small">${usersHtml(s)}</td></tr>`; }).join('')}
    <tr class="total"><td colspan="4" style="text-align:right">월 환산 합계 (해지 제외)</td><td class="num">${won(krw) || '0원'}${usd ? ` + $${usd.toLocaleString('en-US')}` : ''}</td><td colspan="6"></td></tr>
  </tbody></table></div>`;
}
/* 이번 달 결제 일정: 결제일별로 묶어서 */
function schedHtml(){
  const list = listOf().filter(s => isOn(s) && s.billing_day && s.cycle === '월');
  const yearly = listOf().filter(s => isOn(s) && s.cycle === '년' && s.end_date && s.end_date.slice(5, 7) === todayStr().slice(5, 7));
  const today = new Date().getDate();
  const days = [...new Set(list.map(s => s.billing_day))].sort((a, b) => a - b);
  if (!days.length && !yearly.length) return '<div class="empty">결제일이 입력된 월 구독이 없습니다. 항목을 열어 결제일을 넣어 두면 여기에 날짜별로 정리됩니다.</div>';
  return `<div class="hint" style="margin-bottom:8px">${todayStr().slice(0, 4)}년 ${Number(todayStr().slice(5, 7))}월 · 오늘 ${today}일. 파란 테두리가 오늘, 흐린 것은 이미 지난 결제일입니다.</div>
    <div class="sched">${days.map(d => { const items = list.filter(s => s.billing_day === d); const sum = items.filter(s => s.currency !== 'USD').reduce((a, s) => a + Number(s.fee), 0), usd = items.filter(s => s.currency === 'USD').reduce((a, s) => a + Number(s.fee), 0);
      return `<div class="d ${d === today ? 'today' : d < today ? 'past' : ''}"><h3>${d}일 <span class="n">${won(sum)}${usd ? ` + $${usd}` : ''}</span></h3>${items.map(s => `<div class="it" data-open="${s.id}" style="cursor:pointer"><span>${esc(s.name)}</span><b>${money(s.fee, s.currency)}</b></div>`).join('')}</div>`; }).join('')}
    ${yearly.length ? `<div class="d"><h3>이달 갱신(연간) <span class="n">${won(yearly.filter(s => s.currency !== 'USD').reduce((a, s) => a + Number(s.fee), 0))}</span></h3>${yearly.map(s => `<div class="it" data-open="${s.id}" style="cursor:pointer"><span>${esc(s.name)} <span class="hint">${fmtDate(s.end_date)}</span></span><b>${money(s.fee, s.currency)}</b></div>`).join('')}</div>` : ''}</div>`;
}
function expireHtml(){
  const list = S().filter(s => isOn(s) && s.end_date).sort((a, b) => a.end_date.localeCompare(b.end_date));
  if (!list.length) return '<div class="empty">만료·갱신일이 입력된 항목이 없습니다.</div>';
  return `<div class="hint" style="margin-bottom:8px">만료·갱신일이 가까운 순서입니다. 연간 결제는 갱신 전에 계속 쓸지 확인하세요.</div>
    <div class="tablewrap"><table><thead><tr><th>구분</th><th>항목</th><th>회사</th><th class="num">금액</th><th>만료·갱신일</th><th>결제 수단</th><th>사용자</th></tr></thead><tbody>
    ${list.map(s => `<tr class="row" data-id="${s.id}"><td><span class="cat ${catCls(s.category)}">${esc(s.category || '기타')}</span></td><td><b>${esc(s.name)}</b></td><td><span class="co ${CO_CLS[s.company] || 'c'}">${esc(s.company)}</span></td><td class="num">${feeHtml(s)}</td><td>${expHtml(s.end_date)}</td><td class="hint">${esc(s.pay_method || '')}</td><td class="small">${usersHtml(s)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function bindView(){
  bindSort(sort, renderView, { name: 'asc', category: 'asc', company: 'asc', pay_method: 'asc', users: 'asc' });
  document.querySelectorAll('tr.row[data-id]').forEach(tr => tr.onclick = e => { if (e.target.closest('a, button')) return; openEdit(tr.dataset.id); });
  document.querySelectorAll('[data-eye]').forEach(b => b.onclick = e => { e.stopPropagation(); shown[b.dataset.eye] = !shown[b.dataset.eye]; renderView(); });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async e => { e.stopPropagation(); try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했습니다'); } catch { toast('복사할 수 없습니다. 직접 선택해서 복사하세요', true); } });
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openEdit(el.dataset.open));
}

/* 추가·수정 창 */
function openEdit(id, preset = {}){
  const s0 = id ? S().find(x => x.id === id) : null;
  const d = s0 || { name: '', category: CATS[0], company: COMPANIES[0], vendor: '', fee: '', currency: 'KRW', cycle: '월', billing_day: '', start_date: '', end_date: '', pay_method: '', owner: '', users: '', url: '', login_id: '', password: '', account_id: '', status: '이용중', memo: '', admin_only: false, ...preset };
  const pays = [...new Set(S().map(s => s.pay_method).filter(Boolean))];
  openModal(`${modalHead(s0 ? '구독·정기 지출' : '구독·정기 지출 추가', s0 && !isOn(s0) ? tag('해지', '#e9e9e7', '#5a5a55', true) : '')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>항목 이름 *</label><input id="sName" value="${esc(d.name)}" placeholder="예: 어도비, 사무실 임대료" maxlength="80"></div>
        <div class="f"><label>구분</label><input id="sCat" list="catList" value="${esc(d.category || '')}"><datalist id="catList">${[...new Set([...CATS, ...S().map(s => s.category)])].filter(Boolean).map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div class="f"><label>회사 (누구 돈으로)</label><select id="sCo">${COMPANIES.map(c => `<option ${d.company === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="sec">로그인</div>
      <div class="f3">
        <div class="f"><label>접속 주소</label><input id="sUrl" value="${esc(d.url || '')}" placeholder="예: adobe.co.kr"></div>
        <div class="f"><label>아이디</label><input id="sLogin" value="${esc(d.login_id || '')}" autocomplete="off"></div>
        <div class="f"><label>비밀번호</label><div style="display:flex;gap:4px"><input id="sPw" type="password" value="${esc(d.password || '')}" autocomplete="off" style="flex:1"><button type="button" class="btn sm" id="sPwEye">👁</button></div></div>
      </div>
      <div class="sec">금액·결제</div>
      <div class="f3">
        <div class="f"><label>금액 *</label><div style="display:flex;gap:4px"><select id="sCur" style="width:76px"><option value="KRW" ${d.currency !== 'USD' ? 'selected' : ''}>원</option><option value="USD" ${d.currency === 'USD' ? 'selected' : ''}>$</option></select><input id="sFee" inputmode="decimal" value="${d.fee !== '' && d.fee != null ? Number(d.fee).toLocaleString('en-US') : ''}" placeholder="예: 39,000" style="flex:1"></div></div>
        <div class="f"><label>주기</label><select id="sCycle">${CYCLES.map(c => `<option ${d.cycle === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="f"><label>결제일 (매월/매년 며칠)</label><input type="number" id="sBill" value="${esc(d.billing_day ?? '')}" min="1" max="31" placeholder="예: 10"></div>
      </div>
      <div class="f3">
        <div class="f"><label>결제 수단</label><input id="sPay" list="payList" value="${esc(d.pay_method || '')}" placeholder="예: 하나카드 4312, 계좌 자동이체"><datalist id="payList">${pays.map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>
        <div class="f"><label>결제처 (업체)</label><input id="sVendor" value="${esc(d.vendor || '')}" placeholder="예: Adobe, SK텔레콤"></div>
        <div class="f"><label>구매자 (결제 담당)</label><select id="sOwner"><option value="">미지정</option>${memberOptions(d.owner)}</select></div>
      </div>
      <div class="f"><label>사용자 (쓰는 사람, 쉼표로 여러 명)</label><input id="sUsers" list="userList" value="${esc(d.users || '')}" placeholder="예: 류수연, 김채은 (팀원 이름이면 얼굴 표시)"><datalist id="userList">${members.map(m => `<option value="${esc(m.name)}">`).join('')}<option value="전체 팀원"></datalist></div>
      <div class="f3">
        <div class="f"><label>시작일</label><input type="date" id="sStart" value="${esc(d.start_date || '')}"></div>
        <div class="f"><label>만료·갱신일</label><input type="date" id="sEnd" value="${esc(d.end_date || '')}"></div>
        <div class="f"><label>상태</label><select id="sStatus"><option ${d.status !== '해지' ? 'selected' : ''}>이용중</option><option ${d.status === '해지' ? 'selected' : ''}>해지</option></select></div>
      </div>
      <div class="f"><label>메모</label><textarea id="sMemo" placeholder="플랜 이름, 인원 수, 해지 방법 등">${esc(d.memo || '')}</textarea></div>
      ${isAdmin() ? `<label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="sAdmin" ${d.admin_only ? 'checked' : ''}> 🔒 관리자만 보기</label>` : ''}
      ${s0 ? `<div class="hint">등록: ${esc(s0.created_by || '')} ${fmtDateTime(s0.created_at)}${s0.updated_by ? ` · 수정: ${esc(s0.updated_by)} ${fmtDateTime(s0.updated_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">${s0 && isAdmin() ? '<button class="btn danger left" id="sDel">삭제</button>' : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="sSave">${s0 ? '저장' : '추가'}</button></div>`, { wide: true });
  $('#sName').focus();
  $('#sPwEye').onclick = () => { const p = $('#sPw'); p.type = p.type === 'password' ? 'text' : 'password'; };
  const fee = $('#sFee'); fee.oninput = () => { const v = fee.value.replace(/[^\d.]/g, ''); const n = Number(v); fee.value = v && !isNaN(n) ? (v.endsWith('.') ? v : n.toLocaleString('en-US', { maximumFractionDigits: 2 })) : ''; };
  $('#sSave').onclick = async () => {
    const name = $('#sName').value.trim(); if (!name) { $('#sName').focus(); toast('항목 이름을 입력하세요', true); return; }
    const f = Number(fee.value.replace(/[^\d.]/g, '')) || 0;
    const row = { id: s0 ? s0.id : uid(), name, category: $('#sCat').value.trim() || '기타', company: $('#sCo').value, vendor: $('#sVendor').value.trim() || null,
      fee: f, currency: $('#sCur').value, cycle: $('#sCycle').value, billing_day: $('#sBill').value ? Number($('#sBill').value) : null,
      start_date: $('#sStart').value || null, end_date: $('#sEnd').value || null, pay_method: $('#sPay').value.trim() || null, owner: $('#sOwner').value || null, users: $('#sUsers').value.trim() || null,
      url: $('#sUrl').value.trim() || null, login_id: $('#sLogin').value.trim() || null, password: $('#sPw').value.trim() || null,
      account_id: null, status: $('#sStatus').value, memo: $('#sMemo').value.trim() || null,
      admin_only: $('#sAdmin') ? $('#sAdmin').checked : !!(s0 && s0.admin_only), created_by: s0 ? s0.created_by : me, created_at: s0 ? s0.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('subscriptions', row); toast(s0 ? '저장했습니다' : '추가했습니다');
  };
  const del = $('#sDel'); if (del) del.onclick = async () => { if (confirm(`"${s0.name}" 항목을 삭제할까요? (해지한 것은 삭제 대신 상태를 "해지"로 두면 기록이 남습니다)`)) { closeModal(); await removeRow('subscriptions', s0.id); toast('삭제했습니다'); } };
}

boot({ icon: '💸', title: '구독관리', tables: ['subscriptions'], render, normalize });
</script>
</body>
</html>
