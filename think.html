    // ── 탭(카드) ────────────────────────────────
    // 탭은 고정이 아니라 사용자가 만들고 지우고 넓이를 바꿉니다.
    // 탭 목록: [{ id, title, key, trashKey, width, compact }]
    //   key      : 그 탭의 주제들이 저장되는 자리
    //   trashKey : 그 탭 휴지통이 저장되는 자리
    //   width    : 탭 넓이(px). 끌어서 바꾼 값이 그대로 남습니다
    //   compact  : true 면 제목을 작게 (메모함처럼 참고용 탭)
    const BOARDS_KEY = "boards";
    const MIN_W = 260, MAX_W = 1400, DEFAULT_W = 520;

    function loadBoards() {
      try { return JSON.parse(storeGet(BOARDS_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveBoards(list) { storeSet(BOARDS_KEY, JSON.stringify(list)); }

    // ══ 추출: 적은 내용 전부를 메모장용 텍스트 파일(.txt)로 내려받기 ══
    // 탭마다 주제 → 내용 순서로 적고, 보관함도 뒤에 붙입니다. 휴지통은 뺍니다.
    function pad2(n) { return String(n).padStart(2, "0"); }
    function readList(key) { try { return JSON.parse(storeGet(key)) || []; } catch (e) { return []; } }

    function buildExportText() {
      const d = new Date();
      const stamp = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())
                  + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      const L = [];
      L.push("파고들기  (추출: " + stamp + ")");
      L.push("");

      const all = loadBoards();
      const boards = all.filter(b => !b.archived).concat(all.filter(b => b.archived));
      boards.forEach((board) => {
        const tag = board.archived ? "  [보관한 탭" + (board.archivedAt ? " · " + board.archivedAt : "") + "]" : "";
        if (board.kind === "memo") {
          L.push("================================================");
          L.push("■ " + (board.title || "제목 없음") + "  (메모장)" + tag);
          L.push("================================================");
          L.push("");
          const text = ((readList(board.key)[0] || {}).body || "").replace(/\r\n/g, "\n").trim();
          if (text) text.split("\n").forEach((line) => L.push(line));
          else L.push("(내용 없음)");
          L.push(""); L.push("");
          return;
        }
        const list = readList(board.key);
        const arch = readList(board.key + "_archive");
        L.push("================================================");
        L.push("■ " + (board.title || "제목 없음") + "  (주제 " + list.filter(x => !x.head).length + "개, 보관 " + arch.length + "개)" + tag);
        L.push("================================================");
        L.push("");

        const put = (note, extra) => {
          if (note.head) { L.push("── " + (note.title || "구분") + " ──"); L.push(""); return; }
          L.push("▶ " + (note.title || "제목 없음") + (extra || ""));
          L.push("------------------------------------------------");
          const body = (note.body || "").replace(/\r\n/g, "\n").trim();
          if (body) body.split("\n").forEach((line) => L.push(line));   // 줄마다 따로 넣어야 메모장 줄바꿈으로 통일됨
          else L.push("(내용 없음)");
          const dec = (note.decision || "").replace(/\r\n/g, "\n").trim();
          if (dec) {
            L.push("");
            L.push("◆ 결정");
            dec.split("\n").forEach((line) => L.push("  " + line));
          }
          L.push("");
          L.push("");
        };

        if (!list.length) { L.push("(주제 없음)"); L.push(""); }
        list.forEach((note) => put(note));

        if (arch.length) {
          L.push("[보관함]");
          L.push("");
          arch.forEach((note) => put(note, note.archivedAt ? "  (" + note.archivedAt + " 보관)" : ""));
        }
      });

      return L.join("\r\n");   // 메모장은 \r\n 줄바꿈을 씁니다
    }

    // 글을 메모장용 .txt 파일로 내려받습니다
    function downloadText(name, text) {
      // 맨 앞의 ﻿ 는 UTF-8 표시(BOM). 메모장이 한글을 깨뜨리지 않게 해 줍니다
      const blob = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    // 파일 이름에 못 쓰는 글자(\ / : * ? " < > |)를 빼고 길이를 줄입니다
    function safeFileName(t) {
      return (t || "제목 없음").replace(/[\\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40) || "제목 없음";
    }
    function dateTag() {
      const d = new Date();
      return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes());
    }

    // 전체 추출: 모든 탭
    function exportText() {
      downloadText("파고들기_" + dateTag() + ".txt", buildExportText());
    }

    // 주제 하나만 추출: 제목 + 내용
    function exportNote(note) {
      const body = (note.body || "").replace(/\r\n/g, "\n").trim();
      const L = [note.title || "제목 없음", "------------------------------------------------"];
      if (body) body.split("\n").forEach((line) => L.push(line));
      else L.push("(내용 없음)");
      const dec = (note.decision || "").replace(/\r\n/g, "\n").trim();
      if (dec) {
        L.push("");
        L.push("◆ 결정");
        dec.split("\n").forEach((line) => L.push("  " + line));
      }
      L.push("");
      downloadText(safeFileName(note.title) + "_" + dateTag() + ".txt", L.join("\r\n"));
    }
    document.getElementById("exportBtn").addEventListener("click", exportText);

    function newId() {
      return "b" + Date.now() + Math.random().toString(16).slice(2, 6);
    }

    // 처음 한 번: 예전에 고정으로 박혀 있던 '파고들기'와 '메모함'을 탭 목록으로 옮깁니다.
    // 적어둔 내용은 저장 자리를 그대로 쓰므로 전혀 움직이지 않습니다.
    function migrateBoards() {
      if (storeGet(BOARDS_KEY) !== null) return;

      const list = [];
      if (storeGet("dig") !== null) {
        list.push({
          id: "dig", title: storeGet("digTitle") || "파고들기",
          key: "dig", trashKey: "digTrash", width: 832, compact: false
        });
      }
      if (storeGet("notes") !== null) {
        list.push({
          id: "notes", title: storeGet("memo2Title") || "메모함",
          key: "notes", trashKey: "notesTrash", width: 444, compact: true
        });
      }
      if (!list.length) {
        list.push({
          id: "dig", title: "파고들기",
          key: "dig", trashKey: "digTrash", width: DEFAULT_W, compact: false
        });
      }
      storeSet(BOARDS_KEY, JSON.stringify(list));
    }

    // kind: "topic"(주제형, 기본) 또는 "memo"(메모장형)
    function addBoard(kind) {
      const list = loadBoards();
      const id = newId();
      list.push({
        id: id, title: kind === "memo" ? "새 메모" : "새 탭",
        key: "board_" + id, trashKey: "board_" + id + "_trash",
        width: DEFAULT_W, compact: false,
        kind: kind === "memo" ? "memo" : "topic"
      });
      saveBoards(list);
      drawLayout(id);        // 새 탭의 제목을 바로 고칠 수 있게
    }

    function removeBoard(board) {
      const msg = "'" + board.title + "' 탭을 지울까요?\n" +
                  (board.kind === "memo" ? "적은 메모가 함께 사라집니다. 되돌릴 수 없습니다.\n" : "안에 적은 주제가 모두 함께 사라집니다. 되돌릴 수 없습니다.\n") +
                  "(한 시간마다 남는 백업 파일에는 남아 있습니다)";
      if (!confirm(msg)) return;

      saveBoards(loadBoards().filter(b => b.id !== board.id));
      closeBoard(board.id);
      storeDel(board.key);
      storeDel(board.trashKey);
      storeSet("_touch", String(Date.now()));   // 지운 것도 파일에 반영되도록 한 번 흔들어 줌
      storeDel("_touch");
      drawLayout();
    }

    function setBoardWidth(id, width) {
      const list = loadBoards();
      const b = list.find(x => x.id === id);
      if (!b) return;
      b.width = Math.round(width);
      saveBoards(list);
    }

    // 탭 순서 바꾸기: fromId 탭을 toId 탭의 앞(또는 after 면 뒤)으로 옮깁니다
    let CARD_DRAG = null;   // 지금 끌고 있는 탭의 id
    function moveBoard(fromId, toId, after) {
      if (fromId === toId) return;
      const list = loadBoards();
      const fi = list.findIndex(b => b.id === fromId);
      if (fi < 0) return;
      const item = list.splice(fi, 1)[0];
      let ti = list.findIndex(b => b.id === toId);
      if (ti < 0) return;
      if (after) ti += 1;
      list.splice(ti, 0, item);
      saveBoards(list);
      drawLayout();
    }

    function setBoardTitle(id, title) {
      const list = loadBoards();
      const b = list.find(x => x.id === id);
      if (!b) return;
      b.title = title.trim() || "제목 없음";
      saveBoards(list);
      const chip = document.querySelector('.tab-chip[data-id="' + id + '"] .t');
      if (chip) chip.textContent = b.title;
    }

    // 탭 하나의 화면을 만들어 붙입니다
    function buildCard(board, layout) {
      const card = document.createElement("div");
      card.className = "card" + (board.compact ? "" : " board-big");
      card.style.width = (board.width || DEFAULT_W) + "px";
      card.dataset.width = board.width || DEFAULT_W;   // 원래 넓이 (좁은 화면에서 줄일 때의 기준)

      const top = document.createElement("div");
      top.className = "card-top";

      const headRow = document.createElement("div");
      headRow.className = "card-head";

      // 손잡이(⠿): 끌어서 탭 순서 바꾸기
      const moveBtn = document.createElement("span");
      moveBtn.className = "card-move";
      moveBtn.textContent = "⠿";
      moveBtn.title = "끌어서 탭 순서 바꾸기";
      moveBtn.draggable = true;
      moveBtn.addEventListener("dragstart", (e) => {
        CARD_DRAG = board.id;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "");   // 파이어폭스에서 필요
        try { e.dataTransfer.setDragImage(card, 24, 24); } catch (err) {}
        card.classList.add("card-dragging");
      });
      moveBtn.addEventListener("dragend", () => {
        CARD_DRAG = null;
        card.classList.remove("card-dragging");
        document.querySelectorAll(".card-drop-left, .card-drop-right")
          .forEach(c => c.classList.remove("card-drop-left", "card-drop-right"));
      });
      headRow.appendChild(moveBtn);

      // 다른 탭을 끌어와 이 탭의 왼쪽 반/오른쪽 반에 놓으면 그 앞/뒤로 들어갑니다
      card.addEventListener("dragover", (e) => {
        if (!CARD_DRAG || CARD_DRAG === board.id) return;
        e.preventDefault();
        e.stopPropagation();
        const rect = card.getBoundingClientRect();
        const right = (e.clientX - rect.left) > rect.width / 2;
        card.classList.toggle("card-drop-right", right);
        card.classList.toggle("card-drop-left", !right);
      });
      card.addEventListener("dragleave", (e) => {
        if (!card.contains(e.relatedTarget)) card.classList.remove("card-drop-left", "card-drop-right");
      });
      card.addEventListener("drop", (e) => {
        if (!CARD_DRAG) return;
        e.preventDefault();
        e.stopPropagation();
        const after = card.classList.contains("card-drop-right");
        card.classList.remove("card-drop-left", "card-drop-right");
        document.querySelectorAll(".card.card-dragging").forEach(c => c.classList.remove("card-dragging"));
        const src = CARD_DRAG; CARD_DRAG = null;
        moveBoard(src, board.id, after);
      });

      const h1 = document.createElement("h1");
      h1.contentEditable = "plaintext-only";
      h1.textContent = board.title;
      h1.dataset.placeholder = "제목";
      // 제목은 타이핑을 멈추면 저장, 엔터로 끝내기, Shift+엔터로 줄 바꾸기
      let titleTimer = null;
      const saveTitle = () => { setBoardTitle(board.id, h1.textContent); flashMark(mark); };
      h1.addEventListener("input", () => {
        clearTimeout(titleTimer);
        titleTimer = setTimeout(saveTitle, 600);
      });
      h1.addEventListener("blur", () => { clearTimeout(titleTimer); if (!SKIP_BLUR_SAVE) saveTitle(); });
      h1.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { h1.blur(); return; }
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          clearTimeout(titleTimer);
          saveTitle();
          h1.blur();
        }
      });
      headRow.appendChild(h1);

      const mark = document.createElement("span");
      mark.className = "saved";
      mark.textContent = "저장됨";
      headRow.appendChild(mark);

      const archBtn = document.createElement("button");
      archBtn.className = "card-arch";
      archBtn.textContent = "보관";
      archBtn.title = "끝난 탭을 위쪽 '보관' 줄로 내려둡니다. 언제든 다시 꺼낼 수 있습니다";
      archBtn.addEventListener("click", () => archiveBoard(board.id));
      headRow.appendChild(archBtn);

      const kill = document.createElement("button");
      kill.className = "card-del";
      kill.textContent = "×";
      kill.title = "이 탭 지우기";
      kill.addEventListener("click", () => removeBoard(board));
      headRow.appendChild(kill);

      top.appendChild(headRow);

      const memo = board.kind === "memo";
      let addBtn = null, addHeadBtn = null, list = null, memoBody = null;
      let archHead = null, archTitle = null, archList = null, trashHead = null, trashTitle = null, trashClear = null, trashList = null, foot = null;

      if (!memo) {
        addBtn = document.createElement("button");
        addBtn.className = "notes-add";
        addBtn.textContent = "+ 새 주제";
        top.appendChild(addBtn);

        const addHeadRow = document.createElement("div");
        addHeadRow.className = "add-head-row";
        addHeadBtn = document.createElement("button");
        addHeadBtn.className = "add-head";
        addHeadBtn.textContent = "+ 구분";
        addHeadBtn.title = "'공격'·'수비' 같은 구분 줄을 넣습니다. 끌어서 옮기고, 그 아래로 주제를 끌어다 둡니다";
        addHeadRow.appendChild(addHeadBtn);
        top.appendChild(addHeadRow);
      }

      card.appendChild(top);

      const body = document.createElement("div");
      body.className = "card-body";

      if (memo) {
        memoBody = document.createElement("textarea");
        memoBody.className = "memo-body";
        body.appendChild(memoBody);
      } else {
      list = document.createElement("div");
      body.appendChild(list);

      // 보관함: 생각이 끝난 주제를 내려두는 곳 (휴지통과는 별개입니다)
      // 펼쳤을 때의 목록은 주제들 아래(스크롤 영역 안)에 나옵니다
      archList = document.createElement("div");
      archList.style.display = "none";
      body.appendChild(archList);

      trashList = document.createElement("div");
      trashList.style.display = "none";
      body.appendChild(trashList);

      // 여닫는 글자들은 카드 맨 아래 오른쪽에 한 줄로
      foot = document.createElement("div");
      foot.className = "card-foot";

      archHead = document.createElement("div");
      archHead.className = "section-head";
      archTitle = document.createElement("h2");
      archTitle.textContent = "📦 보관함 (0)";
      archHead.appendChild(archTitle);
      foot.appendChild(archHead);

      trashHead = document.createElement("div");
      trashHead.className = "section-head";
      trashTitle = document.createElement("h2");
      trashTitle.textContent = "🗑 휴지통 (0)";
      trashHead.appendChild(trashTitle);
      foot.appendChild(trashHead);

      trashClear = document.createElement("button");
      trashClear.className = "clear-btn";
      trashClear.textContent = "비우기";
      trashClear.title = "휴지통 비우기";
      foot.appendChild(trashClear);
      }   // (주제형 끝)

      card.appendChild(body);
      if (foot) card.appendChild(foot);

      // 오른쪽 끝을 잡고 끌면 넓이가 바뀝니다
      const grip = document.createElement("div");
      grip.className = "card-grip";
      grip.title = "끌어서 넓이 조절";
      grip.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = card.getBoundingClientRect().width;
        document.body.classList.add("resizing");

        const onMove = (ev) => {
          const w = Math.min(MAX_W, Math.max(MIN_W, startW + (ev.clientX - startX)));
          card.style.width = w + "px";
        };
        const onUp = () => {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          document.body.classList.remove("resizing");
          setBoardWidth(board.id, card.getBoundingClientRect().width);
          card.dataset.width = card.getBoundingClientRect().width;
          flashMark(mark);
          fitLayout();
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
      card.appendChild(grip);

      layout.appendChild(card);

      return { card: card, body: body, h1: h1, mark: mark, addBtn: addBtn, addHeadBtn: addHeadBtn, list: list, memoBody: memoBody,
               archHead: archHead, archTitle: archTitle, archList: archList,
               trashHead: trashHead, trashTitle: trashTitle, trashClear: trashClear,
               trashList: trashList };
    }

    // 탭 전체를 다시 그림. renameId 를 주면 그 탭 제목에 커서를 놓습니다
    // ── 위쪽 탭 띠 ──
    // 탭이 많아져도 화면이 망가지지 않게, 펼쳐 둔 탭(최대 MAX_OPEN 개)만 카드로 보입니다.
    // 어느 탭을 펼쳐 뒀는지는 이 기기에만 기억합니다(컴퓨터·휴대폰이 각자 다르게).
    const OPEN_KEY = "think_open";   // + "_" + 사람 id
    const MAX_OPEN = 3;
    function loadOpen() {
      try { const v = JSON.parse(localStorage.getItem(OPEN_KEY + "_" + (me ? me.id : "x"))); return Array.isArray(v) ? v : null; }
      catch (e) { return null; }
    }
    function saveOpen(ids) { try { localStorage.setItem(OPEN_KEY + "_" + (me ? me.id : "x"), JSON.stringify(ids)); } catch (e) {} }
    // 펼쳐 둔 탭 id 목록 (펼친 순서). 처음이면 앞에서 MAX_OPEN 개
    function openIds(boards) {
      let ids = loadOpen();
      if (!ids) ids = boards.slice(0, MAX_OPEN).map(b => b.id);
      return ids.filter(id => boards.some(b => b.id === id));
    }
    function openBoard(id) {
      const ids = openIds(loadBoards()).filter(x => x !== id);
      ids.push(id);
      while (ids.length > MAX_OPEN) ids.shift();   // 넘치면 가장 먼저 펼친 것부터 접힘
      saveOpen(ids);
    }
    function closeBoard(id) { saveOpen(openIds(loadBoards()).filter(x => x !== id)); }
    function toggleBoard(id) {
      if (openIds(loadBoards()).includes(id)) closeBoard(id); else openBoard(id);
      drawLayout();
    }
    function updateStripVar() {
      const strip = document.getElementById("tabStrip");
      document.body.style.setProperty("--strip", (strip.hidden ? 0 : strip.offsetHeight + 12) + "px");
    }

    // ── 탭 보관: 끝난 탭은 지우지 않고 위쪽 '보관' 줄로 내려둡니다 ──
    function dateText() {
      const d = new Date();
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }
    function archiveBoard(id) {
      const list = loadBoards();
      const b = list.find(x => x.id === id);
      if (!b) return;
      b.archived = true;
      b.archivedAt = dateText();
      saveBoards(list);
      closeBoard(id);
      drawLayout();
    }
    function unarchiveBoard(id) {
      const list = loadBoards();
      const b = list.find(x => x.id === id);
      if (!b) return;
      b.archived = false;
      delete b.archivedAt;
      saveBoards(list);
      openBoard(id);        // 꺼내면 바로 펼쳐 보입니다
      drawLayout();
    }
    let ARCH_ROW_OPEN = false;   // 보관 줄을 펼쳐 보는 중인지 (이 창에서만)

    // 띠와 카드에 보이는 순서: 주제형 먼저, 메모장형 다음 (각각은 탭 목록 순서대로)
    function stripOrder(boards) {
      return boards.filter(b => b.kind !== "memo").concat(boards.filter(b => b.kind === "memo"));
    }

    let CHIP_DRAG = null;   // 끌고 있는 띠 항목의 탭 (id 와 종류)
    function drawStrip(boards, ids) {
      const strip = document.getElementById("tabStrip");
      strip.innerHTML = "";
      strip.hidden = false;

      const active = boards.filter(b => !b.archived);
      const groups = [
        { kind: "topic", label: "📋 주제", list: active.filter(b => b.kind !== "memo") },
        { kind: "memo",  label: "📝 메모", list: active.filter(b => b.kind === "memo") }
      ];
      groups.forEach(g => {
        if (!g.list.length) return;
        const row = document.createElement("div");
        row.className = "strip-group " + g.kind;
        const label = document.createElement("span");
        label.className = "strip-label";
        label.textContent = g.label;
        row.appendChild(label);

        g.list.forEach(b => {
          const on = ids.includes(b.id);
          const chip = document.createElement("button");
          chip.className = "tab-chip" + (on ? " on" : "");
          chip.dataset.id = b.id;
          chip.title = on ? "누르면 접기" : "누르면 펼치기 (한 번에 " + MAX_OPEN + "개까지) · 끌어서 순서 바꾸기";
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = b.title || "제목 없음";
          chip.appendChild(t);
          chip.addEventListener("click", () => toggleBoard(b.id));

          // 끌어서 순서 바꾸기 (같은 줄 안에서만)
          chip.draggable = true;
          chip.addEventListener("dragstart", (e) => {
            CHIP_DRAG = { id: b.id, kind: g.kind };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", "");
            chip.classList.add("dragging");
          });
          chip.addEventListener("dragend", () => {
            CHIP_DRAG = null;
            strip.querySelectorAll(".dragging, .drop-before, .drop-after")
              .forEach(c => c.classList.remove("dragging", "drop-before", "drop-after"));
          });
          chip.addEventListener("dragover", (e) => {
            if (!CHIP_DRAG || CHIP_DRAG.id === b.id || CHIP_DRAG.kind !== g.kind) return;
            e.preventDefault();
            const r = chip.getBoundingClientRect();
            const after = (e.clientX - r.left) > r.width / 2;
            chip.classList.toggle("drop-after", after);
            chip.classList.toggle("drop-before", !after);
          });
          chip.addEventListener("dragleave", () => chip.classList.remove("drop-before", "drop-after"));
          chip.addEventListener("drop", (e) => {
            if (!CHIP_DRAG || CHIP_DRAG.kind !== g.kind) return;
            e.preventDefault();
            const after = chip.classList.contains("drop-after");
            chip.classList.remove("drop-before", "drop-after");
            const src = CHIP_DRAG.id; CHIP_DRAG = null;
            moveBoard(src, b.id, after);
          });
          row.appendChild(chip);
        });
        strip.appendChild(row);
      });

      // 보관 줄: 평소엔 개수만, 누르면 보관한 탭이 펼쳐집니다 (누르면 꺼내기, × 는 완전히 지우기)
      const archived = boards.filter(b => b.archived);
      if (archived.length) {
        const row = document.createElement("div");
        row.className = "strip-group arch";
        const label = document.createElement("button");
        label.className = "strip-label strip-toggle";
        label.textContent = "📦 보관 " + archived.length + "개 " + (ARCH_ROW_OPEN ? "▾" : "▸");
        label.title = "누르면 보관한 탭을 보이거나 숨깁니다";
        label.addEventListener("click", () => { ARCH_ROW_OPEN = !ARCH_ROW_OPEN; drawLayout(); });
        row.appendChild(label);
        if (ARCH_ROW_OPEN) archived.forEach(b => {
          const chip = document.createElement("span");
          chip.className = "tab-chip arch-chip";
          chip.dataset.id = b.id;
          chip.title = "누르면 다시 꺼냅니다" + (b.archivedAt ? " (" + b.archivedAt + " 보관)" : "");
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = (b.kind === "memo" ? "📝 " : "📋 ") + (b.title || "제목 없음");
          chip.appendChild(t);
          chip.addEventListener("click", () => unarchiveBoard(b.id));
          const x = document.createElement("button");
          x.className = "chip-x";
          x.textContent = "×";
          x.title = "완전히 지우기";
          x.addEventListener("click", (e) => { e.stopPropagation(); removeBoard(b); });
          chip.appendChild(x);
          row.appendChild(chip);
        });
        strip.appendChild(row);
      }
      updateStripVar();
    }

    function drawLayout(renameId) {
      const layout = document.getElementById("layout");
      layout.innerHTML = "";

      const boards = loadBoards();
      const active = boards.filter(b => !b.archived);
      if (renameId) openBoard(renameId);           // 새로 만든 탭은 바로 펼쳐 보입니다
      const ids = openIds(active);
      drawStrip(boards, ids);

      const shown = stripOrder(active).filter(b => ids.includes(b.id));
      shown.forEach(board => {
        const el = buildCard(board, layout);
        if (board.kind === "memo") createMemo(board, el);
        else createBoard(board, el);
        if (board.id === renameId) {
          el.h1.focus();
          document.getSelection().selectAllChildren(el.h1);
        }
      });
      if (!shown.length) {
        const p = document.createElement("div");
        p.className = "layout-empty";
        p.textContent = active.length ? "위에서 탭 이름을 누르면 여기에 펼쳐집니다." : "아직 탭이 없습니다. 위 '+ 새 탭'을 눌러보세요.";
        layout.appendChild(p);
      }
      fitLayout();
    }

    // 화면 폭에 맞춰 탭 넓이를 정합니다 (아이패드·휴대폰에서 잘리지 않게)
    //   다 들어감      → 저장된 넓이 그대로
    //   조금 넘침      → 같은 비율로 줄여서 나란히 (fit)
    //   그래도 안 들어감 → 탭 하나씩 화면 가득, 옆으로 밀어 넘김 (swipe)
    const LAYOUT_GAP = 20, PAGE_SIDE = 40, FIT_MIN_W = 280;
    function fitLayout() {
      const cards = Array.from(document.querySelectorAll("#layout > .card"));
      document.body.classList.remove("fit", "swipe");
      if (!cards.length) return;

      const want = cards.map(c => Number(c.dataset.width) || DEFAULT_W);
      const gaps = LAYOUT_GAP * (cards.length - 1);
      const avail = document.documentElement.clientWidth - PAGE_SIDE;
      const sum = want.reduce((a, b) => a + b, 0);

      if (sum + gaps <= avail) {
        cards.forEach((c, i) => { c.style.width = want[i] + "px"; });
        return;
      }
      const factor = (avail - gaps) / sum;
      const scaled = want.map(w => Math.floor(w * factor));
      if (scaled.every(w => w >= FIT_MIN_W)) {
        document.body.classList.add("fit");
        cards.forEach((c, i) => { c.style.width = scaled[i] + "px"; });
        return;
      }
      document.body.classList.add("swipe");
      cards.forEach(c => { c.style.width = ""; });   // 넓이는 CSS(body.swipe .card)가 정함
    }
    // 폭이 바뀌면(회전 등) 펼쳐 둔 글 칸의 높이도 새 폭에 맞춰 다시 잽니다
    function regrowAll() {
      document.querySelectorAll("textarea.note-body").forEach(ta => {
        ta.style.height = "auto";
        ta.style.height = (ta.scrollHeight + 2) + "px";
      });
    }
    let fitTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { updateStripVar(); fitLayout(); regrowAll(); }, 80);
    });

    function flashMark(mark) {
      if (!mark) return;
      mark.classList.add("show");
      clearTimeout(mark._timer);
      mark._timer = setTimeout(() => mark.classList.remove("show"), 1500);
    }

    // ── 탭 하나의 속(주제 목록) ─────────────────
    // 제목만 죽 보이다가 제목을 한 번 누르면 아래로 펼쳐지고,
    // 두 번 누르면 이름을 고칩니다. 끌어다 순서를 바꿀 수 있고,
    // 지운 것은 그 탭의 휴지통에 모입니다.
    // 끌기 상태는 탭 전체가 함께 씁니다. 그래야 다른 탭 위에 놓았을 때 어디서 왔는지 압니다.
    let DRAG = null;            // { key: 출발 탭의 저장 자리, idx: 그 탭에서의 자리 번호 }
    const BOARD_API = {};       // 저장 자리(key) → 그 탭의 load/save/draw

    // ── 메모장형 탭: 제목 아래가 통째로 글 칸 ──
    // 저장은 주제형과 같은 자리(B.key)에 항목 하나짜리 목록으로 둡니다. (엇갈린 저장 합치기가 항목 단위라서)
    function createMemo(B, el) {
      const ta = el.memoBody;
      const load = () => { try { return JSON.parse(storeGet(B.key)) || []; } catch (e) { return []; } };
      const item = load()[0];
      ta.value = (item && item.body) || "";

      const grow = () => {
        ta.style.height = "auto";
        ta.style.height = Math.max(ta.scrollHeight + 2, el.body.clientHeight - 4) + "px";
      };
      let timer = null;
      const save = () => {
        const all = load();
        const cur = all[0] || { id: memoItemId(B.key) };
        if (cur.id === "memo") cur.id = memoItemId(B.key);
        if ((cur.body || "") === ta.value) return;
        cur.body = ta.value;
        storeSet(B.key, JSON.stringify([cur]));
        flashMark(el.mark);
      };
      ta.addEventListener("input", () => { grow(); clearTimeout(timer); timer = setTimeout(save, 600); });
      ta.addEventListener("blur", () => { clearTimeout(timer); if (!SKIP_BLUR_SAVE) save(); });
      setTimeout(grow, 0);

      // 다른 창에서 고친 내용이 오면 다시 그릴 때 불러옵니다
      BOARD_API[B.key] = { load: load, save: (l) => storeSet(B.key, JSON.stringify(l)), draw: () => {
        const it = load()[0];
        if (document.activeElement !== ta) { ta.value = (it && it.body) || ""; grow(); }
      } };
    }

    function createBoard(B, el) {
      let trashOpen = false;
      let renameNext = null;    // 새로 만든 직후 바로 이름을 고칠 항목
      let focusBodyNext = null; // 제목에서 엔터를 친 뒤 생각 칸으로 커서를 보낼 항목
      let lastDoneBody = null;  // 탭으로 완료한 항목. Shift+탭이면 여기로 되돌아갑니다

      const load      = () => { try { return JSON.parse(storeGet(B.key)) || []; }      catch (e) { return []; } };
      const loadTrash = () => { try { return JSON.parse(storeGet(B.trashKey)) || []; } catch (e) { return []; } };

      // 내용이 바뀌었을 때 ('저장됨' 표시를 띄움)
      function save(list) {
        storeSet(B.key, JSON.stringify(list));
        flashMark(el.mark);
      }
      // 접기/펼치기처럼 내용이 안 바뀌는 저장 (표시를 띄우지 않음)
      function saveQuiet(list) { storeSet(B.key, JSON.stringify(list)); }

      function saveTrash(list) { storeSet(B.trashKey, JSON.stringify(list)); }

      function move(from, to, below) {
        const all = load();
        const item = all.splice(from, 1)[0];
        let target = (to > from) ? to - 1 : to;   // 빼내면서 번호가 하나 밀림
        if (below) target += 1;
        all.splice(target, 0, item);
        save(all);
        draw();
      }

      // 다른 탭에서 끌어온 주제를 이 탭의 to 번째 자리에 넣습니다 (below 면 그 아래)
      function takeFrom(src, to, below) {
        const from = BOARD_API[src.key];
        if (!from) return;
        const srcList = from.load();
        const item = srcList.splice(src.idx, 1)[0];
        if (!item) return;
        from.save(srcList);
        const all = load();
        let target = (to === null) ? all.length : (below ? to + 1 : to);
        all.splice(target, 0, item);
        save(all);
        from.draw();
        draw();
      }
      BOARD_API[B.key] = { load: load, save: save, draw: () => draw() };

      // 항목이 아닌 카드의 빈 자리(빈 탭, 목록 맨 아래)에 놓으면 맨 끝에 붙습니다
      el.body.addEventListener("dragover", (e) => {
        if (!DRAG || e.target.closest(".note-item")) { el.card.classList.remove("drop-into"); return; }
        e.preventDefault();
        el.card.classList.add("drop-into");
      });
      el.body.addEventListener("dragleave", (e) => {
        if (!el.body.contains(e.relatedTarget)) el.card.classList.remove("drop-into");
      });
      el.body.addEventListener("drop", (e) => {
        el.card.classList.remove("drop-into");
        if (!DRAG || e.target.closest(".note-item")) return;
        e.preventDefault();
        const src = DRAG; DRAG = null;
        if (src.key === B.key) move(src.idx, load().length, false);
        else takeFrom(src, null, false);
      });

      function setOpen(id, open) {
        const all = load();
        const n = all.find(x => x.id === id);
        if (!n) return;
        n.open = open;
        saveQuiet(all);
        draw();
      }

      // 지우지 않고 휴지통으로 옮깁니다
      function toTrash(id) {
        const all = load();
        const at = all.findIndex(x => x.id === id);
        if (at === -1) return;
        const bin = loadTrash();
        bin.unshift(all.splice(at, 1)[0]);   // 최근에 지운 것이 맨 위로
        saveTrash(bin);
        save(all);
        draw();
      }

      function restore(i) {
        const bin = loadTrash();
        const item = bin.splice(i, 1)[0];
        if (!item) return;
        const all = load();
        all.unshift(item);
        saveTrash(bin);
        save(all);
        draw();
      }

      function deleteForever(i) {
        const bin = loadTrash();
        const item = bin[i];
        if (!item) return;
        if (!confirm((item.title || "제목 없음") + " 을(를) 완전히 삭제할까요?\n되돌릴 수 없습니다.")) return;
        bin.splice(i, 1);
        saveTrash(bin);
        drawTrash();
      }

      function emptyTrash() {
        const bin = loadTrash();
        if (bin.length === 0) return;
        if (!confirm("휴지통의 " + bin.length + "개를 완전히 삭제할까요?\n되돌릴 수 없습니다.")) return;
        saveTrash([]);
        drawTrash();
      }

      function draw() {
        drawArch();       // 보관함 개수도 같이 갱신
        drawTrash();      // 휴지통 개수도 같이 갱신

        const box = el.list;
        const list = load();
        box.innerHTML = "";

        if (!list.length) {
          const p = document.createElement("div");
          p.className = "notes-empty";
          p.textContent = "아직 없습니다. 위 '+ 새 주제'를 눌러보세요.";
          box.appendChild(p);
          return;
        }

        list.forEach((note, idx) => {
          const item = document.createElement("div");
          item.className = "note-item" + (note.head ? " is-head" : "");

          // ── 끌어다 순서 바꾸기 ──
          item.draggable = true;

          item.ondragstart = (e) => {
            DRAG = { key: B.key, idx: idx };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", "");   // 파이어폭스에서 필요
            item.classList.add("dragging");
          };
          item.ondragend = () => {
            DRAG = null;
            document.querySelectorAll(".card.drop-into").forEach(c => c.classList.remove("drop-into"));
            draw();
          };
          item.ondragover = (e) => {
            if (!DRAG || (DRAG.key === B.key && DRAG.idx === idx)) return;
            e.preventDefault();
            e.stopPropagation();
            el.card.classList.remove("drop-into");
            const rect = item.getBoundingClientRect();
            const below = (e.clientY - rect.top) > rect.height / 2;
            item.classList.toggle("drop-below", below);
            item.classList.toggle("drop-above", !below);
          };
          item.ondragleave = () => item.classList.remove("drop-above", "drop-below");
          item.ondrop = (e) => {
            e.preventDefault();
            const below = item.classList.contains("drop-below");
            item.classList.remove("drop-above", "drop-below");
            e.stopPropagation();
            el.card.classList.remove("drop-into");
            if (!DRAG) return;
            const src = DRAG; DRAG = null;
            if (src.key === B.key) { if (src.idx !== idx) move(src.idx, idx, below); }
            else takeFrom(src, idx, below);
          };

          // ── 제목 줄 ──
          const head = document.createElement("div");
          head.className = "note-head";

          const arrow = document.createElement("span");
          arrow.className = "note-arrow";
          arrow.textContent = note.open ? "▼" : "▶";
          head.appendChild(arrow);

          const tt = document.createElement("span");
          tt.className = "note-title-text";
          tt.textContent = note.title || (note.head ? "구분" : "제목 없음");
          head.appendChild(tt);

          // 이름 고치기 (두 번 눌렀을 때, 또는 새로 만든 직후)
          function startRename() {
            const ti = document.createElement("input");
            ti.className = "note-title-input";
            ti.value = note.title || "";
            ti.placeholder = note.head ? "구분 이름 (예: 공격, 수비)" : "무엇을 고민할지 적어보세요";

            const finish = () => {
              if (SKIP_BLUR_SAVE) return;   // 다시 그리느라 커서를 빼는 중: 바로 뒤에 전체를 새로 그립니다
              const all = load();
              const n = all.find(x => x.id === note.id);
              if (n) {
                n.title = ti.value.trim() || (n.head ? "구분" : "제목 없음");
                if (focusBodyNext === note.id && !n.head) n.open = true;   // 엔터로 넘어가면 생각 칸이 보이게
                save(all);
              }
              draw();
            };

            ti.addEventListener("blur", finish);
            ti.addEventListener("keydown", (e) => {
              if (e.isComposing) return;                        // 한글 조합 중 엔터는 무시
              if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); focusBodyNext = note.id; ti.blur(); }
              if (e.key === "Escape") { ti.value = note.title || ""; ti.blur(); }
            });
            // 입력칸 안에서 누른 건 접기/펼치기로 새지 않게
            ti.addEventListener("click", (e) => e.stopPropagation());
            ti.addEventListener("dblclick", (e) => e.stopPropagation());
            ti.addEventListener("mousedown", () => { item.draggable = false; });
            ti.addEventListener("mouseup", () => { item.draggable = true; });

            tt.replaceWith(ti);
            ti.focus();
            ti.select();
          }

          if (note.head) {
            // 구분 줄: 지우기(×)만. 아래 주제는 그대로 남습니다
            const del = document.createElement("button");
            del.className = "note-del";
            del.textContent = "×";
            del.title = "이 구분 줄 지우기 (아래 주제는 그대로 남습니다)";
            del.addEventListener("click", (e) => {
              e.stopPropagation();
              if (!confirm("'" + (note.title || "구분") + "' 구분 줄을 지울까요?\n아래 주제들은 그대로 남습니다.")) return;
              const all = load();
              const at = all.findIndex(x => x.id === note.id);
              if (at !== -1) { all.splice(at, 1); save(all); draw(); }
            });
            head.appendChild(del);
            head.addEventListener("dblclick", () => startRename());
            item.appendChild(head);
            box.appendChild(item);
            if (renameNext === note.id) { renameNext = null; startRename(); }
            return;
          }

          const exp = document.createElement("button");
          exp.className = "note-archive";
          exp.textContent = "추출";
          exp.title = "이 주제만 메모장용 텍스트 파일(.txt)로 내려받기";
          exp.addEventListener("click", (e) => {
            e.stopPropagation();
            exportNote(note);
          });
          head.appendChild(exp);

          const arch = document.createElement("button");
          arch.className = "note-archive";
          arch.textContent = "보관";
          arch.title = "생각이 끝났으면 보관함으로";
          arch.addEventListener("click", (e) => {
            e.stopPropagation();
            toArchive(note.id);
          });
          head.appendChild(arch);

          const del = document.createElement("button");
          del.className = "note-del";
          del.textContent = "×";
          del.title = "휴지통으로 보내기";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            toTrash(note.id);
          });
          head.appendChild(del);

          // 한 번 누르면 접기/펼치기.
          // 두 번째 누름이 곧바로 이어지면 더블클릭이므로 접지 않고 넘깁니다
          let clickTimer = null;
          head.addEventListener("click", () => {
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
            clickTimer = setTimeout(() => {
              clickTimer = null;
              setOpen(note.id, !note.open);
            }, 200);
          });
          head.addEventListener("dblclick", () => {
            clearTimeout(clickTimer);
            clickTimer = null;
            startRename();
          });

          item.appendChild(head);

          // ── 내용 ──
          if (note.open) {
            const ta = document.createElement("textarea");
            ta.className = "note-body";
            ta.value = note.body || "";

            // 글자를 끌어 선택할 때는 항목이 끌려가지 않게
            ta.addEventListener("mousedown", () => { item.draggable = false; });
            ta.addEventListener("mouseup", () => { item.draggable = true; });

            // 글이 길어지면 칸도 같이 늘어나게
            const grow = () => {
              ta.style.height = "auto";
              ta.style.height = (ta.scrollHeight + 2) + "px";
            };

            let bodyTimer = null;
            const saveBody = () => {
              const all = load();
              const n = all.find(x => x.id === note.id);
              if (!n) return;
              n.body = ta.value;
              save(all);
            };
            ta.addEventListener("input", () => {
              grow();
              clearTimeout(bodyTimer);
              bodyTimer = setTimeout(saveBody, 600);
            });
            ta.addEventListener("blur", () => { clearTimeout(bodyTimer); if (!SKIP_BLUR_SAVE) saveBody(); });

            // 엔터 = 줄바꿈(그대로), 탭 = 완료(저장하고 나감)
            ta.addEventListener("keydown", (e) => {
              if (e.isComposing) return;                        // 한글 조합 중에는 무시
              if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); lastDoneBody = note.id; window.__lastDoneBoard = B.key; ta.blur(); }
            });

            item.appendChild(ta);
            setTimeout(grow, 0);

            // 제목에서 엔터를 쳐서 넘어온 항목이면 생각 칸에 커서를 놓습니다
            if (focusBodyNext === note.id) {
              focusBodyNext = null;
              setTimeout(() => {
                ta.focus();
                ta.setSelectionRange(ta.value.length, ta.value.length);
              }, 0);
            }
          }

          box.appendChild(item);

          // 방금 만든 항목이면 바로 제목을 쓸 수 있게 해줍니다
          if (renameNext === note.id) {
            renameNext = null;
            startRename();
          }
        });
      }


      // ── 보관함 (생각이 끝난 주제를 내려두는 곳) ──
      const ARCH_KEY = B.key + "_archive";
      let archOpen = false;

      const loadArch = () => { try { return JSON.parse(storeGet(ARCH_KEY)) || []; } catch (e) { return []; } };
      const saveArch = (list) => storeSet(ARCH_KEY, JSON.stringify(list));

      // 오늘 날짜를 "2026-09-25" 모양으로
      function todayText() {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      // "2026-09-25" → "9월 25일"
      function dateLabel(s) {
        if (!s) return "";
        const [y, m, d] = s.split("-").map(Number);
        if (!y) return "";
        return m + "월 " + d + "일";
      }

      // 목록 → 보관함
      function toArchive(id) {
        const all = load();
        const at = all.findIndex(x => x.id === id);
        if (at === -1) return;
        const item = all.splice(at, 1)[0];
        item.archivedAt = todayText();
        item.open = false;
        const arch = loadArch();
        arch.unshift(item);          // 최근에 보관한 것이 맨 위로
        saveArch(arch);
        save(all);
        draw();
      }

      // 보관함 → 목록
      function unarchive(i) {
        const arch = loadArch();
        const item = arch.splice(i, 1)[0];
        if (!item) return;
        delete item.archivedAt;
        const all = load();
        all.unshift(item);
        saveArch(arch);
        save(all);
        draw();
      }

      // 보관함 → 휴지통 (아주 지우는 건 휴지통에서 합니다)
      function archiveToTrash(i) {
        const arch = loadArch();
        const item = arch.splice(i, 1)[0];
        if (!item) return;
        const bin = loadTrash();
        bin.unshift(item);
        saveTrash(bin);
        saveArch(arch);
        draw();
      }

      function drawArch() {
        const arch = loadArch();
        el.archTitle.textContent = "📦 보관함 (" + arch.length + ")";

        const box = el.archList;
        box.style.display = archOpen ? "block" : "none";
        box.innerHTML = "";

        if (arch.length === 0) {
          box.innerHTML = '<div class="empty">보관한 것이 없어요</div>';
          return;
        }

        arch.forEach((note, i) => {
          const row = document.createElement("div");
          row.className = "note-trash-row";

          const t = document.createElement("span");
          t.className = "note-trash-title";
          t.textContent = note.title || "제목 없음";
          t.title = (note.body || "").slice(0, 200);   // 마우스를 올리면 내용 미리보기
          row.appendChild(t);

          const when = document.createElement("span");
          when.className = "note-arch-date";
          when.textContent = dateLabel(note.archivedAt);
          row.appendChild(when);

          row.appendChild(makeBtn("restore", "↩", "다시 목록으로", () => unarchive(i)));
          row.appendChild(makeBtn("del", "×", "휴지통으로 보내기", () => archiveToTrash(i)));

          box.appendChild(row);
        });
      }
      function drawTrash() {
        const bin = loadTrash();
        el.trashTitle.textContent = "🗑 휴지통 (" + bin.length + ")";

        const box = el.trashList;
        box.style.display = trashOpen ? "block" : "none";
        box.innerHTML = "";

        if (bin.length === 0) {
          box.innerHTML = '<div class="empty">휴지통이 비어 있어요</div>';
          return;
        }

        bin.forEach((note, i) => {
          const row = document.createElement("div");
          row.className = "note-trash-row";

          const t = document.createElement("span");
          t.className = "note-trash-title";
          t.textContent = note.title || "제목 없음";
          t.title = (note.body || "").slice(0, 200);   // 마우스를 올리면 내용 미리보기
          row.appendChild(t);

          row.appendChild(makeBtn("restore", "↩", "되돌리기", () => restore(i)));
          row.appendChild(makeBtn("del", "×", "완전 삭제", () => deleteForever(i)));

          box.appendChild(row);
        });
      }

      document.addEventListener("keydown", (e) => {
        if (!(e.key === "Tab" && e.shiftKey) || !lastDoneBody || window.__lastDoneBoard !== B.key) return;
        const a = document.activeElement;
        if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
        e.preventDefault();
        const all = load();
        const n = all.find(x => x.id === lastDoneBody);
        if (!n) { lastDoneBody = null; return; }
        if (!n.open) { n.open = true; save(all); }
        focusBodyNext = n.id;   // 다시 그리면서 그 칸에 커서를 놓습니다
        draw();
      });

      el.addBtn.addEventListener("click", () => {
        const all = load();
        const item = { id: newId(), title: "새 주제", body: "", open: true };
        // 새로 만든 것이 맨 위로. 맨 위가 구분 줄(예: 공격)이면 그 바로 아래에
        all.splice(all.length && all[0].head ? 1 : 0, 0, item);
        renameNext = item.id;    // 그리고 바로 제목을 고칠 수 있게
        save(all);
        draw();
      });

      // 구분 줄 추가: 목록 맨 위에 넣고 바로 이름을 고칩니다
      el.addHeadBtn.addEventListener("click", () => {
        const all = load();
        const item = { id: newId(), head: true, title: "구분" };
        all.unshift(item);
        renameNext = item.id;
        save(all);
        draw();
      });

      el.archHead.addEventListener("click", () => {
        archOpen = !archOpen;
        el.archHead.classList.toggle("open", archOpen);
        drawArch();
        if (archOpen) setTimeout(() => el.archList.scrollIntoView({ block: "nearest" }), 0);
      });

      el.trashHead.addEventListener("click", () => {
        trashOpen = !trashOpen;
        el.trashHead.classList.toggle("open", trashOpen);
        drawTrash();
        if (trashOpen) setTimeout(() => el.trashList.scrollIntoView({ block: "nearest" }), 0);
      });

      el.trashClear.addEventListener("click", (e) => {
        e.stopPropagation();
        emptyTrash();
      });

      draw();
    }


    // ── 시작 ──
    // 이 기기에서 들어온 적이 있으면 바로 열고, 아니면 이름 고르는 화면을 띄웁니다
    (async () => {
      let savedId = null;
      try { savedId = localStorage.getItem(LOGIN_KEY); } catch (e) {}
      if (savedId) {
        try { await start(); }
        catch (e) {
          document.getElementById("gate").hidden = false;
          fail("화면을 여는 중 오류: " + (e && e.message ? e.message : e));
        }
      }
      if (!me) await initGate();
    })();
  </script>
</body>
</html>
