<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>파고들기</title>
  <link rel="icon" href="favicon-think.svg?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: "맑은 고딕", sans-serif;
      background: #f4f1ea;
      padding: 44px 20px 32px;
      margin: 0;
    }
    .card {
      background: #fff;
      flex: 0 0 auto;           /* 넓이는 탭마다 직접 정합니다 */
      min-width: 0;
      box-sizing: border-box;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);

      /* 내용이 적어도 카드는 줄어들지 않는 고정 높이 */
      height: calc(100vh - 76px - var(--strip, 0px));
      height: calc(100dvh - 76px - var(--strip, 0px));  /* 아이패드·휴대폰: 주소창을 뺀 실제 보이는 높이. --strip 은 위쪽 탭 띠 높이 */
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }
    /* 카드 위쪽(제목·입력칸)은 고정, 아래쪽은 카드 안에서 스크롤 */
    .card-top { flex: 0 0 auto; }
    .card-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; }

    /* 스크롤 막대를 얇고 연하게 */
    .card-body::-webkit-scrollbar, textarea::-webkit-scrollbar { width: 8px; }
    .card-body::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb {
      background: #e2ddd4; border-radius: 4px;
    }
    .card-body::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track { background: transparent; }

    /* ── 컨디션 · 감정 카드 ── */
    .mood-date {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; color: #999; margin-bottom: 16px;
    }
    .mood-back {
      background: none; color: #c96442; font-size: 12px;
      padding: 0; text-decoration: underline;
    }
    .mood-back:hover { background: none; color: #b0543a; }

    .mood-group { margin-bottom: 14px; }
    .mood-label {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; color: #666; margin-bottom: 7px;
    }
    .mood-score { font-size: 13px; font-weight: bold; color: #c96442; }
    /* 1~10 점수 버튼 한 줄 */
    .scale { display: flex; gap: 3px; }
    .scale button {
      flex: 1 1 0; min-width: 0; padding: 8px 0;
      font-size: 12px; border-radius: 6px;
      background: #f4f1ea; color: #aaa;
    }
    .scale button:hover { background: #e8e2d6; color: #666; }
    .scale button.on { background: #c96442; color: #fff; font-weight: bold; }
    .scale-ends {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #ccc; margin-top: 4px;
    }

    .mood-note {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      font-family: inherit; font-size: 14px;
      border: 1px solid #ddd; border-radius: 8px;
    }
    .mood-sub { font-size: 11px; color: #bbb; margin: 16px 0 8px; }
    .mood-guide { font-size: 11px; color: #ccc; margin-bottom: 10px; }

    /* 최근 30일 막대 그래프 */
    .chart { display: flex; align-items: flex-end; gap: 2px; height: 70px; }
    .chart .day {
      flex: 1 1 0; min-width: 0; height: 100%; cursor: pointer;
      display: flex; align-items: flex-end; gap: 1px;
    }
    .chart .day:hover { background: #faf8f4; }
    .chart .bar { flex: 1 1 0; border-radius: 2px 2px 0 0; }
    .chart .bar.c { background: #c96442; }
    .chart .bar.e { background: #c9a087; }
    .chart .bar.none { background: #efeae1; }
    .chart-legend { display: flex; gap: 12px; font-size: 11px; color: #bbb; margin-top: 6px; }
    .chart-legend i {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 2px; margin-right: 4px;
    }

    /* 날짜별 기록 목록 */
    .mood-list li { cursor: pointer; flex-wrap: wrap; justify-content: space-between; }
    .mood-list li:hover { background: #faf8f4; }
    .mood-list .d { font-size: 13px; color: #888; }
    .mood-list .v { font-size: 13px; color: #555; }
    .mood-list .n { flex-basis: 100%; font-size: 12px; color: #aaa; margin-top: 4px; }
    .mood-list li.on .d, .mood-list li.on .v { color: #c96442; font-weight: bold; }
    .mood-list li.empty { cursor: default; color: #ccc; font-size: 13px; border-bottom: none; }
    .mood-list li.empty:hover { background: none; }


    /* ── 메모함 카드 ── */
    .notes-add { width: 100%; margin-bottom: 4px; font-size: 14px; padding: 11px; }
    .note-item { border-bottom: 1px solid #f0f0f0; }

    /* 제목 줄. 누르면 접혔다 펴집니다 */
    .note-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; cursor: pointer;
    }
    .note-head:hover { background: #faf8f4; }
    .note-arrow { flex-shrink: 0; width: 12px; font-size: 10px; color: #ccc; }
    .note-title-text {
      flex: 1; min-width: 0; font-size: 14px; color: #444; word-break: break-word;
    }
    /* 펼쳤을 때는 제목을 바로 고칠 수 있게 입력칸으로 바뀝니다 */
    .note-title-input {
      flex: 1; min-width: 0; padding: 6px 8px;
      font-family: inherit; font-size: 14px; color: #444;
      border: 1px solid #ddd; border-radius: 6px;
    }
    .note-del {
      flex-shrink: 0; padding: 0 4px; font-size: 15px;
      background: none; color: #ddd;
    }
    .note-del:hover { background: none; color: #c96442; }

    .note-body {
      width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 10px 12px;
      font-family: inherit; font-size: 14px; line-height: 1.8; color: #333;
      background: #fdfcfa; border: 1px solid #eee; border-radius: 8px;
      resize: none; overflow: hidden;      /* 내용에 맞춰 저절로 늘어납니다 */
    }
    .note-body:focus { outline: none; background: #fff; border-color: #ddd; }

    /* 결정 칸: 생각 칸 아래, 고민의 결론을 적는 곳. 회의 때 바로 보이게 주황 테두리 */
    .note-decision-wrap { margin: 0 0 14px; }
    .note-decision-label {
      display: block; margin: 0 0 4px 2px;
      font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #c96442;
    }
    .note-decision {
      width: 100%; box-sizing: border-box; margin: 0; padding: 10px 12px;
      font-family: inherit; font-size: 14px; line-height: 1.8; color: #333;
      background: #fff8f3; border: 1.5px solid #e8c6b6; border-left: 4px solid #c96442; border-radius: 8px;
      resize: none; overflow: hidden;
    }
    .note-decision:focus { outline: none; background: #fff; border-color: #c96442; }
    .note-decision::placeholder { color: #d9b8a8; }
    /* 접힌 주제에 결정이 적혀 있으면 제목 옆에 작은 표시 */
    .note-decided {
      flex-shrink: 0; padding: 1px 7px; font-size: 11px; font-weight: bold;
      color: #fff; background: #c96442; border-radius: 10px;
    }
    .notes-empty { padding: 14px 0; font-size: 13px; color: #ccc; }
    /* 크게 쓰는 탭(board-big)의 주제는 크고 뚜렷하게 */
    .board-big .note-item { border-bottom: 1px solid #e8e4dc; }
    .board-big .note-head { padding: 8px 0; gap: 10px; }
    .board-big .note-arrow { width: 14px; font-size: 11px; color: #c9b8a8; }
    .board-big .note-title-text {
      font-size: 14px; font-weight: 500; color: #2f2f2f; line-height: 1.5;
    }
    .board-big .note-title-input { font-size: 14px; font-weight: 500; color: #2f2f2f; }
    /* 지금 펼쳐서 파고 있는 주제는 색으로 한 번 더 구분 */
    .board-big .note-item:has(.note-body) .note-title-text { color: #c96442; }
    .board-big .note-item:has(.note-body) .note-arrow { color: #c96442; }
    .board-big .note-body { margin-bottom: 18px; font-size: 12px; line-height: 1.9; }

    /* 주제 줄의 '보관' 버튼 */
    .note-archive {
      flex-shrink: 0; padding: 3px 7px; font-size: 11px;
      background: none; color: #d8d2c8;
    }
    .note-head:hover .note-archive { color: #a99d8d; }
    .note-archive:hover { background: #f4f1ea; color: #6b8e5a; }

    /* 보관함 줄의 날짜 */
    .note-arch-date { flex-shrink: 0; font-size: 11px; color: #ccc; margin-right: 4px; }

    /* 구분 줄(공격·수비 같은 소제목). 주제 목록 안에 끼워 넣고, 그 아래로 주제를 끌어다 둡니다 */
    .note-item.is-head { border-bottom: none; margin-top: 14px; }
    .note-item.is-head:first-child { margin-top: 0; }
    .note-item.is-head .note-head { padding: 6px 0 4px; cursor: grab; border-bottom: 2px solid #c96442; }
    .note-item.is-head .note-head:hover { background: none; }
    .note-item.is-head .note-arrow { display: none; }
    .note-item.is-head .note-title-text,
    .board-big .note-item.is-head .note-title-text {
      font-size: 13px; font-weight: bold; color: #c96442; letter-spacing: 2px; text-transform: uppercase;
    }
    .note-item.is-head .note-title-input,
    .board-big .note-item.is-head .note-title-input { font-size: 13px; font-weight: bold; color: #c96442; }
    .note-item.is-head .note-del { color: #e8ddd3; }
    /* '+ 구분' 작은 단추 (새 주제 단추 아래 오른쪽) */
    .add-head-row { display: flex; justify-content: flex-end; margin: 0 0 4px; }
    .add-head { padding: 2px 6px; font-size: 11px; background: none; color: #c9b8a8; }
    .add-head:hover { background: none; color: #c96442; }

    /* 메모 휴지통 목록 */
    .note-trash-row {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 0; border-bottom: 1px solid #f4f4f4;
    }
    .note-trash-title {
      flex: 1; min-width: 0; font-size: 13px; color: #bbb;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 메모를 끌어다 순서 바꾸는 중 */
    .note-item.dragging { opacity: 0.35; }
    .note-item.drop-above { box-shadow: inset 0 3px 0 #c96442; }
    .note-item.drop-below { box-shadow: inset 0 -3px 0 #c96442; }
    .card.drop-into { box-shadow: 0 0 0 2px #c96442, 0 4px 24px rgba(0,0,0,0.08); }
    /* 오른쪽 위 저장 상태 표시 */
    .store-status {
      position: fixed; top: 7px; right: 20px; z-index: 50;
      font-size: 12px; color: #aaa;
    }
    .store-status.warn {
      padding: 5px 10px; border-radius: 6px;
      background: #c96442; color: #fff;
    }
    .store-status button {
      margin-left: 8px; padding: 3px 8px; font-size: 12px;
      background: #fff; color: #c96442;
    }
    .store-status button:hover { background: #f4f1ea; }

    /* 위쪽 줄: 새 탭 버튼과 저장 상태 */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 20px; gap: 12px;
    }
    .add-board {
      padding: 5px 12px; font-size: 12px;
      background: #fff; color: #c96442; border: 1px solid #e2ddd4;
    }
    .add-board:hover { background: #c96442; color: #fff; }
    .topbar-left { display: flex; align-items: center; gap: 8px; position: relative; }

    /* ── 위쪽 탭 띠: 모든 탭 이름이 늘어서고, 누른 탭만 아래에 펼쳐집니다 ── */
    .tab-strip { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
    .strip-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .strip-label {
      flex-shrink: 0; min-width: 58px; font-size: 12px; font-weight: bold; color: #b5a494;
      user-select: none;
    }
    .strip-group.memo .tab-chip.on { background: #6b8e5a; border-color: #6b8e5a; }   /* 메모장형은 초록 */
    .strip-group.memo .tab-chip.on:hover { background: #5a7a4a; }
    .strip-group.memo .tab-chip:hover { border-color: #6b8e5a; color: #6b8e5a; }
    .strip-group.memo .tab-chip.on:hover { color: #fff; }
    .tab-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 260px;
      padding: 5px 12px; font-size: 13px; font-family: inherit;
      background: #fff; color: #666; border: 1px solid #e2ddd4; border-radius: 999px;
      cursor: pointer; user-select: none;
    }
    .tab-chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-chip:hover { border-color: #c96442; color: #c96442; }
    .tab-chip.on { background: #c96442; border-color: #c96442; color: #fff; }
    .tab-chip.on:hover { background: #b5563a; color: #fff; }
    .tab-chip.dragging { opacity: 0.4; }
    .tab-chip.drop-before { box-shadow: -3px 0 0 #c96442; }
    .tab-chip.drop-after  { box-shadow:  3px 0 0 #c96442; }
    .tab-strip .strip-hint { margin-left: 6px; font-size: 11px; color: #bbb; }
    .layout-empty { padding: 60px 0; text-align: center; font-size: 14px; color: #bbb; }
    body.swipe .tab-strip { padding: 0 12px; }

    /* 메모장형 탭: 제목 아래가 통째로 글 칸 */
    .memo-body {
      width: 100%; box-sizing: border-box; min-height: 100%; margin: 0; padding: 12px 14px;
      font-family: inherit; font-size: 12px; line-height: 1.9; color: #333;
      background: #fdfcfa; border: 1px solid #eee; border-radius: 8px;
      resize: none; overflow: hidden;
    }
    .memo-body:focus { outline: none; background: #fff; border-color: #ddd; }

    /* 탭을 나란히 놓는 틀. 넓이를 직접 정하므로 넘치면 옆으로 넘겨서 봅니다 */
    .layout {
      display: flex; gap: 20px; align-items: stretch;
      width: max-content; margin: 0 auto;
    }

    /* ── 화면이 좁을 때 (아이패드·휴대폰) ──
       fit   : 탭들을 화면 폭에 맞게 같은 비율로 줄여서 나란히 둡니다
       swipe : 그래도 안 들어가면(휴대폰) 탭 하나가 화면을 다 쓰고, 옆으로 밀어 넘깁니다
       어느 쪽인지는 fitLayout() 이 화면 폭을 재서 정합니다 */
    body.fit .card, body.swipe .card { padding: 18px; }
    body.fit .card-grip, body.swipe .card-grip { display: none; }
    body.swipe { padding-left: 0; padding-right: 0; }
    body.swipe .layout {
      width: 100%; box-sizing: border-box; gap: 12px; padding: 0 12px;
      overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    body.swipe .card { flex: 0 0 calc(100% - 24px); scroll-snap-align: start; }
    body.swipe .card:last-child { scroll-snap-align: end; }

    /* 터치 기기: 입력칸 글자가 16px보다 작으면 iOS 가 화면을 저절로 확대해서 틀어집니다 */
    @media (hover: none) and (pointer: coarse) {
      .gate-box input, .note-title-input, .note-body,
      .board-big .note-body, .board-big .note-title-input { font-size: 14px; }
      .board-big .note-title-input { font-size: 14px; }
      .card-head h1 { font-size: 19px; }
      .topbar .store-status { max-width: 40vw; }
    }

    /* 탭 오른쪽 끝을 잡고 끌면 넓이가 바뀝니다 */
    .card { position: relative; }
    .card-grip {
      position: absolute; top: 0; right: -10px; width: 20px; height: 100%;
      cursor: col-resize; z-index: 5; touch-action: none;
    }
    .card-grip::after {
      content: ""; position: absolute; top: 50%; left: 9px;
      width: 2px; height: 40px; margin-top: -20px;
      background: #e2ddd4; border-radius: 1px; opacity: 0;
      transition: opacity 0.15s;
    }
    .card-grip:hover::after { opacity: 1; }
    body.resizing { cursor: col-resize; user-select: none; }

    /* 탭 제목 왼쪽 손잡이(⠿)를 끌어서 다른 탭 위에 놓으면 탭 순서가 바뀝니다 */
    .card-move {
      flex: 0 0 auto; align-self: center; margin-right: 6px;
      font-size: 16px; line-height: 1; color: #e5e0d8;
      cursor: grab; user-select: none; -webkit-user-select: none;
    }
    .card-move:hover { color: #c96442; }
    .card-move:active { cursor: grabbing; }
    .card.card-dragging { opacity: 0.35; }
    .card.card-drop-left  { box-shadow: -5px 0 0 #c96442, 0 4px 24px rgba(0,0,0,0.08); }
    .card.card-drop-right { box-shadow:  5px 0 0 #c96442, 0 4px 24px rgba(0,0,0,0.08); }
    body.swipe .card-move { display: none; }   /* 휴대폰(한 탭씩 넘겨 보기)에서는 끌 수 없으므로 숨김 */

    /* 탭 지우기 (제목 줄 오른쪽 끝) */
    .card-del {
      padding: 0 2px; margin-left: 8px; font-size: 15px;
      background: none; color: #e5e0d8;
    }
    .card-del:hover { background: none; color: #c96442; }
    /* 탭 보관 단추 (× 왼쪽). 끝난 탭을 위쪽 '보관' 줄로 내려둡니다 */
    .card-arch {
      flex-shrink: 0; margin-left: 8px; padding: 2px 8px; font-size: 11px;
      background: none; color: #d8d2c8; border: 1px solid transparent; border-radius: 6px;
    }
    .card-arch:hover { background: #f4f1ea; color: #6b8e5a; border-color: #e2ddd4; }
    /* 보관 줄 */
    .strip-toggle { background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
    .strip-toggle:hover { color: #c96442; }
    .arch-chip { background: #f4f1ea; color: #a99d8d; border-color: #e8e3da; cursor: pointer; }
    .arch-chip:hover { border-color: #6b8e5a; color: #6b8e5a; }
    .chip-x { padding: 0 2px; margin-left: 2px; font-size: 13px; line-height: 1; background: none; border: none; color: #cfc8bd; cursor: pointer; }
    .chip-x:hover { color: #c96442; }

    h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.6; }

    /* ── 왼쪽: 연간 목표 카드 ── */
    .card-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-head h1 { margin: 0; flex: 1 1 auto; min-width: 0; text-align: left; }   /* 제목은 왼쪽 정렬 */
    .card-head.tight { margin-bottom: 8px; }

    /* 클릭해서 고치는 제목 */
    h1[contenteditable] {
      white-space: pre-line;               /* 줄바꿈을 그대로 살림 */
      cursor: text; outline: none;
      padding: 3px 6px; margin-left: -6px; border-radius: 6px;
    }
    h1[contenteditable]:hover { background: #faf8f4; }
    h1[contenteditable]:focus { background: #fff; box-shadow: 0 0 0 1px #c96442; }
    h1[contenteditable]:empty::before {
      content: attr(data-placeholder); color: #d4cfc6;
    }
    .saved {
      font-size: 12px; color: #6b8e5a;
      opacity: 0; transition: opacity 0.3s;
    }
    .saved.show { opacity: 1; }
    .note {
      flex: 1 1 auto; min-height: 0;      /* 카드 높이를 꽉 채우고 */
      overflow-y: auto;                    /* 길어지면 이 안에서만 스크롤 */
      width: 100%; box-sizing: border-box;
      resize: none;
      font-family: inherit; font-size: 15px; line-height: 1.9; color: #333;
      background: #faf8f4; padding: 14px; border-radius: 10px;
      border: 1px solid transparent; outline: none;
    }
    .note:hover { border-color: #eee; }
    .note:focus { border-color: #c96442; background: #fff; }
    .note::placeholder { color: #c4c0b8; }
    .date {
      display: flex; align-items: baseline; justify-content: space-between;
      color: #999; font-size: 14px; margin-bottom: 24px;
    }
    #clock { font-size: 17px; color: #c96442; letter-spacing: 0.5px; }
    .row { display: flex; gap: 8px; margin-bottom: 20px; }
    /* 글자 입력칸에만 적용 (예전엔 그냥 input 이라 체크박스까지 늘어났었음) */
    .row input, .sub-input input {
      flex: 1; padding: 12px; font-size: 15px; min-width: 0;
      border: 1px solid #ddd; border-radius: 8px;
    }
    select {
      padding: 12px 6px; font-size: 14px; cursor: pointer;
      border: 1px solid #ddd; border-radius: 8px; background: #fff;
    }
    button {
      padding: 12px 18px; font-size: 15px; cursor: pointer;
      border: none; border-radius: 8px;
      background: #c96442; color: #fff;
    }
    button:hover { background: #b0543a; }
    ul { list-style: none; padding-left: 0; padding-right: 0; margin: 0; }
    li {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid #f0f0f0;
      text-align: left;
    }
    /* 체크박스: 브라우저 기본 여백을 없애고 크기를 고정해서 줄을 맞춤 */
    li input[type="checkbox"] {
      width: 18px; height: 18px; margin: 0; flex-shrink: 0;
      accent-color: #c96442; cursor: pointer;
    }
    li .text { flex: 1; text-align: left; min-width: 0; word-break: break-word; }

    /* 메인 목록은 '한 줄 + 하위 할일'을 담아야 해서 세로로 쌓음 */
    #list > li { display: block; padding: 0; }
    .row-main { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
    .row-main .text { cursor: grab; }

    /* 더블클릭해서 고칠 때 나오는 입력칸 */
    .edit {
      flex: 1; min-width: 0; font-size: 15px; padding: 5px 8px;
      border: 1px solid #c96442; border-radius: 6px; outline: none;
    }
    .subs .edit { font-size: 14px; padding: 3px 6px; }

    /* 드래그로 순서 바꾸기 */
    #list > li.dragging { opacity: 0.35; }
    #list > li.drop-above { box-shadow: inset 0 3px 0 #c96442; }
    #list > li.drop-below { box-shadow: inset 0 -3px 0 #c96442; }
    li.done .row-main .text { text-decoration: line-through; color: #bbb; }

    /* 하위 할일 */
    .subs { margin: 0 0 6px; }
    .subs li {
      padding: 5px 0 5px 28px; border-bottom: none; font-size: 14px;
    }
    .subs .text { color: #666; }
    .subs li.done .text { text-decoration: line-through; color: #ccc; }
    .add-sub { background: none; color: #ccc; font-size: 17px; padding: 0 4px; flex-shrink: 0; }
    .add-sub:hover { background: none; color: #c96442; }
    .progress { font-size: 11px; color: #aaa; flex-shrink: 0; }

    /* 하위 할일 입력칸 */
    .sub-input { display: flex; gap: 6px; padding: 2px 0 10px 28px; }
    .sub-input input { padding: 8px 10px; font-size: 14px; }
    .sub-input button { padding: 8px 14px; font-size: 13px; }

    /* 카테고리 태그 — 폭을 고정해서 뒤따르는 글자들이 한 줄로 맞게 함 */
    .tag {
      font-size: 11px; padding: 3px 8px; border-radius: 20px;
      color: #fff; white-space: nowrap; flex-shrink: 0;
      min-width: 46px; text-align: center; box-sizing: content-box;
    }
    .tag.blank { background: none !important; }
    li.done .row-main .tag { opacity: 0.35; }
    /* 카테고리가 바뀌는 줄에 여유 간격 */
    li.group-start { margin-top: 10px; }
    .del {
      background: none; color: #ccc; font-size: 18px; padding: 0 0 0 8px;
    }
    .del:hover { background: none; color: #c96442; }
    .empty { color: #bbb; text-align: center; padding: 24px 0; }

    /* 이월된 항목에 붙는 '3일째' 표시 */
    .days {
      font-size: 11px; color: #c9a087; flex-shrink: 0;
      border: 1px solid #e8d5c8; border-radius: 4px; padding: 1px 5px;
    }
    li.done .days { opacity: 0.3; }

    /* 완료 보관함 · 휴지통 공통 머리글 */
    /* 카드 맨 아래 한 줄: 📦 보관함 (n) · 🗑 휴지통 (n) · 비우기 (오른쪽 정렬) */
    .card-foot {
      flex: 0 0 auto; display: flex; justify-content: flex-end; align-items: center; gap: 14px;
      margin-top: 6px; padding-top: 10px; border-top: 1px solid #eee;
    }
    .section-head { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .section-head h2 { margin: 0; font-size: 12px; color: #aaa; font-weight: normal; }
    .section-head:hover h2 { color: #c96442; }
    .section-head.open h2 { color: #6b8e5a; }
    .clear-btn {
      background: none; color: #bbb; font-size: 12px; padding: 2px 6px;
    }
    .clear-btn:hover { background: none; color: #c96442; }

    /* 보관함 안의 날짜 머리글 */
    .date-head {
      font-size: 13px; color: #999; cursor: pointer; user-select: none;
      padding: 10px 0 6px;
    }
    .date-head:hover { color: #666; }

    /* 보관함·휴지통 항목은 체크박스가 없으므로 그만큼 밀어서 위 목록과 줄을 맞춤 */
    #trashList li, #archiveBox li { padding-left: 28px; }
    #trashList li .text, #archiveBox li .text { color: #bbb; }
    #trashList li .tag, #archiveBox li .tag { opacity: 0.5; }
    .restore { background: none; color: #ccc; font-size: 15px; padding: 0 6px; }
    .restore:hover { background: none; color: #6b8e5a; }
    /* 숨김 지시가 디자인 규칙(display)에 밀리지 않도록 못을 박습니다.
       이것 때문에 로그인 성공 후에도 로그인 창이 화면을 덮고 있었습니다. */
    [hidden] { display: none !important; }

    /* ── 로그인 화면 ── */
    .gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: #f4f1ea;
    }
    .gate-box {
      width: 320px; max-width: calc(100vw - 40px);
      background: #fff; border-radius: 16px; padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .gate-box h1 { margin: 0 0 4px; font-size: 20px; }
    .gate-box .hint { font-size: 12px; color: #aaa; margin-bottom: 20px; line-height: 1.7; }
    .gate-box input {
      width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 11px 12px;
      font-family: inherit; font-size: 14px;
      border: 1px solid #ddd; border-radius: 8px;
    }
    .gate-box button { width: 100%; margin-top: 6px; }
    .gate-msg { margin-top: 12px; font-size: 12px; color: #c96442; line-height: 1.6; }
    /* 로그인: 이름 고르기 (비즈홈과 같은 모양) */
    .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .name-btn {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      font-size: 14px; font-weight: 500; color: #333; text-align: left;
      background: #fff; border: 1px solid #e2ddd4; border-radius: 12px; cursor: pointer; transition: all .12s;
    }
    .name-btn:hover { border-color: #c96442; background: #fdf6f2; }
    .name-btn.on { border-color: #c96442; background: #fbeee7; box-shadow: 0 0 0 3px #f3d9cc; }
    .name-btn .av {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: bold;
    }
    .name-btn small { margin-left: auto; font-size: 11px; font-weight: normal; color: #aaa; }
    .gate-loading { font-size: 13px; color: #bbb; }
    .gate-box .pwrow { display: flex; gap: 6px; }
    .gate-box .pwrow input { flex: 1; width: auto; margin: 0; }
    .gate-box .pwrow button { width: auto; margin: 0; padding: 0 18px; white-space: nowrap; }
    .whoami { font-size: 12px; color: #999; }

    /* ── 위쪽 줄 안의 버튼들 ── */
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    /* 저장 표시는 위쪽 줄 안에서 흐름대로 놓습니다 (고정 위치면 로그아웃 버튼과 겹칩니다) */
    .topbar .store-status {
      position: static; top: auto; right: auto;
      max-width: 52vw; text-align: right;
    }
    .logout {
      padding: 4px 10px; font-size: 11px;
      background: none; color: #bbb; border: 1px solid #e5e0d8;
    }
    .logout:hover { background: #fff; color: #c96442; }

    /* ── 처음 한 번: 쓰던 내용 가져오기 ── */
    .import-box {
      margin: 0 auto; max-width: 520px; padding: 28px;
      background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      font-size: 14px; color: #555; line-height: 1.9;
    }
    .import-box h2 { margin: 0 0 10px; font-size: 16px; color: #333; }
  </style>
</head>
<body>
  <!-- 로그인 화면: 비즈홈과 같은 방식 (이름 고르고 비밀번호) -->
  <div class="gate" id="gate">
    <div class="gate-box">
      <h1>파고들기</h1>
      <div class="hint">이름을 고르고 <b>파고들기 전용 PIN</b>으로 들어갑니다. 내용은 PIN 을 아는 본인만 열 수 있습니다. <span style="color:#ccc">(판 <span id="buildStamp"></span>)</span></div>
      <div class="names" id="gateNames"><span class="gate-loading">팀원 목록을 불러오는 중…</span></div>
      <div class="pwrow" id="gatePwRow" hidden>
        <input type="password" id="gatePw" placeholder="파고들기 PIN" autocomplete="current-password">
        <button id="gateBtn">들어가기</button>
      </div>
      <div id="gateNewRow" hidden>
        <div class="hint" style="margin:4px 0 8px;color:#888">처음입니다. 본인 확인을 위해 <b>비즈홈 비밀번호</b>를 넣고, 앞으로 쓸 <b>파고들기 PIN(6자리 이상)</b>을 정하세요. 비즈홈 비밀번호와 다르게 정하세요.</div>
        <input type="password" id="gateBiz" placeholder="비즈홈 비밀번호" autocomplete="off">
        <input type="password" id="gatePin1" placeholder="새 PIN (6자리 이상)" autocomplete="new-password">
        <input type="password" id="gatePin2" placeholder="새 PIN 한 번 더" autocomplete="new-password">
        <button id="gateSetBtn">PIN 정하고 들어가기</button>
      </div>
      <div class="gate-msg" id="gateMsg"></div>
    </div>
  </div>

  <div class="topbar" id="topbar" hidden>
    <div class="topbar-left">
      <button id="addTopic" class="add-board" title="주제형 탭 새로 만들기">+ 주제</button>
      <button id="addMemo" class="add-board" title="메모장형 탭 새로 만들기">+ 메모장</button>
      <button id="exportBtn" class="add-board" title="모든 탭의 주제와 내용을 메모장용 텍스트 파일(.txt) 하나로 내려받습니다">📄 전체 추출</button>
    </div>
    <div class="topbar-right">
      <span id="whoami" class="whoami"></span>
      <div id="storeStatus" class="store-status" hidden></div>
      <button class="logout" id="logout">로그아웃</button>
    </div>
  </div>

  <div id="tabStrip" class="tab-strip" hidden></div>
  <div class="layout" id="layout"></div>

  <div id="importBox" class="import-box" hidden>
    <h2>쓰던 내용 가져오기</h2>
    저장된 내용이 아직 없습니다.<br>
    이 컴퓨터의 <b>바탕화면 › 클로드코드 › TODO-APP › data › todo-data.json</b> 파일을 고르면
    적어두신 주제가 그대로 올라옵니다.<br>
    <input type="file" id="importFile" accept=".json,application/json" style="margin-top:14px">
    <div id="importMsg" style="margin-top:10px; font-size:13px; color:#c96442;"></div>
  </div>

  <script>
    // ── 판 확인 ────────────────────────────────
    // 브라우저가 옛 파일을 들고 있으면 고쳐도 전달되지 않습니다.
    // 그래서 열 때마다 서버의 최신 파일을 살짝 확인하고, 다르면 새로 받아옵니다.
    const BUILD = "2026-10-12 19:50";
    let lastBuildCheck = 0;
    async function checkBuild() {
      if (Date.now() - lastBuildCheck < 60000) return;      // 1분에 한 번이면 충분
      lastBuildCheck = Date.now();
      try {
        const res = await fetch(location.pathname + "?cb=" + Date.now(), { cache: "no-store" });
        const text = await res.text();
        const m = text.match(/const BUILD = "([^"]+)"/);
        if (m && m[1] > BUILD) {
          // 못 보낸 글이 있으면 먼저 보내고 나서 새 판으로 바꿉니다
          if (typeof localDirty !== "undefined" && localDirty) { try { await pushToServer(); } catch (e) {} }
          if (typeof localDirty !== "undefined" && localDirty) return;
          location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
        }
      } catch (e) {}
    }
    checkBuild();
    // 오래 열어 둔 창(특히 휴대폰)이 옛 판으로 계속 저장하는 일을 막기 위해, 돌아올 때마다 다시 확인합니다
    window.addEventListener("focus", checkBuild);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkBuild(); });

    // ══ 저장 장치 ══════════════════════════════════════════
    // 적은 내용은 이 브라우저가 아니라 Supabase(think_docs 표)에 저장됩니다.
    // 그래서 노트북·휴대폰 어디서 열어도 이어서 쓸 수 있습니다.
    //
    // 로그인: 비즈홈과 같은 방식입니다 (2026-10-11 부터). 팀원 표(members)에서 이름을 고르고
    // 비즈홈 비밀번호를 맞히면 들어갑니다. 사람마다 자기 줄(owner = members.id)만 읽고 씁니다.
    // 저장 (2026-10-12 저녁부터): 아무도 직접 못 읽는 think_store 표. 파고들기 전용 PIN 이 맞으면 서버 함수가
    // 기기별 출입증(token)을 주고, 읽기·저장은 그 출입증으로 서버 함수(think_load / think_save / think_hist_add)를 부릅니다.
    // 설정 SQL: sql-think-pin.sql. (그 전에 쓰던 settings 표의 think:<id> 줄은 공개키로 누구나 읽혀서 옮겼습니다)
    // 예전 think_docs 표(2026-10-11 이전)도 그대로 남아 있습니다(사용 안 함).
    const SUPABASE_URL = "https://nflznotjmdqvqtjkzsec.supabase.co";
    const SUPABASE_KEY = "sb_publishable_grDEdL-mRivtPAta6qNVTw_Di-opchT";
    const CACHE_KEY = "think_cache";      // 저장이 실패했을 때를 대비한 이 기기의 임시 보관 (사람마다 따로)
    const HIST_KEY  = "think_hist_at";    // 마지막으로 지난 내용을 남긴 때 (사람마다 따로)
    const LOGIN_KEY = "think_me";         // 이 기기에서 마지막으로 들어온 사람 (다음부터 안 묻기)
    const DEFAULT_PW = "1234";            // 비즈홈의 초기 비밀번호
    const OLD_OWNER_MEMBER = "e55bb2cb-1deb-4c0b-bec3-6ef68008f7cc";   // 박봉수 (예전 혼자 쓰던 때의 임시 보관본을 이어받기용)
    const TOKEN_KEY = "think_token";      // 이 기기의 출입증 (사람마다 따로)
    function tokenKey() { return TOKEN_KEY + "_" + (me ? me.id : "x"); }
    function getToken(id) { try { return localStorage.getItem(TOKEN_KEY + "_" + id) || ""; } catch (e) { return ""; } }
    let TOKEN = "";
    // 서버 함수 부르기. 출입증이 안 통하면(로그아웃·PIN 변경·초기화) 다시 PIN 을 묻습니다 (적은 것은 임시 보관본에 남아 다시 들어오면 합쳐짐)
    async function rpc(name, args) {
      const { data, error } = await sb.rpc(name, args);
      if (error) throw error;
      if (data && data.ok === false && data.err === "session") {
        try { localStorage.removeItem(tokenKey()); } catch (e) {}
        cacheNow(localDirty);
        alert("파고들기 출입증이 끝났습니다. PIN 을 다시 넣어 주세요.");
        location.reload();
        throw new Error("session");
      }
      return data;
    }
    function cacheKey() { return CACHE_KEY + "_" + (me ? me.id : "x"); }

    // ── 메모장 항목 이름표 고치기 ──
    // 메모장형 탭의 글 항목 id 가 예전엔 전부 "memo" 였습니다. 합치기(mergeDocs)는 같은 id 를 한 자리에만 남기므로
    // 메모장이 여러 개면 가장 최근 것 하나만 남고 나머지 글이 지워졌습니다(2026-10-12 아침 사고).
    // 이제 id 는 "memo_<저장자리>" 로 탭마다 다릅니다. 서버·임시 보관본·예전 저장소에서 읽을 때마다 먼저 고칩니다.
    function memoItemId(key) { return "memo_" + key; }
    function fixMemoIds(doc) {
      if (!doc) return doc;
      Object.keys(doc).forEach(k => {
        const l = parseList(doc[k]);
        if (!l) return;
        let changed = false;
        l.forEach(x => { if (x.id === "memo") { x.id = memoItemId(k); changed = true; } });
        if (changed) doc[k] = JSON.stringify(l);
      });
      return doc;
    }
    function histKey()  { return HIST_KEY  + "_" + (me ? me.id : "x"); }

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById("buildStamp").textContent = BUILD;

    let me = null;            // 로그인한 사람
    let STATE = {};           // 내용 전체 (이름 → 글자)
    let saveTimer = null;
    let editSeq = 0;
    let appReady = false;     // 처음 그리는 동안의 저장은 보내지 않음
    let serverStamp = null;   // 마지막으로 서버와 맞춘 시각(updated_at). 다른 창이 그 뒤에 저장했는지 알아내는 기준
    let localDirty = false;   // 이 창에서 고친 뒤 아직 서버에 못 보낸 것이 있는지
    let firstEditAt = 0;      // 연달아 치기 시작한 때. 계속 치는 중이어도 5초에 한 번은 보냅니다
    let pushing = false;      // 지금 서버로 보내는 중인지
    let needRedraw = false;   // 글을 치는 중이라 화면 다시 그리기를 미뤄 둔 상태
    let accessToken = SUPABASE_KEY;   // 창을 닫는 순간 보낼 때 쓰는 열쇠 (공개키 그대로)

    // 앱 안에서는 이 셋으로만 읽고 씁니다
    function storeGet(key) {
      const v = STATE[key];
      return (v === undefined || v === null) ? null : v;
    }
    function storeSet(key, value) {
      STATE[key] = stampChanges(STATE[key], String(value));
      if (!appReady) return;
      markEdited();
    }
    function storeDel(key) {
      delete STATE[key];
      if (!appReady) return;
      markEdited();
    }
    function markEdited() {
      editSeq++;
      localDirty = true;
      cacheNow(true);
      showStoreStatus("saving");
      clearTimeout(saveTimer);
      const now = Date.now();
      if (!firstEditAt) firstEditAt = now;
      // 멈추면 0.7초 뒤에, 계속 치는 중이어도 5초에 한 번은 서버로 보냅니다
      const wait = Math.max(0, Math.min(700, firstEditAt + 5000 - now));
      saveTimer = setTimeout(pushToServer, wait);
    }

    // ── 항목(주제·탭)마다 마지막으로 고친 시각(ts)을 붙입니다 ──
    // 창 두 개가 엇갈려 저장할 때 어느 쪽이 새것인지 고르는 기준입니다.
    // 접기/펼치기(open)만 바뀐 건 내용이 아니므로 시각을 바꾸지 않습니다.
    function parseList(str) {
      if (typeof str !== "string") return null;
      let v; try { v = JSON.parse(str); } catch (e) { return null; }
      if (!Array.isArray(v)) return null;
      if (!v.every(x => x && typeof x === "object" && x.id !== undefined)) return null;
      return v;
    }
    function noteSig(x) {
      const c = Object.assign({}, x);
      delete c.open; delete c.ts;
      return JSON.stringify(c);
    }
    // 서버(또는 합친 결과)에서 본 가장 새 ts. 기기 시계가 느려도 이보다 뒤로 찍어서
    // "내가 본 것 뒤에 고친 것"이 합칠 때 반드시 이기게 합니다 (노트북·데스크탑 시계 차이 대비)
    let MAX_SEEN_TS = 0;
    function noteSeenTs(doc) {
      try {
        Object.keys(doc || {}).forEach(k => {
          const l = parseList(doc[k]);
          if (l) l.forEach(x => { if (x.ts && x.ts > MAX_SEEN_TS) MAX_SEEN_TS = x.ts; });
        });
      } catch (e) {}
    }
    function stampChanges(prevStr, nextStr) {
      const list = parseList(nextStr);
      if (!list) return nextStr;
      const before = {};
      (parseList(prevStr) || []).forEach(x => { before[x.id] = noteSig(x); });
      const now = Math.max(Date.now(), MAX_SEEN_TS + 1);
      MAX_SEEN_TS = now;
      let changed = false;
      list.forEach(x => {
        if (before[x.id] !== noteSig(x)) { x.ts = now; changed = true; }
      });
      return changed ? JSON.stringify(list) : nextStr;
    }

    // ── 두 판을 합칩니다 (내 것 + 서버 것) ──
    // 항목은 id 로 짝을 지어 ts 가 새것을 고르고, 한쪽에만 있는 항목은 살립니다.
    // (지워지는 쪽보다 남는 쪽이 안전합니다.) 같은 항목이 두 자리(예: 목록과 휴지통)에
    // 있으면 ts 가 새 자리에만 남깁니다.
    function mergeDocs(local, server) {
      local = local || {}; server = server || {};
      const out = {};
      const lists = {};
      const keys = new Set(Object.keys(local).concat(Object.keys(server)));
      keys.forEach(k => {
        const a = parseList(local[k]), b = parseList(server[k]);
        if (a && b) {
          const pick = new Map();
          a.forEach(x => pick.set(x.id, x));
          b.forEach(x => {
            const y = pick.get(x.id);
            if (!y || (x.ts || 0) > (y.ts || 0)) pick.set(x.id, x);
          });
          const order = [], seen = new Set();
          a.forEach(x => { if (!seen.has(x.id)) { order.push(pick.get(x.id)); seen.add(x.id); } });
          b.forEach(x => { if (!seen.has(x.id)) { order.push(pick.get(x.id)); seen.add(x.id); } });
          lists[k] = order;
        } else if (a || b) {
          lists[k] = a || b;
        } else {
          out[k] = (server[k] !== undefined) ? server[k] : local[k];
        }
      });
      const where = {};
      Object.keys(lists).forEach(k => lists[k].forEach(x => {
        const w = where[x.id];
        if (!w || (x.ts || 0) > w.ts) where[x.id] = { key: k, ts: x.ts || 0 };
      }));
      Object.keys(lists).forEach(k => {
        out[k] = JSON.stringify(lists[k].filter(x => where[x.id].key === k));
      });
      return out;
    }

    // 이 기기에 임시로 남겨두기 (저장 실패로 날아가는 일이 없게)
    let lastCacheAt = 0;   // 이 창이 마지막으로 임시 보관본을 적은 때
    function cacheNow(dirty) {
      try {
        lastCacheAt = Date.now();
        localStorage.setItem(cacheKey(), JSON.stringify({ data: STATE, dirty: !!dirty, at: lastCacheAt }));
      } catch (e) {}
    }
    // 저장이 끝난 뒤 '보낼 것 없음'으로 바꿀 때: 그 사이 다른 창이 적어 둔 것이 있으면 건드리지 않습니다
    function cacheClearIfMine() {
      const c = readCache();
      if (!c || c.at === lastCacheAt) cacheNow(false);
    }
    function readCache() {
      try { return JSON.parse(localStorage.getItem(cacheKey())); } catch (e) { return null; }
    }

    // 서버로 보내기. 서버가 그 사이(다른 창·다른 기기에서) 바뀌었으면 덮어쓰지 않고
    // 서버 것과 합친 뒤 다시 보냅니다. 그래서 어느 창에서 적었든 내용이 사라지지 않습니다.
    async function pushToServer() {
      clearTimeout(saveTimer);
      firstEditAt = 0;
      if (!me) return;
      if (pushing) { saveTimer = setTimeout(pushToServer, 500); return; }   // 앞 저장이 끝나면 다시
      pushing = true;
      const seq = editSeq;
      try {
        let saved = false;
        for (let attempt = 0; attempt < 3 && !saved; attempt++) {
          const res = await rpc("think_save", { p_token: TOKEN, p_value: STATE, p_expect: serverStamp, p_by: me.name });
          if (!res || res.ok === false) throw new Error((res && res.err) || "저장 실패");
          if (!res.conflict) {
            serverStamp = res.updated_at;
            saved = true;
          } else {
            // 그 사이 다른 창이 먼저 저장했음 → 서버 것과 합친 뒤 다시 시도
            const ok = await pullAndMerge();
            if (!ok) throw new Error("합치기 실패");
          }
        }
        if (!saved) throw new Error("저장 순서가 계속 엇갈림");

        if (seq === editSeq) { cacheClearIfMine(); localDirty = false; }
        showStoreStatus("ok");
        saveHistory();          // 10분에 한 번 지난 내용 남기기
      } catch (e) {
        showStoreStatus("fail");
      } finally {
        pushing = false;
      }
      if (seq !== editSeq) saveTimer = setTimeout(pushToServer, 300);   // 보내는 동안 또 고쳤으면 한 번 더
    }

    // 서버 것을 받아 지금 내용과 합칩니다
    async function pullAndMerge() {
      let data;
      try { data = await rpc("think_load", { p_token: TOKEN, p_full: true }); } catch (e) { return false; }
      if (!data || data.ok === false) return false;
      if (!data.updated_at) { serverStamp = null; return true; }
      fixMemoIds(data.value);
      noteSeenTs(data.value || {});
      const before = JSON.stringify(STATE);
      STATE = mergeDocs(STATE, data.value || {});
      serverStamp = data.updated_at;
      cacheNow(localDirty);
      redrawSoon();
      if (!localDirty && JSON.stringify(STATE) !== before) showStoreStatus("pulled");
      return true;
    }

    // 화면 다시 그리기. 글을 치는 중이면 커서가 날아가지 않게 손을 뗀 뒤로 미룹니다
    let lastInputAt = 0;          // 마지막으로 글자를 친 때
    let SKIP_BLUR_SAVE = false;   // 다시 그리려고 커서를 뺄 때: 칸의 (옛) 내용을 저장하지 않게
    document.addEventListener("input", () => { lastInputAt = Date.now(); }, true);
    function isEditing(a) { return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable); }
    function redrawSoon() {
      const a = document.activeElement;
      if (isEditing(a)) {
        if (Date.now() - lastInputAt < 3000) { needRedraw = true; return; }   // 치는 중이면 손 뗄 때까지 미룸
        // 커서만 둔 채 쉬고 있으면: 칸 내용은 이미 저장돼 있으니, 저장 없이 커서를 빼고 새 내용으로 그립니다
        SKIP_BLUR_SAVE = true;
        try { a.blur(); } catch (e) {}
        SKIP_BLUR_SAVE = false;
      }
      needRedraw = false;
      try { drawLayout(); } catch (e) {}
    }
    document.addEventListener("focusout", () => {
      if (needRedraw) setTimeout(() => { if (needRedraw) redrawSoon(); }, 50);
    });

    // 창으로 돌아왔을 때: 다른 창·기기에서 더 새로 저장한 것이 있으면 받아옵니다
    async function refreshIfChanged() {
      if (!appReady || !me || pushing) return;
      if (localDirty) { pushToServer(); return; }
      try {
        const data = await rpc("think_load", { p_token: TOKEN, p_full: false });
        if (data && data.ok !== false && data.updated_at !== serverStamp) await pullAndMerge();
      } catch (e) {}
    }
    window.addEventListener("focus", refreshIfChanged);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshIfChanged();
      else if (localDirty) pushToServer();          // 다른 탭으로 옮길 때 바로 보냄
    });
    // 창을 켜 둔 채로도 다른 기기(노트북↔PC)에서 고친 내용이 오게: 보이는 동안 20초마다 확인
    // (서버에는 고친 시각 한 칸만 물어보므로 가볍습니다. 바뀌었을 때만 내용을 받습니다)
    setInterval(() => {
      if (document.visibilityState !== "visible") return;
      if (needRedraw) redrawSoon();     // 아까 치는 중이라 미뤄 둔 것이 있으면 먼저
      refreshIfChanged();
    }, 20000);

    // 15초마다: 못 보낸 것이 남아 있으면 다시 보냅니다
    setInterval(() => { if (appReady && localDirty && !pushing) pushToServer(); }, 15000);

    // 10분에 한 번, 지금 내용을 따로 남겨 둡니다 (실수로 지웠을 때 되돌리기용)
    async function saveHistory() {
      const last = Number(localStorage.getItem(histKey()) || 0);
      if (Date.now() - last < 600000) return;
      localStorage.setItem(histKey(), String(Date.now()));
      try {
        await rpc("think_hist_add", { p_token: TOKEN, p_value: STATE });
      } catch (e) {}
    }

    // 창을 닫는 순간: 보통 방식은 창이 닫히면서 끊기므로, 닫혀도 끝까지 가는 방식(keepalive)으로 보냅니다
    function flushOnClose() {
      if (!localDirty || !me || !accessToken || !TOKEN) return;
      clearTimeout(saveTimer);
      const body = JSON.stringify({ p_token: TOKEN, p_value: STATE, p_expect: serverStamp, p_by: me.name });
      if (body.length > 60000) { pushToServer(); return; }     // keepalive 는 64KB 까지만 됩니다
      const url = SUPABASE_URL + "/rest/v1/rpc/think_save";
      try {
        fetch(url, {
          method: "POST", keepalive: true, body: body,
          headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + accessToken,
                     "Content-Type": "application/json", Prefer: "return=minimal" }
        });
        // 결과는 기다릴 수 없습니다. 임시 보관본은 dirty 로 남겨 두어, 다음에 열 때 서버 것과 합쳐 맞춥니다
      } catch (e) {}
    }
    window.addEventListener("pagehide", flushOnClose);

    function showStoreStatus(state) {
      const el = document.getElementById("storeStatus");
      el.hidden = false;
      el.classList.toggle("warn", state === "fail");
      if (state === "ok") {
        const t = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
        el.textContent = "💾 저장됨 · " + t;
      } else if (state === "pulled") {
        const t = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
        el.textContent = "🔄 다른 기기에서 고친 내용 받음 · " + t;
      } else if (state === "saving") {
        el.textContent = "💾 저장 중…";
      } else if (state === "ready") {
        el.textContent = "💾 저장 켜짐";
      } else if (state === "nosave") {
        el.classList.add("warn");
        el.textContent = "⚠ 이 브라우저는 로그인 정보를 저장하지 못합니다(시크릿 모드이거나 사이트 데이터 차단). 지금은 쓸 수 있지만 새로고침하면 다시 로그인해야 합니다.";
      } else if (state === "fail") {
        el.textContent = "⚠ 저장하지 못했습니다. 인터넷 연결을 확인해 주세요. (적은 내용은 이 기기에 남아 있다가 다시 열 때 저장됩니다)";
      }
    }

    // ── 로그인 ────────────────────────────────
    // 이 브라우저가 로그인 정보를 저장할 수 있는지 (시크릿 모드·사이트 데이터 차단이면 못 합니다)
    function storageWorks() {
      try {
        localStorage.setItem("_t", "1");
        localStorage.removeItem("_t");
        return true;
      } catch (e) { return false; }
    }

    // 앱이 어디까지 갔는지 브라우저 콘솔(F12)에 남깁니다
    function dbg(stepName, info) {
      try { console.log("[파고들기] " + stepName, info === undefined ? "" : info); } catch (e) {}
    }
    // 어디까지 갔는지 화면에 그대로 적습니다. 문제가 생기면 이 줄만 보면 압니다.
    function step(t) {
      const el = document.getElementById("gateMsg");
      el.style.color = "#888";
      el.textContent = t;
    }
    function fail(t) {
      const el = document.getElementById("gateMsg");
      el.style.color = "#c96442";
      el.textContent = t;
    }

    // 예상 못한 오류도 화면에 띄웁니다 (조용히 사라지지 않게)
    window.addEventListener("error", (e) => { fail("오류: " + (e.message || e)); dbg("window.onerror", (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || "")); });
    window.addEventListener("unhandledrejection", (e) => {
      const r = e.reason;
      fail("오류: " + (r && r.message ? r.message : r));
      dbg("unhandledrejection", r && r.message ? r.message : String(r));
    });

    // ── 로그인 (비즈홈과 같은 방식) ──
    let MEMBERS = [];        // 비즈홈 팀원 목록
    let loginPick = null;    // 로그인 화면에서 고른 사람

    async function loadMembers() {
      const { data, error } = await sb.from("members")
        .select("id,name,color,title,sort_order").order("sort_order");
      if (error) throw error;
      return data || [];
    }

    function renderNames() {
      const box = document.getElementById("gateNames");
      box.innerHTML = "";
      MEMBERS.forEach(m => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "name-btn" + (loginPick && loginPick.id === m.id ? " on" : "");
        const av = document.createElement("span");
        av.className = "av";
        av.style.background = m.color || "#999";
        av.textContent = (m.name || "?").charAt(0);
        b.appendChild(av);
        b.appendChild(document.createTextNode(m.name || "이름 없음"));
        if (m.title) { const t = document.createElement("small"); t.textContent = m.title; b.appendChild(t); }
        b.addEventListener("click", async () => {
          loginPick = m;
          renderNames();
          document.getElementById("gatePwRow").hidden = true;
          document.getElementById("gateNewRow").hidden = true;
          step("확인 중…");
          try {
            const st = await rpc("think_status", { p_member: m.id });
            if (loginPick !== m) return;
            step("");
            if (st && st.has_pin) {
              document.getElementById("gatePwRow").hidden = false;
              const pw = document.getElementById("gatePw");
              pw.value = "";
              pw.focus();
            } else {
              document.getElementById("gateNewRow").hidden = false;
              ["gateBiz", "gatePin1", "gatePin2"].forEach(id => { document.getElementById(id).value = ""; });
              document.getElementById("gateBiz").focus();
            }
          } catch (e) {
            fail("확인하지 못했습니다: " + (e && e.message ? e.message : e));
          }
        });
        box.appendChild(b);
      });
    }

    async function initGate() {
      try {
        MEMBERS = await loadMembers();
        renderNames();
        if (!MEMBERS.length) fail("비즈홈에 팀원이 아직 없습니다. 비즈홈에서 먼저 등록하세요.");
      } catch (e) {
        fail("팀원 목록을 불러오지 못했습니다: " + (e && e.message ? e.message : e));
      }
    }

    function lockedMsg(r) {
      const t = r && r.until ? new Date(r.until).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }) : "";
      return "여러 번 틀려서 잠시 잠겼습니다." + (t ? " " + t + " 이후에 다시 해 주세요." : " 10분 뒤에 다시 해 주세요.");
    }
    // 처음: 비즈홈 비밀번호 확인 + 파고들기 PIN 정하기
    async function setPin() {
      const biz = document.getElementById("gateBiz").value, p1 = document.getElementById("gatePin1").value, p2 = document.getElementById("gatePin2").value;
      const btn = document.getElementById("gateSetBtn");
      if (!loginPick) { fail("먼저 이름을 고르세요."); return; }
      if (!biz) { fail("비즈홈 비밀번호를 적어주세요."); return; }
      if (p1.length < 6) { fail("PIN 은 6자리 이상으로 정해 주세요."); return; }
      if (p1 !== p2) { fail("새 PIN 두 칸이 서로 다릅니다."); return; }
      if (p1 === biz) { fail("PIN 은 비즈홈 비밀번호와 다르게 정해 주세요."); return; }
      btn.disabled = true;
      try {
        const r = await rpc("think_set_pin", { p_member: loginPick.id, p_bizpw: biz, p_pin: p1 });
        if (!r || !r.ok) {
          const err = r && r.err;
          fail(err === "bizpw" ? "비즈홈 비밀번호가 맞지 않습니다." : err === "locked" ? lockedMsg(r) : err === "has_pin" ? "이미 PIN 이 정해져 있습니다. 새로고침 후 PIN 으로 들어가세요." : err === "short" ? "PIN 은 6자리 이상입니다." : "PIN 을 정하지 못했습니다: " + err);
          return;
        }
        await enter(r.token);
      } catch (e) {
        fail("오류가 났습니다: " + (e && e.message ? e.message : e));
      } finally { btn.disabled = false; }
    }
    async function enter(token) {
      try { localStorage.setItem(TOKEN_KEY + "_" + loginPick.id, token); } catch (e) {}
      TOKEN = token;
      try { localStorage.setItem(LOGIN_KEY, loginPick.id); } catch (e) {}
      step("확인됨. 내용 불러오는 중…");
      await start({ id: loginPick.id, name: loginPick.name });
      if (!document.getElementById("gate").hidden) {
        fail("내용은 불러왔는데 화면이 열리지 않았습니다. 이 문구를 알려주세요.");
        return;
      }
      if (!storageWorks()) showStoreStatus("nosave");
    }

    async function signIn() {
      const pw = document.getElementById("gatePw").value;
      const btn = document.getElementById("gateBtn");
      if (!loginPick) { fail("먼저 이름을 고르세요."); return; }
      if (!pw) { fail("PIN 을 적어주세요."); return; }

      btn.disabled = true;
      btn.textContent = "들어가는 중…";
      try {
        step("① PIN 확인 중…");
        const r = await rpc("think_login", { p_member: loginPick.id, p_pin: pw });
        if (!r || !r.ok) {
          const err = r && r.err;
          fail(err === "pin" ? "PIN 이 맞지 않습니다." + (r.left ? " (" + r.left + "번 더 틀리면 10분 잠김)" : " 10분 동안 잠겼습니다.") : err === "locked" ? lockedMsg(r) : err === "no_pin" ? "아직 PIN 을 정하지 않았습니다. 새로고침 후 다시 이름을 눌러 주세요." : "들어가지 못했습니다: " + err);
          return;
        }
        await enter(r.token);
      } catch (e) {
        fail("오류가 났습니다: " + (e && e.message ? e.message : e));
      } finally {
        btn.disabled = false;
        btn.textContent = "들어가기";
      }
    }

    document.getElementById("gateBtn").addEventListener("click", signIn);
    document.getElementById("gatePw").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
    document.getElementById("gateSetBtn").addEventListener("click", setPin);
    document.getElementById("gatePin2").addEventListener("keydown", (e) => { if (e.key === "Enter") setPin(); });
    document.getElementById("logout").addEventListener("click", async () => {
      if (localDirty) { try { await pushToServer(); } catch (e) {} }
      try { await sb.rpc("think_logout", { p_token: TOKEN }); } catch (e) {}
      try { localStorage.removeItem(tokenKey()); localStorage.removeItem(LOGIN_KEY); } catch (e) {}
      location.reload();
    });

    // ── 내용 불러오기 ─────────────────────────
    async function start(known) {
      // 로그인한 사람 확인: 방금 로그인했으면 그 사람, 아니면 이 기기에 기억해 둔 사람
      let user = known || null;
      if (!user) {
        let savedId = null;
        try { savedId = localStorage.getItem(LOGIN_KEY); } catch (e) {}
        if (savedId) {
          if (!MEMBERS.length) { try { MEMBERS = await loadMembers(); } catch (e) {} }
          const m = MEMBERS.find(x => x.id === savedId);
          if (m && getToken(m.id)) user = { id: m.id, name: m.name };   // 이 기기에 출입증이 있어야 바로 들어감
          else if (!m) { try { localStorage.removeItem(LOGIN_KEY); } catch (e) {} }   // 팀원에서 빠진 사람
        }
      }
      if (!user) {
        document.getElementById("gate").hidden = false;
        return;
      }
      me = user;
      TOKEN = getToken(me.id);

      // 혼자 쓰던 때(2026-10-11 이전)의 임시 보관본은 박봉수 것으로 이어받습니다
      if (me.id === OLD_OWNER_MEMBER) {
        try {
          const old = localStorage.getItem("think_cache");
          if (old && !localStorage.getItem(cacheKey())) localStorage.setItem(cacheKey(), old);
          localStorage.removeItem("think_cache");
          const oldHist = localStorage.getItem("think_hist_at");
          if (oldHist && !localStorage.getItem(histKey())) localStorage.setItem(histKey(), oldHist);
          localStorage.removeItem("think_hist_at");
        } catch (e) {}
      }

      document.getElementById("gate").hidden = true;
      document.getElementById("topbar").hidden = false;
      document.getElementById("whoami").textContent = me.name;

      dbg("A. 로그인확인 통과", me.name);
      if (typeof step === "function") step("④ 내용 불러오는 중…");

      let data = null, error = null;
      try { data = await rpc("think_load", { p_token: TOKEN, p_full: true }); if (!data || data.ok === false) error = new Error((data && data.err) || "알 수 없음"); }
      catch (e) { error = e; }
      if (error) {
        document.getElementById("gate").hidden = false;
        document.getElementById("gateMsg").textContent = "내용을 불러오지 못했습니다: " + (error.message || error);
        dbg("B. 내용 불러오기 실패", error.message || String(error));
        return;
      }

      serverStamp = data.updated_at || null;
      const serverData = fixMemoIds((data && data.value) ? data.value : {});
      noteSeenTs(serverData);
      const cache = readCache();
      if (cache && cache.dirty && cache.data) {
        // 지난번에 저장하지 못하고 남아 있던 내용이 있으면 서버 것과 합쳐 살립니다
        fixMemoIds(cache.data);
        noteSeenTs(cache.data);
        STATE = mergeDocs(cache.data, serverData);
        appReady = true;
        localDirty = true;
        pushToServer();
      } else {
        STATE = serverData;
      }

      dbg("C. 내용 받음", "항목 " + Object.keys(STATE).length + "개");
      if (!Object.keys(STATE).length && me.id === OLD_OWNER_MEMBER) {   // TODO-APP 파일 가져오기는 박봉수에게만 해당
        document.getElementById("importBox").hidden = false;
      }

      // 화면 그리기. 여기서 문제가 나면 빈 화면이 되지 않도록 붙잡아 알립니다
      try {
        migrateBoards();
        dbg("D. 탭 목록 준비", storeGet("boards") || "(없음)");
        drawLayout();
        dbg("E. 화면 그리기 끝", "탭 " + document.querySelectorAll(".card").length + "개");
        document.getElementById("addTopic").addEventListener("click", () => addBoard("topic"));
        document.getElementById("addMemo").addEventListener("click", () => addBoard("memo"));
      } catch (e) {
        const m = (e && e.message) ? e.message : String(e);
        dbg("D~E. 화면 그리기 실패", m + " | " + (e && e.stack ? e.stack.slice(0, 500) : ""));
        document.getElementById("gate").hidden = false;
        document.getElementById("gateMsg").style.color = "#c96442";
        document.getElementById("gateMsg").textContent = "화면을 그리는 중 오류: " + m;
        return;
      }

      appReady = true;
      showStoreStatus(cache && cache.dirty ? "saving" : "ready");
    }

    // ── 처음 한 번: 쓰던 파일에서 가져오기 ────
    document.getElementById("importFile").addEventListener("change", async (e) => {
      const f = e.target.files[0];
      const msg = document.getElementById("importMsg");
      if (!f) return;
      try {
        const text = await f.text();
        const obj = JSON.parse(text);
        const data = obj.data || obj;
        if (typeof data !== "object") throw new Error("모양이 다릅니다");

        STATE = {};
        Object.keys(data).forEach(k => { if (typeof data[k] === "string") STATE[k] = data[k]; });

        appReady = true;
        await pushToServer();
        location.reload();
      } catch (err) {
        msg.textContent = "가져오지 못했습니다: " + err.message;
      }
    });

    // 작은 버튼을 만들어주는 함수
