<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무기술서</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202611241843">
<script src="common.js?v=202611241843"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn.primary{padding:9px 16px;font-size:14px}
  .st{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:600}
  .st.s0{background:#dcfce7;color:#166534}.st.s1{background:#fef3c7;color:#92400e}.st.s2{background:#dbeafe;color:#1e40af}.st.s3{background:#fee2e2;color:#991b1b}
  .need{font-size:11px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:4px;padding:1px 7px;white-space:nowrap}
  .ok{font-size:11px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:4px;padding:1px 7px;white-space:nowrap}
  /* 직무 본문 */
  .jd{display:grid;gap:10px}
  .cmn{display:flex;align-items:flex-start;gap:12px;font-size:12.5px;line-height:1.6;color:var(--fg2);background:var(--bg2);border-radius:8px;padding:7px 12px;white-space:pre-wrap}
  .cmn > div{flex:1;min-width:0}
  .jh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .jh h1{font-size:21px;margin:0;letter-spacing:-.02em}
  .jh .sp{flex:1}
  .lead{font-size:14px;line-height:1.6;color:var(--fg);white-space:pre-wrap;word-break:keep-all}
  .meta{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);padding-bottom:10px;border-bottom:1px solid var(--line)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .cols h3{font-size:12px;color:var(--fg3);font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .cols aside h3:not(:first-child){margin-top:14px}
  .cols h3 .n{font-weight:400}
  /* 담백하게(2026-11-25 대표: 세로로 길면 일이 많아 보임): 상자·줄 구분선 없이 제목 한 줄 + 업무 목록 */
  .gb{margin-bottom:9px}
  .gt{font-weight:700;font-size:14px;line-height:1.5;padding:0 0 1px}
  .du{position:relative;padding-left:14px}
  .gb:not(.one) .du::before{content:'·';position:absolute;left:4px;top:0;color:var(--fg3);line-height:1.55;font-size:13.5px}
  .gb.one .du{padding-left:0}
  .gb.one .dn{font-size:14px}
  .gb.one .dn b{font-weight:700}
  .du summary{list-style:none;cursor:pointer}
  .du summary::-webkit-details-marker{display:none}
  .dl{display:block}
  .dn{font-size:13.5px;font-weight:400;line-height:1.55;word-break:keep-all;color:var(--fg)}
  .dm{padding:2px 0 6px;display:grid;gap:2px;font-size:12.5px;line-height:1.6;color:var(--fg2);white-space:pre-wrap;word-break:break-word}
  .dm b{display:inline-block;min-width:64px;color:var(--fg3);font-weight:600;font-size:12px}
  .ci{font-size:13px;line-height:1.55;padding:1px 0}
  .ci b{font-size:13.5px;font-weight:600}
  .ci .cw{color:var(--fg3);font-size:12px;margin-left:6px}
  .ci p{display:inline;margin:0 0 0 8px;color:var(--fg3);font-size:12px}
  .txt{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:13px;padding:10px 14px;background:var(--bg2);border-radius:10px}
  .memo{font-size:12px;color:var(--fg3);line-height:1.7;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:12px}
  .memo b{color:var(--fg2);margin-right:6px}
  .jf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tw{overflow-x:auto}
  table.jt{width:100%;border-collapse:collapse;font-size:13px}
  table.jt th{text-align:left;font-size:12px;color:var(--fg3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  table.jt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6;word-break:break-word}
  table.jt td.nm{font-weight:600;min-width:150px}
  table.jt td.c{white-space:nowrap}
  /* 고치기 창 */
  .dbox{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--bg2)}
  .dbox .r1{display:grid;grid-template-columns:1fr 100px 110px 100px 32px;gap:8px;align-items:end}
  .dbox .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:640px){.dbox .r1{grid-template-columns:1fr 1fr}.dbox .r2{grid-template-columns:1fr}}
  .dbox label,.cbox label{font-size:11px;color:var(--fg3);display:block;margin-bottom:2px}
  .dbox input,.dbox select,.dbox textarea,.cbox input{width:100%;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;background:var(--bg)}
  .dbox textarea{min-height:58px;line-height:1.5;resize:vertical}
  .cbox{display:grid;grid-template-columns:1fr 1fr 2fr 110px 32px;gap:8px;align-items:end}
  @media(max-width:640px){.cbox{grid-template-columns:1fr 1fr}}
  .xb{border:0;background:none;cursor:pointer;color:var(--fg3);font-size:16px;padding:6px}
  .xb:hover{color:var(--red)}
  .sec{font-size:13px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:8px}
  .sec .sp{flex:1}
  #jSummary,#jReq,#jOnb,#jNote{min-height:70px;line-height:1.6;font-family:inherit}
  /* 사람별 */
  .pp{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;background:var(--bg)}
  .pp .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .pp .ph .sp{flex:1}
  .pp .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
  .pp .row:hover{background:var(--bg2)}
  .pp .row .t{flex:1;font-weight:600}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:120px}
  .bar i{display:block;height:100%;background:var(--blue)}
  .bar.over i{background:var(--red)}
  @media print{.top,.jh .btn,.cmn .btn,.jf,.memo{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   업무기술서 — "직무" 하나가 한 장. 사람이 아니라 자리를 적어 둔다.
   누가 그만둬도 그 자리의 일이 무엇이고, 얼마나 걸리고, 누구와 소통하는지 남아 있게 하려는 화면 (2026-11-24)
   한 장 = { id, title(직무명), dept, holder(지금 담당자), backup(대신 할 수 있는 사람), status, summary,
            duties:[{ group(큰 항목), name, cycle(주기), hours(주당 시간), level(난이도), how(하는 방법), tools(쓰는 시스템), with(소통 상대), caution(주의) }],
            contacts:[{ who, org, about, freq }], requirements(채용 요건), onboarding(인수인계 순서), note,
            verified_by, verified_at(담당자가 내용을 확인한 날), sort_order, created_by, created_at, updated_by, updated_at }
   고치기: 관리자와 그 직무의 지금 담당자. 새로 만들기·삭제: 관리자
================================================================ */
const STATUS = ['재직', '인수인계 중', '채용 중', '공석'];
const CYCLES = ['매일', '매주', '매월', '분기·반기', '수시', '프로젝트'];
const LEVELS = ['쉬움', '보통', '어려움'];
const FULL_WEEK = 40;   // 한 사람의 주당 근무 시간(넘으면 빨간 막대)
const COMMON = '__common__';   // 모든 직무 위에 공통으로 보이는 글(운영 브랜드 등)을 담는 줄. dept 칸이 이 값이고 summary 에 글이 있음
const commonRow = () => (DATA.job_descs || []).find(x => x.dept === COMMON);
const J = () => (DATA.job_descs || []).filter(x => x.dept !== COMMON).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.title).localeCompare(String(b.title), 'ko'));
const duties = j => Array.isArray(j.duties) ? j.duties : [];
const contacts = j => Array.isArray(j.contacts) ? j.contacts : [];
const hoursOf = j => duties(j).reduce((s, d) => s + (Number(d.hours) || 0), 0);
const missing = j => duties(j).filter(d => !(Number(d.hours) > 0) || !(d.how || '').trim()).length;   // 시간이나 방법이 비어 있는 업무 수
const canEdit = j => isAdmin() || (j && j.holder === me);
const hr = n => (Math.round(n * 10) / 10).toString();
const stCls = s => 's' + Math.max(0, STATUS.indexOf(s));
let view = LS.get('jobs_view') || '';   // 'j:<직무 id>' | 'contacts'
const groupsOf = ds => [...new Set(ds.map(d => d.group || ''))];   // 큰 항목(적힌 순서). 없는 것은 ''

function normalize(table, j){ if (table !== 'job_descs') return j; return { ...j, duties: duties(j), contacts: contacts(j) }; }

/* 상단 탭 = 직무 이름. 누르면 그 직무의 하는 일(R&R)과 소통 상대가 바로 아래에 나옴 */
function render(){
  const js = J();
  const tabs = js.map(j => ({ key: 'j:' + j.id, label: j.title }));
  if (!tabs.some(t => t.key === view)) view = js.length ? 'j:' + js[0].id : '';
  $('#app').innerHTML = headerHtml({ icon: '🧩', title: '업무기술서', tabs, active: view }) + `<main class="wrap" style="max-width:1180px"><div id="view"></div></main>`;
  bindHeader(k => { view = k; LS.set('jobs_view', k); render(); }, null);
  renderView();
}
/* 업무 한 줄: 이름만 담백하게(2026-11-24 대표: 글이 많으면 일이 많아 보임). 줄을 누르면 시스템·소통 상대·방법·주의가 펼쳐짐 */
function dutyHtml(d, g){   // g 가 있으면 '큰 항목 : 업무' 한 줄로 (큰 항목에 업무가 하나뿐일 때)
  const rows = [['쓰는 시스템', d.tools], ['소통 상대', d.with], ['하는 방법', d.how], ['주의', d.caution]].filter(r => r[1]);
  const head = `<div class="dl"><div class="dn">${g ? `<b>${esc(g)}</b> : ` : ''}${esc(d.name || '')}</div></div>`;
  return rows.length ? `<details class="du"><summary>${head}</summary><div class="dm">${rows.map(r => `<div><b>${r[0]}</b>${esc(r[1])}</div>`).join('')}</div></details>` : `<div class="du">${head}</div>`;
}
function detailHtml(j){
  const ds = duties(j), cs = contacts(j), gs = groupsOf(ds), cm = commonRow();
  const blocks = gs.map(g => { const list = ds.filter(d => (d.group || '') === g); return g && list.length === 1 ? `<div class="gb one">${dutyHtml(list[0], g)}</div>` : `<div class="gb">${g ? `<div class="gt">${esc(g)}</div>` : ''}${list.map(d => dutyHtml(d)).join('')}</div>`; }).join('');
  return `<div class="jd">
    ${cm && cm.summary || isAdmin() ? `<div class="cmn"><div>${cm && cm.summary ? esc(cm.summary) : '<span class="hint">모든 직무에 공통으로 보일 글이 없습니다</span>'}</div>${isAdmin() ? '<button class="btn sm" id="cmEdit">공통 고치기</button>' : ''}</div>` : ''}
    <div class="jh"><h1>${esc(j.title)}</h1><span class="st ${stCls(j.status)}">${esc(j.status || '재직')}</span><span class="sp"></span>
      ${canEdit(j) ? '<button class="btn sm" id="rEdit">고치기</button>' : ''}<button class="btn sm" id="rCopy">채용공고용 복사</button><button class="btn sm" id="rPrint">인쇄</button>${isAdmin() ? '<button class="btn sm" id="rNew">＋ 직무 추가</button>' : ''}</div>
    ${j.summary ? `<div class="lead">${esc(j.summary)}</div>` : ''}
    <div class="meta">${j.dept ? `<span>${esc(j.dept)}</span>` : ''}<span>담당 ${j.holder ? who(j.holder) : '-'}</span>${j.verified_at ? `<span class="ok">${esc(j.verified_by || '')} 확인 ${fmtDate(j.verified_at.slice(0, 10))}</span>` : ''}</div>
    <div class="cols">
      <section><h3>하는 일 (R&amp;R)</h3>${ds.length ? blocks : '<div class="hint">아직 적힌 업무가 없습니다</div>'}</section>
      <aside>
        <h3>소통 상대</h3>
        ${cs.length ? `<div class="cl">${cs.map(c => `<div class="ci"><b>${esc(c.org || c.who || '')}</b>${c.org && c.who ? `<span class="cw">${esc(c.who)}</span>` : ''}${c.about ? `<p>${esc(c.about)}</p>` : ''}${c.freq ? `<span class="cw">${esc(c.freq)}</span>` : ''}</div>`).join('')}</div>` : '<div class="hint">아직 적힌 소통 상대가 없습니다</div>'}
        ${j.requirements ? `<h3>이 자리에 필요한 사람</h3><div class="txt">${esc(j.requirements)}</div>` : ''}
        ${j.onboarding ? `<h3>새 사람이 오면</h3><div class="txt">${esc(j.onboarding)}</div>` : ''}
      </aside>
    </div>
    ${canEdit(j) && j.note ? `<div class="memo"><b>메모</b> ${esc(j.note)}</div>` : ''}
    <div class="jf">${j.holder === me ? '<button class="btn sm" id="rVerify">내용이 맞습니다 (확인 표시)</button>' : ''}<span class="hint">마지막 수정: ${esc(j.updated_by || j.created_by || '')} · ${fmtDateTime(j.updated_at || j.created_at)}</span></div>
  </div>`;
}
function renderView(){
  const el = $('#view'), list = J();
  const addBtn = isAdmin() ? '<div style="margin-top:12px"><button class="btn primary" id="rNew">＋ 직무 추가</button></div>' : '';
  if (!DATA.job_descs) el.innerHTML = `<div class="empty">업무기술서 저장 표가 아직 없습니다.${isAdmin() ? ' sql-jobs.sql 을 Supabase SQL Editor 에서 실행하세요.' : ''}</div>`;
  else if (!list.length) el.innerHTML = `<div class="empty">아직 적힌 직무가 없습니다.${addBtn}</div>`;
  else {
    const j = list.find(x => 'j:' + x.id === view) || list[0];
    el.innerHTML = detailHtml(j);
    const e = $('#rEdit'); if (e) e.onclick = () => openEdit(j.id);
    const ce = $('#cmEdit'); if (ce) ce.onclick = openCommon;
    $('#rPrint').onclick = () => window.print();
    $('#rCopy').onclick = async () => { try { await navigator.clipboard.writeText(postingText(j)); toast('채용공고에 붙여 넣을 글을 복사했습니다'); } catch { toast('복사하지 못했습니다', true); } };
    const v = $('#rVerify'); if (v) v.onclick = async () => { await saveRow('job_descs', { ...j, verified_by: me, verified_at: nowIso(), updated_by: me }); toast('확인 표시를 남겼습니다'); };
  }
  const nb = $('#rNew'); if (nb) nb.onclick = () => openEdit(null);
  document.querySelectorAll('[data-open]').forEach(x => x.onclick = () => openRead(x.dataset.open));
}
/* 공통 글 고치기 (관리자) */
function openCommon(){
  const cm = commonRow();
  openModal(`${modalHead('모든 직무에 공통으로 보이는 글')}
    <div class="mb"><div class="f"><label>예: 운영 브랜드, 자사 브랜드 목록 (줄을 바꿔 여러 줄로 적을 수 있습니다)</label><textarea id="cmText" style="min-height:120px;line-height:1.6;font-family:inherit">${esc(cm ? cm.summary || '' : '')}</textarea></div></div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="cmSave">저장</button></div>`, { wide: true });
  $('#cmSave').onclick = async () => {
    const row = { ...(cm || { id: uid(), title: '공통', dept: COMMON, duties: [], contacts: [], sort_order: -1, created_by: me, created_at: nowIso() }), summary: $('#cmText').value.trim() || null, updated_by: me };
    closeModal(); await saveRow('job_descs', row); toast('저장했습니다');
  };
}
/* 직무 하나 열기 = 그 직무 탭으로 가기 (사람별·소통 상대 전체·홈 검색에서 씀) */
function openRead(id){ if (!J().some(x => x.id === id)) return; view = 'j:' + id; LS.set('jobs_view', view); render(); window.scrollTo(0, 0); }
/* 채용공고에 붙여 넣을 글: 담당자 이름·거래처는 빼고 하는 일과 요건만 */
function postingText(j){
  const ds = duties(j), gs = groupsOf(ds), grouped = gs.some(g => g);
  const by = k => ds.filter(d => grouped ? (d.group || '') === k : d.cycle === k).map(d => `- ${d.name}`);
  return [`[${j.title}]`, j.summary || '', '', '■ 담당 업무', ...(grouped ? gs : CYCLES).flatMap(c => by(c).length ? [grouped ? (c || '기타') : `(${c})`, ...by(c)] : []), '', '■ 자격 요건·우대 사항', j.requirements || '(작성 필요)'].join('\n');
}

/* 쓰기·고치기 */
let W = null;   // 고치는 중인 업무·소통 상대 목록
const sel = (cls, list, cur) => `<select class="${cls}">${list.map(v => `<option ${v === cur ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
const dutyBox = (d, i) => `<div class="dbox" data-d="${i}">
  <div><label>큰 항목 (같은 이름끼리 묶여 보입니다. 예: 1. 제품 발주)</label><input class="dGroup" list="grpList" value="${esc(d.group || '')}"></div>
  <div class="r1"><div><label>업무 이름</label><input class="dName" value="${esc(d.name || '')}" placeholder="예: 로켓그로스 입고 등록"></div>
    <div><label>주기</label>${sel('dCycle', CYCLES, d.cycle || '수시')}</div>
    <div><label>주당 시간</label><input class="dHours" type="number" min="0" step="0.5" value="${d.hours ?? ''}" placeholder="예: 2.5"></div>
    <div><label>난이도</label>${sel('dLevel', LEVELS, d.level || '보통')}</div>
    <button type="button" class="xb" data-dx="${i}" title="이 업무 지우기">✕</button></div>
  <div><label>하는 방법 (처음 보는 사람이 따라 할 수 있게 순서대로)</label><textarea class="dHow" placeholder="1. … 2. … 3. …">${esc(d.how || '')}</textarea></div>
  <div class="r2"><div><label>쓰는 시스템·계정</label><input class="dTools" value="${esc(d.tools || '')}" placeholder="예: 쿠팡 윙, 이벗, 카페24"></div>
    <div><label>소통 상대</label><input class="dWith" value="${esc(d.with || '')}" placeholder="예: 물류창고 담당자, 팀장"></div></div>
  <div><label>주의할 점·자주 나는 실수</label><input class="dCaution" value="${esc(d.caution || '')}" placeholder="예: 수량을 빼먹으면 미매칭으로 출고가 멈춤"></div></div>`;
const contactBox = (c, i) => `<div class="cbox" data-c="${i}">
  <div><label>소속·거래처</label><input class="cOrg" value="${esc(c.org || '')}" placeholder="예: 물류창고"></div>
  <div><label>상대 (이름·직함)</label><input class="cWho" value="${esc(c.who || '')}" placeholder="예: 출고 담당"></div>
  <div><label>무슨 일로</label><input class="cAbout" value="${esc(c.about || '')}" placeholder="예: 입고 예약, 재고 확인"></div>
  <div><label>빈도</label><input class="cFreq" value="${esc(c.freq || '')}" placeholder="예: 주 2~3회"></div>
  <button type="button" class="xb" data-cx="${i}" title="지우기">✕</button></div>`;
function readW(){
  W.duties = [...document.querySelectorAll('[data-d]')].map(b => { const g = c => b.querySelector(c).value.trim(), h = g('.dHours'); return { group: g('.dGroup'), name: g('.dName'), cycle: g('.dCycle'), hours: h === '' ? null : Number(h), level: g('.dLevel'), how: g('.dHow'), tools: g('.dTools'), with: g('.dWith'), caution: g('.dCaution') }; });
  W.contacts = [...document.querySelectorAll('[data-c]')].map(b => { const g = c => b.querySelector(c).value.trim(); return { org: g('.cOrg'), who: g('.cWho'), about: g('.cAbout'), freq: g('.cFreq') }; });
}
function drawW(){
  $('#dList').innerHTML = `<datalist id="grpList">${groupsOf(W.duties).filter(Boolean).map(g => `<option value="${esc(g)}">`).join('')}</datalist>` + W.duties.map(dutyBox).join('') || '<div class="hint">아직 없습니다. 아래 단추로 추가하세요.</div>';
  $('#cList').innerHTML = W.contacts.map(contactBox).join('') || '<div class="hint">아직 없습니다.</div>';
  document.querySelectorAll('[data-dx]').forEach(b => b.onclick = () => { readW(); W.duties.splice(Number(b.dataset.dx), 1); drawW(); });
  document.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => { readW(); W.contacts.splice(Number(b.dataset.cx), 1); drawW(); });
}
function openEdit(id){
  const j = id ? J().find(x => x.id === id) : null;
  if (!(j ? canEdit(j) : isAdmin())) { toast('관리자와 그 직무의 담당자만 고칠 수 있습니다', true); return; }
  W = { duties: j ? duties(j).map(d => ({ ...d })) : [], contacts: j ? contacts(j).map(c => ({ ...c })) : [] };
  const names = members.map(m => m.name), adm = isAdmin();
  openModal(`${modalHead(j ? '업무기술서 고치기' : '직무 추가')}
    <div class="mb">
      <div class="f2"><div class="f"><label>직무명 *</label><input id="jTitle" value="${esc(j ? j.title : '')}" maxlength="60" placeholder="예: 물류지원" ${adm ? '' : 'disabled'}></div>
        <div class="f"><label>부서</label><input id="jDept" value="${esc(j ? j.dept || '' : '')}" placeholder="예: 운영기획팀" ${adm ? '' : 'disabled'}></div></div>
      <div class="f2"><div class="f"><label>지금 담당자</label><input id="jHolder" list="nmList" value="${esc(j ? j.holder || '' : '')}" placeholder="비워 두면 담당자 없음" ${adm ? '' : 'disabled'}></div>
        <div class="f"><label>대신 할 수 있는 사람</label><input id="jBackup" list="nmList" value="${esc(j ? j.backup || '' : '')}" placeholder="휴가·퇴사 때 이어받을 사람"></div></div>
      <datalist id="nmList">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="f"><label>상태</label><select id="jStatus" ${adm ? '' : 'disabled'}>${STATUS.map(s => `<option ${s === (j ? j.status || '재직' : '재직') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label>한 줄 설명 (이 자리가 회사에서 맡은 역할)</label><textarea id="jSummary" placeholder="예: 제품이 공장에서 나와 고객에게 도착할 때까지의 발주·입출고·재고를 책임지는 자리">${esc(j ? j.summary || '' : '')}</textarea></div>
      <div class="sec">하는 일 <span class="hint">주당 시간은 평균으로. 월 1회 4시간이면 1시간</span><span class="sp"></span></div>
      <div id="dList" style="display:grid;gap:8px"></div>
      <div><button type="button" class="btn sm" id="dAdd">＋ 업무 추가</button></div>
      <div class="sec">소통 상대 <span class="hint">전화번호·비밀번호는 여기 적지 않습니다 (운영계정·파트너스에)</span></div>
      <div id="cList" style="display:grid;gap:8px"></div>
      <div><button type="button" class="btn sm" id="cAdd">＋ 소통 상대 추가</button></div>
      <div class="f"><label>이 자리에 필요한 사람 (채용 요건·우대)</label><textarea id="jReq" placeholder="예: 엑셀 수식 가능, 3PL·쿠팡 입고 경험 우대, 꼼꼼함">${esc(j ? j.requirements || '' : '')}</textarea></div>
      <div class="f"><label>새 사람이 오면 (인수인계 순서)</label><textarea id="jOnb" placeholder="1주차: … / 2주차: … / 한 달 뒤 혼자 할 수 있어야 하는 것: …">${esc(j ? j.onboarding || '' : '')}</textarea></div>
      <div class="f"><label>메모</label><textarea id="jNote">${esc(j ? j.note || '' : '')}</textarea></div>
    </div>
    <div class="mf">${j && adm ? '<button class="btn danger left" id="jDel">삭제</button>' : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="jSave">저장</button></div>`, { wide: true, cls: 'xl' });
  drawW();
  $('#dAdd').onclick = () => { readW(); W.duties.push({ group: (W.duties[W.duties.length - 1] || {}).group || '', cycle: '매주', level: '보통' }); drawW(); const b = document.querySelectorAll('[data-d]'); b[b.length - 1].querySelector('.dName').focus(); };
  $('#cAdd').onclick = () => { readW(); W.contacts.push({}); drawW(); };
  $('#jSave').onclick = async () => {
    const title = $('#jTitle').value.trim(); if (!title) { $('#jTitle').focus(); toast('직무명을 입력하세요', true); return; }
    readW();
    const v = k => $(k).value.trim() || null;
    const row = { id: j ? j.id : uid(), title, dept: v('#jDept'), holder: v('#jHolder'), backup: v('#jBackup'), status: $('#jStatus').value, summary: v('#jSummary'),
      duties: (gs => W.duties.filter(d => d.name).sort((a, b) => gs.indexOf(a.group || '') - gs.indexOf(b.group || '')))(groupsOf(W.duties)), contacts: W.contacts.filter(c => c.org || c.who), requirements: v('#jReq'), onboarding: v('#jOnb'), note: v('#jNote'),
      verified_by: j ? j.verified_by || null : null, verified_at: j ? j.verified_at || null : null,
      sort_order: j ? j.sort_order || 0 : J().length, created_by: j ? j.created_by : me, created_at: j ? j.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('job_descs', row); toast('저장했습니다');
  };
  const del = $('#jDel'); if (del) del.onclick = async () => { if (confirm(`"${j.title}" 업무기술서를 삭제할까요?`)) { closeModal(); await removeRow('job_descs', j.id); toast('삭제했습니다'); } };
}

boot({ icon: '🧩', title: '업무기술서', tables: ['job_descs'], render, normalize, open: id => openRead(id) });
</script>
</body>
</html>
