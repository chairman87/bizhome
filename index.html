<style>
  /* 폴더들은 가운데로 모음 (폴더 수가 적어도 왼쪽에 쏠리지 않게) */
  .depts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;align-items:flex-start}
  .dept{border-radius:10px;padding:10px;flex:0 1 260px;min-width:0}   /* 폴더 폭은 내용에 맞춰 좁게 고정 (위의 공지·결정사항 판 폭에 맞추지 않음) */
  .depts .adddept{flex:0 1 260px;width:auto}
  /* 홈의 '칸' = 판(공지사항·업무공유·이달의 목표)과 폴더. 모두 같은 줄 흐름에 놓이고, 순서(sort_order)와 가로 길이(width)는 메뉴 편집에서 바꿈 */
  .dept{position:relative;max-width:100%}
  .bwrap{flex:0 1 1082px;min-width:0;max-width:100%;container-type:inline-size}
  .bwrap.full{flex:0 0 100%}                       /* 가로 길이를 따로 정하지 않은 판은 한 줄을 통째로 씀 (가운데 1082px) */
  .bwrap .bin{position:relative}
  .bwrap.full .bin{max-width:1082px;margin:0 auto}
  .bwrap .nboard{margin:0;max-width:none}
  @container (max-width:620px){.nrow{grid-template-columns:minmax(0,1fr) auto auto}.nrow .by{display:none}.nboard .hd{flex-wrap:wrap;row-gap:2px}.nboard .hd h2{white-space:nowrap}}
  @container (max-width:360px){.nboard .hd h2{flex:1 0 100%}.nrow{grid-template-columns:minmax(0,1fr) auto}.nrow .dt{display:none}.grow .ck{display:none}}
  @media(max-width:640px){.dept,.depts .adddept,.bwrap{flex:1 1 100% !important}}
  /* 메뉴 편집: 칸 끌어 옮기기 + 오른쪽 끝 손잡이로 가로 길이 조절 */
  .editing [data-blk][draggable=true]{cursor:grab}
  [data-blk].dragging{opacity:.35}
  [data-blk].drop-l{box-shadow:-5px 0 0 var(--blue)}
  [data-blk].drop-r{box-shadow:5px 0 0 var(--blue)}
  [data-blk].drop-t{box-shadow:0 -5px 0 var(--blue)}
  [data-blk].drop-b{box-shadow:0 5px 0 var(--blue)}
  .editing .bwrap .nboard{outline:1px dashed var(--line2);outline-offset:2px}
  /* 자유 배치 판(#cv): 칸마다 저장된 위치(x,y)와 가로 길이(width)에 놓임. 위쪽에 빈 곳이 있으면 위로 붙고, 겹치면 아래 칸이 밀려 내려감 */
  .cvwrap{position:relative}
  .editing .cvwrap{overflow-x:auto;padding-bottom:10px}
  #cv{position:relative;transform-origin:0 0}
  #cv > [data-blk]{position:absolute;left:0;top:0;margin:0;max-width:none;flex:none}
  #cv .bwrap .nboard{margin:0;max-width:none}
  #cv.stack{transform:none !important;height:auto !important;width:auto !important}
  #cv.stack > [data-blk]{position:static;width:auto !important;margin:0 0 14px}
  .editing #cv{background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:20px 20px;border:1px dashed var(--line2);border-radius:10px}
  .editing #cv > [data-blk]{cursor:grab}
  .editing #cv > [data-blk].moving{cursor:grabbing;opacity:.85;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  body.mving{user-select:none;cursor:grabbing}
  .rz{position:absolute;top:0;right:-9px;width:16px;height:100%;cursor:ew-resize;z-index:3}
  .rz::after{content:"";position:absolute;top:50%;left:6px;width:5px;height:44px;max-height:70%;transform:translateY(-50%);border-radius:3px;background:var(--line2)}
  .rz:hover::after,.resizing .rz::after{background:var(--blue)}
  .rz[data-w]::before{content:attr(data-w);position:absolute;top:-24px;right:0;background:#111;color:#fff;font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap}
  body.rzing{cursor:ew-resize;user-select:none}
  .dept h2{margin:4px 6px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
  .dept h2 .nm{padding:2px 8px;border-radius:4px}
  .dept h2 .n{font-weight:400;color:var(--fg2);flex:1}
  .pg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;font-weight:500;width:100%;text-align:left}
  .pg:hover{box-shadow:var(--shadow);border-color:var(--line2)}
  .pg .ic{width:22px;text-align:center;font-size:16px;flex:none}
  .pg .t{flex:1;min-width:0;word-break:break-word}
  .pg .soon{font-size:10px;color:var(--fg3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-weight:400;white-space:nowrap}
  .pg.na{color:var(--fg2);font-weight:400}
  .pg .b{font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:0 6px;font-weight:600}
  .addpg{border:0;background:transparent;color:inherit;opacity:.6;padding:8px 12px;width:100%;text-align:left;border-radius:8px;font-size:13px}
  .addpg:hover{opacity:1;background:rgba(255,255,255,.6)}
  .adddept{border:2px dashed var(--line2);border-radius:10px;padding:24px 10px;color:var(--fg3);text-align:center;background:transparent;width:100%;font-size:14px}
  .adddept:hover{color:var(--fg);border-color:var(--fg3)}
  /* 편집 모드 */
  .ed{display:none;gap:2px;flex:none}
  .editing .ed{display:inline-flex}
  .ed button{border:1px solid transparent;background:transparent;border-radius:4px;padding:0 5px;font-size:12px;color:var(--fg2);line-height:20px}
  .ed button:hover{background:rgba(0,0,0,.06);color:var(--fg)}
  .ed button.del:hover{color:var(--red)}
  .editing .pg{cursor:pointer}
  /* 메뉴 편집: 폴더·페이지를 끌어서 순서 바꾸기 */
  .editing .dept[draggable=true]{cursor:grab}
  .dept.dragging,.pg.dragging{opacity:.35}
  .dept.drop-l{box-shadow:-5px 0 0 var(--blue)}
  .dept.drop-r{box-shadow:5px 0 0 var(--blue)}
  .dept.drop-in{outline:2px dashed var(--blue);outline-offset:-2px}
  .pg.drop-before{box-shadow:0 -3px 0 var(--blue)}
  .pg.drop-after{box-shadow:0 3px 0 var(--blue)}
  .editing .pg .soon{display:none}
  .editbar{max-width:1082px;margin-left:auto;margin-right:auto;background:#fff8e6;border:1px solid #f5e6a3;border-radius:var(--radius);padding:8px 12px;margin-bottom:14px;font-size:13px;color:#7a5a00;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .emojis{display:flex;flex-wrap:wrap;gap:4px}
  .emojis button{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:16px;padding:2px 4px;line-height:1}
  .emojis button:hover{background:var(--bg3)}
  .foot{margin-top:24px;font-size:12px;color:var(--fg3);text-align:center}
  .allow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:6px 0}
  .allow label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;width:auto;font-size:13px;font-weight:400;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg)}

  /* 공지사항 판 (홈 맨 위) */

  .nboard .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}

  .nrow{display:grid;grid-template-columns:1fr 90px 110px 90px;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:var(--bg2)}
  .nrow.unread{background:#fff7f5}
  .nrow.unread:hover{background:#fff0ec}
  .nrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow.unread .t{font-weight:700}
  .nrow .by,.nrow .dt{color:var(--fg2);font-size:12px;white-space:nowrap}
  .nrow .ok{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;text-align:center;color:var(--fg2);background:var(--bg)}
  .nrow.unread .ok{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .nrow .ok[data-dok]:hover{filter:brightness(.92)}
  .nrow .new{font-size:10px;color:#fff;background:var(--red);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600;vertical-align:1px}
  .nrow .pin{margin-right:4px}
  .nrow .rd{font-size:11px;color:var(--fg3);margin-left:6px}
  .nboard .hd:last-child{border-bottom:0}
  .nboard .none{padding:14px;color:var(--fg3);font-size:13px;text-align:center}
  /* 이달의 목표 판 (업무공유 판 아래) */
  .goals .hd .mnav{display:inline-flex;align-items:center;gap:2px;margin-left:6px}
  .goals .hd .mnav button{border:1px solid var(--line2);background:var(--bg);border-radius:4px;padding:0 7px;font-size:12px;line-height:20px;color:var(--fg2)}
  .goals .hd .mnav button:hover{background:var(--bg3);color:var(--fg)}
  .goals .hd .mnav button:disabled{opacity:.35;cursor:default}
  .goals .hd .act{border:0;background:transparent;font-size:12px;color:var(--fg2);padding:0}
  .goals .hd .act:hover{color:var(--fg)}
  .grow{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
  .grow:last-child{border-bottom:0}
  .grow .no{flex:none;width:22px;height:22px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .grow .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-weight:500}
  .grow.done .tx{color:var(--fg3);text-decoration:line-through;font-weight:400}
  .grow.done .no{background:#dcfce7;color:#15803d}
  .grow .ck{flex:none;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;color:var(--fg2);background:var(--bg);white-space:nowrap}
  .grow.done .ck{background:#dcfce7;border-color:#bbf7d0;color:#15803d;font-weight:600}
  button.ck{cursor:pointer}
  button.ck:hover{filter:brightness(.95)}
  .goals .gnote{padding:8px 14px;font-size:12px;color:var(--fg2);background:var(--bg2);white-space:pre-wrap;border-top:1px solid var(--line)}
  #gItems{min-height:170px}
  @media(max-width:640px){.nrow{grid-template-columns:1fr 70px}.nrow .by,.nrow .dt{display:none}}
  .content{white-space:pre-wrap;line-height:1.6;font-size:14px}
</style>

<script>
/* ================================================================
   비즈홈 — 부서별 메뉴 대문. 메뉴는 저장소(menu 표)에 있고 관리자가 화면에서 편집
================================================================ */
const DEPT_COLORS = {
  orange: { n: '주황', bg: '#fdf3ec', tagBg: '#f9dcc4', tagFg: '#9a3b00' },
  yellow: { n: '노랑', bg: '#fdf9e7', tagBg: '#f5e6a3', tagFg: '#7a5a00' },
  blue:   { n: '파랑', bg: '#eef5fd', tagBg: '#cfe3fa', tagFg: '#0b4f9c' },
  pink:   { n: '분홍', bg: '#fdeef3', tagBg: '#f9cfdc', tagFg: '#9c1f4a' },
  gray:   { n: '회색', bg: '#f4f4f2', tagBg: '#e2e2de', tagFg: '#444444' },
  lime:   { n: '연두', bg: '#f5fae8', tagBg: '#dcedb0', tagFg: '#4a6800' },
  green:  { n: '초록', bg: '#eef8f0', tagBg: '#cdebd3', tagFg: '#1b5e20' },
  purple: { n: '보라', bg: '#f3effd', tagBg: '#dcd0f7', tagFg: '#4a2a8a' },
};
/* 페이지에 연결할 수 있는 화면 목록. 새 화면을 만들면 여기에 한 줄 추가 */
const SCREENS = [
  ['', '아직 없음 (준비 중)'],
  ['tasks.html', '업무'],
  ['rnr.html', '업무 분장'],
  ['alarms.html', '알람 (회사 운영 알람 메시지 모음)'],
  ['leave.html', '연차/휴가 등록'],
  ['notices.html', '공지사항'],
  ['decisions.html', '업무공유 (대표 결정·공유)'],
  ['accounts.html', '운영계정 (자료실)'],
  ['accounts.html?dept=마케팅', '마케팅계정 (마케팅)'],
  ['subscriptions.html', '구독관리 (매월 지출)'],
  ['payments.html', '결재 (지출 결재·이체)'],
  ['docs.html', '회사 서류함'],
  ['contractors.html', '외주 용역관리'],
  ['quotes.html', '견적서 관리'],
  ['partners.html', '파트너스 (크리에이터 협업)'],
  ['samples.html', '비매출 (샘플 발송)'],
  ['meetings.html', '회의록'],
  ['ads.html', '광고 영상 리스트'],
  ['insights.html', '마케팅 인사이트 (광고 성과에서 배운 것)'],
  ['comments.html', '댓글 관리 (메타 광고 댓글 숨기기·삭제)'],
  ['videos.html', '참고 컨텐츠 영상 (팀원이 참고할 영상 링크 공유)'],
  ['projects.html', '프로젝트 관리'],
  ['members', '팀원 관리'],
  ['url', '외부 링크 (인터넷 주소 입력)'],
];
const EMOJIS = ['📝','📋','📅','📆','🗓️','⏰','📊','📈','📉','💰','💳','💵','🧾','🛍️','📦','📁','📄','📒','📚','🔔','✅','🎯','🏆','🎓','🧑‍💼','👥','😀','🤝','📣','💬','💌','✏️','🎨','🎬','🎥','📷','🔎','🔐','🔒','🛠️','⚙️','💻','🖥️','📱','🌐','🚀','🧨','🎁','⭐','❤️'];

/* 처음 한 번 넣는 기본 메뉴. 관리자가 "메뉴 편집"으로 얼마든지 추가·수정 가능 */
const DEFAULT_MENU = [
  ['인사', 'orange', [['📅', '연차/휴가 등록', 'leave.html'], ['😎', '멤버 리스트', 'members']]],
  ['업무지원', 'blue', [['📝', '업무', 'tasks.html'], ['📋', '업무 분장', 'rnr.html']]],
  ['총무', 'yellow', [['📢', '공지사항', 'notices.html'], ['🔐', '계정·구독 관리', 'accounts.html']]],
  ['마케팅', 'pink', [['🎬', '광고 영상 리스트', 'ads.html'], ['💡', '마케팅 인사이트', 'insights.html']]],
  ['사업관리', 'gray', [['🗂️', '프로젝트 관리', 'projects.html']]],
];

const M = () => DATA.menu || [];
const bySort = (a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
const depts = () => M().filter(x => x.type === 'dept').sort(bySort);
/* 홈의 칸: 폴더(dept) + 판(board: 공지사항·업무공유·이달의 목표). 한 줄 흐름에 sort_order 순으로 놓임 */
const blocks = () => M().filter(x => x.type === 'dept' || x.type === 'board').sort(bySort);
const CV_W = 1460, CV_GAP = 14, MIN_W = 200;   // 배치 판의 기준 가로 폭, 칸 사이 간격, 칸의 최소 가로 길이
const blkW = r => Math.min(CV_W, Number(r.width) > 0 ? Math.max(MIN_W, Number(r.width)) : (r.type === 'board' ? 1082 : 260));   // 가로 길이(px). 안 정했으면 폴더 260, 판은 한 줄 전체
let LAY = [];   // 마지막으로 계산한 배치 [{id, el, left, top, w, h}]
/* 칸들을 저장된 위치에 놓음. 규칙:
   ① 위치(x,y)가 저장된 칸은 놓은 자리 그대로. 다른 칸과 겹칠 때만(내용이 길어진 경우 등) 아래쪽 칸이 겹치지 않을 만큼 밀려 내려감. 빈 곳을 메우려고 저절로 움직이지 않음
   ② 아직 위치가 없는 칸(새 폴더 등)은 맨 아래에 순서대로 한 줄씩 가운데 정렬로 놓음
   ③ 보는 화면에서는 전체 묶음을 가운데로 모으고, 화면이 좁으면 비율대로 줄임. 휴대폰(700px 미만)은 한 줄에 하나씩 */
function layoutBlocks(){
  const cv = $('#cv'); if (!cv) return;
  const A = cv.parentElement.clientWidth, stack = A < 700 && !editing;
  const els = [...cv.children].filter(el => el.dataset.blk);
  const items = els.map(el => { const r = M().find(x => x.id === el.dataset.blk) || {}; return { id: el.dataset.blk, el, r, w: blkW(r), x: r.x, y: r.y, so: r.sort_order || 0 }; });
  const posd = items.filter(i => i.x != null && i.y != null).sort((a, b) => a.y - b.y || a.x - b.x), auto = items.filter(i => i.x == null || i.y == null).sort((a, b) => a.so - b.so);
  cv.classList.toggle('stack', stack);
  if (stack) { [...posd, ...auto].forEach(i => cv.appendChild(i.el)); cv.style.cssText = ''; LAY = []; return; }
  cv.style.transform = 'none';
  items.forEach(i => { i.el.style.width = i.w + 'px'; });
  items.forEach(i => { i.h = i.el.offsetHeight; });
  const placed = [];
  const put = (i, left) => { let top = Math.max(0, i.y || 0); for (const p of placed) if (left < p.left + p.w && left + i.w > p.left) top = Math.max(top, p.top + p.h + CV_GAP); i.left = left; i.top = top; placed.push(i); };
  posd.forEach(i => put(i, Math.max(0, Math.min(CV_W - i.w, i.x))));
  let cy = placed.reduce((m, p) => Math.max(m, p.top + p.h + CV_GAP), 0), line = [], lw = 0;
  const flush = () => { if (!line.length) return; let x = Math.max(0, Math.round((CV_W - lw) / 2)), bottom = cy; line.forEach(i => { i.left = x; i.top = cy; x += i.w + CV_GAP; bottom = Math.max(bottom, cy + i.h); placed.push(i); }); cy = bottom + CV_GAP; line = []; lw = 0; };
  auto.forEach(i => { if (line.length && lw + CV_GAP + i.w > CV_W) flush(); lw += (line.length ? CV_GAP : 0) + i.w; line.push(i); });
  flush();
  placed.forEach(i => { i.el.style.left = i.left + 'px'; i.el.style.top = i.top + 'px'; });

function guard(){ if (!isAdmin()) { toast('관리자만 할 수 있습니다', true); return false; } return true; }
async function moveItem(id, dir){
  if (!guard()) return;
  const it = M().find(x => x.id === id); if (!it) return;
  const list = it.type === 'page' ? pagesOf(it.parent) : blocks();   // 폴더·판은 칸 전체 순서 안에서 움직임
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  // 순서 번호를 0,1,2… 로 다시 매기면서 둘을 맞바꿈
  const order = list.map(x => x.id); [order[i], order[j]] = [order[j], order[i]];
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row.sort_order !== k) await saveRow('menu', { ...row, sort_order: k }); }
}
/* 끌어다 놓은 결과를 저장: 순서 번호를 0,1,2… 로 다시 매기고 바뀐 줄만 저장 */
async function dropDept(id, targetId, after){
  if (!guard() || id === targetId) return;
  const order = blocks().map(x => x.id).filter(x => x !== id);
  let to = order.indexOf(targetId); if (to < 0) return; if (after) to++;
  order.splice(to, 0, id);
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row && row.sort_order !== k) await saveRow('menu', { ...row, sort_order: k }); }
}

/* ---------- 홈 맨 위 공지사항 판 ----------

   나머지는 지워지는 게 아니라 전체 보기(공지사항·결정사항 화면)에 쌓임 */
const RECENT_DAYS = 7, RECENT_MAX = 3;
const isRecent = iso => !!iso && (Date.now() - new Date(iso).getTime()) <= RECENT_DAYS * 86400000;
const NREADS = n => Array.isArray(n.reads) ? n.reads : [];

  </section>`;
}

/* ---------- 홈의 업무공유 판 (공지 판 바로 아래. 아직 확인 안 한 것을 먼저, 최근 5개) ---------- */
const DREADS = d => Array.isArray(d.reads) ? d.reads : [];
const DTARGETS = d => Array.isArray(d.targets) ? d.targets : [];
const dRead = d => DREADS(d).includes(me);
const dAudience = d => DTARGETS(d).length ? DTARGETS(d) : members.map(m => m.name);
const dForMe = d => dAudience(d).includes(me);
const dMine = () => (DATA.decisions || []).filter(d => isAdmin() || !DTARGETS(d).length || DTARGETS(d).includes(me) || d.created_by === me);   // 대상이 정해진 글은 그 사람들과 관리자만
const dDate = d => d.decided_at || (d.created_at || '').slice(0, 10);
function decisionBoard(){
  if (!DATA.decisions) return '';
  const admin = isAdmin();
  const all = dMine().sort((a, b) => ((dForMe(a) && !dRead(a)) ? 0 : 1) - ((dForMe(b) && !dRead(b)) ? 0 : 1) || String(dDate(b)).localeCompare(String(dDate(a))) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  const need = d => dForMe(d) && !dRead(d);
  const todo = all.filter(need).length, list = [...all.filter(need), ...all.filter(d => !need(d) && isRecent(d.created_at)).slice(0, RECENT_MAX)];

}

/* ---------- 홈의 '이달의 목표' 판 (업무공유 판 아래) ----------
   한 달 = goals 표 한 줄 { month:'YYYY-MM', items:[{text, done}], note }. 관리자만 적고 고치며, 달성한 줄은 체크. ‹ › 로 다른 달도 봄 */
const thisMonth = () => todayStr().slice(0, 7);
let goalMonth = null;   // 보고 있는 달 (null = 이번 달)
const gMonth = () => goalMonth || thisMonth();
const addMonth = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const goalOf = ym => (DATA.goals || []).find(g => g.month === ym) || null;
const gItems = g => g && Array.isArray(g.items) ? g.items.filter(x => x && x.text) : [];
function goalBoard(){
  if (!DATA.goals) return '';
  const ym = gMonth(), g = goalOf(ym), items = gItems(g), admin = isAdmin(), cur = ym === thisMonth();
  const months = (DATA.goals || []).filter(x => gItems(x).length).map(x => x.month);
  if (!admin && !months.length) return '';   // 아직 아무 달도 적지 않았으면 팀원에게는 판을 안 보임
  const hasPrev = months.some(m => m < ym), hasNext = ym < thisMonth() || (admin && ym <= thisMonth());   // 관리자는 다음 달 목표를 미리 적을 수 있음
  const done = items.filter(i => i.done).length;
  return `<section class="nboard goals">
    <div class="hd"><h2>🎯 ${Number(ym.slice(5, 7))}월 목표 <span class="cnt">${items.length ? `${done}/${items.length} 달성` : ''}${cur ? '' : ` · ${ym.slice(0, 4)}년`}</span>
      <span class="mnav"><button data-gnav="-1" ${hasPrev ? '' : 'disabled'} title="이전 달">‹</button><button data-gnav="1" ${hasNext ? '' : 'disabled'} title="다음 달">›</button>${cur ? '' : '<button data-gnav="0" title="이번 달로">이번 달</button>'}</span></h2>
      ${admin ? `<button class="act" id="goalEdit">${items.length ? '✎ 목표 고치기' : '＋ 목표 적기'}</button>` : ''}</div>
    ${items.length ? items.map((it, i) => `<div class="grow ${it.done ? 'done' : ''}"><span class="no">${it.done ? '✓' : i + 1}</span><span class="tx">${linkify(it.text)}</span>
      ${admin ? `<button class="ck" data-gdone="${i}" title="눌러서 달성 표시를 바꿉니다">${it.done ? '✓ 달성' : '달성 체크'}</button>` : (it.done ? '<span class="ck">✓ 달성</span>' : '')}</div>`).join('')
    : `<div class="none">${Number(ym.slice(5, 7))}월 목표가 아직 없습니다.${admin ? ' 오른쪽 위 <b>＋ 목표 적기</b>로 적어 주세요.' : ''}</div>`}
    ${g && g.note ? `<div class="gnote">${linkify(g.note)}</div>` : ''}
  </section>`;
}
function bindGoals(){
  document.querySelectorAll('[data-gnav]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.gnav), ym = gMonth();
    if (n === 0) goalMonth = null;
    else if (n > 0) goalMonth = addMonth(ym, 1);
    else { const prev = (DATA.goals || []).filter(x => gItems(x).length && x.month < ym).map(x => x.month).sort().pop(); if (prev) goalMonth = prev; }
    if (goalMonth === thisMonth()) goalMonth = null;
    render();
  });
  const ge = $('#goalEdit'); if (ge) ge.onclick = openGoalEdit;
  document.querySelectorAll('[data-gdone]').forEach(b => b.onclick = async () => {
    if (!isAdmin()) return; const g = goalOf(gMonth()); if (!g) return;
    const items = gItems(g).map((it, i) => i === Number(b.dataset.gdone) ? { ...it, done: !it.done } : it);
    await saveRow('goals', { ...g, items, updated_by: me });
  });
}
/* 목표 적기·고치기 (관리자): 한 줄에 목표 하나. 이미 달성 체크한 줄은 글자가 같으면 체크가 유지됨 */
function openGoalEdit(){
  if (!isAdmin()) return;
  const ym = gMonth(), g = goalOf(ym), items = gItems(g);
  openModal(`${modalHead(`🎯 ${ym.slice(0, 4)}년 ${Number(ym.slice(5, 7))}월 목표`)}
    <div class="mb">
      <div class="f"><label>목표 (한 줄에 하나씩)</label><textarea id="gItems" placeholder="예:\n레모너리 월 매출 5억\n흑생마 쿠팡 로켓그로스 입점\n신규 영상 60개 제작">${esc(items.map(i => i.text).join('\n'))}</textarea></div>
      <div class="f"><label>덧붙이는 말 (선택 · 목표 아래 작은 글씨)</label><textarea id="gNote" style="min-height:50px" placeholder="예: 추석 연휴(10/3~9) 감안한 목표입니다">${esc(g && g.note || '')}</textarea></div>
      <div class="hint">홈 화면 업무공유 아래에 모든 팀원에게 보입니다. 달성한 목표는 홈에서 <b>달성 체크</b>를 누르면 표시됩니다.</div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="gSave">저장</button></div>`, { wide: true });
  $('#gItems').focus();
  $('#gSave').onclick = async () => {
    const lines = $('#gItems').value.split('\n').map(x => x.replace(/^\s*(?:[-*•·]|\d+[.)])\s*/, '').trim()).filter(Boolean);
    const next = lines.map(text => ({ text, done: !!(items.find(i => i.text === text) || {}).done }));
    const row = { id: g ? g.id : uid(), month: ym, items: next, note: $('#gNote').value.trim() || null, created_by: g ? g.created_by : me, created_at: g ? g.created_at : nowIso(), updated_by: me };
    closeModal(); await saveRow('goals', row); toast('목표를 저장했습니다');
  };
}

boot({ icon: BRAND.icon, title: BRAND.name, tables: ['menu', 'projects', 'tasks', 'leaves', 'notices', 'decisions', 'goals', 'accounts', 'subscriptions', 'payments', 'docs', 'ad_comments', 'alarms'], render });
</script>
</body>
