<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비즈홈</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
  .dept{border-radius:10px;padding:10px}
  .dept h2{margin:4px 6px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
  .dept h2 .nm{padding:2px 8px;border-radius:4px}
  .dept h2 .n{font-weight:400;color:var(--fg2);flex:1}
  .pg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;font-weight:500;width:100%;text-align:left}
  .pg:hover{box-shadow:var(--shadow);border-color:var(--line2)}
  .pg .ic{width:22px;text-align:center;font-size:16px;flex:none}
  .pg .t{flex:1;min-width:0;word-break:break-word}
  .pg .soon{font-size:10px;color:var(--fg3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-weight:400;white-space:nowrap}
  .pg.na{color:var(--fg2);font-weight:400}
  .pg .b{font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:0 6px;font-weight:600}
  .addpg{border:0;background:transparent;color:inherit;opacity:.6;padding:8px 12px;width:100%;text-align:left;border-radius:8px;font-size:13px}
  .addpg:hover{opacity:1;background:rgba(255,255,255,.6)}
  .adddept{border:2px dashed var(--line2);border-radius:10px;padding:24px 10px;color:var(--fg3);text-align:center;background:transparent;width:100%;font-size:14px}
  .adddept:hover{color:var(--fg);border-color:var(--fg3)}
  /* 편집 모드 */
  .ed{display:none;gap:2px;flex:none}
  .editing .ed{display:inline-flex}
  .ed button{border:1px solid transparent;background:transparent;border-radius:4px;padding:0 5px;font-size:12px;color:var(--fg2);line-height:20px}
  .ed button:hover{background:rgba(0,0,0,.06);color:var(--fg)}
  .ed button.del:hover{color:var(--red)}
  .editing .pg{cursor:pointer}
  .editing .pg .soon{display:none}
  .editbar{background:#fff8e6;border:1px solid #f5e6a3;border-radius:var(--radius);padding:8px 12px;margin-bottom:14px;font-size:13px;color:#7a5a00;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .emojis{display:flex;flex-wrap:wrap;gap:4px}
  .emojis button{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:16px;padding:2px 4px;line-height:1}
  .emojis button:hover{background:var(--bg3)}
  .foot{margin-top:24px;font-size:12px;color:var(--fg3);text-align:center}
  /* 업무 R&R 판 */
  .rnr{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:18px;overflow:hidden}
  .rnr .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rnr .hd h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .rnr .hd .meta{font-size:12px;color:var(--fg2)}
  .rnr .hd .sp{flex:1}
  .rnr .body{padding:12px 14px}
  .rnr .teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .rnr .team{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .rnr .team h3{margin:0;padding:8px 10px;background:var(--bg3);font-size:14px;text-align:center}
  .rnr table{min-width:0;width:100%}
  .rnr th{width:90px;text-align:center}
  .rnr td.n{width:90px;text-align:center;font-weight:600;vertical-align:middle;white-space:nowrap}
  .rnr td.d{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:13px}
  .rnr .footer{margin-top:12px;color:var(--red);white-space:pre-wrap;line-height:1.6;font-size:13px}
  .rnr .note{font-size:12px;color:var(--fg2);margin-bottom:10px}
  .rnr .fold{border:0;background:transparent;color:var(--fg2);font-size:12px;padding:2px 6px;border-radius:4px}
  .rnr .fold:hover{background:var(--bg3)}
  /* R&R 편집 창 */
  .tbox{border:1px solid var(--line2);border-radius:var(--radius);padding:10px;margin-bottom:10px;background:var(--bg2)}
  .tbox .th{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .tbox .th input{flex:1;border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;font-weight:600}
  .rrow{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;align-items:start;margin-bottom:6px}
  .rrow input,.rrow textarea{border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;width:100%;font:inherit;background:var(--bg)}
  .rrow textarea{min-height:64px;resize:vertical;font-size:13px}
  .rrow .x{padding:4px}
  .addrow2{border:1px dashed var(--line2);background:transparent;border-radius:var(--radius);padding:4px 10px;font-size:12px;color:var(--fg2);width:100%}
  .addrow2:hover{background:var(--bg3);color:var(--fg)}
  .vlist .v{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
  .vlist .v:hover{background:var(--bg2)}
  .vlist .v.on{background:#eef4fd}
  .vlist .v .t{flex:1}
  .vlist .v .m{font-size:12px;color:var(--fg3)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   비즈홈 — 부서별 메뉴 대문. 메뉴는 저장소(menu 표)에 있고 관리자가 화면에서 편집
================================================================ */
const DEPT_COLORS = {
  orange: { n: '주황', bg: '#fdf3ec', tagBg: '#f9dcc4', tagFg: '#9a3b00' },
  yellow: { n: '노랑', bg: '#fdf9e7', tagBg: '#f5e6a3', tagFg: '#7a5a00' },
  blue:   { n: '파랑', bg: '#eef5fd', tagBg: '#cfe3fa', tagFg: '#0b4f9c' },
  pink:   { n: '분홍', bg: '#fdeef3', tagBg: '#f9cfdc', tagFg: '#9c1f4a' },
  gray:   { n: '회색', bg: '#f4f4f2', tagBg: '#e2e2de', tagFg: '#444444' },
  green:  { n: '초록', bg: '#eef8f0', tagBg: '#cdebd3', tagFg: '#1b5e20' },
  purple: { n: '보라', bg: '#f3effd', tagBg: '#dcd0f7', tagFg: '#4a2a8a' },
};
/* 페이지에 연결할 수 있는 화면 목록. 새 화면을 만들면 여기에 한 줄 추가 */
const SCREENS = [
  ['', '아직 없음 (준비 중)'],
  ['tasks.html', '업무요청/보고'],
  ['leave.html', '연차/휴가 등록'],
  ['members', '팀원 관리'],
  ['url', '외부 링크 (인터넷 주소 입력)'],
];
const EMOJIS = ['📝','📋','📅','📆','🗓️','⏰','📊','📈','📉','💰','💳','💵','🧾','🛍️','📦','📁','📄','📒','📚','🔔','✅','🎯','🏆','🎓','🧑‍💼','👥','😀','🤝','📣','💬','💌','✏️','🎨','🎬','🎥','📷','🔎','🔐','🔒','🛠️','⚙️','💻','🖥️','📱','🌐','🚀','🧨','🎁','⭐','❤️'];

/* 처음 한 번 넣는 기본 메뉴. 관리자가 "메뉴 편집"으로 얼마든지 추가·수정 가능 */
const DEFAULT_MENU = [
  ['인사', 'orange', [['📅', '연차/휴가 등록', 'leave.html'], ['😎', '멤버 리스트', 'members']]],
  ['업무지원', 'blue', [['📝', '업무요청/보고', 'tasks.html']]],
];

const M = () => DATA.menu || [];
const bySort = (a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
const depts = () => M().filter(x => x.type === 'dept').sort(bySort);
const pagesOf = id => M().filter(x => x.type === 'page' && x.parent === id).sort(bySort);
let editing = false;
let seeding = false;

async function seedDefault(){
  if (seeding) return; seeding = true;
  try {
    let n = 0;
    for (const [name, color, pages] of DEFAULT_MENU) {
      const d = { id: uid(), type: 'dept', parent: null, name, icon: null, color, href: null, sort_order: n++, created_at: nowIso(), updated_at: nowIso() };
      await store.upsert('menu', d);
      let k = 0;
      for (const [icon, title, href] of pages) await store.upsert('menu', { id: uid(), type: 'page', parent: d.id, name: title, icon, color: null, href: href || null, sort_order: k++, created_at: nowIso(), updated_at: nowIso() });
    }
    toast('기본 메뉴를 넣었습니다. "메뉴 편집"으로 바꿀 수 있습니다');
  } catch (e) { toast('기본 메뉴 넣기 실패: ' + (e.message || e), true); }
  seeding = false;
  await reload();
}

/* ---------- 화면 ---------- */
function render(){
  if (members.length && admins().length === 0) { ensureAdmin(); return; }
  if (!M().length && isAdmin() && !seeding) { seedDefault(); }
  const admin = isAdmin();
  if (!admin) editing = false;
  const tasks = DATA.tasks || [], leaves = DATA.leaves || [];
  const badges = {
    'tasks.html': tasks.filter(t => (t.assignee === me && t.status === '요청') || (t.created_by === me && t.status === '보고완료')).length,
    'leave.html': isAdmin() ? leaves.filter(l => l.status === '신청').length : 0,
  };
  const editBtn = admin ? `<button class="btn ${editing ? 'primary' : ''}" id="editBtn">${editing ? '✓ 편집 끝내기' : '✎ 메뉴 편집'}</button>` : '';
  $('#app').innerHTML = headerHtml({ icon: '🏠', title: '비즈홈', home: false, extra: editBtn }) + `<main class="wrap ${editing ? 'editing' : ''}">
    ${editing ? `<div class="editbar">✎ 편집 중: 부서·페이지를 눌러 이름/아이콘/연결 화면을 바꾸고, ✕ 로 삭제, ↑↓ 로 순서를 바꿉니다. 끝나면 오른쪽 위 <b>편집 끝내기</b>.</div>` : ''}
    ${rnrHtml()}
    ${M().length ? '' : `<div class="empty">${admin ? (seeding ? '기본 메뉴를 넣는 중...' : '메뉴가 없습니다.') : '아직 메뉴가 없습니다. 관리자가 메뉴를 만들면 여기에 나타납니다.'}</div>`}
    <div class="depts">${depts().map((d, di, arr) => {
      const c = DEPT_COLORS[d.color] || DEPT_COLORS.gray;
      const pages = pagesOf(d.id);
      return `<section class="dept" style="background:${c.bg}" data-dept="${d.id}">
        <h2><span class="nm" style="background:${c.tagBg};color:${c.tagFg}">${esc(d.name)}</span><span class="n">${pages.length}</span>
          <span class="ed"><button data-dedit="${d.id}" title="부서 이름·색 바꾸기">✎</button><button data-dmove="${d.id}" data-dir="-1" ${di === 0 ? 'disabled' : ''} title="왼쪽으로">←</button><button data-dmove="${d.id}" data-dir="1" ${di === arr.length - 1 ? 'disabled' : ''} title="오른쪽으로">→</button><button class="del" data-ddel="${d.id}" title="부서 삭제">✕</button></span></h2>
        ${pages.map((p, pi) => {
          const ed = `<span class="ed"><button data-pmove="${p.id}" data-dir="-1" ${pi === 0 ? 'disabled' : ''} title="위로">↑</button><button data-pmove="${p.id}" data-dir="1" ${pi === pages.length - 1 ? 'disabled' : ''} title="아래로">↓</button><button class="del" data-pdel="${p.id}" title="페이지 삭제">✕</button></span>`;
          const inner = `<span class="ic">${esc(p.icon || '📄')}</span><span class="t">${esc(p.name)}</span>`;
          if (editing) return `<div class="pg" data-pedit="${p.id}">${inner}${ed}</div>`;
          if (p.href === 'members') return `<button class="pg" data-members>${inner}<span class="hint">${members.length}명</span></button>`;
          if (p.href && /^https?:\/\//i.test(p.href)) return `<a class="pg" href="${esc(p.href)}" target="_blank" rel="noopener">${inner}<span class="hint">↗</span></a>`;
          if (p.href) return `<a class="pg" href="${esc(p.href)}">${inner}${badges[p.href] ? `<span class="b" title="처리할 것">${badges[p.href]}</span>` : ''}</a>`;
          return `<div class="pg na" data-soon="${esc(p.name)}">${inner}<span class="soon">준비 중</span></div>`;
        }).join('')}
        ${admin ? `<button class="addpg" data-padd="${d.id}">＋ 새 페이지</button>` : ''}
      </section>`;
    }).join('')}
    ${admin && editing ? `<button class="adddept" id="deptAdd">＋ 부서 추가</button>` : ''}</div>
    ${admin && !editing ? `<div class="foot">"준비 중" 페이지는 아직 화면이 없습니다. 연결할 화면이 생기면 메뉴 편집에서 지정합니다.</div>` : ''}
  </main>`;
  bindHeader(() => {}, null, m => `${m.role === 'admin' ? '관리자' : '팀원'}`);
  const eb = $('#editBtn'); if (eb) eb.onclick = () => { editing = !editing; render(); };
  bindRnr();
  document.querySelectorAll('[data-members]').forEach(b => b.onclick = () => openMembers());
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(`"${b.dataset.soon}" 화면은 아직 준비 중입니다`));
  document.querySelectorAll('[data-padd]').forEach(b => b.onclick = () => openPage(null, b.dataset.padd));
  document.querySelectorAll('[data-pedit]').forEach(b => b.onclick = e => { if (e.target.closest('.ed')) return; openPage(b.dataset.pedit); });
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = e => { e.stopPropagation(); delPage(b.dataset.pdel); });
  document.querySelectorAll('[data-pmove]').forEach(b => b.onclick = e => { e.stopPropagation(); moveItem(b.dataset.pmove, Number(b.dataset.dir)); });
  document.querySelectorAll('[data-dedit]').forEach(b => b.onclick = () => openDept(b.dataset.dedit));
  document.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => delDept(b.dataset.ddel));
  document.querySelectorAll('[data-dmove]').forEach(b => b.onclick = () => moveItem(b.dataset.dmove, Number(b.dataset.dir)));
  const da = $('#deptAdd'); if (da) da.onclick = () => openDept(null);
}

/* ---------- 편집 동작 (관리자만) ---------- */
function guard(){ if (!isAdmin()) { toast('관리자만 할 수 있습니다', true); return false; } return true; }
async function moveItem(id, dir){
  if (!guard()) return;
  const it = M().find(x => x.id === id); if (!it) return;
  const list = it.type === 'dept' ? depts() : pagesOf(it.parent);
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  // 순서 번호를 0,1,2… 로 다시 매기면서 둘을 맞바꿈
  const order = list.map(x => x.id); [order[i], order[j]] = [order[j], order[i]];
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row.sort_order !== k) await saveRow('menu', { ...row, sort_order: k }); }
}
async function delPage(id){
  if (!guard()) return;
  const p = M().find(x => x.id === id); if (!p) return;
  if (confirm(`페이지 "${p.name}" 을(를) 메뉴에서 삭제할까요?\n(연결된 화면의 내용은 지워지지 않습니다)`)) { await removeRow('menu', id); toast('삭제했습니다'); }
}
async function delDept(id){
  if (!guard()) return;
  const d = M().find(x => x.id === id); if (!d) return;
  const pages = pagesOf(id);
  if (!confirm(`부서 "${d.name}" 을(를) 삭제할까요?${pages.length ? `\n안에 있는 페이지 ${pages.length}개도 함께 삭제됩니다.` : ''}`)) return;
  for (const p of pages) await removeRow('menu', p.id);
  await removeRow('menu', id);
  toast('부서를 삭제했습니다');
}

/* 페이지 추가·수정 창 */
function openPage(id, deptId){
  if (!guard()) return;
  const p = id ? M().find(x => x.id === id) : null;
  const d = p || { name: '', icon: '📄', parent: deptId, href: '' };
  const isUrl = d.href && /^https?:\/\//i.test(d.href);
  const screenVal = isUrl ? 'url' : (SCREENS.some(s => s[0] === d.href) ? (d.href || '') : '');
  openModal(`${modalHead(p ? '페이지 수정' : '새 페이지')}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>아이콘</label><input id="pIcon" value="${esc(d.icon || '')}" maxlength="4" style="font-size:18px;width:80px"></div>
        <div class="f"><label>이름 *</label><input id="pName" value="${esc(d.name)}" placeholder="예: 구매요청" maxlength="40"></div>
      </div>
      <div class="emojis">${EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('')}</div>
      <div class="f2">
        <div class="f"><label>부서</label><select id="pDept">${depts().map(x => `<option value="${x.id}" ${x.id === d.parent ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        <div class="f"><label>누르면 열리는 화면</label><select id="pScreen">${SCREENS.map(([v, l]) => `<option value="${v}" ${screenVal === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="f" id="pUrlBox" ${screenVal === 'url' ? '' : 'hidden'}><label>인터넷 주소</label><input id="pUrl" value="${esc(isUrl ? d.href : '')}" placeholder="https://..."></div>
      <div class="hint">화면이 아직 없는 메뉴는 "아직 없음"으로 두면 "준비 중"으로 표시됩니다. 새 화면을 만들면 여기서 연결합니다.</div>
    </div>
    <div class="mf">
      ${p ? `<button class="btn danger left" id="pDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="pSave">${p ? '저장' : '추가'}</button>
    </div>`);
  $('#pName').focus();
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { $('#pIcon').value = b.dataset.e; });
  $('#pScreen').onchange = () => { $('#pUrlBox').hidden = $('#pScreen').value !== 'url'; if ($('#pScreen').value === 'url') $('#pUrl').focus(); };
  const save = async () => {
    const name = $('#pName').value.trim(); if (!name) { $('#pName').focus(); toast('이름을 입력하세요', true); return; }
    let href = $('#pScreen').value;
    if (href === 'url') { href = $('#pUrl').value.trim(); if (!/^https?:\/\//i.test(href)) { $('#pUrl').focus(); toast('주소는 https:// 로 시작해야 합니다', true); return; } }
    const parent = $('#pDept').value;
    const n = { id: p ? p.id : uid(), type: 'page', parent, name, icon: $('#pIcon').value.trim() || '📄', color: null, href: href || null,
      sort_order: p && p.parent === parent ? p.sort_order : pagesOf(parent).length, created_at: p ? p.created_at : nowIso() };
    closeModal();
    await saveRow('menu', n);
    toast(p ? '저장했습니다' : '페이지를 추가했습니다');
  };
  $('#pSave').onclick = save;
  $('#pName').onkeydown = e => { if (e.key === 'Enter') save(); };
  if (p) $('#pDel').onclick = () => { closeModal(); delPage(p.id); };
}

/* 부서 추가·수정 창 */
function openDept(id){
  if (!guard()) return;
  const d = id ? M().find(x => x.id === id) : null;
  const cur = d ? d.color : Object.keys(DEPT_COLORS)[depts().length % Object.keys(DEPT_COLORS).length];
  openModal(`${modalHead(d ? '부서 수정' : '새 부서')}
    <div class="mb">
      <div class="f"><label>부서 이름 *</label><input id="dName" value="${esc(d ? d.name : '')}" placeholder="예: 개발" maxlength="20"></div>
      <div class="f"><label>색</label><div class="emojis" id="dColors">${Object.entries(DEPT_COLORS).map(([k, c]) => `<button type="button" data-c="${k}" style="background:${c.tagBg};color:${c.tagFg};padding:4px 10px;font-size:13px;border-color:${k === cur ? c.tagFg : 'transparent'}">${c.n}</button>`).join('')}</div></div>
    </div>
    <div class="mf">
      ${d ? `<button class="btn danger left" id="dDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="dSave">${d ? '저장' : '추가'}</button>
    </div>`);
  let color = cur;
  $('#dName').focus();
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; document.querySelectorAll('[data-c]').forEach(x => x.style.borderColor = x.dataset.c === color ? DEPT_COLORS[x.dataset.c].tagFg : 'transparent'); });
  const save = async () => {
    const name = $('#dName').value.trim(); if (!name) { $('#dName').focus(); toast('부서 이름을 입력하세요', true); return; }
    const n = { id: d ? d.id : uid(), type: 'dept', parent: null, name, icon: null, color, href: null, sort_order: d ? d.sort_order : depts().length, created_at: d ? d.created_at : nowIso() };
    closeModal();
    await saveRow('menu', n);
    toast(d ? '저장했습니다' : '부서를 추가했습니다');
  };
  $('#dSave').onclick = save;
  $('#dName').onkeydown = e => { if (e.key === 'Enter') save(); };
  if (d) $('#dDel').onclick = () => { closeModal(); delDept(d.id); };
}

/* ================================================================
   업무 분장 (R&R) — 버전으로 쌓임. 첫 화면에는 최신 버전, 이전 버전은 언제든 열람
   한 버전 = { version, title, effective_date, note(변경 요약), teams:[{name, rows:[{name, duties}]}], footer(하단 안내문) }
================================================================ */
const R = () => (DATA.rnr || []).slice().sort((a, b) => (b.version || 0) - (a.version || 0));
const latestRnr = () => R()[0];
let rnrFold = LS.get('rnr_fold') === '1';
let rnrSeeding = false;

/* 처음 한 번 넣는 내용 (2026년 9월 업무 분장 캡처) */
const DEFAULT_RNR = {
  title: '9월 업무 분장', effective_date: '2026-09-01', note: '첫 등록',
  teams: [
    { name: '마케팅팀', rows: [
      { name: '안상형', duties: '레모너리 서리맥스 흑생마 영상: 12개' },
      { name: '류수연', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n리뷰 블로그 캠페인' },
      { name: '김채은', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n매월 마지막 수요일 타사광고 레퍼런스/인사이트 공유' },
      { name: '전예솔', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n디자인 업무\n틱톡 심포니 테스트' },
      { name: '김홍재', duties: '레모너리 서리맥스 흑생마 영상: 12개' },
    ]},
    { name: '경영지원팀', rows: [
      { name: '홍주', duties: '1) 매출관리: 식이해법연구소\n2) 퍼포먼스(예산 업데이트), 광고 성과 관리 및 인사이트 공유\n3) 광고 : 광고영상 검수(파트너스 포함)\n4) 네이버광고 (검색광고, 브랜드검색)' },
      { name: '김상우', duties: '1) 보건소대응, 가품 및 리셀 상품 관리\n2) SCM : 제품 bom 관리, 발주 생산, 물류 입출고, 포장박스 발주\n3) 매출관리 : 식이해법연구소/피에이치뷰티\n4) 쇼핑몰 관리\n - 자사몰 : 레모너리/서리맥스/흑생마\n - 쿠팡 : 매칭, 가격관리, 최저가 모니터링\n - 네이버 : 브랜드 검색시 첫페이지 제품노출, 블로그노출, 최저가 모니터링\n5) 고객 CS 및 주문 출고 : 피에이치뷰티' },
      { name: '김홍석', duties: '1) 고객 CS 및 주문 출고 : 식이해법연구소\n2) 오프라인 약국 사업부 : 영업 및 컨텐츠 기획\n3) 리뷰관리 : 자사몰, 네이버, 쿠팡 리뷰 관리' },
      { name: '이유나', duties: '1) 뷰티 BM\n2) 광고 업로드 : 메타, 틱톡, 구글애즈\n3) 기타 지원업무' },
      { name: '황려은', duties: '오프라인 약국 사업부' },
    ]},
  ],
  footer: '* 상기 개별 제작 영상 개수는 월별 기준으로 작성되었으며, 해당 개수는 월말까지 미달되지 않아야 합니다',
};
async function seedRnr(){
  if (rnrSeeding) return; rnrSeeding = true;
  try { await store.upsert('rnr', { id: uid(), version: 1, ...DEFAULT_RNR, created_by: me, created_at: nowIso(), updated_at: nowIso() }); }
  catch (e) { toast('업무 분장 기본 내용 넣기 실패: ' + (e.message || e), true); }
  rnrSeeding = false; await reload();
}
const rnrMeta = v => `v${v.version} · ${fmtDate(v.effective_date) || '적용일 없음'} 적용 · ${esc(v.created_by || '')} · ${fmtDateTime(v.created_at)}`;
function rnrBodyHtml(v){
  const teams = Array.isArray(v.teams) ? v.teams : [];
  return `<div class="teams">${teams.map(t => `<div class="team"><h3>${esc(t.name)}</h3>
    <table><thead><tr><th>인원</th><th>업무</th></tr></thead><tbody>
    ${(t.rows || []).map(r => `<tr><td class="n">${esc(r.name)}</td><td class="d">${esc(r.duties)}</td></tr>`).join('') || '<tr><td colspan="2" class="hint">없음</td></tr>'}
    </tbody></table></div>`).join('')}</div>
    ${v.footer ? `<div class="footer">${esc(v.footer)}</div>` : ''}`;
}
function rnrHtml(){
  const cur = latestRnr(), admin = isAdmin();
  if (!cur) {
    if (admin && !DATA.rnr) return '';   // 표가 아직 없음(SQL 미실행) → 아래 경고에서 안내
    return admin ? `<div class="rnr"><div class="hd"><h2>📋 업무 분장 (R&R)</h2><span class="sp"></span>${rnrSeeding ? '<span class="hint">기본 내용을 넣는 중...</span>' : `<button class="btn sm" id="rnrSeed">9월 업무 분장 불러오기</button><button class="btn sm primary" id="rnrNew">직접 만들기</button>`}</div></div>` : '';
  }
  return `<div class="rnr">
    <div class="hd"><h2>📋 ${esc(cur.title)}</h2><span class="meta">${rnrMeta(cur)}</span><span class="sp"></span>
      <button class="btn sm" id="rnrHist">이전 버전${R().length > 1 ? ` (${R().length - 1})` : ''}</button>
      ${admin ? `<button class="btn sm primary" id="rnrNew">새 버전 만들기</button>` : ''}
      <button class="fold" id="rnrFold">${rnrFold ? '펼치기 ▾' : '접기 ▴'}</button></div>
    ${rnrFold ? '' : `<div class="body">${cur.note && cur.version > 1 ? `<div class="note">이번 버전 변경 요약: ${esc(cur.note)}</div>` : ''}${rnrBodyHtml(cur)}</div>`}
  </div>`;
}
function bindRnr(){
  const s = $('#rnrSeed'); if (s) s.onclick = seedRnr;
  const n = $('#rnrNew'); if (n) n.onclick = () => openRnrEditor(latestRnr());
  const h = $('#rnrHist'); if (h) h.onclick = openRnrHistory;
  const f = $('#rnrFold'); if (f) f.onclick = () => { rnrFold = !rnrFold; LS.set('rnr_fold', rnrFold ? '1' : '0'); render(); };
}
/* 이전 버전 보기 */
function openRnrHistory(sel){
  const list = R(); if (!list.length) return;
  const v = list.find(x => x.id === sel) || list[0];
  openModal(`${modalHead('업무 분장 버전 기록')}
    <div class="mb">
      <div class="vlist" style="border:1px solid var(--line);border-radius:var(--radius);max-height:180px;overflow:auto">${list.map(x => `<div class="v ${x.id === v.id ? 'on' : ''}" data-v="${x.id}"><span class="t"><b>v${x.version}</b> ${esc(x.title)}${x === list[0] ? ' ' + tag('현재', '#dcfce7', '#15803d') : ''}</span><span class="m">${fmtDate(x.effective_date)} 적용 · ${esc(x.created_by || '')}${x.note ? ' · ' + esc(x.note) : ''}</span></div>`).join('')}</div>
      <div class="rnr" style="margin:0"><div class="hd"><h2>${esc(v.title)}</h2><span class="meta">${rnrMeta(v)}</span></div><div class="body">${rnrBodyHtml(v)}</div></div>
    </div>
    <div class="mf">${isAdmin() ? `<button class="btn left" id="rnrFrom">이 버전을 바탕으로 새 버전 만들기</button>` : ''}<button class="btn primary" data-close>닫기</button></div>`, { wide: true });
  document.querySelectorAll('[data-v]').forEach(el => el.onclick = () => openRnrHistory(el.dataset.v));
  const f = $('#rnrFrom'); if (f) f.onclick = () => { closeModal(); openRnrEditor(v); };
}
/* 새 버전 편집 창 (base 내용이 채워진 채 열림, 저장하면 새 버전으로 쌓임) */
function openRnrEditor(base){
  if (!isAdmin()) { toast('관리자만 할 수 있습니다', true); return; }
  const d = base ? JSON.parse(JSON.stringify(base)) : { title: '업무 분장', effective_date: todayStr(), teams: [{ name: '팀', rows: members.map(m => ({ name: m.name, duties: '' })) }], footer: '' };
  if (!Array.isArray(d.teams) || !d.teams.length) d.teams = [{ name: '팀', rows: [] }];
  const nextVer = (latestRnr() ? latestRnr().version : 0) + 1;
  const draft = { title: d.title || '', effective_date: todayStr(), note: '', teams: d.teams, footer: d.footer || '' };
  const teamsHtml = () => draft.teams.map((t, ti) => `<div class="tbox" data-ti="${ti}">
      <div class="th"><input value="${esc(t.name)}" data-tname="${ti}" placeholder="팀 이름"><button class="btn sm danger" data-tdel="${ti}">팀 삭제</button></div>
      ${(t.rows || []).map((r, ri) => `<div class="rrow"><input value="${esc(r.name)}" data-rname="${ti}-${ri}" placeholder="이름"><textarea data-rd="${ti}-${ri}" placeholder="맡은 업무 (줄바꿈으로 여러 개)">${esc(r.duties)}</textarea><button class="x" data-rdel="${ti}-${ri}" title="삭제">✕</button></div>`).join('')}
      <button class="addrow2" data-radd="${ti}">＋ 인원 추가</button>
    </div>`).join('') + `<button class="addrow2" id="rTeamAdd">＋ 팀 추가</button>`;
  /* 화면의 입력값을 draft 에 반영 */
  const collect = () => {
    draft.title = $('#rTitle').value.trim(); draft.effective_date = $('#rDate').value; draft.note = $('#rNote').value.trim(); draft.footer = $('#rFooter').value.trim();
    document.querySelectorAll('[data-tname]').forEach(i => draft.teams[+i.dataset.tname].name = i.value.trim());
    document.querySelectorAll('[data-rname]').forEach(i => { const [a, b] = i.dataset.rname.split('-').map(Number); draft.teams[a].rows[b].name = i.value.trim(); });
    document.querySelectorAll('[data-rd]').forEach(i => { const [a, b] = i.dataset.rd.split('-').map(Number); draft.teams[a].rows[b].duties = i.value.trim(); });
  };
  const paint = () => {
    $('#rTeams').innerHTML = teamsHtml();
    document.querySelectorAll('[data-radd]').forEach(b => b.onclick = () => { collect(); draft.teams[+b.dataset.radd].rows.push({ name: '', duties: '' }); paint(); });
    document.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => { collect(); const [a, c] = b.dataset.rdel.split('-').map(Number); draft.teams[a].rows.splice(c, 1); paint(); });
    document.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => { collect(); const t = draft.teams[+b.dataset.tdel]; if ((t.rows || []).length && !confirm(`"${t.name}" 팀과 인원 ${t.rows.length}명 내용을 지울까요?`)) return; draft.teams.splice(+b.dataset.tdel, 1); paint(); });
    $('#rTeamAdd').onclick = () => { collect(); draft.teams.push({ name: '새 팀', rows: [{ name: '', duties: '' }] }); paint(); };
  };
  openModal(`${modalHead(`새 버전 만들기 (v${nextVer})`)}
    <div class="mb">
      <div class="hint">${base ? `v${base.version} "${esc(base.title)}" 내용이 채워져 있습니다. 고쳐서 저장하면 <b>v${nextVer}</b> 로 새로 쌓이고, 이전 버전은 그대로 남습니다.` : '첫 버전을 만듭니다.'}</div>
      <div class="f2">
        <div class="f"><label>제목 *</label><input id="rTitle" value="${esc(draft.title)}" placeholder="예: 10월 업무 분장" maxlength="60"></div>
        <div class="f"><label>적용일</label><input type="date" id="rDate" value="${esc(draft.effective_date)}"></div>
      </div>
      <div class="f"><label>변경 요약 (무엇이 바뀌었는지 한 줄)</label><input id="rNote" placeholder="예: 안상형 영상 개수 12→15, 황려은 CS 추가" maxlength="200"></div>
      <div id="rTeams"></div>
      <div class="f"><label>하단 안내문 (빨간 글씨로 표시)</label><textarea id="rFooter" style="min-height:50px">${esc(draft.footer)}</textarea></div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="rSave">v${nextVer} 으로 저장</button></div>`, { wide: true });
  paint();
  $('#rTitle').focus();
  $('#rSave').onclick = async () => {
    collect();
    if (!draft.title) { $('#rTitle').focus(); toast('제목을 입력하세요', true); return; }
    draft.teams = draft.teams.map(t => ({ name: t.name || '팀', rows: (t.rows || []).filter(r => r.name || r.duties) })).filter(t => t.rows.length || t.name);
    if (!draft.teams.length) { toast('팀과 인원을 하나 이상 넣어 주세요', true); return; }
    closeModal();
    await saveRow('rnr', { id: uid(), version: nextVer, ...draft, created_by: me, created_at: nowIso() });
    toast(`v${nextVer} 으로 저장했습니다`);
  };
}

boot({ icon: '🏠', title: '비즈홈', tables: ['menu', 'tasks', 'leaves', 'rnr'], render });
</script>
</body>
</html>
