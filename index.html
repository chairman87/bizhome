<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비즈홈</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:20px}
  .q{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);cursor:pointer;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .q:hover{background:var(--bg2);box-shadow:var(--shadow)}
  .q .ic{font-size:24px}
  .q .l{font-weight:600}
  .q .s{font-size:12px;color:var(--fg2)}
  .q .s b{color:var(--red)}
  .depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
  .dept{border-radius:10px;padding:10px}
  .dept h2{margin:4px 6px 10px;font-size:14px;display:flex;align-items:center;gap:8px}
  .dept h2 .nm{padding:2px 8px;border-radius:4px}
  .dept h2 .n{font-weight:400;color:var(--fg2)}
  .pg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;font-weight:500}
  .pg:hover{box-shadow:var(--shadow);border-color:var(--line2)}
  .pg .ic{width:22px;text-align:center;font-size:16px;flex:none}
  .pg .t{flex:1;min-width:0}
  .pg .soon{font-size:10px;color:var(--fg3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-weight:400;white-space:nowrap}
  .pg.na{color:var(--fg2);font-weight:400}
  .pg .b{font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:0 6px;font-weight:600}
  .foot{margin-top:24px;font-size:12px;color:var(--fg3);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   비즈홈 — 부서별 메뉴. href 가 있는 카드만 실제 화면이 연결되어 있음.
   (여기 목록을 고치면 대문 메뉴가 바뀝니다)
================================================================ */
const HOME = [
  { name: '인사', bg: '#fdf3ec', tagBg: '#f9dcc4', tagFg: '#9a3b00', items: [
    ['🥳', 'WELCOME!'], ['⏰', '근무시간 입력'], ['📅', '연차/휴가 등록'], ['🎓', '교육 결과보고'], ['🎯', 'KPI 평가/관리'], ['😎', '멤버 리스트', 'members'], ['😀', '채용공고 / 리스트'],
  ]},
  { name: '총무', bg: '#fdf9e7', tagBg: '#f5e6a3', tagFg: '#7a5a00', items: [
    ['🛍️', '구매요청'], ['💳', '카드 사용내역'], ['💵', '정기결제 관리'], ['💰', '매출/비용 관리'], ['👩‍💼', '파트너사 관리'], ['🔐', '공용계정 관리'], ['🪪', '카드 관리'],
  ]},
  { name: '업무지원', bg: '#eef5fd', tagBg: '#cfe3fa', tagFg: '#0b4f9c', items: [
    ['🗓️', '일일 업무보고'], ['📆', '주간업무 보고'], ['📝', '업무요청/보고', 'tasks.html'], ['🔔', '결재대기함'], ['📥', '프로그램 설치'], ['📄', '공유 자료실'], ['📒', '업무절차/SOP'], ['🖥️', '전사 회의록'],
  ]},
  { name: '마케팅', bg: '#fdeef3', tagBg: '#f9cfdc', tagFg: '#9c1f4a', items: [
    ['👑', '대행팀 온보딩'], ['🧑‍🤝‍🧑', '클라이언트 온보딩'], ['🎯', '대행팀 KPI'], ['✏️', '콘텐츠 제작'], ['🎥', '영상 프리랜서 리스트'], ['🎁', '공구/협찬/시딩'], ['📄', '[온보딩] 대행팀 업무 프로세스'], ['🖥️', '커머스팀'], ['🎬', '셀프캠'], ['🔎', '연예인PPL'], ['📁', '상품기획/조사'], ['🪄', '광고소재 제작'], ['💌', 'CRM/메시지'], ['🧑‍🎤', '마케팅 활동로그'],
  ]},
  { name: '사업관리', bg: '#f4f4f2', tagBg: '#e2e2de', tagFg: '#444', items: [
    ['📈', '전사 대시보드'], ['🕹️', '프로젝트 관리'], ['📉', '세일즈', 'sales.html'], ['💬', 'CS 응대가이드'], ['🧨', '리스크 관리'], ['🔒', '채용/인사 관리'],
  ]},
];

function render(){
  const tasks = DATA.tasks || [], leads = DATA.leads || [];
  const inbox = tasks.filter(t => t.recipient === me && t.status === '회신대기').length;
  const mine = tasks.filter(t => t.assignee === me && t.status !== '완료').length;
  const over = tasks.filter(t => t.assignee === me && t.status !== '완료' && t.due_date && t.due_date < todayStr()).length;
  const active = leads.filter(l => l.status === '대기중' || l.status === '미팅·협의중').length;
  const waiting = leads.filter(l => l.status === '대기중').length;
  $('#app').innerHTML = headerHtml({ icon: '🏠', title: '비즈홈' }) + `<main class="wrap">
    <div class="quick">
      <a class="q" href="tasks.html"><span class="ic">📝</span><div><div class="l">내 업무함</div><div class="s">내 업무 ${mine}건${over ? ` · <b>지연 ${over}건</b>` : ''}${inbox ? ` · <b>받은업무 ${inbox}건</b>` : ' · 받은업무 0건'}</div></div></a>
      <a class="q" href="sales.html"><span class="ic">📌</span><div><div class="l">영업 미팅 현황</div><div class="s">진행중 ${active}건${waiting ? ` · <b>대기중 ${waiting}건</b>` : ''}</div></div></a>
    </div>
    <div class="depts">${HOME.map(d => `<section class="dept" style="background:${d.bg}">
      <h2><span class="nm" style="background:${d.tagBg};color:${d.tagFg}">${esc(d.name)}</span><span class="n">${d.items.length}</span></h2>
      ${d.items.map(([ic, t, href]) => {
        const badge = href === 'tasks.html' && inbox ? `<span class="b">${inbox}</span>` : '';
        if (href === 'members') return `<button class="pg" data-members style="width:100%;text-align:left"><span class="ic">${ic}</span><span class="t">${esc(t)}</span><span class="hint">${members.length}명</span></button>`;
        if (href) return `<a class="pg" href="${href}"><span class="ic">${ic}</span><span class="t">${esc(t)}</span>${badge}</a>`;
        return `<div class="pg na" data-soon="${esc(t)}"><span class="ic">${ic}</span><span class="t">${esc(t)}</span><span class="soon">준비 중</span></div>`;
      }).join('')}
    </section>`).join('')}</div>
    <div class="foot">"준비 중" 메뉴는 아직 화면이 없습니다. 노션 캡처를 보내 주시면 하나씩 만들어 연결합니다.</div>
  </main>`;
  bindHeader(() => {}, null, m => `내 업무 ${tasks.filter(t => t.assignee === m.name && t.status !== '완료').length}건`);
  document.querySelectorAll('[data-members]').forEach(b => b.onclick = () => openMembers());
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(`"${b.dataset.soon}" 화면은 아직 준비 중입니다`));
}

boot({ icon: '🏠', title: '비즈홈', tables: ['tasks', 'leads'], render });
</script>
</body>
</html>
