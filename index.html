<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인트라넷</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202609221642">
<script src="common.js?v=202609221642"></script>
<style>
  /* 폴더들은 가운데로 모음 (폴더 수가 적어도 왼쪽에 쏠리지 않게) */
  .depts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;align-items:flex-start}
  .dept{border-radius:10px;padding:10px;flex:0 1 260px;min-width:0}   /* 폴더 폭은 내용에 맞춰 좁게 고정 (위의 공지·결정사항 판 폭에 맞추지 않음) */
  .depts .adddept{flex:0 1 260px;width:auto}
  @media(max-width:640px){.dept,.depts .adddept{flex:1 1 100%}}
  .dept h2{margin:4px 6px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
  .dept h2 .nm{padding:2px 8px;border-radius:4px}
  .dept h2 .n{font-weight:400;color:var(--fg2);flex:1}
  .pg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;font-weight:500;width:100%;text-align:left}
  .pg:hover{box-shadow:var(--shadow);border-color:var(--line2)}
  .pg .ic{width:22px;text-align:center;font-size:16px;flex:none}
  .pg .t{flex:1;min-width:0;word-break:break-word}
  .pg .soon{font-size:10px;color:var(--fg3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-weight:400;white-space:nowrap}
  .pg.na{color:var(--fg2);font-weight:400}
  .pg .b{font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:0 6px;font-weight:600}
  .addpg{border:0;background:transparent;color:inherit;opacity:.6;padding:8px 12px;width:100%;text-align:left;border-radius:8px;font-size:13px}
  .addpg:hover{opacity:1;background:rgba(255,255,255,.6)}
  .adddept{border:2px dashed var(--line2);border-radius:10px;padding:24px 10px;color:var(--fg3);text-align:center;background:transparent;width:100%;font-size:14px}
  .adddept:hover{color:var(--fg);border-color:var(--fg3)}
  /* 편집 모드 */
  .ed{display:none;gap:2px;flex:none}
  .editing .ed{display:inline-flex}
  .ed button{border:1px solid transparent;background:transparent;border-radius:4px;padding:0 5px;font-size:12px;color:var(--fg2);line-height:20px}
  .ed button:hover{background:rgba(0,0,0,.06);color:var(--fg)}
  .ed button.del:hover{color:var(--red)}
  .editing .pg{cursor:pointer}
  /* 메뉴 편집: 폴더·페이지를 끌어서 순서 바꾸기 */
  .editing .dept[draggable=true]{cursor:grab}
  .dept.dragging,.pg.dragging{opacity:.35}
  .dept.drop-l{box-shadow:-5px 0 0 var(--blue)}
  .dept.drop-r{box-shadow:5px 0 0 var(--blue)}
  .dept.drop-in{outline:2px dashed var(--blue);outline-offset:-2px}
  .pg.drop-before{box-shadow:0 -3px 0 var(--blue)}
  .pg.drop-after{box-shadow:0 3px 0 var(--blue)}
  .editing .pg .soon{display:none}
  .editbar{max-width:1082px;margin-left:auto;margin-right:auto;background:#fff8e6;border:1px solid #f5e6a3;border-radius:var(--radius);padding:8px 12px;margin-bottom:14px;font-size:13px;color:#7a5a00;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .emojis{display:flex;flex-wrap:wrap;gap:4px}
  .emojis button{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:16px;padding:2px 4px;line-height:1}
  .emojis button:hover{background:var(--bg3)}
  .foot{margin-top:24px;font-size:12px;color:var(--fg3);text-align:center}
  .allow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:6px 0}
  .allow label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;width:auto;font-size:13px;font-weight:400;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg)}
  .allow label:has(input:checked){background:#dbeafe;border-color:#93c5fd}
  .allow label.adm{color:var(--fg3);background:var(--bg2)!important;border-color:var(--line)!important}
  /* 공지사항 판 (홈 맨 위) */
  .nboard{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:0 auto 18px;max-width:1082px;overflow:hidden}   /* 폭은 아래 폴더 4개 묶음(260×4+간격)과 같게, 가운데 */
  .nboard .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .nboard .hd h2{margin:0;font-size:14px;flex:1}
  .nboard .hd .cnt{font-size:12px;color:var(--fg2);font-weight:400}
  .nboard .hd a{font-size:12px;color:var(--fg2);text-decoration:none}
  .nboard .hd a:hover{color:var(--fg)}
  .nrow{display:grid;grid-template-columns:1fr 90px 110px 90px;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:var(--bg2)}
  .nrow.unread{background:#fff7f5}
  .nrow.unread:hover{background:#fff0ec}
  .nrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow.unread .t{font-weight:700}
  .nrow .by,.nrow .dt{color:var(--fg2);font-size:12px;white-space:nowrap}
  .nrow .ok{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;text-align:center;color:var(--fg2);background:var(--bg)}
  .nrow.unread .ok{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .nrow .ok[data-dok]:hover{filter:brightness(.92)}
  .nrow .new{font-size:10px;color:#fff;background:var(--red);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600;vertical-align:1px}
  .nrow .pin{margin-right:4px}
  .nrow .rd{font-size:11px;color:var(--fg3);margin-left:6px}
  .nboard .hd:last-child{border-bottom:0}
  .nboard .none{padding:14px;color:var(--fg3);font-size:13px;text-align:center}
  @media(max-width:640px){.nrow{grid-template-columns:1fr 70px}.nrow .by,.nrow .dt{display:none}}
  .content{white-space:pre-wrap;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   비즈홈 — 부서별 메뉴 대문. 메뉴는 저장소(menu 표)에 있고 관리자가 화면에서 편집
================================================================ */
const DEPT_COLORS = {
  orange: { n: '주황', bg: '#fdf3ec', tagBg: '#f9dcc4', tagFg: '#9a3b00' },
  yellow: { n: '노랑', bg: '#fdf9e7', tagBg: '#f5e6a3', tagFg: '#7a5a00' },
  blue:   { n: '파랑', bg: '#eef5fd', tagBg: '#cfe3fa', tagFg: '#0b4f9c' },
  pink:   { n: '분홍', bg: '#fdeef3', tagBg: '#f9cfdc', tagFg: '#9c1f4a' },
  gray:   { n: '회색', bg: '#f4f4f2', tagBg: '#e2e2de', tagFg: '#444444' },
  lime:   { n: '연두', bg: '#f5fae8', tagBg: '#dcedb0', tagFg: '#4a6800' },
  green:  { n: '초록', bg: '#eef8f0', tagBg: '#cdebd3', tagFg: '#1b5e20' },
  purple: { n: '보라', bg: '#f3effd', tagBg: '#dcd0f7', tagFg: '#4a2a8a' },
};
/* 페이지에 연결할 수 있는 화면 목록. 새 화면을 만들면 여기에 한 줄 추가 */
const SCREENS = [
  ['', '아직 없음 (준비 중)'],
  ['tasks.html', '업무'],
  ['rnr.html', '업무 분장'],
  ['alarms.html', '알람 (회사 운영 알람 메시지 모음)'],
  ['leave.html', '연차/휴가 등록'],
  ['notices.html', '공지사항'],
  ['decisions.html', '결정사항 (대표 결정 공유)'],
  ['accounts.html', '운영계정 (업무지원)'],
  ['accounts.html?dept=마케팅', '마케팅계정 (마케팅)'],
  ['subscriptions.html', '구독관리 (매월 지출)'],
  ['payments.html', '결재 (지출 결재·이체)'],
  ['docs.html', '회사 서류함'],
  ['contractors.html', '외주 용역관리'],
  ['quotes.html', '견적서 관리'],
  ['partners.html', '파트너스 (크리에이터 협업)'],
  ['samples.html', '비매출 (샘플 발송)'],
  ['meetings.html', '회의록'],
  ['ads.html', '광고 영상 리스트'],
  ['insights.html', '마케팅 인사이트 (광고 성과에서 배운 것)'],
  ['comments.html', '댓글 관리 (메타 광고 댓글 숨기기·삭제)'],
  ['videos.html', '참고 컨텐츠 영상 (팀원이 참고할 영상 링크 공유)'],
  ['projects.html', '프로젝트 관리'],
  ['members', '팀원 관리'],
  ['url', '외부 링크 (인터넷 주소 입력)'],
];
const EMOJIS = ['📝','📋','📅','📆','🗓️','⏰','📊','📈','📉','💰','💳','💵','🧾','🛍️','📦','📁','📄','📒','📚','🔔','✅','🎯','🏆','🎓','🧑‍💼','👥','😀','🤝','📣','💬','💌','✏️','🎨','🎬','🎥','📷','🔎','🔐','🔒','🛠️','⚙️','💻','🖥️','📱','🌐','🚀','🧨','🎁','⭐','❤️'];

/* 처음 한 번 넣는 기본 메뉴. 관리자가 "메뉴 편집"으로 얼마든지 추가·수정 가능 */
const DEFAULT_MENU = [
  ['인사', 'orange', [['📅', '연차/휴가 등록', 'leave.html'], ['😎', '멤버 리스트', 'members']]],
  ['업무지원', 'blue', [['📝', '업무', 'tasks.html'], ['📋', '업무 분장', 'rnr.html']]],
  ['총무', 'yellow', [['📢', '공지사항', 'notices.html'], ['🔐', '계정·구독 관리', 'accounts.html']]],
  ['마케팅', 'pink', [['🎬', '광고 영상 리스트', 'ads.html'], ['💡', '마케팅 인사이트', 'insights.html']]],
  ['사업관리', 'gray', [['🗂️', '프로젝트 관리', 'projects.html']]],
];

const M = () => DATA.menu || [];
const bySort = (a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
const depts = () => M().filter(x => x.type === 'dept').sort(bySort);
const pagesOf = id => M().filter(x => x.type === 'page' && x.parent === id).sort(bySort);
let editing = false;
let seeding = false;

async function seedDefault(){
  if (seeding) return; seeding = true;
  try {
    let n = 0;
    for (const [name, color, pages] of DEFAULT_MENU) {
      const d = { id: uid(), type: 'dept', parent: null, name, icon: null, color, href: null, sort_order: n++, created_at: nowIso(), updated_at: nowIso() };
      await store.upsert('menu', d);
      let k = 0;
      for (const [icon, title, href] of pages) await store.upsert('menu', { id: uid(), type: 'page', parent: d.id, name: title, icon, color: null, href: href || null, sort_order: k++, created_at: nowIso(), updated_at: nowIso() });
    }
    toast('기본 메뉴를 넣었습니다. "메뉴 편집"으로 바꿀 수 있습니다');
  } catch (e) { toast('기본 메뉴 넣기 실패: ' + (e.message || e), true); }
  seeding = false;
  await reload();
}

/* ---------- 화면 ---------- */
function render(){
  if (members.length && admins().length === 0) { ensureAdmin(); return; }
  if (!M().length && isAdmin() && !seeding) { seedDefault(); }
  const admin = isAdmin();
  if (!admin) editing = false;
  const tasks = DATA.tasks || [], leaves = DATA.leaves || [], notices = DATA.notices || [], accounts = (DATA.accounts || []).filter(a => isAdmin() || !a.admin_only), payments = DATA.payments || [], subs = (DATA.subscriptions || []).filter(s => (isAdmin() || !s.admin_only) && s.status !== '해지'), docs = (DATA.docs || []).filter(d => isAdmin() || !d.admin_only);
  const badges = {
    // 남이 나에게 새로 요청한 것 + 내가 요청한 것 중 확인 기다리는 보고 (내가 직접 등록한 내 업무는 제외)
    'tasks.html': tasks.filter(t => (t.assignee === me && t.status === '요청' && t.created_by !== me) || (t.created_by === me && t.assignee !== me && t.status === '보고완료')).length,
    'leave.html': isAdmin() ? leaves.filter(l => l.status === '신청').length : 0,
    'notices.html': notices.filter(n => !(Array.isArray(n.reads) && n.reads.includes(me))).length,
    'decisions.html': dMine().filter(d => dForMe(d) && !dRead(d)).length,   // 내가 아직 확인 안 한 결정
    'docs.html': docs.filter(d => d.expire_date && dayDiff(d.expire_date) <= 30).length,   // 유효기간 30일 내(지난 것 포함)
    'alarms.html': (DATA.alarms || []).filter(a => !(Array.isArray(a.reads) && a.reads.includes(me))).length,   // 내가 아직 안 읽은 알람
    'comments.html': (DATA.ad_comments || []).filter(c => c.flag && !c.ok_by && !c.hidden && !c.deleted).length,   // 보이는 상태의 이상 의심 댓글 (숨기거나 '문제없음' 하면 빠짐)
    'payments.html': isAdmin() ? payments.filter(p => p.status === '결재대기' || p.status === '결재완료').length : payments.filter(p => p.status === '결재완료').length,   // 관리자: 결재·이체 대기, 팀원: 이체할 것
  };
  const editBtn = admin ? `<button class="btn ${editing ? 'primary' : ''}" id="editBtn">${editing ? '✓ 편집 끝내기' : '✎ 메뉴 편집'}</button>` : '';
  $('#app').innerHTML = headerHtml({ icon: BRAND.icon, title: BRAND.name, home: false, extra: editBtn }) + `<main class="wrap ${editing ? 'editing' : ''}">
    ${editing ? `<div class="editbar">✎ 편집 중: 폴더와 페이지를 <b>끌어서</b> 순서를 바꾸거나 페이지를 다른 폴더로 옮길 수 있습니다(화살표 버튼도 됩니다). 눌러서 이름/아이콘/연결 화면을 바꾸고, ✕ 로 삭제. 끝나면 오른쪽 위 <b>편집 끝내기</b>.</div>` : ''}
    ${M().length ? '' : `<div class="empty">${admin ? (seeding ? '기본 메뉴를 넣는 중...' : '메뉴가 없습니다.') : '아직 메뉴가 없습니다. 관리자가 메뉴를 만들면 여기에 나타납니다.'}</div>`}
    ${editing ? '' : noticeBoard(notices) + decisionBoard()}
    <div class="depts">${depts().map((d, di, arr) => {
      const c = DEPT_COLORS[d.color] || DEPT_COLORS.gray;
      const pages = pagesOf(d.id).filter(p => editing || canSee(p));   // 볼 수 있는 사람이 정해진 메뉴는 그 사람과 관리자만
      return `<section class="dept" style="background:${c.bg}" data-dept="${d.id}" ${editing ? 'draggable="true"' : ''}>
        <h2><span class="nm" style="background:${c.tagBg};color:${c.tagFg}">${esc(d.name)}</span><span class="n">${pages.length}</span>
          <span class="ed"><button data-dedit="${d.id}" title="부서 이름·색 바꾸기">✎</button><button data-dmove="${d.id}" data-dir="-1" ${di === 0 ? 'disabled' : ''} title="왼쪽으로">←</button><button data-dmove="${d.id}" data-dir="1" ${di === arr.length - 1 ? 'disabled' : ''} title="오른쪽으로">→</button><button class="del" data-ddel="${d.id}" title="부서 삭제">✕</button></span></h2>
        ${pages.map((p, pi) => {
          const ed = `<span class="ed"><button data-pmove="${p.id}" data-dir="-1" ${pi === 0 ? 'disabled' : ''} title="위로">↑</button><button data-pmove="${p.id}" data-dir="1" ${pi === pages.length - 1 ? 'disabled' : ''} title="아래로">↓</button><button class="del" data-pdel="${p.id}" title="페이지 삭제">✕</button></span>`;
          const inner = `<span class="ic">${esc(p.icon || '📄')}</span><span class="t">${esc(p.name)}${(p.allowed || []).length ? ` <span class="hint" title="볼 수 있는 사람: ${esc(p.allowed.join(', '))}">🔒</span>` : ''}</span>`;
          if (editing) return `<div class="pg" data-pedit="${p.id}" draggable="true">${inner}${ed}</div>`;
          if (p.href === 'members') return `<button class="pg" data-members>${inner}<span class="hint">${members.length}명</span></button>`;
          if (p.href && /^https?:\/\//i.test(p.href)) return `<a class="pg" href="${esc(p.href)}" target="_blank" rel="noopener">${inner}<span class="hint">↗</span></a>`;
          if (p.href) return `<a class="pg" href="${esc(p.href)}">${inner}${badges[p.href] ? `<span class="b" title="처리할 것">${badges[p.href]}</span>` : ''}</a>`;
          return `<div class="pg na" data-soon="${esc(p.name)}">${inner}<span class="soon">준비 중</span></div>`;
        }).join('')}
        ${admin ? `<button class="addpg" data-padd="${d.id}">＋ 새 페이지</button>` : ''}
      </section>`;
    }).join('')}
    ${admin && editing ? `<button class="adddept" id="deptAdd">＋ 부서 추가</button>` : ''}</div>
    ${admin && !editing ? `<div class="foot">"준비 중" 페이지는 아직 화면이 없습니다. 연결할 화면이 생기면 메뉴 편집에서 지정합니다.</div>` : ''}
  </main>`;
  bindHeader(() => {}, null, m => `${m.role === 'admin' ? '관리자' : '팀원'}`);
  const eb = $('#editBtn'); if (eb) eb.onclick = () => { editing = !editing; render(); };
  document.querySelectorAll('[data-members]').forEach(b => b.onclick = () => openMembers());
  document.querySelectorAll('[data-notice]').forEach(el => el.onclick = () => openNotice(el.dataset.notice));
  document.querySelectorAll('[data-decision]').forEach(el => el.onclick = e => { if (e.target.closest('[data-dok]')) { confirmDecision(el.dataset.decision); return; } openDecision(el.dataset.decision); });
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(`"${b.dataset.soon}" 화면은 아직 준비 중입니다`));
  document.querySelectorAll('[data-padd]').forEach(b => b.onclick = () => openPage(null, b.dataset.padd));
  document.querySelectorAll('[data-pedit]').forEach(b => b.onclick = e => { if (e.target.closest('.ed')) return; openPage(b.dataset.pedit); });
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = e => { e.stopPropagation(); delPage(b.dataset.pdel); });
  document.querySelectorAll('[data-pmove]').forEach(b => b.onclick = e => { e.stopPropagation(); moveItem(b.dataset.pmove, Number(b.dataset.dir)); });
  document.querySelectorAll('[data-dedit]').forEach(b => b.onclick = () => openDept(b.dataset.dedit));
  document.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => delDept(b.dataset.ddel));
  document.querySelectorAll('[data-dmove]').forEach(b => b.onclick = () => moveItem(b.dataset.dmove, Number(b.dataset.dir)));
  const da = $('#deptAdd'); if (da) da.onclick = () => openDept(null);
  if (editing) bindMenuDrag();
}
/* 메뉴 편집 중 끌어서 옮기기: 폴더는 다른 폴더의 왼쪽/오른쪽 절반에, 페이지는 다른 페이지의 위/아래 절반이나 폴더의 빈 곳(맨 끝)에 놓음 */
function bindMenuDrag(){
  let kind = null, dragId = null;
  const clear = () => document.querySelectorAll('.drop-l,.drop-r,.drop-in,.drop-before,.drop-after').forEach(x => x.classList.remove('drop-l', 'drop-r', 'drop-in', 'drop-before', 'drop-after'));
  const end = el => { kind = null; dragId = null; el.classList.remove('dragging'); clear(); };
  document.querySelectorAll('.pg[data-pedit][draggable]').forEach(pg => {
    pg.ondragstart = e => { e.stopPropagation(); kind = 'page'; dragId = pg.dataset.pedit; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); pg.classList.add('dragging'); };
    pg.ondragend = () => end(pg);
    pg.ondragover = e => { if (kind !== 'page' || dragId === pg.dataset.pedit) return; e.preventDefault(); e.stopPropagation(); const r = pg.getBoundingClientRect(); clear(); pg.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before'); };
    pg.ondrop = e => { if (kind !== 'page' || dragId === pg.dataset.pedit) return; e.preventDefault(); e.stopPropagation(); const r = pg.getBoundingClientRect(); const id = dragId, after = e.clientY > r.top + r.height / 2; clear(); dropPage(id, pg.closest('[data-dept]').dataset.dept, pg.dataset.pedit, after); };
  });
  document.querySelectorAll('section.dept[draggable]').forEach(sec => {
    sec.ondragstart = e => { if (e.target !== sec) return; kind = 'dept'; dragId = sec.dataset.dept; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); sec.classList.add('dragging'); };
    sec.ondragend = e => { if (e.target === sec) end(sec); };
    sec.ondragover = e => {
      if (kind === 'page') { e.preventDefault(); clear(); sec.classList.add('drop-in'); return; }
      if (kind !== 'dept' || dragId === sec.dataset.dept) return;
      e.preventDefault(); const r = sec.getBoundingClientRect(); clear(); sec.classList.add(e.clientX > r.left + r.width / 2 ? 'drop-r' : 'drop-l');
    };
    sec.ondrop = e => {
      if (kind === 'page') { e.preventDefault(); const id = dragId; clear(); dropPage(id, sec.dataset.dept, null, true); return; }
      if (kind !== 'dept' || dragId === sec.dataset.dept) return;
      e.preventDefault(); const r = sec.getBoundingClientRect(); const id = dragId, after = e.clientX > r.left + r.width / 2; clear(); dropDept(id, sec.dataset.dept, after);
    };
  });
}

/* ---------- 편집 동작 (관리자만) ---------- */
function guard(){ if (!isAdmin()) { toast('관리자만 할 수 있습니다', true); return false; } return true; }
async function moveItem(id, dir){
  if (!guard()) return;
  const it = M().find(x => x.id === id); if (!it) return;
  const list = it.type === 'dept' ? depts() : pagesOf(it.parent);
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  // 순서 번호를 0,1,2… 로 다시 매기면서 둘을 맞바꿈
  const order = list.map(x => x.id); [order[i], order[j]] = [order[j], order[i]];
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row.sort_order !== k) await saveRow('menu', { ...row, sort_order: k }); }
}
/* 끌어다 놓은 결과를 저장: 순서 번호를 0,1,2… 로 다시 매기고 바뀐 줄만 저장 */
async function dropDept(id, targetId, after){
  if (!guard() || id === targetId) return;
  const order = depts().map(x => x.id).filter(x => x !== id);
  let to = order.indexOf(targetId); if (to < 0) return; if (after) to++;
  order.splice(to, 0, id);
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row && row.sort_order !== k) await saveRow('menu', { ...row, sort_order: k }); }
}
async function dropPage(id, deptId, targetId, after){
  if (!guard() || id === targetId) return;
  const it = M().find(x => x.id === id && x.type === 'page'); if (!it) return;
  const order = pagesOf(deptId).map(x => x.id).filter(x => x !== id);
  let to = targetId ? order.indexOf(targetId) : order.length; if (to < 0) to = order.length; else if (targetId && after) to++;
  order.splice(to, 0, id);
  for (let k = 0; k < order.length; k++) { const row = M().find(x => x.id === order[k]); if (row && (row.sort_order !== k || row.parent !== deptId)) await saveRow('menu', { ...row, parent: deptId, sort_order: k }); }
  if (it.parent !== deptId) toast('다른 폴더로 옮겼습니다');
}
async function delPage(id){
  if (!guard()) return;
  const p = M().find(x => x.id === id); if (!p) return;
  if (confirm(`페이지 "${p.name}" 을(를) 메뉴에서 삭제할까요?\n(연결된 화면의 내용은 지워지지 않습니다)`)) { await removeRow('menu', id); toast('삭제했습니다'); }
}
async function delDept(id){
  if (!guard()) return;
  const d = M().find(x => x.id === id); if (!d) return;
  const pages = pagesOf(id);
  if (!confirm(`부서 "${d.name}" 을(를) 삭제할까요?${pages.length ? `\n안에 있는 페이지 ${pages.length}개도 함께 삭제됩니다.` : ''}`)) return;
  for (const p of pages) await removeRow('menu', p.id);
  await removeRow('menu', id);
  toast('부서를 삭제했습니다');
}

/* 페이지 추가·수정 창 */
const canSee = p => !(Array.isArray(p.allowed) && p.allowed.length) || isAdmin() || p.allowed.includes(me);
function openPage(id, deptId){
  if (!guard()) return;
  const p = id ? M().find(x => x.id === id) : null;
  const d = p || { name: '', icon: '📄', parent: deptId, href: '' };
  const isUrl = d.href && /^https?:\/\//i.test(d.href);
  const screenVal = isUrl ? 'url' : (SCREENS.some(s => s[0] === d.href) ? (d.href || '') : '');
  openModal(`${modalHead(p ? '페이지 수정' : '새 페이지')}
    <div class="mb">
      <div class="f2">
        <div class="f"><label>아이콘</label><input id="pIcon" value="${esc(d.icon || '')}" maxlength="4" style="font-size:18px;width:80px"></div>
        <div class="f"><label>이름 *</label><input id="pName" value="${esc(d.name)}" placeholder="예: 구매요청" maxlength="40"></div>
      </div>
      <div class="emojis">${EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('')}</div>
      <div class="f2">
        <div class="f"><label>부서</label><select id="pDept">${depts().map(x => `<option value="${x.id}" ${x.id === d.parent ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        <div class="f"><label>누르면 열리는 화면</label><select id="pScreen">${SCREENS.map(([v, l]) => `<option value="${v}" ${screenVal === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="f" id="pUrlBox" ${screenVal === 'url' ? '' : 'hidden'}><label>인터넷 주소</label><input id="pUrl" value="${esc(isUrl ? d.href : '')}" placeholder="https://..."></div>
      <div class="hint">화면이 아직 없는 메뉴는 "아직 없음"으로 두면 "준비 중"으로 표시됩니다. 새 화면을 만들면 여기서 연결합니다.</div>
      <div class="f"><label>볼 수 있는 사람 <span class="hint">(아무도 체크하지 않으면 전체 공개 · 관리자는 항상 볼 수 있음)</span></label>
        <div class="allow">${members.map(m => `<label class="${m.role === 'admin' ? 'adm' : ''}"><input type="checkbox" data-allow="${esc(m.name)}" ${(d.allowed || []).includes(m.name) ? 'checked' : ''} ${m.role === 'admin' ? 'checked disabled' : ''}> ${esc(fullName(m.name))}</label>`).join('')}</div></div>
    </div>
    <div class="mf">
      ${p ? `<button class="btn danger left" id="pDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="pSave">${p ? '저장' : '추가'}</button>
    </div>`);
  $('#pName').focus();
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { $('#pIcon').value = b.dataset.e; });
  $('#pScreen').onchange = () => { $('#pUrlBox').hidden = $('#pScreen').value !== 'url'; if ($('#pScreen').value === 'url') $('#pUrl').focus(); };
  const save = async () => {
    const name = $('#pName').value.trim(); if (!name) { $('#pName').focus(); toast('이름을 입력하세요', true); return; }
    let href = $('#pScreen').value;
    if (href === 'url') { href = $('#pUrl').value.trim(); if (!/^https?:\/\//i.test(href)) { $('#pUrl').focus(); toast('주소는 https:// 로 시작해야 합니다', true); return; } }
    const parent = $('#pDept').value;
    const allowed = [...document.querySelectorAll('[data-allow]:checked:not(:disabled)')].map(c => c.dataset.allow);   // 관리자는 저장 안 함(항상 허용)
    const n = { id: p ? p.id : uid(), type: 'page', parent, name, icon: $('#pIcon').value.trim() || '📄', color: null, href: href || null, allowed,
      sort_order: p && p.parent === parent ? p.sort_order : pagesOf(parent).length, created_at: p ? p.created_at : nowIso() };
    closeModal();
    await saveRow('menu', n);
    toast(p ? '저장했습니다' : '페이지를 추가했습니다');
  };
  $('#pSave').onclick = save;
  $('#pName').onkeydown = e => { if (e.key === 'Enter') save(); };
  if (p) $('#pDel').onclick = () => { closeModal(); delPage(p.id); };
}

/* 부서 추가·수정 창 */
function openDept(id){
  if (!guard()) return;
  const d = id ? M().find(x => x.id === id) : null;
  const cur = d ? d.color : Object.keys(DEPT_COLORS)[depts().length % Object.keys(DEPT_COLORS).length];
  openModal(`${modalHead(d ? '부서 수정' : '새 부서')}
    <div class="mb">
      <div class="f"><label>부서 이름 *</label><input id="dName" value="${esc(d ? d.name : '')}" placeholder="예: 개발" maxlength="20"></div>
      <div class="f"><label>색</label><div class="emojis" id="dColors">${Object.entries(DEPT_COLORS).map(([k, c]) => `<button type="button" data-c="${k}" style="background:${c.tagBg};color:${c.tagFg};padding:4px 10px;font-size:13px;border-color:${k === cur ? c.tagFg : 'transparent'}">${c.n}</button>`).join('')}</div></div>
    </div>
    <div class="mf">
      ${d ? `<button class="btn danger left" id="dDel">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="dSave">${d ? '저장' : '추가'}</button>
    </div>`);
  let color = cur;
  $('#dName').focus();
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; document.querySelectorAll('[data-c]').forEach(x => x.style.borderColor = x.dataset.c === color ? DEPT_COLORS[x.dataset.c].tagFg : 'transparent'); });
  const save = async () => {
    const name = $('#dName').value.trim(); if (!name) { $('#dName').focus(); toast('부서 이름을 입력하세요', true); return; }
    const n = { id: d ? d.id : uid(), type: 'dept', parent: null, name, icon: null, color, href: null, sort_order: d ? d.sort_order : depts().length, created_at: d ? d.created_at : nowIso() };
    closeModal();
    await saveRow('menu', n);
    toast(d ? '저장했습니다' : '부서를 추가했습니다');
  };
  $('#dSave').onclick = save;
  $('#dName').onkeydown = e => { if (e.key === 'Enter') save(); };
  if (d) $('#dDel').onclick = () => { closeModal(); delDept(d.id); };
}
/* ---------- 홈 맨 위 공지사항 판 ----------
   홈에는 '지금 볼 것'만: 아직 확인 안 한 글은 전부 + 📌 고정 글 + 확인한 글은 최근 7일 것 최대 3개.
   나머지는 지워지는 게 아니라 전체 보기(공지사항·결정사항 화면)에 쌓임 */
const RECENT_DAYS = 7, RECENT_MAX = 3;
const isRecent = iso => !!iso && (Date.now() - new Date(iso).getTime()) <= RECENT_DAYS * 86400000;
const NREADS = n => Array.isArray(n.reads) ? n.reads : [];
const nRead = n => NREADS(n).includes(me);
const nSorted = list => list.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
function noticeBoard(notices){
  if (!DATA.notices) return '';
  const all = nSorted(notices), unread = all.filter(n => !nRead(n)).length, admin = isAdmin();
  const recent = all.filter(n => nRead(n) && !n.pinned && isRecent(n.created_at)).slice(0, RECENT_MAX);
  const list = all.filter(n => !nRead(n) || n.pinned || recent.includes(n));
  return `<section class="nboard">
    <div class="hd"><h2>📢 공지사항 <span class="cnt">${unread ? `안 읽음 ${unread}건` : list.length ? '' : all.length ? '새 공지 없음' : ''}</span></h2>
      ${admin ? '<a href="notices.html#new">＋ 공지 작성</a>' : ''}<a href="notices.html">전체 보기 →</a></div>
    ${list.length ? list.map(n => `<div class="nrow ${nRead(n) ? '' : 'unread'}" data-notice="${n.id}">
      <span class="t">${n.pinned ? '<span class="pin">📌</span>' : ''}${esc(n.title)}${nRead(n) ? '' : '<span class="new">NEW</span>'}${admin ? `<span class="rd" title="읽은 사람 수">👁 ${NREADS(n).length}/${members.length}</span>` : ''}</span>
      <span class="by">${esc(n.created_by || '')}</span><span class="dt">${fmtDate((n.created_at || '').slice(0, 10))}</span>
      <span class="ok">${nRead(n) ? '✓ 확인완료' : '확인'}</span></div>`).join('')
    : all.length ? '' : `<div class="none">아직 공지가 없습니다.${admin ? ' 오른쪽 위 <b>＋ 공지 작성</b>으로 올려 보세요.' : ''}</div>`}
  </section>`;
}
/* 공지 열어 보기 (열면 읽음 기록) */
function openNotice(id){
  const n = (DATA.notices || []).find(x => x.id === id); if (!n) return;
  if (!nRead(n)) saveRow('notices', { ...n, reads: [...NREADS(n), me] });
  openModal(`${modalHead(`${n.pinned ? '📌 ' : ''}${esc(n.title)}`)}
    <div class="mb">
      <div class="hint">${esc(n.created_by || '')} · ${fmtDateTime(n.created_at)}</div>
      <div class="content">${linkify(n.content || '')}</div>
      ${isAdmin() ? `<div class="hint">읽음 ${NREADS(n).length}/${members.length}${members.filter(m => !NREADS(n).includes(m.name)).length ? ` · 안 읽음: ${members.filter(m => !NREADS(n).includes(m.name)).map(m => esc(m.name)).join(', ')}` : ''}</div>` : ''}
    </div>
    <div class="mf">${isAdmin() ? '<a class="btn left" href="notices.html">수정·삭제는 공지사항 화면에서</a>' : ''}<button class="btn primary" data-close>닫기</button></div>`, { wide: true });
}

/* ---------- 홈의 결정사항 판 (공지 판 바로 아래. 아직 확인 안 한 것을 먼저, 최근 5개) ---------- */
const DREADS = d => Array.isArray(d.reads) ? d.reads : [];
const DTARGETS = d => Array.isArray(d.targets) ? d.targets : [];
const dRead = d => DREADS(d).includes(me);
const dAudience = d => DTARGETS(d).length ? DTARGETS(d) : members.map(m => m.name);
const dForMe = d => dAudience(d).includes(me);
const dMine = () => (DATA.decisions || []).filter(d => isAdmin() || !DTARGETS(d).length || DTARGETS(d).includes(me) || d.created_by === me);   // 대상이 정해진 글은 그 사람들과 관리자만
const dDate = d => d.decided_at || (d.created_at || '').slice(0, 10);
function decisionBoard(){
  if (!DATA.decisions) return '';
  const admin = isAdmin();
  const all = dMine().sort((a, b) => ((dForMe(a) && !dRead(a)) ? 0 : 1) - ((dForMe(b) && !dRead(b)) ? 0 : 1) || String(dDate(b)).localeCompare(String(dDate(a))) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  const need = d => dForMe(d) && !dRead(d);
  const todo = all.filter(need).length, list = [...all.filter(need), ...all.filter(d => !need(d) && isRecent(d.created_at)).slice(0, RECENT_MAX)];
  if (!all.length && !admin) return '';
  return `<section class="nboard">
    <div class="hd"><h2>✅ 결정사항 <span class="cnt">${todo ? `확인할 것 ${todo}건` : list.length ? '' : all.length ? '새 결정사항 없음' : ''}</span></h2>
      ${admin ? '<a href="decisions.html#new">＋ 결정사항 쓰기</a>' : ''}<a href="decisions.html">전체 보기 →</a></div>
    ${list.length ? list.map(d => { const un = dForMe(d) && !dRead(d), aud = dAudience(d); return `<div class="nrow ${un ? 'unread' : ''}" data-decision="${d.id}">
      <span class="t">${d.topic ? `<span class="rd" style="margin:0 6px 0 0">[${esc(d.topic)}]</span>` : ''}${esc(d.title)}${un ? '<span class="new">NEW</span>' : ''}${admin ? `<span class="rd" title="확인한 사람 수">✓ ${aud.filter(n => DREADS(d).includes(n)).length}/${aud.length}</span>` : ''}</span>
      <span class="by">${esc(d.created_by || '')}</span><span class="dt">${fmtDate(dDate(d))}</span>
      ${!dForMe(d) ? '<span class="ok">-</span>' : un ? '<span class="ok" data-dok title="눌러서 확인">확인</span>' : '<span class="ok">✓ 확인완료</span>'}</div>`; }).join('')
    : all.length ? '' : `<div class="none">아직 결정사항이 없습니다. 오른쪽 위 <b>＋ 결정사항 쓰기</b>로 남겨 보세요.</div>`}
  </section>`;
}
async function confirmDecision(id){
  const d = (DATA.decisions || []).find(x => x.id === id); if (!d || dRead(d)) return;
  await saveRow('decisions', { ...d, reads: [...DREADS(d), me] }); toast('확인했습니다');
}
/* 결정사항 열어 보기 (공지와 달리 열기만 해서는 확인 처리되지 않고, 확인했습니다 를 눌러야 함) */
function openDecision(id){
  const d = (DATA.decisions || []).find(x => x.id === id); if (!d) return;
  const aud = dAudience(d), pend = aud.filter(n => !DREADS(d).includes(n)), un = dForMe(d) && !dRead(d);
  openModal(`${modalHead('✅ 결정사항')}
    <div class="mb">
      <div class="hint">${d.topic ? esc(d.topic) + ' · ' : ''}${fmtDate(dDate(d))} · ${esc(d.created_by || '')} · 대상: ${DTARGETS(d).length ? esc(DTARGETS(d).join(', ')) : '전체'}</div>
      <div style="font-size:17px;font-weight:700;line-height:1.5">${esc(d.title)}</div>
      ${d.reason ? `<div class="content" style="background:var(--bg2);border-radius:6px;padding:10px 12px">${linkify(d.reason)}</div>` : ''}
      ${isAdmin() ? `<div class="hint">확인 ${aud.length - pend.length}/${aud.length}${pend.length ? ` · 안 함: ${esc(pend.join(', '))}` : ' · 모두 확인'}</div>` : ''}
    </div>
    <div class="mf">${isAdmin() ? '<a class="btn left" href="decisions.html">수정·삭제는 결정사항 화면에서</a>' : ''}<button class="btn" data-close>닫기</button>${un ? '<button class="btn primary" id="dOk">확인했습니다</button>' : ''}</div>`, { wide: true });
  const ok = $('#dOk'); if (ok) ok.onclick = () => { closeModal(); confirmDecision(id); };
}

boot({ icon: BRAND.icon, title: BRAND.name, tables: ['menu', 'tasks', 'leaves', 'notices', 'decisions', 'accounts', 'subscriptions', 'payments', 'docs', 'ad_comments', 'alarms'], render });
