<!DOCTYPE html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카톡 주문취소</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202610231318">
<script src="common.js?v=202610231318"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .tabs2{display:flex;gap:4px;flex-wrap:wrap}
  .tabs2 button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}
  .tabs2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .card{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:12px 14px;margin-bottom:10px}
  .card.done{opacity:.65}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .brand{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
  .b-레모너리{background:#fef9c3;color:#854d0e}.b-서리맥스{background:#e0f2fe;color:#075985}.b-흑생마{background:#e7e5e4;color:#292524}
  .st{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px}
  .st-취소접수{background:#fee2e2;color:#b91c1c}.st-취소요청,.st-취소중{background:#e0e7ff;color:#3730a3}.st-취소완료{background:#dcfce7;color:#15803d}
  .st-환불대기{background:#fef3c7;color:#92400e}.st-취소실패{background:#fde68a;color:#7c2d12}.st-처리안함{background:#f4f4f5;color:#71717a}
  .when{font-size:12px;color:var(--fg3);margin-left:auto}
  .w{display:inline-block;font-size:11px;background:#fef3c7;color:#92400e;border-radius:3px;padding:1px 6px;margin-right:4px}
  .raw{white-space:pre-wrap;font-size:13px;background:var(--bg2);border-radius:6px;padding:8px 10px;margin:4px 0 10px;border-left:3px solid #fca5a5}
  .who{font-size:13px;color:var(--fg2);margin-bottom:8px}
  .cands{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .cand{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .cand:last-child{border-bottom:0}
  .cand.sel{background:#eff6ff}
  .cand.off{color:var(--fg3);cursor:default}
  .cand .no{font-weight:700;font-family:ui-monospace,Consolas,monospace}
  .cand .meta{flex:1;min-width:0}
  .cand .meta small{display:block;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;border-radius:3px;padding:1px 6px;white-space:nowrap}
  .tag.ok{background:#dcfce7;color:#15803d}.tag.no{background:#f4f4f5;color:#71717a}.tag.ship{background:#fee2e2;color:#b91c1c}
  .refund{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .refund b{font-weight:600}
  .autolog{font-size:12px;color:var(--fg2);background:#f8fafc;border-left:3px solid #a5b4fc;padding:4px 8px;margin-top:8px;word-break:break-all}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .btns .done-info{font-size:12px;color:var(--fg2)}
  .btn.danger2{background:#dc2626;border-color:#dc2626;color:#fff}
  .btn.danger2:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   카톡 주문취소 — 레모너리·서리맥스·흑생마 카톡 채널로 들어온 주문 취소·환불·반품 메시지 (2026-10-23)
   대표 PC 의 KAKAO-ORDER/reader.py 가 메시지를 모으고, 고객 휴대폰으로 찾은 카페24 주문 후보(candidates)를 붙여 넣음.
   직원: 카톡 원문 확인 → 취소할 주문을 고름 → [즉시 취소] → 대표 PC 의 cancel.py 가 카페24 취소 API 로 취소(사유: 구매 의사 취소).
     카드·계좌이체는 결제사 취소까지, 무통장(입금 완료)은 아래 환불 계좌로 환불 정보까지(계좌 없으면 '환불 대기' = 취소 접수만).
     배송이 시작된 주문은 취소 불가 → 반품으로 처리.
   카톡 주문과 같은 잠긴 표(kakao_orders, kind = '취소') · sql-kakao-cancels.sql
================================================================ */
const TABS = [['취소 접수', ['취소접수']], ['진행 중', ['취소요청', '취소중']], ['확인 필요', ['취소실패', '환불대기']], ['취소 완료', ['취소완료']], ['처리 안 함', ['처리안함']]];
const ST_NAME = { 취소접수: '취소 접수', 취소요청: '취소 대기', 취소중: '취소 중', 취소완료: '취소 완료', 환불대기: '환불 대기', 취소실패: '취소 실패', 처리안함: '처리 안 함' };
const TOKEN_KEY = 'think_token';   // 메모장·카톡 주문과 같은 출입증
let ROWS = null, loadErr = '', tab = '취소 접수', brand = '', days = 14, loading = false;
const pick = {};   // 카드별로 고른 주문번호

const sbc = () => SupabaseStore.client;
const myMember = () => members.find(m => m.name === me);
const tokenOf = m => { try { return localStorage.getItem(TOKEN_KEY + '_' + m.id) || ''; } catch (e) { return ''; } };
async function token(){
  const m = myMember(); if (!m) return '';
  let t = tokenOf(m); if (t) return t;
  const { data, error } = await sbc().rpc('think_login', { p_member: m.id, p_pin: m.password || '1234' });
  if (error || !data || !data.ok) throw new Error('출입증을 받지 못했습니다' + (data && data.err ? ` (${data.err})` : ''));
  try { localStorage.setItem(TOKEN_KEY + '_' + m.id, data.token); } catch (e) {}
  return data.token;
}
async function call(name, args, retry = true){
  const { data, error } = await sbc().rpc(name, { p_token: await token(), ...args });
  if (error) throw error;
  if (data && data.ok === false && data.err === 'session' && retry) { const m = myMember(); try { localStorage.removeItem(TOKEN_KEY + '_' + m.id); } catch (e) {} return call(name, args, false); }
  if (data && data.ok === false) throw new Error(data.err);
  return data;
}
async function load(){
  if (loading || store !== SupabaseStore || !myMember()) return;
  loading = true;
  try { ROWS = ((await call('ko_list', { p_days: days })).rows || []).filter(r => r.kind === '취소'); loadErr = ''; }
  catch (e) { loadErr = e.message || String(e); }
  loading = false; render();
}
async function patch(id, p, msg){
  try { await call('ko_update', { p_id: id, p_patch: p }); const r = ROWS.find(x => x.id === id); Object.assign(r, p); if (p.status) { r.handled_by = me; r.handled_at = nowIso(); } render(); if (msg) toast(msg); }
  catch (e) { toast('저장 실패: ' + (e.message || e)); }
}
const fmt = n => n == null ? '' : Number(n).toLocaleString('ko-KR') + '원';
const when = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const cands = r => Array.isArray(r.candidates) ? r.candidates : [];
const canCancel = c => c && !c.shipped && !c.canceled;
// 고른 주문: 직원이 고른 것 → 이미 저장된 것 → 취소 가능한 주문이 하나뿐이면 그것
function selOf(r){
  if (!pick[r.id]) { const ok = cands(r).filter(canCancel); pick[r.id] = r.cancel_order_id || (ok.length === 1 ? ok[0].order_id : ''); }
  return pick[r.id];
}

function candHtml(r, open){
  const list = cands(r);
  if (!list.length) return `<div class="w">⚠ 이 고객 휴대폰으로 최근 30일 주문을 못 찾았어요 — [주문번호 적기]로 직접 적어 주세요</div>`;
  const sel = selOf(r);
  return `<div class="cands">${list.map(c => {
    const off = !canCancel(c) || !open;
    const tag = c.canceled ? '<span class="tag no">이미 취소됨</span>' : c.shipped ? '<span class="tag ship">배송 시작 — 반품 처리</span>' : '<span class="tag ok">취소 가능</span>';
    return `<div class="cand ${sel === c.order_id ? 'sel' : ''} ${off ? 'off' : ''}" ${off ? '' : `data-pick="${esc(r.id)}" data-no="${esc(c.order_id)}"`}>
      ${open ? `<input type="radio" ${sel === c.order_id ? 'checked' : ''} ${off ? 'disabled' : ''}>` : ''}
      <span class="no">${esc(c.order_id)}</span>
      <span class="meta">${esc(c.date || '')} · ${fmt(c.amount)} · ${esc(c.pay || '')} ${c.paid ? '(결제 완료)' : '(입금 전)'} · ${esc(c.ship || '')}<small>${esc(c.items || '')}</small></span>${tag}</div>`;
  }).join('')}</div>`;
}

function cardHtml(r){
  const open = ['취소접수', '취소실패'].includes(r.status);
  const done = ['취소완료', '처리안함'].includes(r.status);
  const list = cands(r), sel = selOf(r);
  const c = list.find(x => x.order_id === sel);
  const needRefund = c && c.paid && /무통장|가상계좌/.test(c.pay || '');
  const rf = r.refund || {};
  return `<div class="card ${done ? 'done' : ''}" data-id="${esc(r.id)}">
    <div class="top"><span class="brand b-${esc(r.brand)}">${esc(r.brand)}</span><span class="st st-${esc(r.status)}">${esc(ST_NAME[r.status] || r.status)}</span>
      <span class="when">카톡 ${esc(r.kakao_name || '')} · ${when(r.sent_at)}</span></div>
    <div class="raw">${esc(r.raw_text || '')}</div>
    <div class="who">고객 <b>${esc(r.name || '?')}</b> · ${esc(r.phone || '휴대폰 없음')}</div>
    ${candHtml(r, open)}
    ${needRefund || rf.account ? `<div class="refund">💳 환불 계좌: ${rf.account ? `<b>${esc(rf.bank || '')} ${esc(rf.account)} ${esc(rf.holder || '')}</b>` : '<span class="w">카톡에 계좌가 없어요 — 비워 두면 취소 접수까지만 하고 환불은 직접</span>'}
      ${open ? `<button class="btn sm" data-refund="${esc(r.id)}">✎ 계좌 고치기</button>` : ''}</div>` : ''}
    ${r.auto_log ? `<div class="autolog">🤖 ${esc(r.auto_log)}</div>` : ''}
    <div class="btns">
      ${open ? `<button class="btn danger2" data-cancel="${esc(r.id)}" ${canCancel(c) ? '' : 'disabled'} title="${canCancel(c) ? '카페24에서 이 주문을 취소합니다' : '취소할 주문을 고르세요(배송 시작된 주문은 취소 불가)'}">즉시 취소</button>
        <button class="btn" data-orderno="${esc(r.id)}">주문번호 적기</button><button class="btn" data-st="처리안함" data-sid="${esc(r.id)}">처리 안 함</button>`
        : r.status === '취소요청' ? `<span class="done-info">대표 PC 가 5분 안에 카페24에서 취소합니다</span><button class="btn" data-st="취소접수" data-sid="${esc(r.id)}">취소 요청 되돌리기</button>`
        : r.status === '취소중' ? `<span class="done-info">카페24에서 취소하는 중…</span>`
        : `<span class="done-info">${r.cancel_order_id ? `주문 <b>${esc(r.cancel_order_id)}</b> · ` : ''}${esc(r.handled_by || '')} ${r.handled_at ? fmtDateTime(r.handled_at) : ''}</span>${r.status !== '취소완료' ? `<button class="btn" data-st="취소접수" data-sid="${esc(r.id)}">다시 열기</button>` : ''}`}
      <button class="btn" data-memo="${esc(r.id)}">메모</button>
    </div>
    ${r.memo ? `<div class="who" style="margin-top:6px">📝 ${esc(r.memo)}</div>` : ''}
  </div>`;
}

function render(){
  let body;
  if (store !== SupabaseStore) body = '<div class="empty">팀 저장소에 연결되지 않았습니다.</div>';
  else if (ROWS === null) body = `<div class="empty">${loadErr ? '불러오지 못했습니다: ' + esc(loadErr) : '불러오는 중…'}</div>`;
  else {
    const inTab = (r, t) => (TABS.find(x => x[0] === t) || [, []])[1].includes(r.status);
    const list = ROWS.filter(r => inTab(r, tab) && (!brand || r.brand === brand));
    const cnt = t => ROWS.filter(r => inTab(r, t) && (!brand || r.brand === brand)).length;
    body = `<div class="actions">
        <div class="tabs2">${TABS.map(([t]) => `<button data-tab="${t}" class="${tab === t ? 'on' : ''}">${t} ${cnt(t)}</button>`).join('')}</div>
        <select id="fbrand" style="border:1px solid var(--line2);border-radius:var(--radius);padding:5px 8px"><option value="">브랜드 전체</option>${['레모너리', '서리맥스', '흑생마'].map(b => `<option ${brand === b ? 'selected' : ''}>${b}</option>`).join('')}</select>
        <select id="fdays" style="border:1px solid var(--line2);border-radius:var(--radius);padding:5px 8px">${[3, 7, 14, 30, 90].map(d => `<option value="${d}" ${days === d ? 'selected' : ''}>최근 ${d}일</option>`).join('')}</select>
        <button class="btn" id="reloadBtn">새로고침</button>
      </div>
      ${list.length ? list.map(cardHtml).join('') : `<div class="empty">${tab === '취소 접수' ? '처리할 카톡 취소 요청이 없습니다. 👍' : '해당하는 건이 없습니다.'}</div>`}`;
  }
  $('#app').innerHTML = headerHtml({ icon: '❌', title: '카톡 주문취소' }) + `<main class="wrap" style="max-width:900px">${body}
    <div class="hint" style="margin-top:12px">대표 PC 가 20분마다 레모너리·서리맥스·흑생마 카톡 채널의 취소·환불·반품 메시지를 모아, 고객 휴대폰으로 찾은 카페24 주문과 함께 올립니다.
    카톡 원문을 보고 취소할 주문을 고른 뒤 <b>즉시 취소</b>를 누르면 대표 PC 가 5분 안에 카페24에서 취소합니다(사유: 구매 의사 취소).
    카드·계좌이체는 결제 취소까지, 입금된 무통장은 환불 계좌로 환불 정보까지 넣습니다(계좌가 없으면 취소 접수까지만 → '확인 필요'의 환불 대기). 배송이 시작된 주문은 취소할 수 없어 반품으로 처리하세요.</div></main>`;
  bindHeader(() => {}, null, () => ROWS ? `처리할 취소 요청 ${ROWS.filter(r => r.status === '취소접수').length}건` : '');
  const get = id => ROWS.find(x => x.id === id);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const fb = $('#fbrand'); if (fb) fb.onchange = () => { brand = fb.value; render(); };
  const fd = $('#fdays'); if (fd) fd.onchange = () => { days = Number(fd.value); load(); };
  const rb = $('#reloadBtn'); if (rb) rb.onclick = () => load();
  document.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => { pick[el.dataset.pick] = el.dataset.no; render(); });
  document.querySelectorAll('[data-cancel]').forEach(el => el.onclick = () => {
    const r = get(el.dataset.cancel), no = pick[r.id] || r.cancel_order_id, c = cands(r).find(x => x.order_id === no);
    if (!no) return toast('취소할 주문을 고르세요');
    const rf = r.refund || {};
    const how = !c ? '' : !c.paid ? '입금 전 주문이라 그대로 취소됩니다.' : /카드|계좌이체/.test(c.pay) ? `${c.pay} 결제도 함께 취소(환불)됩니다.` : /네이버페이|카카오페이/.test(c.pay) ? `${c.pay} 결제가 취소됩니다.`
      : rf.account ? `환불 계좌 ${rf.bank || ''} ${rf.account} ${rf.holder || ''} 로 환불 정보를 넣습니다.` : '환불 계좌가 없어 취소 접수까지만 합니다(환불은 직접).';
    if (!confirm(`${r.brand} 주문 ${no}${c ? ` (${fmt(c.amount)}, ${c.pay})` : ''}\n\n카페24에서 이 주문을 취소합니다. 사유: 구매 의사 취소\n${how}\n\n진행할까요?`)) return;
    patch(r.id, { cancel_order_id: no, status: '취소요청' }, '취소 요청했습니다 — 5분 안에 처리됩니다');
  });
  document.querySelectorAll('[data-orderno]').forEach(el => el.onclick = () => {
    const r = get(el.dataset.orderno);
    const v = prompt('취소할 카페24 주문번호 (예: 20261023-0000292)', r.cancel_order_id || '');
    if (v === null) return;
    const no = v.trim();
    if (!/^\d{8}-\d{7}$/.test(no)) return toast('주문번호 모양이 아닙니다 (예: 20261023-0000292)');
    if (!cands(r).some(c => c.order_id === no)) r.candidates = [...cands(r), { order_id: no, date: '', amount: null, pay: '직접 적음', paid: false, ship: '확인 전', shipped: false, canceled: false, items: '직원이 적은 주문번호 — 대표 PC 가 취소 전에 상태를 확인합니다' }];
    pick[r.id] = no; render();
  });
  document.querySelectorAll('[data-refund]').forEach(el => el.onclick = () => {
    const r = get(el.dataset.refund), rf = r.refund || {};
    const v = prompt('환불 계좌: 은행 계좌번호 예금주 (예: 국민 123456-01-234567 홍길동) — 비우면 계좌 없이 취소 접수만', [rf.bank, rf.account, rf.holder].filter(Boolean).join(' '));
    if (v === null) return;
    const m = v.trim().match(/^(\S+)\s+([\d-]{6,})\s*(\S*)$/);
    if (v.trim() && !m) return toast('은행 계좌번호 예금주 순서로 적어 주세요');
    patch(r.id, { refund: m ? { bank: m[1].replace(/은행$/, ''), account: m[2], holder: m[3] || r.name || '' } : {} }, '환불 계좌를 저장했습니다');
  });
  document.querySelectorAll('[data-st]').forEach(el => el.onclick = () => patch(el.dataset.sid, { status: el.dataset.st }, `${ST_NAME[el.dataset.st] || el.dataset.st}(으)로 바꿨습니다`));
  document.querySelectorAll('[data-memo]').forEach(el => el.onclick = () => { const r = get(el.dataset.memo); const v = prompt('메모', r.memo || ''); if (v !== null) patch(r.id, { memo: v.trim() }, '메모를 저장했습니다'); });
  if (ROWS === null && !loading && !loadErr) load();
}

boot({ icon: '❌', title: '카톡 주문취소', tables: [], render });
setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('#modal .modal')) load(); }, 60000);   // 1분마다 새로 읽기
</script>
</body>
</html>
