<html lang="ko">
<head>

<style>
  .wrap-doc{max-width:980px}
  .lead{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
  .lead h1{margin:0 0 6px;font-size:22px}
  .lead .meta{font-size:12px;color:var(--fg2);margin-bottom:10px}
  .lead p{margin:6px 0;font-size:14px;line-height:1.7}
  .terms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .terms span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--fg2)}
  .terms b{color:var(--fg)}
  .ins{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .ins .no{display:inline-block;background:#fffbea;border:1px solid #e0c25a;color:#92400e;border-radius:999px;font-size:12px;font-weight:700;padding:1px 10px;margin-bottom:8px}
  .ins h2{margin:0 0 6px;font-size:18px;line-height:1.4}
  .ins .sum{font-size:14px;line-height:1.75;color:var(--fg);margin:0 0 12px}
  .ins table{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
  .ins th{background:#fffbea;color:#292524;font-size:12px;font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid #e0c25a;white-space:nowrap}
  .ins td{font-size:13px;padding:7px 10px;border-bottom:1px solid var(--line)}
  .ins tr:last-child td{border-bottom:0}
  .ins td.n,.ins th.n{text-align:right;white-space:nowrap}
  .ins tr.avg td{background:var(--bg2);color:var(--fg2);font-size:12px}
  .ins .cap{font-size:12px;color:var(--fg2);font-weight:600;margin:14px 0 0}
  .good{background:#dcfce7;color:#166534;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
  .bad{background:#fee2e2;color:#b91c1c;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
  .mid{background:var(--bg2);color:var(--fg2);border-radius:4px;padding:1px 7px;font-size:12px;white-space:nowrap}
  .p-레{color:#1d4ed8}.p-서{color:#15803d}.p-흑{color:#6d28d9}
  .todo{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:14px;line-height:1.75;color:#1e3a8a}
  .todo b.t{display:block;font-size:12px;letter-spacing:.04em;margin-bottom:2px}
  .check{background:var(--bg);border:2px solid #e0c25a;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
  .check h2{margin:0 0 8px;font-size:17px}
  .check li{font-size:14px;line-height:1.9}
  .foot{font-size:12px;color:var(--fg2);text-align:center;margin:18px 0 30px;line-height:1.7}
  .who{display:inline-block;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--fg2);vertical-align:middle;font-weight:500}
</style>
</head>

<script>
/* ================================================================
   마케팅 인사이트 — 광고 성과에서 "영상·파트너스 제작에 도움이 되는 것"만 뽑아 팀에 공유하는 화면
   · 금액(지출·예산·CPA), 편집자별 비교, 예산 판단(증액·중단)은 싣지 않음. 효율(ROAS)도 숫자 대신 "평균보다 높음/낮음"으로만 표시.
   · 새 기간의 보고서는 REPORTS 맨 앞에 하나 추가하면 위쪽 탭으로 나뉨.
================================================================ */
const G_ = '<span class="good">평균보다 높음</span>', B_ = '<span class="bad">평균보다 낮음</span>', M_ = '<span class="mid">평균 수준</span>';
const P = c => `<b class="p-${c}">(${c})</b>`;
const REPORTS = [{
  /* 2026-09-20 영상 뜯어보기: 성과 상위 30개를 나스 최종본(실제 돈이 쓰인 편집본)에서 장면·대사로 확인. 작업 폴더 클로드코드\AD-VIDEO-REVIEW */
  key: '2026-09-video', label: '영상 뜯어보기 (9월)',
  title: '잘 되는 영상을 실제로 뜯어봤습니다',
  meta: '자료: 메타 성과 상위 영상 30개(레모너리 14 · 서리맥스 10 · 흑생마 6)의 실제 장면과 대사 전체 · 성과 기간 2026-08-01 ~ 09-19 · 정리 2026-09-20',
  lead: ['지난 보고서는 <b>제목과 숫자만</b> 보고 썼습니다. 이번에는 나스에 있는 최종본 가운데 <b>실제로 광고비가 쓰인 편집본</b>을 찾아, 첫 12초는 1초 단위 장면으로, 대사는 처음부터 끝까지 받아써서 확인했습니다. 영상 내용은 성과를 모르는 상태에서 먼저 기록하고, 그 뒤에 성과와 맞대 봤습니다.',
    '비교는 <b>비슷한 규모로 돌린 영상끼리</b> 했습니다(크게 돌릴수록 효율은 원래 내려가기 때문입니다). 다만 30개를 본 결과라 <b>법칙이 아니라 "다음 영상에서 시험해 볼 가설"</b>로 읽어 주세요.'],
  terms: [['효율', '광고비 대비 매출. 브랜드 평균과 비교해 표시'], ['몸속 설명형', '알약이 몸속을 돌며 생기는 일을 3D·도식으로 설명하는 형식'], ['고지문', '화면 아래 "질병의 예방·치료를 위한 제품이 아닙니다" 같은 작은 안내']],
  items: [
    { who: '영상 제작', h: '"몸속을 설명하는 영상"보다 "사람이 말을 거는 영상"이 팔립니다',
      sum: '우리 영상에서 가장 흔한 형식은 <b>제3자 목소리가 "○○를 먹으면 몸에 무슨 일이 일어날까요?"라고 묻고, 3D 몸속 장면으로 설명</b>하는 것입니다. 이 형식은 크게 키울 수는 있었지만, 확인한 8개(레모너리 6 · 서리맥스 2)가 <b>모두 브랜드 평균 이하</b>의 효율이었습니다. 반대로 비슷한 규모에서 효율이 높았던 영상은 <b>고객이나 친근한 인물이 "나"로 말합니다</b>. 몸속 장면은 없거나 짧습니다.',
      rows: { head: ['효율 좋았던 영상', '브랜드', '첫 문장', '화면', '효율'], body: [
        ['평범한 직장인', P('레'), '"나 그냥 평범한 직장인이에요"', '흰 배경 손그림 일상툰', G_],
        ['속부터채워요', P('서'), '"서리맥스 챙기고 나서 머리 고민이 확실하게 줄었어요"', '흰 배경 손그림', G_],
        ['요즘 대세', P('서'), '"요즘 대세인 서리맥스가 왜 머리 고민에 좋다고 할까요?"', '점토 인형 캐릭터가 제품을 들고 설명', G_],
        ['발효 서리태 잔소리', P('서'), '"언제까지 힘들게 콩물 갈고… 할 거야?"', '제품 캐릭터가 시청자에게 잔소리', G_],
        ['왜 입소문인지 (심포니)', P('레'), '"요즘 왜 이렇게 입소문인지 직접 챙겨봤어요"', '인물 + 제품 실물 근접', `${G_} <span class="mid">자료 적음</span>`],
        ['엄마 흰머리 (심포니)', P('서'), '"부모님 머리를 봤는데 흰머리가 부쩍…"', '자녀가 선물하는 이야기', `${G_} <span class="mid">자료 적음</span>`]],
        avg: [['몸속 설명형 8개 (질문으로 시작 · 제3자 내레이션 · 3D 몸속)', '', '"○○를 먹으면 몸에 무슨 일이 일어날까요?"', '3D 인체 · 알약 캐릭터', '<span class="mid">8개 모두 평균 이하</span>']] },
      todo: '새 기획은 <b>"누가 말하는 영상인가"</b>부터 정해 보세요. 직장인 · 간호사 · 부모님 선물하는 자녀처럼 <b>구체적인 한 사람</b>이 자기 이야기로 시작하는 쪽입니다. 몸속 원리 설명은 중간에 5~10초면 충분합니다.' },
    { who: '영상 제작', h: '그림체보다 대본입니다 — 같은 대본, 다른 그림, 같은 결과',
      sum: '「요즘 대세」(점토 인형)와 「속부터채워요」(손그림)는 <b>그림은 전혀 다른데 대본 뼈대와 마지막 문장이 거의 같고, 효율도 나란히 상위</b>입니다. 그림 스타일을 고민하는 시간보다 대본 뼈대를 맞추는 쪽이 효과가 크다는 뜻입니다.',
      rows: { head: ['순서', '두 영상이 공유하는 대본 뼈대'], body: [
        ['0~3초', '제품과 브랜드명을 바로 보여 줌 + 부드러운 고민 언급("머리 고민")'],
        ['3~12초', '왜 다른가: <b>129시간 발효</b> · <b>한 줌을 한 알에</b> — 숫자 하나, 비유 하나'],
        ['12~40초', '성분 설명은 짧게, 원재료 표시면 같은 <b>실물</b>을 한 번 보여 줌'],
        ['마지막', '<b>"하루 두 알" · "하루 천 원"</b> → "간편하게 시작해보세요" (재촉 없음)']] },
      todo: '이 뼈대에 <b>그림·화자만 바꾼 변주</b>를 먼저 만들어 보세요(실사 1인칭, 부모님 선물 버전 등). 레모너리도 같은 뼈대로 옮길 수 있습니다: 0초 제품 → "레몬 좋은 건 아는데 시고 번거롭다" → 91% · 한 알 → 하루 두 알 루틴.' },
    { who: '영상 제작', h: '센 표현은 효율에 도움이 되지 않았습니다',
      sum: '효율 상위 영상은 하나같이 <b>표현이 부드럽고</b>("도움을 줍니다", "관리되는 느낌", "가벼워지고") <b>화면 아래 고지문</b>이 있습니다. 반대로 <b>단정적인 표현</b>("지방을 녹이는", "쏟아지기", "더 이상 안 빠지고", 브랜드가 직접 "탈모"라고 말하기)을 쓴 영상은 확인한 7개 중 <b>평균을 넘은 것이 1개</b>뿐이었습니다. 증상 부위를 실제처럼 크게 보여 주는 도입도 같은 쪽이었습니다.',
      todo: '수위를 낮추는 것은 심의 때문만이 아니라 <b>파는 데도 유리</b>합니다. 대본을 쓰고 나서 단정 표현을 "~에 도움", "~한 느낌"으로 바꾸고, 고지문을 넣어 주세요.' },
    { who: '영상 제작', h: '증거는 CG가 아니라 "진짜 물건"으로',
      sum: '30개 영상 어디에도 <b>실제 전후 사진 · 체중 숫자 · 후기 캡처는 거의 없습니다</b>. 전후 모습은 대부분 그림이나 AI 인물입니다. 그런데 효율 상위 영상에는 <b>손에 잡히는 실물 증거</b>가 하나씩 들어 있었습니다.',
      rows: { head: ['영상', '브랜드', '실물 증거'], body: [
        ['평범한 직장인', P('레'), '학술지 논문 화면을 캡처해 핵심 문장에 강조 표시'],
        ['왜 입소문인지 (심포니)', P('레'), '상자 뒷면 성분표를 <b>손가락으로 짚으며</b> 읽음 · 91% · HACCP 마크'],
        ['요즘 대세', P('서'), '원재료명 표시면 · 하루 천 원 저울 그림'],
        ['파트너스 (김하연 · 서다흰 · 이지홍)', P('레'), '"레몬과즙분말 91%" 라벨 확대 · 병 뒷면 성분표']] },
      todo: '영상마다 <b>"이건 진짜다" 싶은 컷 하나</b>를 넣어 주세요: 성분표를 손으로 짚기, 라벨 숫자 확대, 논문 · 인증 마크 화면. 화려한 CG 전후 장면보다 이쪽이 구매로 이어졌습니다.' },
    { who: '파트너스', h: '잘 된 파트너스 5편은 구성이 거의 같습니다',
      sum: '효율 상위 파트너스 5편을 나란히 보니 <b>같은 순서</b>였습니다. ① <b>0초부터 제품</b>이 화면에 있음 ② "레몬 좋은 건 아는데 <b>시고 번거롭다</b>" — 5편 중 4편이 레몬 · 레몬즙을 먹고 <b>찡그리는 장면</b>을 넣음 ③ "그래서 한 알" ④ 성분 두세 가지 ⑤ 가벼운 체감("붓기", "속이 편해요") ⑥ "추천해요". <b>체중 숫자 · 전후 사진 · 할인 · 품절은 한 편도 없습니다.</b> 가장 잘 된 영상은 여기에 <b>자기 직업 · 생활</b>을 얹었습니다(간호사복 차림으로 "3교대하면 피곤함과 붓기와의 전쟁").',
      todo: '가이드에 이 순서를 그대로 적어 주세요. 그리고 크리에이터에게 <b>"본인 직업이나 하루 일과에서 시작해 달라"</b>고 부탁해 보세요. 서리맥스 파트너스도 같은 구성(콩물 갈기 번거로움 → 한 알)으로 시험해 볼 만합니다.' },
    { who: '영상 제작', h: '마무리는 재촉보다 "쉬운 루틴"',
      sum: '30개 중 <b>품절 · "오늘 당장" 같은 재촉 장치를 쓴 영상은 2개</b>뿐이고, 효율 상위에는 없습니다. 효율 상위 영상은 거의 전부 <b>"하루 두 알", "루틴", "간편하게"</b>로 끝납니다. 우리 고객이 사는 이유는 "효과가 세서"보다 <b>"레몬물 · 콩물을 매일 챙기는 번거로움을 한 알로 끝낼 수 있어서"</b>에 가깝습니다.',
      todo: '마지막 5초는 <b>"하루 두 알이면 끝"</b>이 전해지면 됩니다. 기존 방식의 번거로움(레몬 짜기, 콩물 갈기, 신맛에 찡그리기)을 앞에서 보여 주면 이 마무리가 더 잘 먹힙니다.' },
    { who: '영상 제작', h: '흑생마는 아직 "사람 목소리" 영상이 없습니다',
      sum: '흑생마 6편은 <b>모두 제3자 내레이션 + AI 영상 + 3D 혈관 설명</b>이고, 고객이 "나"로 말하는 영상과 실물 증거 컷이 한 편도 없습니다. 아직 자료가 적어 어떤 형식이 좋은지 판단하기 이르지만(「10일 동안 흑생마」가 현재 1위), 레모너리 · 서리맥스에서 통한 방식이 <b>아직 시도되지 않았다</b>는 점은 분명합니다.',

}
