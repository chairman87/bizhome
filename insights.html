<script>
/* ================================================================

     (일예산은 광고 영상 리스트에 이미 보이는 값이라 "50만 원 이상" 같은 기준으로는 씀. 성과가 나빴던 영상은 제목 대신 유형으로만.)
   · 화면은 목록 → 글. 글은 conclusion(결론부터) → items(왜 그렇게 봤나). 새 글은 REPORTS 맨 앞에 하나 추가.
================================================================ */
const W_ = '<span class="mid">많이 보여 닳는 중</span>';
const G_ = '<span class="good">평균보다 높음</span>', B_ = '<span class="bad">평균보다 낮음</span>', M_ = '<span class="mid">평균 수준</span>';
const P = c => `<b class="p-${c}">(${c})</b>`;
const REPORTS = [{
  /* 자료: AD-VIDEO-REVIEW (partners.py 파트너스 캠페인 날짜별 성과 · sept.py 2026-06-01 → out/since0601.json 자체 제작 신작). 금액은 싣지 않고 ROAS · 도달 일예산 · 도달률로만. 못 올라간 크리에이터는 실명 없이. */

  return `<div class="tablewrap" style="border:0"><table><thead><tr>${r.head.map((h, i) => `<th class="${num.includes(i) ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${r.body.map(c => tr(c)).join('')}${(r.avg || []).map(c => tr(c, 'avg')).join('')}</tbody></table></div>`;
}
/* 막대 두 줄 비교(예: 구매 비중 vs 광고 노출 비중). rows: [이름, 값A%, 값B%] */
function bars(b){
  if (!b) return '';
  const max = Math.max(...b.rows.flatMap(r => [r[1], r[2] ?? 0]), 1) / 0.88;      // 가장 긴 막대도 오른쪽에 숫자 자리가 남게
  return `<div class="bars"><div class="legend"><span><i class="a"></i>${b.a}</span>${b.b ? `<span><i class="b"></i>${b.b}</span>` : ''}</div>${b.rows.map(([name, a, bb]) =>
    `<div class="brow"><div class="bname">${name}</div><div class="btrack"><div class="bar a" style="width:${a / max * 100}%"></div><span>${a}%</span></div>${bb == null ? '' : `<div class="bname"></div><div class="btrack"><div class="bar b" style="width:${bb / max * 100}%"></div><span>${bb}%</span></div>`}</div>`).join('')}</div>`;
}
function listHtml(){
  return `<main class="wrap wrap-doc"><div class="lead"><h1>마케팅 인사이트</h1><p>광고 성과와 실제 영상을 뜯어보고 <b>"무엇을 어떻게 만들면 좋을지"</b>를 정리한 글 모음입니다. 제목을 누르면 <b>결론부터</b> 나오고, 그 아래에 왜 그렇게 봤는지 분석이 이어집니다.</p></div>
    ${REPORTS.map((r, i) => `<a class="post" href="#${encodeURIComponent(r.key)}"><div class="pno">${REPORTS.length - i}</div><div class="pbody"><div class="ptitle">${r.title}</div><div class="psum">${r.summary || ''}</div><div class="pmeta">${r.date || ''}${(r.tags || []).map(t => `<span class="who">${t}</span>`).join('')}</div></div><div class="parrow">›</div></a>`).join('')}
  </main>`;
}
function detailHtml(R){
  return `<main class="wrap wrap-doc"><a class="back" href="#">← 목록으로</a>
    <div class="lead"><h1>${R.title}</h1><div class="meta">${R.meta}</div>${R.lead.map(p => `<p>${p}</p>`).join('')}
      ${R.terms && R.terms.length ? `<div class="terms">${R.terms.map(([k, v]) => `<span><b>${k}</b> ${v}</span>`).join('')}</div>` : ''}</div>
    ${R.conclusion ? `<section class="concl"><h2>결론부터</h2><ol>${R.conclusion.map(c => `<li>${c}</li>`).join('')}</ol></section><h3 class="why">왜 그렇게 봤나 — 분석</h3>` : ''}
    ${R.items.map((it, i) => `<section class="ins"><span class="no">${R.conclusion ? '근거' : '인사이트'} ${i + 1}</span><span class="who">${it.who}</span><h2>${it.h}</h2><p class="sum">${it.sum}</p>${bars(it.bars)}${table(it.rows)}${it.todo ? `<div class="todo"><b class="t">그래서 이렇게</b>${it.todo}</div>` : ''}</section>`).join('')}
    ${R.check && R.check.length ? `<section class="check"><h2>✅ 기획할 때 체크해 보세요</h2><ul>${R.check.map(c => `<li>${c}</li>`).join('')}</ul></section>` : ''}
    <div class="foot">${R.foot}</div><a class="back" href="#">← 목록으로</a>
  </main>`;
}
function render(){
  const R = REPORTS.find(r => r.key === view);
  $('#app').innerHTML = headerHtml({ icon: '💡', title: '마케팅 인사이트', tabs: [], active: '' }) + (R ? detailHtml(R) : listHtml());
  bindHeader(null, null, null);
}
window.addEventListener('hashchange', () => { view = decodeURIComponent((location.hash || '').slice(1)); renderApp(); window.scrollTo(0, 0); });      // renderApp 이 로그인 · 열람 권한을 확인한 뒤 render 를 부름
boot({ icon: '💡', title: '마케팅 인사이트', tables: [], render });
</script>
</body>
</html>
