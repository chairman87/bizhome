<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 분장</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="common.css?v=202609222208">
<script src="common.js?v=202609222208"></script>
<style>
  /* 업무 R&R 판 */
  .rnr{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:18px;overflow:hidden}
  .rnr .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rnr .hd h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .rnr .hd .meta{font-size:12px;color:var(--fg2)}
  .rnr .hd .sp{flex:1}
  .rnr .body{padding:12px 14px}
  .rnr .teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));max-width:1300px;margin:0 auto}  /* 넓은 화면에서 업무 칸이 너무 늘어나지 않게 */
  .rnr .team{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .rnr .team h3{margin:0;padding:8px 10px;background:var(--bg3);font-size:14px;text-align:center}
  .rnr table{min-width:0;width:100%}
  .rnr th{text-align:center}
  .rnr th:first-child{width:64px}
  .rnr td.n{width:64px;text-align:center;font-weight:600;vertical-align:middle;white-space:nowrap;padding:8px 4px}
  .rnr td.d{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.6;font-size:13px;padding:8px 10px}
  .wrap-wide{max-width:1800px}
  .rnr .footer{margin-top:12px;color:var(--red);white-space:pre-wrap;line-height:1.6;font-size:13px}
  .rnr [data-edit]{cursor:text;border-radius:4px}
  .rnr [data-edit]:hover{background:#fffbea;outline:1px dashed #e0c25a}
  .rnr .inline{width:100%;font:inherit;border:2px solid var(--blue);border-radius:4px;padding:4px 6px;background:var(--bg);resize:vertical;line-height:1.5}
  .rnr td.d .inline{min-height:70px}
  .rnr .note{font-size:12px;color:var(--fg2);margin-bottom:10px}
  /* 조직도: 팀 수만큼 세로 칸, 같은 헤드가 여러 팀을 맡으면 헤드 상자가 그 팀들 위에 넓게 걸침 */
  .org{display:grid;gap:8px 18px;margin:4px auto 18px;max-width:900px}
  .org .box{border:1px solid var(--line2);border-radius:var(--radius);text-align:center;padding:8px 10px;position:relative}
  .org .head{background:#efe9fb;border-color:#c9b8ec;color:#3b2a6b;font-weight:600;font-size:14px}
  .org .head::after,.org .tm::after{content:"";position:absolute;left:50%;bottom:-9px;width:1px;height:8px;background:var(--line2)}
  .org .tm{background:var(--bg3);font-weight:600;font-size:13px}
  .org .mem{display:flex;flex-direction:column;gap:5px}
  .org .mem .p{display:flex;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);border-radius:var(--radius);padding:5px 10px;background:var(--bg);font-size:13px}
  .org .mem .p b{font-weight:600;white-space:nowrap}
  @media (max-width:700px){.org{grid-template-columns:1fr !important}.org .head{grid-column:auto !important}}
  .rnr .fold{border:0;background:transparent;color:var(--fg2);font-size:12px;padding:2px 6px;border-radius:4px}
  .rnr .fold:hover{background:var(--bg3)}
  /* R&R 편집 창 */
  .tbox{border:1px solid var(--line2);border-radius:var(--radius);padding:10px;margin-bottom:10px;background:var(--bg2)}
  .tbox .th{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .tbox .th input{flex:1;border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;font-weight:600}
  .rrow{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;align-items:start;margin-bottom:6px}
  .tbox .th .hd-in{flex:0 0 220px;font-weight:400}
  .rrow input,.rrow textarea{border:1px solid var(--line2);border-radius:var(--radius);padding:6px 8px;width:100%;font:inherit;background:var(--bg)}
  .rrow textarea{min-height:64px;resize:vertical;font-size:13px}
  .rrow .x{padding:4px}
  .addrow2{border:1px dashed var(--line2);background:transparent;border-radius:var(--radius);padding:4px 10px;font-size:12px;color:var(--fg2);width:100%}
  .addrow2:hover{background:var(--bg3);color:var(--fg)}
  .vlist .v{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
  .vlist .v:hover{background:var(--bg2)}
  .vlist .v.on{background:#eef4fd}
  .vlist .v .t{flex:1}
  .vlist .v .m{font-size:12px;color:var(--fg3)}
  .rnr{margin-bottom:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>

/* ================================================================
   업무 분장 (R&R) — 버전으로 쌓임. 첫 화면에는 최신 버전, 이전 버전은 언제든 열람
   한 버전 = { version, title, effective_date, note(변경 요약), teams:[{name, head(헤드 이름), rows:[{name, duties}]  (예전 role 칸은 더 이상 안 씀)}], footer(하단 안내문) }
   조직도는 teams 에서 바로 그림: 팀 순서대로 나란히, 이웃 팀의 head 가 같으면 헤드 상자 하나가 그 팀들 위에 걸침
================================================================ */
const R = () => (DATA.rnr || []).slice().sort((a, b) => (b.version || 0) - (a.version || 0));
const latestRnr = () => R()[0];
let rnrFold = LS.get('rnr_fold') === '1';
let rnrSeeding = false;

/* 처음 한 번 넣는 내용 (2026년 9월 업무 분장 캡처) */
const DEFAULT_RNR = {
  title: '9월 업무 분장', effective_date: '2026-09-01', note: '첫 등록',
  teams: [
    { name: '마케팅팀', head: '홍주', rows: [
      { name: '안상형', role: '영상', duties: '레모너리 서리맥스 흑생마 영상: 12개' },
      { name: '류수연', role: '영상 · 리뷰 블로그', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n리뷰 블로그 캠페인' },
      { name: '김채은', role: '영상 · 레퍼런스', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n매월 마지막 수요일 타사광고 레퍼런스/인사이트 공유' },
      { name: '전예솔', role: '영상 · 디자인', duties: '레모너리/서리맥스 영상: 10개 + 파트너스 2개\n디자인 업무\n틱톡 심포니 테스트' },
      { name: '김홍재', role: '영상', duties: '레모너리 서리맥스 흑생마 영상: 12개' },
    ]},
    { name: '운영기획팀', head: '홍주', rows: [
      { name: '홍주', role: '퍼포먼스 · 광고 검수', duties: '1) 매출관리: 식이해법연구소\n2) 퍼포먼스(예산 업데이트), 광고 성과 관리 및 인사이트 공유\n3) 광고 : 광고영상 검수(파트너스 포함)\n4) 네이버광고 (검색광고, 브랜드검색)' },
      { name: '김상우', role: 'SCM · MD · 경영지원', duties: '1) 보건소대응, 가품 및 리셀 상품 관리\n2) SCM : 제품 bom 관리, 발주 생산, 물류 입출고, 포장박스 발주\n3) 매출관리 : 식이해법연구소/피에이치뷰티\n4) 쇼핑몰 관리\n - 자사몰 : 레모너리/서리맥스/흑생마\n - 쿠팡 : 매칭, 가격관리, 최저가 모니터링\n - 네이버 : 브랜드 검색시 첫페이지 제품노출, 블로그노출, 최저가 모니터링\n5) 고객 CS 및 주문 출고 : 피에이치뷰티' },
      { name: '김홍석', role: 'CS', duties: '1) 고객 CS 및 주문 출고 : 식이해법연구소\n2) 오프라인 약국 사업부 : 영업 및 컨텐츠 기획\n3) 리뷰관리 : 자사몰, 네이버, 쿠팡 리뷰 관리' },
      { name: '이유나', role: '기획 · 광고지원', duties: '1) 뷰티 BM\n2) 광고 업로드 : 메타, 틱톡, 구글애즈\n3) 기타 지원업무' },
    ]},
  ],
  footer: '* 상기 개별 제작 영상 개수는 월별 기준으로 작성되었으며, 해당 개수는 월말까지 미달되지 않아야 합니다',
};
async function seedRnr(){
  if (rnrSeeding) return; rnrSeeding = true;
  try { await store.upsert('rnr', { id: uid(), version: 1, ...DEFAULT_RNR, created_by: me, created_at: nowIso(), updated_at: nowIso() }); }
  catch (e) { toast('업무 분장 기본 내용 넣기 실패: ' + (e.message || e), true); }
  rnrSeeding = false; await reload();
}
const rnrMeta = v => `v${v.version} · ${fmtDate(v.effective_date) || '적용일 없음'} 적용 · ${esc(v.created_by || '')} · ${fmtDateTime(v.created_at)}`;
/* editable=true 면 관리자가 더블클릭으로 바로 고칠 수 있는 표시(data-edit)를 붙임 */
/* 조직도: 팀 순서대로 한 줄에 놓고, 헤드 이름이 같은 이웃 팀은 헤드 상자 하나로 묶음
   이름 뒤 직함(대리·팀장 등)은 팀원 관리의 직함 칸에서 자동으로 붙음(fullName). 여기 이름 칸에는 이름만 적음 */
function orgHtml(v, editable){
  const teams = Array.isArray(v.teams) ? v.teams : [];
  if (!teams.length) return '';
  const ed = (kind, ti, ri) => editable ? ` data-edit="${kind}" data-ti="${ti}" data-ri="${ri ?? ''}" title="더블클릭하면 바로 고칠 수 있습니다"` : '';
  const groups = [];
  teams.forEach((t, ti) => {
    const h = (t.head || '').trim(), last = groups[groups.length - 1];
    if (last && h && last.head === h) last.span++; else groups.push({ head: h, ti, span: 1 });
  });
  const heads = groups.map(g => `<div class="box head" style="grid-column:span ${g.span}${g.head || editable ? '' : ';visibility:hidden'}">
    <span${ed('head', g.ti)}>${esc(g.head ? fullName(g.head) : (editable ? '(헤드 없음 · 더블클릭)' : ''))}</span></div>`).join('');
  const body = teams.map((t, ti) => {
    const all = t.rows || [], head = (t.head || '').trim();
    const rows = all.filter(r => r.name && r.name.trim() !== head);
    return `<div><div class="box tm">${esc(t.name)}</div><div class="mem" style="margin-top:10px">
      ${rows.map(r => `<div class="p"><b${ed('name', ti, all.indexOf(r))}>${esc(fullName(r.name))}</b></div>`).join('') || '<div class="hint" style="text-align:center">인원 없음</div>'}
    </div></div>`;
  }).join('');
  return `<div class="org" style="grid-template-columns:repeat(${teams.length},1fr)">${heads}${body}</div>`;
}
function rnrBodyHtml(v, editable){
  const teams = Array.isArray(v.teams) ? v.teams : [];
  const ed = (kind, ti, ri) => editable ? ` data-edit="${kind}" data-ti="${ti}" data-ri="${ri ?? ''}" title="더블클릭하면 바로 고칠 수 있습니다"` : '';
  return `${orgHtml(v, editable)}<div class="teams">${teams.map((t, ti) => `<div class="team"><h3><span${ed('team', ti)}>${esc(t.name)}</span></h3>
    <table><thead><tr><th>이름</th><th>업무</th></tr></thead><tbody>
    ${(t.rows || []).map((r, ri) => `<tr><td class="n"${ed('name', ti, ri)}>${esc(r.name)}</td><td class="d"${ed('duties', ti, ri)}>${esc(r.duties)}</td></tr>`).join('') || '<tr><td colspan="2" class="hint">없음</td></tr>'}
    </tbody></table></div>`).join('')}</div>
    ${v.footer || editable ? `<div class="footer"${ed('footer')}>${esc(v.footer || (editable ? '(하단 안내문 없음 · 더블클릭해서 입력)' : ''))}</div>` : ''}`;
}
/* 더블클릭 편집: 그 칸이 입력창으로 바뀌고, 다른 곳을 클릭하면 현재 버전에 바로 저장. Esc 는 취소 */
function bindInlineEdit(){
  if (!isAdmin()) return;
  document.querySelectorAll('[data-edit]').forEach(el => el.ondblclick = () => {
    const cur = latestRnr(); if (!cur || el.querySelector('textarea,input')) return;
    const kind = el.dataset.edit, ti = +el.dataset.ti, ri = el.dataset.ri === '' ? null : +el.dataset.ri;
    const get = () => kind === 'title' ? cur.title : kind === 'footer' ? (cur.footer || '') : kind === 'team' ? cur.teams[ti].name : kind === 'head' ? (cur.teams[ti].head || '') : (cur.teams[ti].rows[ri][kind] || '');
    const multi = kind === 'duties' || kind === 'footer';
    const old = get();
    const box = document.createElement(multi ? 'textarea' : 'input');
    box.value = old; box.className = 'inline';
    if (multi) box.rows = Math.max(3, old.split('\n').length + 1);
    el.innerHTML = ''; el.appendChild(box); box.focus(); if (!multi) box.select();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      const val = box.value.trim();
      if (!save || val === old.trim()) { render(); return; }
      const n = JSON.parse(JSON.stringify(cur));
      if (kind === 'title') n.title = val || old; else if (kind === 'footer') n.footer = val; else if (kind === 'team') n.teams[ti].name = val || old; else if (kind === 'head') n.teams[ti].head = val; else n.teams[ti].rows[ri][kind] = val;
      await saveRow('rnr', n);
      toast('저장했습니다 (v' + n.version + ' 에 반영)');
    };
    box.onblur = () => finish(true);
    box.onkeydown = e => {
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      else if (e.key === 'Enter' && (!multi || e.ctrlKey)) { e.preventDefault(); finish(true); }
    };
  });
}
function rnrHtml(){
  const cur = latestRnr(), admin = isAdmin();
  if (!cur) {
    if (admin && !DATA.rnr) return '';   // 표가 아직 없음(SQL 미실행) → 아래 경고에서 안내
    return admin ? `<div class="rnr"><div class="hd"><h2>📋 업무 분장 (R&R)</h2><span class="sp"></span>${rnrSeeding ? '<span class="hint">기본 내용을 넣는 중...</span>' : `<button class="btn sm" id="rnrSeed">9월 업무 분장 불러오기</button><button class="btn sm primary" id="rnrNew">직접 만들기</button>`}</div></div>` : '';
  }
  return `<div class="rnr">
    <div class="hd"><h2>📋 <span${admin ? ' data-edit="title" data-ti="" data-ri="" title="더블클릭하면 바로 고칠 수 있습니다"' : ''}>${esc(cur.title)}</span></h2><span class="meta">${rnrMeta(cur)}</span><span class="sp"></span>
      <button class="btn sm" id="rnrHist">이전 버전${R().length > 1 ? ` (${R().length - 1})` : ''}</button>
      ${admin ? `<button class="btn sm primary" id="rnrNew">새 버전 만들기</button>` : ''}
      <button class="fold" id="rnrFold">${rnrFold ? '펼치기 ▾' : '접기 ▴'}</button></div>
    ${rnrFold ? '' : `<div class="body">${cur.note && cur.version > 1 ? `<div class="note">이번 버전 변경 요약: ${esc(cur.note)}</div>` : ''}${admin ? '<div class="note">✎ 조직도의 헤드, 표의 이름·업무·안내문·제목을 <b>더블클릭</b>하면 그 자리에서 바로 고칠 수 있습니다 (현재 버전에 저장). 월이 바뀌어 크게 바꿀 때는 <b>새 버전 만들기</b>.</div>' : ''}${rnrBodyHtml(cur, admin)}</div>`}
  </div>`;
}
function bindRnr(){
  bindInlineEdit();
  const s = $('#rnrSeed'); if (s) s.onclick = seedRnr;
  const n = $('#rnrNew'); if (n) n.onclick = () => openRnrEditor(latestRnr());
  const h = $('#rnrHist'); if (h) h.onclick = openRnrHistory;
  const f = $('#rnrFold'); if (f) f.onclick = () => { rnrFold = !rnrFold; LS.set('rnr_fold', rnrFold ? '1' : '0'); render(); };
}
/* 이전 버전 보기 */
function openRnrHistory(sel){
  const list = R(); if (!list.length) return;
  const v = list.find(x => x.id === sel) || list[0];
  openModal(`${modalHead('업무 분장 버전 기록')}
    <div class="mb">
      <div class="vlist" style="border:1px solid var(--line);border-radius:var(--radius);max-height:180px;overflow:auto">${list.map(x => `<div class="v ${x.id === v.id ? 'on' : ''}" data-v="${x.id}"><span class="t"><b>v${x.version}</b> ${esc(x.title)}${x === list[0] ? ' ' + tag('현재', '#dcfce7', '#15803d') : ''}</span><span class="m">${fmtDate(x.effective_date)} 적용 · ${esc(x.created_by || '')}${x.note ? ' · ' + esc(x.note) : ''}</span></div>`).join('')}</div>
      <div class="rnr" style="margin:0"><div class="hd"><h2>${esc(v.title)}</h2><span class="meta">${rnrMeta(v)}</span></div><div class="body">${rnrBodyHtml(v)}</div></div>
    </div>
    <div class="mf">${isAdmin() ? `<button class="btn left" id="rnrFrom">이 버전을 바탕으로 새 버전 만들기</button>` : ''}<button class="btn primary" data-close>닫기</button></div>`, { wide: true });
  document.querySelectorAll('[data-v]').forEach(el => el.onclick = () => openRnrHistory(el.dataset.v));
  const f = $('#rnrFrom'); if (f) f.onclick = () => { closeModal(); openRnrEditor(v); };
}
/* 새 버전 편집 창 (base 내용이 채워진 채 열림, 저장하면 새 버전으로 쌓임) */
function openRnrEditor(base){
  if (!isAdmin()) { toast('관리자만 할 수 있습니다', true); return; }
  const d = base ? JSON.parse(JSON.stringify(base)) : { title: '업무 분장', effective_date: todayStr(), teams: [{ name: '팀', rows: members.map(m => ({ name: m.name, duties: '' })) }], footer: '' };
  if (!Array.isArray(d.teams) || !d.teams.length) d.teams = [{ name: '팀', rows: [] }];
  const nextVer = (latestRnr() ? latestRnr().version : 0) + 1;
  const draft = { title: d.title || '', effective_date: todayStr(), note: '', teams: d.teams, footer: d.footer || '' };
  const teamsHtml = () => draft.teams.map((t, ti) => `<div class="tbox" data-ti="${ti}">
      <div class="th"><input value="${esc(t.name)}" data-tname="${ti}" placeholder="팀 이름"><input class="hd-in" value="${esc(t.head || '')}" data-thead="${ti}" placeholder="헤드 이름 (조직도 위 상자)"><button class="btn sm danger" data-tdel="${ti}">팀 삭제</button></div>
      ${(t.rows || []).map((r, ri) => `<div class="rrow"><input value="${esc(r.name)}" data-rname="${ti}-${ri}" placeholder="이름"><textarea data-rd="${ti}-${ri}" placeholder="맡은 업무 (줄바꿈으로 여러 개)">${esc(r.duties)}</textarea><button class="x" data-rdel="${ti}-${ri}" title="삭제">✕</button></div>`).join('')}
      <button class="addrow2" data-radd="${ti}">＋ 인원 추가</button>
    </div>`).join('') + `<button class="addrow2" id="rTeamAdd">＋ 팀 추가</button>`;
  /* 화면의 입력값을 draft 에 반영 */
  const collect = () => {
    draft.title = $('#rTitle').value.trim(); draft.effective_date = $('#rDate').value; draft.note = $('#rNote').value.trim(); draft.footer = $('#rFooter').value.trim();
    document.querySelectorAll('[data-tname]').forEach(i => draft.teams[+i.dataset.tname].name = i.value.trim());
    document.querySelectorAll('[data-thead]').forEach(i => draft.teams[+i.dataset.thead].head = i.value.trim());
    document.querySelectorAll('[data-rname]').forEach(i => { const [a, b] = i.dataset.rname.split('-').map(Number); draft.teams[a].rows[b].name = i.value.trim(); });
    document.querySelectorAll('[data-rd]').forEach(i => { const [a, b] = i.dataset.rd.split('-').map(Number); draft.teams[a].rows[b].duties = i.value.trim(); });
  };
  const paint = () => {
    $('#rTeams').innerHTML = teamsHtml();
    document.querySelectorAll('[data-radd]').forEach(b => b.onclick = () => { collect(); draft.teams[+b.dataset.radd].rows.push({ name: '', role: '', duties: '' }); paint(); });
    document.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => { collect(); const [a, c] = b.dataset.rdel.split('-').map(Number); draft.teams[a].rows.splice(c, 1); paint(); });
    document.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => { collect(); const t = draft.teams[+b.dataset.tdel]; if ((t.rows || []).length && !confirm(`"${t.name}" 팀과 인원 ${t.rows.length}명 내용을 지울까요?`)) return; draft.teams.splice(+b.dataset.tdel, 1); paint(); });
    $('#rTeamAdd').onclick = () => { collect(); draft.teams.push({ name: '새 팀', head: '', rows: [{ name: '', role: '', duties: '' }] }); paint(); };
  };
  openModal(`${modalHead(`새 버전 만들기 (v${nextVer})`)}
    <div class="mb">
      <div class="hint">${base ? `v${base.version} "${esc(base.title)}" 내용이 채워져 있습니다. 고쳐서 저장하면 <b>v${nextVer}</b> 로 새로 쌓이고, 이전 버전은 그대로 남습니다.` : '첫 버전을 만듭니다.'}</div>
      <div class="f2">
        <div class="f"><label>제목 *</label><input id="rTitle" value="${esc(draft.title)}" placeholder="예: 10월 업무 분장" maxlength="60"></div>
        <div class="f"><label>적용일</label><input type="date" id="rDate" value="${esc(draft.effective_date)}"></div>
      </div>
      <div class="f"><label>변경 요약 (무엇이 바뀌었는지 한 줄)</label><input id="rNote" placeholder="예: 안상형 영상 개수 12→15, 황려은 CS 추가" maxlength="200"></div>
      <div id="rTeams"></div>
      <div class="f"><label>하단 안내문 (빨간 글씨로 표시)</label><textarea id="rFooter" style="min-height:50px">${esc(draft.footer)}</textarea></div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="rSave">v${nextVer} 으로 저장</button></div>`, { wide: true });
  paint();
  $('#rTitle').focus();
  $('#rSave').onclick = async () => {
    collect();
    if (!draft.title) { $('#rTitle').focus(); toast('제목을 입력하세요', true); return; }
    draft.teams = draft.teams.map(t => ({ name: t.name || '팀', head: t.head || '', rows: (t.rows || []).filter(r => r.name || r.duties) })).filter(t => t.rows.length || t.name);
    if (!draft.teams.length) { toast('팀과 인원을 하나 이상 넣어 주세요', true); return; }
    closeModal();
    await saveRow('rnr', { id: uid(), version: nextVer, ...draft, created_by: me, created_at: nowIso() });
    toast(`v${nextVer} 으로 저장했습니다`);
  };
}

/* ---------- 화면 ---------- */
function render(){
  const cur = latestRnr(), admin = isAdmin();
  $('#app').innerHTML = headerHtml({ icon: '📋', title: '업무 분장' }) + `<main class="wrap wrap-wide">
    ${!DATA.rnr ? `<div class="empty">업무 분장 저장 표가 아직 없습니다.${admin ? ' 위쪽 빨간 안내대로 Supabase 에서 SQL 을 실행하세요.' : ' 관리자에게 문의하세요.'}</div>` : ''}
    ${DATA.rnr && !cur && !admin ? '<div class="empty">아직 등록된 업무 분장이 없습니다.</div>' : ''}
    ${rnrHtml()}
  </main>`;
  bindHeader(() => {}, null, m => `${m.role === 'admin' ? '관리자' : '팀원'}`);
  bindRnr();
}

boot({ icon: '📋', title: '업무 분장', tables: ['rnr'], render });
</script>
</body>
</html>
