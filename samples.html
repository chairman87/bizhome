<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비매출</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="common.css?v=202609201503">
<script src="common.js?v=202609201503"></script>
<style>
  .actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .actions .btn{padding:9px 16px;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
  .stat .l{font-size:12px;color:var(--fg2)}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v.orange{color:var(--orange)}
  .stat .s{font-size:11px;color:var(--fg3)}
  table.sm{min-width:1500px}
  table.sm td{white-space:nowrap}
  table.sm td.addr{white-space:normal;min-width:260px;max-width:420px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .prod{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;border:1px solid transparent;background:#f1f5f9;color:#334155}
  .prod.p0{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .prod.p1{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .prod.p2{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
  .prod.p3{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
  select.prodsel{border:1px solid transparent;background:transparent;border-radius:6px;font:inherit;font-size:13px;font-weight:700;padding:3px 6px;cursor:pointer}
  select.prodsel:hover{border-color:var(--line2);background:#fff}
  tr.sent td{color:var(--fg3)}
  tr.sent td .prod{opacity:.6}
  .cat{font-size:12px;background:#e0e7ff;color:#3730a3;border-radius:4px;padding:1px 7px;white-space:nowrap}
  .co{font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap;background:var(--bg3);color:var(--fg2)}
  .co.a{background:#dcfce7;color:#166534}.co.b{background:#fce7f3;color:#9d174d}
  .ox{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:2px 10px;font-weight:600;cursor:pointer;color:var(--fg3);font-size:12px;white-space:nowrap}
  .ox.on{background:#dcfce7;border-color:#86efac;color:#15803d}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .f4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.f3,.f4{grid-template-columns:1fr}}
  .sel{background:#fffbea}
  .pickcell{cursor:pointer;text-align:center;width:44px;min-width:44px;padding:0 !important;user-select:none}
  .pickcell:hover{background:#eff6ff}
  .pickcell input{width:20px;height:20px;cursor:pointer;vertical-align:middle;margin:10px 12px}
  .catsel{display:flex;gap:2px;align-items:center;width:100%}
  .catsel select,.catsel input{flex:1;min-width:0}
  .catsel .back{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:0 6px;height:30px;cursor:pointer;color:var(--fg2);flex:none}
  tr.newrow td{background:#fffbea;padding:4px 6px}
  tr.newrow input,tr.newrow select{width:100%;border:1px solid #e0c25a;border-radius:4px;padding:5px 6px;font:inherit;font-size:13px;background:#fff;box-sizing:border-box}
  tr.newrow input:focus,tr.newrow select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
  [data-edit]{cursor:text}
  .inline{width:100%;font:inherit;font-size:13px;border:2px solid var(--blue);border-radius:4px;padding:2px 6px;background:var(--bg);box-sizing:border-box}
  .bulk{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:160px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================================================================
   비매출 — 샘플(무상) 발송 관리. 물류에 올리는 엑셀 양식 그대로 추출
   한 줄 = { product(제품), product_name(주문상품명), option_name(주문상품명(옵션포함)), qty(수량), recipient(수령인), phone, zip, address, address2,
             pay_type(결제구분), pay_method(결제수단), order_date(발주일), country(배송국가), category(구분), memo,
             sent(발송 완료), sent_at, exported_at(엑셀 추출한 때), created_by/at, updated_by/at }
================================================================ */
/* 물류 양식에 들어가는 제품 이름 (주문상품명 / 옵션포함) */
const PRESETS = {
  '레모너리': { name: '[공식] 레모너리 1박스 트리플 고체레몬즙 600mg X 60정', option: '[공식] 레모너리 1박스 트리플 고체레몬즙 600mg X 60정' },
  '서리맥스': { name: '[공식] 서리맥스 129발효서리태 1박스 (500mg, 60정)', option: '[공식] 서리맥스 129발효서리태 1박스 (500mg, 60정)' },
  '흑생마':   { name: '[공식] 137 흑생마 1박스 (500mg, 60정)', option: '[공식] 137 흑생마 1박스 (500mg, 60정)' },
};
const PRODUCTS = Object.keys(PRESETS);
/* 제품 → 회사 (물류 계정이 회사별로 달라 엑셀도 회사별로 나눔) */
const COMPANY_OF = { '레모너리': '식이해법연구소', '서리맥스': '식이해법연구소', '흑생마': '(주)피에이치뷰티' };
const COMPANIES = ['식이해법연구소', '(주)피에이치뷰티'];
const coOf = s => COMPANY_OF[s.product] || '기타';
const CO_CLS = { '식이해법연구소': 'a', '(주)피에이치뷰티': 'b' };
/* 고를 수 있는 제품: 회사 탭을 골랐으면 그 회사 제품만 (식이해법연구소=레모너리·서리맥스, 피에이치뷰티=흑생마) */
const prodsFor = co => co ? PRODUCTS.filter(p => COMPANY_OF[p] === co) : PRODUCTS;
const prodOpts = (sel, co) => prodsFor(co).map(p => `<option ${sel === p ? 'selected' : ''}>${p}</option>`).join('');
const CATS = ['파트너스', '고객'];   // 구분 선택지 (그 외는 직접 입력)
/* 구분 선택 상자: 파트너스 / 고객 / 직접 입력… (직접 입력을 고르면 글자 칸이 나옴) */
const catSelHtml = (id, val, extra = '') => { const custom = val && !CATS.includes(val); return `<span class="catsel"><select id="${id}Sel" ${extra} ${custom ? 'hidden' : ''}>${CATS.map(c => `<option ${val === c ? 'selected' : ''}>${c}</option>`).join('')}<option value="__new" ${custom ? 'selected' : ''}>직접 입력…</option></select><input id="${id}" value="${esc(val || '')}" placeholder="구분 입력 후 Enter" ${extra} ${custom ? '' : 'hidden'}><button type="button" class="back" id="${id}Back" title="목록에서 고르기" ${custom ? '' : 'hidden'}>▾</button></span>`; };
/* 직접 입력을 고르면 같은 자리에서 선택 상자가 글자 칸으로 바뀜. ▾ 를 누르거나 빈 채로 Esc 하면 다시 목록으로 */
const bindCatSel = id => { const sel = $('#' + id + 'Sel'), inp = $('#' + id), back = $('#' + id + 'Back'); if (!sel || !inp) return;
  if (sel.value !== '__new') inp.value = sel.value;
  const toInput = () => { sel.hidden = true; inp.hidden = false; back.hidden = false; inp.focus(); };
  const toList = () => { inp.hidden = true; back.hidden = true; sel.hidden = false; sel.value = CATS[0]; inp.value = sel.value; sel.focus(); };
  sel.onchange = () => { if (sel.value === '__new') { inp.value = ''; toInput(); } else inp.value = sel.value; };
  back.onclick = e => { e.stopPropagation(); toList(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); toList(); } }); };
/* 물류 출고 양식 (★ 260911 레모너리 비매출 출고 양식 과 동일한 21개 열) */
const XLS_HEAD = ['쇼핑몰', '쇼핑몰번호', '주문번호', '품목별 주문번호', '배송메시지', '총 주문금액', '총 결제금액', '상품번호', '주문상품명', '주문상품명(옵션포함)', '수량', '판매가', '수령인', '수령인 휴대전화', '수령인 우편번호', '수령인 주소', '수령인 상세 주소', '결제구분', '결제수단', '발주일', '배송국가'];
const XLS_WIDTH = [13, 10.3, 17.8, 20.8, 10.3, 11.1, 11.1, 8.6, 50.2, 51.2, 5, 6.8, 13, 15.2, 15, 91.5, 15.8, 8.6, 8.6, 16.2, 8.8];
const S = () => DATA.samples || [];
const prodCls = p => 'p' + Math.max(0, PRODUCTS.indexOf(p));
const fmtPhone = s => { const d = String(s || '').replace(/\D/g, ''); return d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : String(s || ''); };

let view = LS.get('smp_view') || 'todo';
let filter = { q: '', product: '', cat: '' };
let company = LS.get('smp_co') || '';   // 회사 탭 ('' = 전체)
let sort = { key: 'created_at', dir: 'desc' };
let picked = new Set();   // 체크한 줄(추출 대상 고르기)

function normalize(table, s){ return { ...s, qty: Number(s.qty) || 1, sent: !!s.sent, country: s.country || '대한민국' }; }
const VIEWS = () => [{ key: 'todo', label: '발송 전', badge: S().filter(s => !s.sent).length }, { key: 'sent', label: '발송 완료' }, { key: 'all', label: '전체' }, null, { key: 'co:', label: '회사: 전체' }, ...COMPANIES.map(c => ({ key: 'co:' + c, label: c, badge: S().filter(s => !s.sent && coOf(s) === c).length }))];

function render(){
  $('#app').innerHTML = headerHtml({ icon: '📦', title: '비매출', tabs: VIEWS(), active: view })
    + `<main class="wrap wrap-wide" style="max-width:1700px">${!DATA.samples ? `<div class="empty">비매출 저장 표가 아직 없습니다.${isAdmin() ? ' 위쪽 빨간 안내대로 SQL(sql-samples.sql)을 실행하세요.' : ''}</div>` : `
    <div class="actions"><button class="btn primary" id="newBtn2">＋ 샘플 발송 등록</button><button class="btn" id="bulkBtn" title="여러 명을 한 번에 붙여넣기">📋 여러 명 붙여넣기</button><button class="btn" id="delBtn" style="color:var(--red);border-color:${picked.size ? 'var(--red)' : 'var(--line2)'}" ${picked.size ? '' : 'disabled'} title="왼쪽 체크박스로 고른 줄을 지웁니다">🗑 삭제${picked.size ? ` (${picked.size}건)` : ''}</button>
      ${view === 'todo' ? `<button class="btn" id="xlsBtn" style="background:#15803d;border-color:#15803d;color:#fff" ${S().some(s => !s.sent) ? '' : 'disabled'}>📥 엑셀 추출 (${company ? company.replace('(주)', '') + ' ' : ''}발송 전 ${picked.size ? picked.size + '건 선택' : '전체'}${!company ? ' · 회사별 파일' : ''})</button>` : ''}
      <input type="search" id="fq" placeholder="검색 (수령인, 전화, 주소)" value="${esc(filter.q)}" style="border:1px solid var(--line2);border-radius:var(--radius);padding:8px 10px;min-width:200px">
      <select id="f_product"><option value="">제품: 전체</option>${prodOpts(filter.product, company)}</select>
      <select id="f_cat"><option value="">구분: 전체</option>${[...new Set([...CATS, ...S().map(s => s.category)])].filter(Boolean).map(c => `<option ${filter.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <span class="count" id="cnt"></span></div>
    ${statsHtml()}${view === 'todo' ? '<div class="hint" style="margin-bottom:8px">맨 위 <b>노란 줄</b>에서 제품을 고르고 수령인·전화·주소를 적은 뒤 <b>Enter</b> 를 누르면 바로 저장됩니다(Tab 으로 칸 이동). 기존 칸은 <b>더블클릭</b>으로 고치고, 줄을 클릭하면 상세 창이 열립니다.</div>' : ''}<div id="view">${tableHtml()}</div>`}</main>`;
  bindHeader(k => { if (k.startsWith('co:')) { company = k.slice(3); LS.set('smp_co', company); } else { view = k; LS.set('smp_view', k); } picked = new Set(); render(); }, null, m => `등록 ${S().filter(s => s.created_by === m.name).length}건`);
  const coTab = document.querySelector(`.tab[data-view="co:${company}"]`); if (coTab) coTab.classList.add('on');   // 회사 탭도 켜진 표시
  const nb = $('#newBtn2'); if (nb) nb.onclick = () => openEdit(null);
  const bb = $('#bulkBtn'); if (bb) bb.onclick = openBulk;
  const db = $('#delBtn'); if (db) db.onclick = deletePicked;
  const xb = $('#xlsBtn'); if (xb) xb.onclick = exportXlsx;
  const fq = $('#fq'); if (fq) fq.oninput = () => { filter.q = fq.value; renderView(); };
  ['product', 'cat'].forEach(k => { const el = $('#f_' + k); if (el) el.onchange = () => { filter[k] = el.value; renderView(); }; });
  bindView();
}
function listOf(){
  const q = filter.q.trim().toLowerCase();
  return S().filter(s => (view === 'all' || (view === 'sent' ? s.sent : !s.sent)) && (!company || coOf(s) === company)
    && (!q || [s.recipient, s.phone, s.address, s.address2, s.memo, s.category].some(v => (v || '').toLowerCase().includes(q)))
    && (!filter.product || s.product === filter.product) && (!filter.cat || s.category === filter.cat));
}
function statsHtml(){
  const all = S(), todo = all.filter(s => !s.sent), m = todayStr().slice(0, 7);
  return `<div class="stats">
    <div class="stat"><div class="l">발송 전</div><div class="v ${todo.length ? 'orange' : ''}">${todo.length}건</div><div class="s">수량 ${todo.reduce((a, s) => a + s.qty, 0)}개 · 추출 안 한 것 ${todo.filter(s => !s.exported_at).length}건</div></div>
    ${PRODUCTS.map(p => `<div class="stat"><div class="l">${p} (이번 달)</div><div class="v">${all.filter(s => s.product === p && (s.created_at || '').startsWith(m)).reduce((a, s) => a + s.qty, 0)}개</div><div class="s">누적 ${all.filter(s => s.product === p).reduce((a, s) => a + s.qty, 0)}개</div></div>`).join('')}
    <div class="stat"><div class="l">회사별 발송 전</div><div class="v" style="font-size:14px">${COMPANIES.map(c => `<span class="co ${CO_CLS[c]}">${c.replace('(주)', '')}</span> ${todo.filter(s => coOf(s) === c).length}건`).join('<br>')}</div><div class="s">엑셀은 회사별로 따로 나옵니다</div></div>
    <div class="stat"><div class="l">발송 완료</div><div class="v">${all.filter(s => s.sent).length}건</div><div class="s">전체 ${all.length}건</div></div>
  </div>`;
}
function renderView(){ $('#view').innerHTML = tableHtml(); const c = $('#cnt'); if (c) c.textContent = `${listOf().length}건`; bindView(); }
function tableHtml(){
  const list = sortBy(listOf(), sort, { qty: n => Number(n) || 0, order_date: d => d || '', created_at: d => d || '' });
  if (!list.length && view !== 'todo') return `<div class="empty">${filter.q || filter.product || filter.cat ? '조건에 맞는 건이 없습니다.' : '해당하는 건이 없습니다.'}</div>`;   // 발송 전 탭은 비어 있어도 입력 줄을 보여 줌
  const cols = [['product', '제품'], ['qty', '수량'], ['recipient', '수령인'], ['phone', '휴대전화'], ['zip', '우편번호'], ['address', '주소'], ['category', '구분'], ['order_date', '발주일'], ['created_by', '등록'], ['created_at', '등록일']];
  const allPicked = list.length && list.every(s => picked.has(s.id));
  const catOpts = [...new Set([...CATS, ...S().map(x => x.category)])].filter(Boolean);
  return `<div class="tablewrap"><table class="sm"><thead><tr><th class="pickcell" id="pickAllCell" title="전체 선택"><input type="checkbox" id="pickAll" ${allPicked ? 'checked' : ''}></th>${cols.map(([k, l]) => `<th data-sort="${k}" class="${k === 'qty' ? 'num' : ''}">${l}${sortArrow(sort, k)}</th>`).join('')}<th>발송</th></tr></thead><tbody>
    ${view === 'todo' ? `<tr class="newrow"><td></td>
      <td><select id="nProd">${prodOpts(prodsFor(company).includes(lastNew.product) ? lastNew.product : prodsFor(company)[0], company)}</select></td>
      <td><input type="number" id="nQty" value="${lastNew.qty}" min="1" style="width:56px"></td>
      <td><input id="nName" placeholder="수령인" style="width:90px"></td>
      <td><input id="nPhone" placeholder="휴대전화" inputmode="tel" style="width:130px"></td>
      <td><input id="nZip" placeholder="우편번호" inputmode="numeric" style="width:80px"></td>
      <td><input id="nAddr" placeholder="주소 (상세주소까지 한 칸에)" style="min-width:320px"></td>
      <td style="min-width:150px">${catSelHtml('nCat', lastNew.category || CATS[0])}</td>
      <td colspan="3" class="hint">Enter 로 저장 · Tab 으로 칸 이동</td><td><button class="btn sm primary" id="nAdd">추가</button></td></tr>` : ''}
    ${!list.length ? `<tr><td colspan="12" class="hint" style="text-align:center;padding:16px">${filter.q || filter.product || filter.cat ? '조건에 맞는 건이 없습니다.' : '발송 전인 샘플이 없습니다. 위 노란 줄에 바로 입력해 보세요.'}</td></tr>` : ''}
    ${list.map(s => `<tr class="row ${s.sent ? 'sent' : ''} ${picked.has(s.id) ? 'sel' : ''}" data-id="${s.id}">
      <td class="pickcell" data-pickcell="${s.id}" title="이 칸 아무 데나 누르면 체크됩니다"><input type="checkbox" data-pick="${s.id}" ${picked.has(s.id) ? 'checked' : ''}></td>
      <td><span class="co ${CO_CLS[coOf(s)] || ''}" title="회사">${esc(coOf(s).replace('(주)', ''))}</span> <select class="prodsel" data-prod="${s.id}" title="제품 바꾸기">${prodOpts(s.product, coOf(s))}</select>${s.option_name && s.option_name !== (PRESETS[s.product] || {}).option ? ' <span class="hint" title="' + esc(s.option_name) + '">옵션 다름</span>' : ''}</td>
      <td class="num" data-edit="qty" data-id="${s.id}">${s.qty}</td><td data-edit="recipient" data-id="${s.id}"><b>${esc(s.recipient || '')}</b></td><td data-edit="phone" data-id="${s.id}">${esc(fmtPhone(s.phone))}</td><td data-edit="zip" data-id="${s.id}">${esc(s.zip || '')}</td>
      <td class="addr" data-edit="address" data-id="${s.id}">${esc(s.address || '')}${s.address2 ? ` <span class="hint">${esc(s.address2)}</span>` : ''}</td>
      <td>${s.category ? `<span class="cat">${esc(s.category)}</span>` : '<span class="hint">-</span>'}${s.memo ? ` <span class="hint" title="${esc(s.memo)}">📝</span>` : ''}</td>
      <td>${fmtDate(s.order_date) || '<span class="hint">-</span>'}</td><td>${who(s.created_by)}</td><td class="hint">${fmtDate((s.created_at || '').slice(0, 10))}${s.exported_at ? ' <span title="엑셀 추출함">📥</span>' : ''}</td>
      <td><button type="button" class="ox ${s.sent ? 'on' : ''}" data-sent="${s.id}" title="누르면 발송 완료/발송 전이 바뀝니다">${s.sent ? `발송 완료 ${fmtDate((s.sent_at || '').slice(0, 10)).slice(5)}` : '발송 전'}</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
let lastNew = { product: PRODUCTS[0], qty: 1, category: CATS[0] };   // 입력 줄에 남겨 두는 값
/* 노란 입력 줄에서 바로 추가 (Enter) */
async function addFromRow(){
  const recipient = $('#nName').value.trim(), phone = $('#nPhone').value.trim(), address = $('#nAddr').value.trim();
  if (!recipient) { $('#nName').focus(); toast('수령인을 입력하세요', true); return; }
  if (!phone) { $('#nPhone').focus(); toast('휴대전화를 입력하세요', true); return; }
  if (!address) { $('#nAddr').focus(); toast('주소를 입력하세요', true); return; }
  const prod = $('#nProd').value;
  lastNew = { product: prod, qty: Number($('#nQty').value) || 1, category: $('#nCat').value.trim() };
  const row = { id: uid(), product: prod, product_name: PRESETS[prod].name, option_name: PRESETS[prod].option, qty: lastNew.qty, recipient, phone: fmtPhone(phone), zip: $('#nZip').value.trim() || null, address, address2: null,
    pay_type: null, pay_method: null, order_date: null, country: '대한민국', category: lastNew.category || null, memo: null, sent: false, sent_at: null, exported_at: null, created_by: me, created_at: nowIso(), updated_by: me };
  await saveRow('samples', row);
  setTimeout(() => { const n = $('#nName'); if (n) n.focus(); }, 300);   // 다음 사람 바로 입력 (화면 다시 그린 뒤)
}
/* 칸 더블클릭으로 고치기 */
function inlineEdit(el){
  const s = S().find(x => x.id === el.dataset.id); if (!s || el.querySelector('input')) return;
  const k = el.dataset.edit, old = k === 'phone' ? fmtPhone(s.phone) : (s[k] ?? '');
  const box = document.createElement('input'); box.className = 'inline'; box.value = old; if (k === 'qty') { box.type = 'number'; box.min = 1; }
  el.innerHTML = ''; el.appendChild(box); box.focus(); box.select();
  let done = false;
  const finish = async save => { if (done) return; done = true; const v = box.value.trim(); if (!save || v === String(old).trim()) { renderView(); return; } await saveRow('samples', { ...s, [k]: k === 'qty' ? (Number(v) || 1) : k === 'phone' ? fmtPhone(v) : (v || null), updated_by: me }); };
  box.onblur = () => finish(true);
  box.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); finish(false); } else if (e.key === 'Enter') { e.preventDefault(); finish(true); } };
}
function bindView(){
  bindSort(sort, renderView, { recipient: 'asc', product: 'asc', category: 'asc', created_by: 'asc' });
  const na = $('#nAdd'); if (na) { bindCatSel('nCat'); na.onclick = addFromRow; document.querySelectorAll('.newrow input, .newrow select').forEach(i => { i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addFromRow(); } }; i.onclick = e => e.stopPropagation(); }); }
  document.querySelectorAll('[data-edit]').forEach(el => el.ondblclick = e => { e.stopPropagation(); inlineEdit(el); });
  document.querySelectorAll('select[data-prod]').forEach(sel => { sel.onclick = e => e.stopPropagation(); sel.onchange = async () => { const s = S().find(x => x.id === sel.dataset.prod); const p = PRESETS[sel.value]; await saveRow('samples', { ...s, product: sel.value, product_name: p.name, option_name: p.option, updated_by: me }); }; });
  document.querySelectorAll('tr.row[data-id]').forEach(tr => tr.onclick = e => { if (e.target.closest('a, button, input, select')) return; openEdit(tr.dataset.id); });
  document.querySelectorAll('[data-pick]').forEach(cb => cb.onchange = () => { if (cb.checked) picked.add(cb.dataset.pick); else picked.delete(cb.dataset.pick); render(); });
  // 체크박스 칸 아무 데나 눌러도 체크되게 (칸 전체가 누르는 자리)
  document.querySelectorAll('[data-pickcell]').forEach(td => td.onclick = e => { e.stopPropagation(); if (e.target.tagName === 'INPUT') return; const id = td.dataset.pickcell; if (picked.has(id)) picked.delete(id); else picked.add(id); render(); });
  const pac = $('#pickAllCell'); if (pac) pac.onclick = e => { if (e.target.tagName === 'INPUT') return; const pa2 = $('#pickAll'); pa2.checked = !pa2.checked; pa2.onchange(); };
  const pa = $('#pickAll'); if (pa) pa.onchange = () => { const ids = listOf().map(s => s.id); if (pa.checked) ids.forEach(i => picked.add(i)); else ids.forEach(i => picked.delete(i)); render(); };
  document.querySelectorAll('[data-sent]').forEach(b => b.onclick = async e => { e.stopPropagation(); const s = S().find(x => x.id === b.dataset.sent); await saveRow('samples', { ...s, sent: !s.sent, sent_at: !s.sent ? nowIso() : null, updated_by: me }); });
}

/* 체크한 줄 한 번에 삭제 */
async function deletePicked(){
  const list = S().filter(s => picked.has(s.id)); if (!list.length) { toast('왼쪽 체크박스로 지울 줄을 먼저 고르세요', true); return; }
  const names = list.slice(0, 5).map(s => s.recipient).join(', ') + (list.length > 5 ? ` 외 ${list.length - 5}명` : '');
  if (!confirm(`${list.length}건을 삭제할까요?
(${names})
삭제하면 되돌릴 수 없습니다.`)) return;
  for (const s of list) await removeRow('samples', s.id);
  picked = new Set(); render(); toast(`${list.length}건을 삭제했습니다`);
}
/* 물류 양식 그대로 엑셀 추출 (발송 전만, 체크한 것이 있으면 그것만) */
function exportXlsx(){
  if (typeof XLSX === 'undefined') { toast('엑셀 도구를 불러오지 못했습니다. 새로고침 후 다시 시도하세요', true); return; }
  const list = S().filter(s => !s.sent && (!company || coOf(s) === company) && (!picked.size || picked.has(s.id))).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  if (!list.length) { toast('추출할 발송 전 건이 없습니다', true); return; }
  // 회사별로 파일을 따로 만듦 (물류 계정이 다름)
  const groups = [...new Set(list.map(coOf))].map(c => [c, list.filter(s => coOf(s) === c)]);
  const made = [];
  for (const [co, items] of groups) {
    // 양식과 같은 규칙: 첫 줄에만 쇼핑몰/쇼핑몰번호, 주문번호 = 날짜-1000001부터, 품목별 주문번호 = 날짜-1000001-01, -02 ...
    const ymd8 = todayStr().replace(/-/g, ''), ymd6 = ymd8.slice(2);
    const rows = [XLS_HEAD];
    items.forEach((s, i) => rows.push([i === 0 ? '한국어 쇼핑몰' : '', i === 0 ? 1 : '', `${ymd8}-${1000001 + i}`, `${ymd8}-1000001-${String(i + 1).padStart(2, '0')}`, '', '', '', '',
      s.product_name || (PRESETS[s.product] || {}).name || s.product, s.option_name || (PRESETS[s.product] || {}).option || '', s.qty, '',
      s.recipient || '', fmtPhone(s.phone), s.zip || '', [s.address || '', s.address2 || ''].filter(Boolean).join(' '), '', s.pay_type || '', s.pay_method || '', s.order_date ? fmtDate(s.order_date) : '', s.country && s.country !== '대한민국' ? s.country : '']));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = XLS_WIDTH.map(w => ({ wch: w }));
    for (let r = 1; r < rows.length; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 14 })]; if (c) c.t = 's'; }   // 우편번호 앞 0 유지
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `${ymd6} ${co.replace('(주)', '')} 출고 양식(샘플)`.slice(0, 31));
    XLSX.writeFile(wb, `★ ${ymd6} ${co.replace('(주)', '')} 비매출 출고 양식(엑셀).xlsx`);
    made.push(`${co} ${items.length}건`);
  }
  const now = nowIso();
  (async () => { for (const s of list) await saveRow('samples', { ...s, exported_at: now, updated_by: me }); })();
  openModal(`${modalHead('엑셀 추출 완료')}<div class="mb"><div>${groups.length > 1 ? `회사별로 파일 ${groups.length}개(${made.join(', ')})를` : `<b>${made[0]}</b>을`} 내려받았습니다. 물류에 올린 뒤 이 건들을 <b>발송 완료</b>로 바꿀까요?</div><div class="hint">나중에 바꾸려면 각 줄의 "발송 전" 버튼을 누르면 됩니다.</div></div>
    <div class="mf"><button class="btn" data-close>나중에</button><button class="btn primary" id="markSent">${list.length}건 발송 완료로</button></div>`);
  $('#markSent').onclick = async () => { closeModal(); for (const s of list) await saveRow('samples', { ...s, sent: true, sent_at: now, exported_at: now, updated_by: me }); picked = new Set(); toast(`${list.length}건을 발송 완료로 표시했습니다`); };
}

      <div class="f"><label>메모 (왜 보내는지, 요청자 등)</label><textarea id="sMemo" style="min-height:60px">${esc(d.memo || '')}</textarea></div>
      ${s0 ? `<div class="hint">등록: ${esc(s0.created_by || '')} ${fmtDateTime(s0.created_at)}${s0.exported_at ? ` · 엑셀 추출: ${fmtDateTime(s0.exported_at)}` : ''}${s0.sent_at ? ` · 발송 완료: ${fmtDateTime(s0.sent_at)}` : ''}</div>` : ''}
    </div>
    <div class="mf">${s0 ? '<button class="btn danger left" id="sDelete">삭제</button>' : ''}${s0 ? `<button class="btn" id="sToggle">${s0.sent ? '발송 전으로 되돌리기' : '발송 완료로'}</button>` : ''}<button class="btn" data-close>취소</button><button class="btn primary" id="sSave">${s0 ? '저장' : '등록'}</button></div>`, { wide: true });
  bindCatSel('sCat'); $('#sName').focus();
  $('#sProd').onchange = () => { const p = PRESETS[$('#sProd').value] || {}; $('#sPName').value = p.name || ''; $('#sOName').value = p.option || ''; $('#sPreset').textContent = '엑셀에 들어갈 상품명: ' + (p.name || ''); };
  $('#sPhone').oninput = () => { $('#sPhone').value = fmtPhone($('#sPhone').value.replace(/\D/g, '').slice(0, 11)) || $('#sPhone').value; };

/* 여러 명 붙여넣기: 엑셀·시트에서 "수령인 [탭] 전화 [탭] 우편번호 [탭] 주소" 줄들을 복사해 붙여넣음 */
function openBulk(){
  openModal(`${modalHead('여러 명 한 번에 등록')}
    <div class="mb">
      <div class="f3">
        <div class="f"><label>제품</label><select id="bProd">${prodOpts(prodsFor(company)[0], company)}</select></div>
        <div class="f"><label>수량 (모두 같게)</label><input type="number" id="bQty" value="1" min="1"></div>
        <div class="f"><label>구분</label>${catSelHtml('bCat', CATS[0])}</div>
      </div>
      <div class="f"><label>붙여넣기 (한 줄에 한 명: 수령인, 휴대전화, 우편번호, 주소 순서. 시트에서 복사하면 됩니다)</label><textarea id="bText" class="bulk" placeholder="김재은\t010-5279-6478\t11780\t경기 의정부시 금신로 276 112동 2204호\n이가희\t010-8107-1989\t44721\t울산 남구 삼산중로 15 4층"></textarea></div>
      <div class="hint">탭 대신 쉼표로 나눠도 됩니다. 우편번호가 없으면 "수령인, 전화, 주소" 세 칸만 있어도 됩니다.</div>
    </div>
    <div class="mf"><button class="btn" data-close>취소</button><button class="btn primary" id="bSave">등록</button></div>`, { wide: true });
  bindCatSel('bCat'); $('#bText').focus();
  $('#bSave').onclick = async () => {
    const lines = $('#bText').value.split('\n').map(l => l.trim()).filter(Boolean); if (!lines.length) { toast('붙여넣은 내용이 없습니다', true); return; }
    const prod = $('#bProd').value, qty = Number($('#bQty').value) || 1, cat = $('#bCat').value.trim() || null, rows = [], bad = [];
    for (const l of lines) {
      const c = (l.includes('\t') ? l.split('\t') : l.split(/\s*,\s*/)).map(x => x.trim());
      if (c.length < 3) { bad.push(l); continue; }
      const hasZip = c.length >= 4 && /^\d{5}$/.test(c[2].replace(/-/g, ''));
      const [recipient, phone] = c; const zip = hasZip ? c[2] : null; const address = (hasZip ? c.slice(3) : c.slice(2)).join(' ').trim();
      if (!recipient || !phone || !address) { bad.push(l); continue; }
      rows.push({ id: uid(), product: prod, product_name: PRESETS[prod].name, option_name: PRESETS[prod].option, qty, recipient, phone: fmtPhone(phone), zip, address, address2: null, pay_type: null, pay_method: null, order_date: null, country: '대한민국', category: cat, memo: null, sent: false, sent_at: null, exported_at: null, created_by: me, created_at: nowIso(), updated_by: me });
    }
    if (!rows.length) { toast('읽을 수 있는 줄이 없습니다. 수령인, 전화, 주소 순서인지 확인하세요', true); return; }
    closeModal(); for (const r of rows) await saveRow('samples', r);
    toast(`${rows.length}명을 등록했습니다${bad.length ? ` (${bad.length}줄은 형식이 달라 건너뜀)` : ''}`);
  };
}
